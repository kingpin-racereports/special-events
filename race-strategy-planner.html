// race.mylaps is populated, a compact by-car summary plus a collapsible
// full-field standings table.
// MyLaps Speedhive import panel — visible to EVERYONE for archived races
// (engineers and read-only viewers alike), since it's just showing race
// results once they exist. Only the actual import controls (the "Import"
// button, the session-id form, "Re-import") are engineer-gated — those
// are the only things that write data. Three states: a centered loading
// spinner while state.mylapsAutoLoading is true (the brief window while
// loadMylapsResultsFromSupabase() runs after opening the race), a
// "results not available" message for non-engineers (or the Import
// prompt for engineers) once that resolves with nothing, or the full
// results view once race.mylaps is populated.
function renderMylapsPanel(race){
  if (!race) return "";
  const mylaps = race.mylaps;

  if (state.mylapsAutoLoading){
    return `
      <div class="mylaps-panel fade-in" style="display:flex;justify-content:center;padding:32px 20px;">
        <div class="mylaps-spinner"></div>
      </div>`;
  }

  if (!mylaps){
    return `
      <div class="mylaps-panel fade-in">
        ${!state.isEngineer ? `
          <p style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--textFaint);margin:8px 0;">
            Race results are not official.
          </p>
        ` : !state.mylapsImporting ? `
          <div style="display:flex;justify-content:center;">
            <button class="btn-gold" style="display:inline-flex;padding:10px 18px;" data-act="mylaps-open">${icon("timer",14)} Import MyLaps Results</button>
          </div>
        ` : `
          <div class="mylaps-import-box">
            <span class="eyebrow">MyLaps Speedhive Session ID</span>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <input class="field font-mono" style="padding:8px 10px;font-size:13px;" placeholder="e.g. 12719160"
                value="${esc(state.mylapsSessionDraft)}" data-act="mylaps-draft" ${state.mylapsLoading?"disabled":""} />
              <button class="btn-primary" style="padding:8px 16px;font-size:13px;white-space:nowrap;" data-act="mylaps-run" ${state.mylapsLoading?"disabled":""}>
                ${state.mylapsLoading ? "Fetching…" : "Fetch"}
              </button>
              <button class="link-muted" data-act="mylaps-cancel" ${state.mylapsLoading?"disabled":""}>${icon("x",14)}</button>
            </div>
            ${state.mylapsError ? `<p style="color:${T.red};font-size:12px;margin-top:8px;">${esc(state.mylapsError)}</p>` : ""}
          </div>
        `}
      </div>`;
  }

  const fieldRows = state.mylapsShowFullField ? mylaps.classification.map((r,i) => {
    const isOurs = race.cars.some(c=>c.number===r.startNumber);
    const statusBadge = r.status === "DNF" ? `<span class="mylaps-badge dnf">DNF</span>`
                       : r.status === "DNS" ? `<span class="mylaps-badge dns">DNS</span>` : "";
    return `<tr style="${isOurs?`background:${T.gold}17;border-left:2px solid ${T.gold};`:""}">
      <td class="num">P${i+1}</td>
      <td><span class="num">#${esc(r.startNumber)}</span> - <span style="font-weight:600;">${esc(r.name)}</span></td>
      <td class="num">${esc(mylaps.intervals[r.startNumber] ?? "—")}</td>
      <td class="num">${r.numberOfLaps}</td>
      <td class="stops">${mylaps.pitStopsByNumber[r.startNumber] ?? 0}</td>
      <td class="mylaps-cls">${esc(r.resultClass)}</td>
      <td>${statusBadge}</td>
    </tr>`;
  }).join("") : "";

  const ov = mylaps.overview;
  const overviewTile = (label, value, sub) => `
    <div class="mylaps-stat-tile">
      <div class="mylaps-stat-label">${label}</div>
      <div class="mylaps-stat-value">${value}</div>
      ${sub ? `<div class="mylaps-stat-sub">${sub}</div>` : ""}
    </div>`;

  // One outright winner gets the full "#num Team Name" treatment (matches
  // Best Stint Pace); a tie between multiple teams just shows car numbers
  // — spelling out every team name when several tied gets cluttered fast.
  const longestStintSub = (ls) => {
    if (!ls) return "";
    const entries = ls.entries || (ls.nums||[]).map(n=>({num:n,name:""})); // old Supabase rows may lack entries
    if (entries.length === 1) return `#${esc(entries[0].num)} ${esc(entries[0].name)}`;
    return entries.map(e=>`#${esc(e.num)}`).join(", ");
  };

  return `
    <div class="mylaps-panel fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span class="eyebrow" style="color:${T.gold};">Race Overview</span>
        ${state.isEngineer ? `<button class="link-muted" data-act="mylaps-reimport" style="font-size:11px;">${icon("rotate",12)} Re-import</button>` : ""}
      </div>

      <div class="mylaps-overview-grid">
        ${overviewTile("Total Laps", ov.totalLaps)}
        ${overviewTile("Total Pit Stops", ov.totalPitStops)}
        ${overviewTile("Entries", ov.entries)}
        ${overviewTile("Finishers", ov.finishers, `${ov.dnf} DNF`)}
        ${overviewTile("Total Cautions", mylaps.cautions.length)}
        ${mylaps.redFlags && mylaps.redFlags.length ? overviewTile("Red Flags", mylaps.redFlags.length) : ""}
        ${overviewTile("Cars on Lead Lap", ov.carsOnLeadLap)}
        ${overviewTile("Most Laps Led", mylaps.lapsLed ? `${mylaps.lapsLed.laps} laps` : "—", mylaps.lapsLed ? `#${esc(mylaps.lapsLed.num)} ${esc(mylaps.lapsLed.name)}` : "")}
        ${overviewTile("Best Stint Pace - GTO", mylaps.bestStint ? mylapsFmtTime(mylaps.bestStint.avg) : "—", mylaps.bestStint ? `#${esc(mylaps.bestStint.num)} ${esc(mylaps.bestStint.name)} · ${mylaps.bestStint.lapCount} laps` : "")}
        ${overviewTile("Longest Stint - GTO", mylaps.longestStint ? `${mylaps.longestStint.lapCount} laps` : "—", longestStintSub(mylaps.longestStint))}
      </div>
      ${mylaps.reconstructedFromDb ? `
      <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${T.textFaint};margin-top:10px;">
        This race was imported before caution/stint/laps-led tracking was added — Re-import to fill those four in.
      </p>` : ""}

      <button class="link-muted" data-act="mylaps-toggle-field" style="margin-top:16px;font-size:12px;">
        ${state.mylapsShowFullField ? "Hide" : "Show"} full-field standings ${icon(state.mylapsShowFullField?"chevronUp":"chevronDown",12)}
      </button>

      ${state.mylapsShowFullField ? `
      <div class="mylaps-table-wrap">
      <table class="mylaps-table">
        <thead><tr><th>Finish</th><th>Car</th><th>Gap</th><th>Laps</th><th>Stops</th><th>Class</th><th>Status</th></tr></thead>
        <tbody>${fieldRows}</tbody>
      </table>
      </div>
      <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:${T.textFaint};margin-top:8px;">
        Gap is the true time gap to the car ahead, but only when both cars are on the same lap — otherwise the field shows the lap deficit.
      </p>` : ""}
    </div>`;
}

// Shown once a race is archived — starting/finish position plus each
// driver's total time behind the wheel (summed across their non-removed
// stints only, so anything absorbed or dropped from a retirement doesn't
// count toward drive time).
// MyLaps result summary for a single car, shown directly in that car's
// always-visible tile header (not gated behind expand/collapse). Omits the
// car number and "Normal" status badge since those are already shown in
// the tile's own header — a DNF/DNS badge is still shown since that's
// context not duplicated elsewhere. Each stat gets its own line.

function mylapsCarHeaderBlock(car){
  const race = state.races.find(r=>r.id===state.currentRaceId);
  if (!race || !race.mylaps) return "";
  const m = matchMylapsToRaceCars({ cars:[car] }, race.mylaps)[0];
  if (!m || !m.found) return "";

  const statusBadge = m.status === "DNF" ? `<span class="mylaps-badge dnf">DNF</span>`
                     : m.status === "DNS" ? `<span class="mylaps-badge dns">DNS</span>` : "";
  const tile = (label, value, sub) => `
    <div class="mylaps-carstat-tile">
      <div class="mylaps-stat-label">${label}</div>
      <div class="mylaps-carstat-value">${value}</div>
      ${sub ? `<div class="mylaps-stat-sub">${sub}</div>` : ""}
    </div>`;

  return `
    <div class="mylaps-header-block">
      <div class="mylaps-carstat-grid">
        ${tile("Finish", `P${m.positionInClass || m.position}`, statusBadge || null)}
        ${tile("Overall Position", `P${m.position}`)}
        ${tile("Fastest Lap", m.bestTime && m.bestTime!=="00.000" ? esc(m.bestTime) : "—")}
        ${tile("Highest Speed Avg", m.bestSpeed ? `${m.bestSpeed.toFixed(1)} mph` : "—")}
        ${tile("Pit Stops", m.pitStops)}
        ${tile("Laps Completed", m.numberOfLaps)}
      </div>
    </div>`;
}

function raceSummaryBlock(cp){
  const totals = {};
  const order = [];
  cp.stints.forEach(s=>{
    if (s.removed || !s.driver) return;
    if (!(s.driver in totals)){ totals[s.driver] = 0; order.push(s.driver); }
    totals[s.driver] += s.lengthMin;
  });
  return `
    <div class="summary-box">
      <div class="summary-driver" style="margin-bottom:6px;">
        <span></span>
        <span class="fin-label" style="margin:0;">${icon("timer",12)} Seat Time</span>
      </div>
      <div class="summary-drivers">
        ${order.map(d=>`<div class="summary-driver"><span>${esc(d)}</span><span class="font-mono">${formatDuration(totals[d])}</span></div>`).join("")}
      </div>
    </div>`;
}

// Real pit-in/pit-out cycle times for one car, from Red Mist Timing (see
// loadRedmistPitCyclesFromSupabase). Shows duration_pdm_seconds only, per
// stop — the field validated against a crew stopwatch. A stop whose
// red_flag_overlap is true shows "Red Flag" instead of a number, since pdm
// can't be trusted when a session-wide stoppage happened during the stop
// (confirmed: pdm read 81s on a stop that was actually ~26 minutes by
// clock time because of an overlapping red flag). A stop flagged
// needsReview (numbers don't fit a normal pattern at all, e.g. a real
// garage repair) gets a wrench marker so it's visually distinct without
// implying the number itself is wrong.
function pitCycleBlock(car){
  const race = state.races.find(r=>r.id===state.currentRaceId);
  if (!race || !race.redmistPitCycles) return "";
  const stops = race.redmistPitCycles.byCarNumber[car.number];
  if (!stops || !stops.length) return "";

  const fmt = sec => {
    if (sec == null) return "—";
    const total = Math.round(sec);
    return `${Math.floor(total/60)}m ${total%60}s`;
  };

  const rows = stops.map(s => {
    const wrench = s.needsReview
      ? `<span title="${esc(s.notes) || "Needs review \u2014 numbers don't fit a normal stop"}" style="margin-left:4px;">\uD83D\uDD27</span>` : "";
    const val = s.redFlagOverlap
      ? `<span style="color:${T.red};">Red Flag</span>`
      : fmt(s.pdmSeconds);
    return `<div class="summary-driver">
      <span>Stop ${s.stopNum}${wrench}</span>
      <span class="font-mono">${val}</span>
    </div>`;
  }).join("");

  const clean = stops.filter(s => !s.redFlagOverlap && s.pdmSeconds != null);
  const avgSeconds = clean.length ? clean.reduce((a,s)=>a+s.pdmSeconds,0)/clean.length : null;
  const avgRow = avgSeconds != null
    ? `<div class="summary-driver" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">
         <span class="fin-label" style="margin:0;">Average</span>
         <span class="font-mono">${fmt(avgSeconds)}</span>
       </div>`
    : "";

  return `
    <div class="summary-box">
      <div class="summary-driver" style="margin-bottom:6px;">
        <span></span>
        <span class="fin-label" style="margin:0;">${icon("timer",12)} Pit Cycle</span>
      </div>
      <div class="summary-drivers">
        ${rows}
        ${avgRow}
      </div>
      <p style="font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;color:var(--textFaint);margin:10px 0 0;">
        Real pit-in/pit-out timing from Red Mist. Red flag periods can't be measured and are shown as such.
      </p>
    </div>`;
}

function carPlanSection(cp, plan, archived){
  const car = cp.car, stints = cp.stints;
  // archived = the race's real status, used for status DISPLAY (podium
  // colors, seat-time summary, collapsing). readOnly = whether editing
  // controls should render at all — true once archived OR whenever the
  // signed-in person isn't an engineer, i.e. the driver read-only view.
  const readOnly = archived || !state.isEngineer;
  const shortNames = buildShortNames(car.drivers.filter(d=>d.trim()));
  const timelineAbbrev = buildTimelineAbbrev(car.drivers.filter(d=>d.trim()));
  const race = archived ? state.races.find(r=>r.id===state.currentRaceId) : null;
  const effectivePos = archived ? getEffectiveFinishPosition(car, race) : null;
  const carPodium = archived ? podiumColor(typeof effectivePos === "number" ? effectivePos : null) : null;
  const hasDelta = archived && car.startingPosition!=null && typeof effectivePos === "number";
  const delta = hasDelta ? car.startingPosition - effectivePos : null;
  const deltaLabel = delta!=null ? (delta>0?`+${delta}`:`${delta}`) : null;
  const deltaColor = delta>0?T.green:(delta<0?T.red:T.textMuted);

  // "Currently on track" — see computeLiveStintIndex() for why this keys
  // off each stint's `finished` flag rather than just the scheduled
  // window. Re-synced periodically without a full re-render — see
  // updateLiveHighlights().
  const liveIdx = computeLiveStintIndex(stints, archived);

  // Collapsible tile: currently enabled only on the archive/plan view for
  // archived races — the tile header (image + team/finish info) toggles
  // visibility of everything below it (Seat Time, Horizontal Planner,
  // Stint Planner, Stint Adjustments). Not yet wired up for planned races.
  const collapsible = archived;
  const isCollapsed = collapsible && !state.expandedCarPlans.has(car.id);
  const headerAttrs = collapsible ? `data-act="toggle-car-plan" data-car="${car.id}" role="button" tabindex="0" style="cursor:pointer;"` : "";

  return `
    <div>
      <div class="car-detail car-detail-plan" style="margin-bottom:12px;border-color:${car.accent};" ${headerAttrs}>
        <div class="strip" style="background:var(--panelRaised);">
          ${carStripContent(car.number, car.team, car.accent)}
          <span class="num" style="border:2px solid ${carPodium||car.accent};color:${carPodium||T.text}">${esc(car.number)}</span>
        </div>
        <div style="padding:20px 16px 14px;display:flex;align-items:center;justify-content:space-between;">
          <div style="flex:1 1 auto;min-width:0;">
            <div class="font-display" style="font-weight:600;font-size:17px;">${esc(car.team)}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);">${esc(car.manufacturer)} ${esc(car.model)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;">
            ${!archived && car.startingPosition!=null ? `<span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);">Start P${car.startingPosition}</span>`:""}
            ${archived && effectivePos!=null ? `
              ${carPodium?icon("trophy",13,"color:"+carPodium):""}
              <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:${carPodium||T.text}">${effectivePos==='DNF' ? 'DNF' : effectivePos==='DNS' ? 'DNS' : 'Finish P'+effectivePos}</span>
              ${deltaLabel?`<span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:${deltaColor}">${deltaLabel}</span>`:""}
            ` : ""}
            ${collapsible ? `<span class="ico" style="color:var(--textFaint);display:flex;">${icon(isCollapsed?"chevronDown":"chevronUp",16)}</span>` : ""}
          </div>
        </div>
      </div>

      ${isCollapsed ? "" : `
      <div class="car-plan-body fade-in">
      ${archived ? mylapsCarHeaderBlock(car) + pitCycleBlock(car) + raceSummaryBlock(cp) : ""}

      <div class="timeline">
        ${stints.map((s,i)=>{
          if (s.removed || s.negligibleFinal) return "";
          const color = DRIVER_PALETTE[s.driverIndex % DRIVER_PALETTE.length];
          const [r,g,b] = hexToRgb(color);
          const isLive = i === liveIdx;
          // The live card gets extra proportional width on top of its
          // normal time-based share — "ON TRACK" is the widest label in
          // the whole row, and this is already the one card we want to
          // draw the eye to, so a bit more room does double duty.
          const grow = Math.max(s.lengthMin, 1) * (isLive ? 1.6 : 1);
          // Live state overrides the driver-tinted look with the same thin
          // red border + tinted wash used for warning entries in the Stint
          // Adjustments log, so "currently on track" reads as one
          // consistent visual language across the app.
          const liveStyle = isLive ? `border-color:var(--red);background:rgba(226,68,92,0.10);box-shadow:none;` : "";
          const tmContent = isLive
            ? `<span style="color:var(--red);font-weight:600;">ON TRACK</span>`
            : (s.finished ? formatDuration(s.lengthMin) : formatTimeUltraCompact(s.start));
          const tmStyle = isLive ? `white-space:normal;overflow:visible;line-height:1.1;` : "";
          return `<div class="seg ${isLive?'seg-live':''}" data-car="${car.id}" data-stint="${i}" data-color="${color}" data-start-iso="${s.start.toISOString()}" style="flex-grow:${grow};flex-basis:0;background:rgba(${r},${g},${b},0.14);border-top-color:${color};${liveStyle}">
            <span class="drv" title="${esc(s.driver||'TBD')}">${esc(timelineAbbrev[s.driver]||s.driver||"TBD")}<span class="${isLive?'live-dot':'dot'}" style="background:${isLive?'var(--red)':color};"></span></span>
            <span class="tm" style="${tmStyle}">${tmContent}</span>
          </div>`;
        }).join("")}
      </div>

      <div class="stint-table">
        <div class="head"><span>Driver</span><span style="padding-left:14px;">Start</span><span>End</span><span>Position</span><span></span></div>
        ${stints.map((s,i)=>{
          if (s.removed){
            let msg;
            if (cp.retiredAtStint != null && i > cp.retiredAtStint){
              msg = `Car retired after Stint ${cp.retiredAtStint+1}`;
            } else {
              let absorbedBy = null;
              for (let k=i-1;k>=0;k--){ if (!stints[k].removed){ absorbedBy = k; break; } }
              msg = `Removed — absorbed by Stint ${absorbedBy!=null ? absorbedBy+1 : "an earlier stint"}`;
            }
            return `
            <div class="row row-removed">
              <span class="stint-ghost-num">${i+1}</span>
              <span style="grid-column:1 / -1;font-style:italic;text-decoration:line-through;">${msg}</span>
            </div>`;
          }
          if (s.negligibleFinal){
            // Too small a sliver of time to schedule as its own stint —
            // noted instead (see cascadeStintsFrom). Real start/end times
            // are left exactly as computed; this is presentation only.
            return `
            <div class="row row-negligible-final">
              <span class="stint-ghost-num">${i+1}</span>
              <span style="grid-column:1 / -1;font-style:italic;color:var(--textFaint);display:flex;align-items:center;gap:6px;">
                <span>⛽</span>Only ${s.negligibleMinutes} min remains — not scheduled as its own stint. Worth flagging if fuel numbers are tight.
              </span>
            </div>`;
          }
          const posStyle = positionCellStyle(s.position, car.startingPosition);
          const validDrivers = car.drivers.filter(d=>d.trim());
          const dotColor = DRIVER_PALETTE[s.driverIndex % DRIVER_PALETTE.length];
          const noteKey = car.id+"__"+i;
          const isOpen = state.openStintNotes.has(noteKey);
          const flags = s.flags || [];
          const flagBadges = priorityFlagBadge(flags);
          const hasNoteContent = flags.length>0 || !!(s.notes && s.notes.trim());
          const isLiveRow = i === liveIdx;
          const isFinishedRow = !isLiveRow && s.finished;
          // Finished rows recede slightly and swap the driver dot for a
          // checkered flag, so "done" reads at a glance without touching
          // the horizontal timeline above.
          const dotEl = isFinishedRow
            ? `<span class="fin-flag">🏁</span>`
            : `<span class="dot" style="background:${dotColor};flex-shrink:0;"></span>`;

          const driverCell = readOnly
            ? `<span class="driver-cell">${dotEl}<span style="font-size:13px;">${esc(shortNames[s.driver]||s.driver||"TBD")}</span></span>`
            : `<span class="driver-cell">
                ${dotEl}
                <select class="field stint-driver" data-act="edit-stint-driver" data-car="${car.id}" data-stint="${i}">
                  ${validDrivers.length===0 ? `<option value="">TBD</option>` : validDrivers.map(d=>`<option value="${esc(d)}" ${s.driver===d?"selected":""}>${esc(shortNames[d]||d)}</option>`).join("")}
                </select>
              </span>`;

          // Start time doubles as the entry point for shifting the boundary
          // with the previous stint — tapping it opens the stint panel where
          // the ±15 steppers live (the table column is far too narrow for
          // them inline).
          const startAdj = readOnly ? { canEarlier:false, canLater:false } : stintStartAdjustability(cp, i);
          const startAdjustable = startAdj.canEarlier || startAdj.canLater;
          const startCell = startAdjustable
            ? `<button class="stint-start-btn font-mono" data-act="open-stint-adjust" data-car="${car.id}" data-stint="${i}" title="Adjust start time">${formatTimeCompact(s.start)}</button>`
            : `<span class="font-mono" style="white-space:nowrap;font-size:11px;padding-left:14px;">${formatTimeCompact(s.start)}</span>`;

          const endCell = (readOnly || s.finished)
            ? `<span class="font-mono" style="white-space:nowrap;font-size:11px;text-align:center;display:block;">${formatTimeCompact(s.end)}</span>`
            : `<button class="finish-stint-cell" data-act="prompt-finish-stint" data-car="${car.id}" data-stint="${i}" title="Finish Stint"><span class="em">🏁</span>Finish</button>`;

          const posCell = readOnly
            ? `<span class="font-mono stint-pos stint-pos-badge" style="background:${posStyle.bg};color:${posStyle.color};display:flex;align-items:center;justify-content:center;">${s.position ? esc(s.position) : "–"}</span>`
            : `<input type="text" class="field stint-pos stint-pos-edit font-mono" placeholder="P–" value="${esc(s.position ?? '')}" data-act="edit-stint-pos" data-car="${car.id}" data-stint="${i}" style="background:${posStyle.bg};color:${posStyle.color};" />`;

          const noteToggle = (!readOnly || hasNoteContent)
            ? `<button class="stint-note-toggle" data-act="toggle-stint-note" data-car="${car.id}" data-stint="${i}" title="${isOpen?'Hide note':(readOnly?'View note':'Add a note')}">${flagBadges ? `<span class="flag-badge">${flagBadges}</span>` : icon(isOpen?"minus":(readOnly?"clock":"plus"),13)}</button>`
            : `<span></span>`;

          return `
          <div class="row ${isLiveRow?'row-live':''} ${isFinishedRow?'row-finished':''}" data-car="${car.id}" data-stint="${i}">
            <span class="stint-ghost-num">${i+1}</span>
            ${driverCell}
            ${startCell}
            ${endCell}
            ${posCell}
            ${noteToggle}
          </div>
          ${isOpen ? `
          <div class="note-row">
            ${readOnly ? `
              ${flags.length ? `<div class="flag-row">${flags.map(fk=>{ const f=FLAG_TYPES.find(x=>x.key===fk); if(!f) return ""; return `<span class="flag-btn active"><span class="em">${f.emoji}</span>${f.label}</span>`; }).join("")}</div>` : ""}
              ${s.notes && s.notes.trim() ? `<p style="margin:0;font-size:12.5px;color:var(--textMuted);">${esc(s.notes)}</p>` : (!flags.length ? `<p style="margin:0;font-size:12.5px;color:var(--textFaint);font-style:italic;">No notes for this stint.</p>` : "")}
            ` : `
              ${startAdjustable ? `
              <div class="start-adjust">
                <span class="start-adjust-label">${icon("clock",11)} Start Time</span>
                <div class="start-adjust-ctl">
                  <button data-act="adjust-stint-start" data-car="${car.id}" data-stint="${i}" data-delta="-${STINT_START_STEP}" ${startAdj.canEarlier?"":"disabled"}>−${STINT_START_STEP}</button>
                  <span class="start-adjust-val font-mono">${formatTimeCompact(s.start)}</span>
                  <button data-act="adjust-stint-start" data-car="${car.id}" data-stint="${i}" data-delta="${STINT_START_STEP}" ${startAdj.canLater?"":"disabled"}>+${STINT_START_STEP}</button>
                </div>
                <span class="start-adjust-hint">Moves the handover with Stint ${i} — that stint absorbs the change. Later stints are unaffected.</span>
              </div>` : ""}
              <div class="flag-row">
                ${FLAG_TYPES.map(f=>`
                  <button class="flag-btn ${flags.includes(f.key)?'active':''}" data-act="toggle-stint-flag" data-car="${car.id}" data-stint="${i}" data-flag="${f.key}" style="${flags.includes(f.key)?`background:${f.color}26;border-color:${f.color};`:""}">
                    <span class="em">${f.emoji}</span><span class="lbl">${f.label}</span>
                  </button>`).join("")}
              </div>
              ${flags.includes("meatball") ? `
              <button class="retire-btn" data-act="prompt-retire-car" data-car="${car.id}" data-stint="${i}">
                <span class="em">⛔</span> Retire
              </button>` : ""}
              <textarea rows="2" placeholder="Note for this stint — incident, fuel-only stop, etc." data-act="edit-stint-note" data-car="${car.id}" data-stint="${i}">${esc(s.notes||"")}</textarea>
            `}
          </div>` : ""}
          ${(!s.removed && s.quietMinutes) ? `
          <div class="row row-quiet">
            <span class="qt-text" style="grid-column:1 / -1;">💤&nbsp; Quiet Time — ${formatDuration(s.quietMinutes)} (${formatTimeCompact(s.end)}–${formatTimeCompact(addMinutes(s.end, s.quietMinutes))})</span>
          </div>` : ""}`;
        }).join("")}
      </div>
      ${car.startingPosition==null ? `<p style="font-size:11px;color:var(--textFaint);margin:6px 2px 0;">Set a class starting position on the Setup page to enable the finish-position heatmap.</p>` : ""}

      ${!readOnly ? `
      <div class="reserve-driver-block">
        ${state.addingReserve.has(car.id) ? `
          <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
            <input class="field" style="font-size:13px;" placeholder="Reserve driver name" value="${esc(state.reserveDraft[car.id]||'')}" data-act="update-reserve-draft" data-car="${car.id}" />
            <button class="btn-primary" style="padding:8px 14px;font-size:13px;white-space:nowrap;" data-act="confirm-add-reserve" data-car="${car.id}">Add</button>
            <button style="background:none;border:none;color:var(--textFaint);display:flex;" data-act="cancel-add-reserve" data-car="${car.id}">${icon("x",15)}</button>
          </div>
        ` : `<button class="add-driver" style="color:${car.accent};margin-top:10px;" data-act="start-add-reserve" data-car="${car.id}">${icon("plus",14)} Add Reserve Driver</button>`}
      </div>` : ""}

      ${(cp.log && cp.log.length) ? `
      <div class="log-head">
        <span class="lbl">Stint Adjustments</span>
        ${!readOnly ? `<button class="log-clear" data-act="clear-stint-log" data-car="${car.id}">Clear</button>` : ""}
      </div>
      <div class="stint-log">
        ${cp.log.map(m=>{
          const refStint = (!isRetireLogEntry(m.text) && m.stintIdx!=null) ? stints[m.stintIdx] : null;
          const refFlags = (refStint && refStint.flags) ? refStint.flags : [];
          const refFlagBadges = refFlags.map(fk => FLAG_TYPES.find(f=>f.key===fk)?.emoji || "").join(" ");
          const refNote = refStint && refStint.notes ? refStint.notes.trim() : "";
          return `
          <div class="log-item ${m.type==='warn'?'warn':''}">
            <span class="ico">${icon(m.type==='warn'?'timer':'clock',13)}</span>
            <span>
              <span class="log-text">${logBold(esc(m.text))}</span>${(refFlagBadges || refNote) ? `<br><span style="color:var(--textFaint);font-size:12px;">${refFlagBadges ? refFlagBadges+"&nbsp; " : ""}${refNote ? esc(refNote) : ""}</span>` : ""}
            </span>
          </div>`;
        }).join("")}
      </div>` : ""}
      </div>`}
    </div>`;
}

function renderConfirmModal(){
  const cd = state.confirmDelete;
  const copy = {
    race: { title: "Delete Race?", body: `"${esc(cd.label)}" will be permanently deleted, including its plan. This can't be undone.` },
    car: { title: "Remove Car?", body: `"${esc(cd.label)}" will be removed from this race. It'll still be available in the car catalog.` },
    catalogCar: { title: "Remove From Catalog?", body: `"${esc(cd.label)}" will be removed from the car catalog. Cars already added to a race are unaffected.` },
    retireCar: { title: "Would you like to retire the car?", body: `${esc(cd.label)} will be retired from this session.` },
    finishStint: { title: "Finish This Stint?", body: `${esc(cd.label)} will end now, at ${esc(cd.timeLabel)}. The next driver's stint will pick up from that time.` },
  }[cd.type];
  const headerIcon = cd.type === "retireCar" ? "⛔" : cd.type === "finishStint" ? "🏁" : icon("trash",18,"color:"+T.red);
  const confirmLabel = cd.type === "retireCar" ? "Retire" : cd.type === "finishStint" ? "Finish Stint" : "Delete";
  const confirmClass = cd.type === "finishStint" ? "confirm positive" : "confirm";
  return `
    <div class="modal-overlay">
      <div class="modal">
        <h3>${headerIcon} ${copy.title}</h3>
        <p>${copy.body}</p>
        <div class="row">
          <button class="cancel" data-act="cancel-delete">Cancel</button>
          <button class="${confirmClass}" data-act="confirm-delete">${confirmLabel}</button>
        </div>
      </div>
    </div>`;
}

// ============================================================================
// EVENTS
// ============================================================================
function bindEvents(){
  const app = document.getElementById("app");

  app.querySelectorAll("[data-act]").forEach(el=>{
    const act = el.getAttribute("data-act");
    if (["update-driver","update-start-pos","edit-stint-pos","edit-stint-driver","edit-stint-note","update-reserve-draft","stint-wheel","mylaps-draft"].includes(act)) return; // input/change events bound below
    el.addEventListener("click", (e)=>{
      e.preventDefault();
      handleAction(act, el, e);
    });
  });

  // text inputs that live-update state without full re-render (to preserve focus)
  bindLiveInput("nameDraft", v=> state.nameDraft = v, ()=>{
    document.getElementById("confirmName").disabled = !state.nameDraft.trim();
  });
  const nameDraftEl = document.getElementById("nameDraft");
  if (nameDraftEl){
    nameDraftEl.addEventListener("keydown", (e)=>{
      if (e.key === "Enter" && state.nameDraft.trim()){
        e.preventDefault();
        handleAction("confirmName");
      }
    });
  }
  bindLiveInput("customTrack", v=> state.customTrack=v);
  bindLiveInput("loginEmail", v=> state.loginEmail = v, ()=>{
    const btn = document.getElementById("magicSendBtn");
    if (btn) btn.disabled = !state.loginEmail.trim();
  });
  const loginEmailEl = document.getElementById("loginEmail");
  if (loginEmailEl){
    loginEmailEl.addEventListener("keydown", (e)=>{
      if (e.key === "Enter" && state.loginEmail.trim()){
        e.preventDefault();
        handleAction("engineer-magiclink-login");
      }
    });
  }
  bindLiveInput("raceDate", v=>{
    if (!v) return;
    const [yy,mo,da] = v.split("-").map(Number);
    const d = new Date(state.eventDate || Date.now());
    d.setFullYear(yy, mo-1, da);
    state.eventDate = d.toISOString();
  });
  bindLiveInput("startTime", v=> state.startTime=v);
  bindLiveInput("durationHours", v=> state.durationHours=v);
  bindLiveInput("ncNumber", v=> state.newCar.number=v);
  bindLiveInput("ncTeam", v=> state.newCar.team=v);
  bindLiveInput("ncManufacturer", v=> state.newCar.manufacturer=v);
  bindLiveInput("ncModel", v=> state.newCar.model=v);

  app.querySelectorAll('[data-act="update-driver"]').forEach(el=>{
    el.addEventListener("input", ()=>{
      const carId = el.getAttribute("data-car"), idx = +el.getAttribute("data-idx");
      const car = state.cars.find(c=>c.id===carId);
      if (car) car.drivers[idx] = el.value;
      updateSetupButtonState();
    });
  });
  // Stint-length picker. A native <select>, so there is no custom scroll,
  // snap, or drag handling to conflict with the page — the browser draws
  // and manages the options list itself. The 60/90/120 preset buttons next
  // to it write the same driverStintMode value, so the two controls are
  // just two ways into one setting. Updating the DOM in place (rather than
  // calling render()) keeps the page from jumping back to the top.
  app.querySelectorAll('[data-act="stint-wheel"]').forEach(el=>{
    el.addEventListener("change", ()=>{
      const carId = el.getAttribute("data-car"), idx = +el.getAttribute("data-idx");
      const car = state.cars.find(c=>c.id===carId);
      if (!car) return;
      // Selecting the "Custom" placeholder itself isn't a value — bounce
      // back to whatever is currently set and leave state alone.
      if (el.value === ""){
        const current = stintModeOf(car, idx);
        el.value = isStintPreset(current) ? "" : current;
        return;
      }
      if (!car.driverStintMode) car.driverStintMode = car.drivers.map(()=>'60');
      car.driverStintMode[idx] = String(el.value);
      el.classList.toggle("has-custom", !isStintPreset(el.value));
      const row = el.closest(".stint-len-row");
      if (row){
        row.querySelectorAll('[data-act="set-stint-mode"]').forEach(btn=>{
          btn.classList.toggle("active", btn.getAttribute("data-mode") === String(el.value));
        });
      }
      // Picking a preset value from inside the custom list is really just
      // choosing that preset — fall back to showing "Custom".
      if (isStintPreset(el.value)) el.value = "";
    });
  });
  app.querySelectorAll('[data-act="update-reserve-draft"]').forEach(el=>{
    el.addEventListener("input", ()=>{
      const carId = el.getAttribute("data-car");
      state.reserveDraft[carId] = el.value;
    });
    el.addEventListener("keydown", (e)=>{
      if (e.key === "Enter"){
        e.preventDefault();
        handleAction("confirm-add-reserve", el);
      }
    });
  });
  app.querySelectorAll('[data-act="update-start-pos"]').forEach(el=>{
    el.addEventListener("input", ()=>{
      const carId = el.getAttribute("data-car");
      const car = state.cars.find(c=>c.id===carId);
      if (car) car.startingPosition = el.value;
    });
  });
  app.querySelectorAll('[data-act="mylaps-draft"]').forEach(el=>{
    el.addEventListener("input", ()=>{ state.mylapsSessionDraft = el.value; });
  });
  app.querySelectorAll('[data-act="edit-stint-pos"]').forEach(el=>{
    el.addEventListener("change", ()=>{
      updateStintPosition(el.getAttribute("data-car"), +el.getAttribute("data-stint"), el.value);
    });
  });
  app.querySelectorAll('[data-act="edit-stint-driver"]').forEach(el=>{
    el.addEventListener("change", ()=>{
      updateStintDriver(el.getAttribute("data-car"), +el.getAttribute("data-stint"), el.value);
    });
  });
  app.querySelectorAll('[data-act="edit-stint-note"]').forEach(el=>{
    el.addEventListener("change", ()=>{
      updateStintNote(el.getAttribute("data-car"), +el.getAttribute("data-stint"), el.value);
    });
  });
}

function bindLiveInput(id, onInput, onExtra, evt){
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener(evt || "input", ()=>{ onInput(el.value); if(onExtra) onExtra(); });
}

function updateSetupButtonState(){
  const btn = document.getElementById("createPlan");
  if (!btn) return;
  const cars = state.cars;
  const canCreatePlan = cars.length>0 && cars.every(c=>c.drivers.some(d=>d.trim()))
      && (state.track && (state.track!=="Other" || state.customTrack.trim()))
      && state.startTime && Number(state.durationHours)>0;
  btn.disabled = !canCreatePlan;
}

async function handleAction(act, el){
  switch(act){
    case "open-engineer-login":
      state.showEngineerLogin = true; state.loginStatus = "idle"; state.loginErrorMsg = "";
      render(); break;
    case "close-engineer-login":
      state.showEngineerLogin = false; render(); break;
    case "engineer-google-login": {
      // Redirect-based flow — the browser navigates to Google and back to
      // this exact page, so there's nothing further to do here on success;
      // the boot sequence picks up the new session on reload.
      const { error } = await supabase.auth.signInWithOAuth({
        provider: "google",
        options: { redirectTo: window.location.href.split("?")[0] },
      });
      if (error){ state.loginStatus = "error"; state.loginErrorMsg = error.message; render(); }
      break;
    }
    case "engineer-magiclink-login": {
      const email = state.loginEmail.trim();
      if (!email) return;
      state.loginStatus = "sending"; render();
      const { error } = await supabase.auth.signInWithOtp({
        email,
        options: { emailRedirectTo: window.location.href.split("?")[0] },
      });
      state.loginStatus = error ? "error" : "sent";
      state.loginErrorMsg = error ? error.message : "";
      render(); break;
    }
    case "engineer-sign-out":
      await supabase.auth.signOut();
      state.isEngineer = false;
      render(); break;
    case "startCreate":
      state.duplicateSource = null;
      state.showNameInput = true; render(); break;
    case "duplicate-race": {
      const race = state.races.find(r=>r.id===el.getAttribute("data-id"));
      if (race){
        state.duplicateSource = race;
        state.nameDraft = race.eventName;
        state.showNameInput = true;
        state.page = "home";
      }
      render(); break;
    }
    case "confirmName": {
      if (!state.nameDraft.trim()) return;
      const src = state.duplicateSource;
      state.eventName = state.nameDraft.trim();
      state.eventDate = new Date().toISOString();
      state.showNameInput = false; state.nameDraft = "";
      state.currentRaceId = null; state.currentStatus = "planned";

      if (src){
        // Carry over cars, drivers, track, and timing so there's nothing
        // to retype — but everything below still lands on Setup fully
        // editable, and finish/starting positions reset since this is a
        // new, not-yet-run race.
        state.cars = src.cars.map(c=>({
          ...c,
          id: uid("car"),
          drivers: [...c.drivers],
          driverStintMode: c.driverStintMode ? [...c.driverStintMode] : c.drivers.map(()=>'60'),
          finishPosition: null,
        }));
        state.track = TRACKS.includes(src.track) ? src.track : (src.track ? "Other" : "");
        state.customTrack = TRACKS.includes(src.track) ? "" : (src.track || "");
        state.startTime = src.startTime;
        state.durationHours = src.durationHours;
        state.duplicateSource = null;
      } else {
        state.cars = []; state.track=""; state.customTrack="";
        state.startTime="10:00"; state.durationHours=4;
      }

      navPush();
      state.page = "setup";
      render(); break;
    }
    case "view-archive":
      navPush();
      state.page = "archive"; render(); break;
    case "go-home":
      // Home is a root screen — drop the trail rather than letting Back
      // walk back into whatever we just left.
      navReset();
      state.page = "home"; render(); break;
    case "nav-back":
      requestBack(); break;
    case "open-stint-adjust": {
      // Tapping the start time opens that stint's panel, where the ±15
      // steppers live.
      const key = el.getAttribute("data-car")+"__"+el.getAttribute("data-stint");
      state.openStintNotes.add(key);
      render(); break;
    }
    case "adjust-stint-start":
      await adjustStintStart(el.getAttribute("data-car"), +el.getAttribute("data-stint"), +el.getAttribute("data-delta"));
      break;
    case "setup-back":
      requestBack(); break;
    case "open-race": {
      const raceId = el.getAttribute("data-id");
      const full = await fetchFullRace(raceId);
      // Record where we came from (Home or Archive) so Back returns there
      // rather than always dumping the user on Home.
      if (full){
        if (full.status === "archived") state.mylapsAutoLoading = true;
        navPush(); openRace(full);
        if (full.status === "archived"){
          loadMylapsResultsFromSupabase(raceId).then(mylaps=>{
            const r = state.races.find(r=>r.id===raceId);
            if (r && mylaps) r.mylaps = mylaps;
            state.mylapsAutoLoading = false;
            render();
          });
          loadRedmistPitCyclesFromSupabase(raceId).then(redmist=>{
            const r = state.races.find(r=>r.id===raceId);
            if (r && redmist) r.redmistPitCycles = redmist;
            render();
          });
        }
      }
      break;
    }
    case "del-race":
      // Archived races no longer expose a delete control in the UI (see
      // raceTile()/renderPlan) — once results are submitted they're meant
      // to be preserved. This handler is intentionally left in place only
      // as a safety net; removing an archived record is a manual, raw-data
      // operation (e.g. editing rsp_races in localStorage) if ever truly needed.
      state.confirmDelete = { type:"race", id: el.getAttribute("data-id"), label: el.getAttribute("data-label") };
      render(); break;
    case "del-current-race":
      state.confirmDelete = { type:"race", id: state.currentRaceId, label: state.eventName };
      render(); break;
    case "cancel-delete":
      state.confirmDelete = null; render(); break;
    case "confirm-delete": {
      const cd = state.confirmDelete;
      if (cd.type === "race"){
        const { error } = await supabase.from('races').delete().eq('id', cd.id);
        if (error) console.error('delete race failed:', error);
        state.races = state.races.filter(r=>r.id!==cd.id);
        if (state.currentRaceId === cd.id){ state.page="home"; state.currentRaceId=null; state.plan=null; }
      } else if (cd.type === "car"){
        state.cars = state.cars.filter(c=>c.id!==cd.id);
      } else if (cd.type === "catalogCar"){
        await deleteCatalogEntry(cd.id);
        state.catalog = state.catalog.filter(c=>c.id!==cd.id);
      } else if (cd.type === "retireCar"){
        await retireCarAction(cd.carId, cd.stintIdx);
      } else if (cd.type === "finishStint"){
        await updateStintEnd(cd.carId, cd.stintIdx, cd.timeStr);
      }
      state.confirmDelete = null; render(); break;
    }
    case "select-track":
      state.track = el.getAttribute("data-track");
      if (state.track !== "Other") state.customTrack = "";
      render();
      updateSetupButtonState();
      break;
    case "show-add-car":
      state.addingCar = true; render(); break;
    case "close-add-car":
      state.addingCar = false; state.addingCustom = false; render(); break;
    case "select-catalog": {
      const def = state.catalog.find(c=>c.id===el.getAttribute("data-id"));
      if (def) addCarFromCatalog(def);
      break;
    }
    case "del-catalog":
      state.confirmDelete = { type:"catalogCar", id: el.getAttribute("data-id"), label: el.getAttribute("data-label") };
      render(); break;
    case "show-custom-car":
      state.addingCustom = true; render(); break;
    case "cancel-custom-car":
      state.addingCustom = false; render(); break;
    case "pick-accent":
      state.newCar.accent = el.getAttribute("data-color"); render(); break;
    case "submit-new-car":
      submitNewCar(); break;
    case "remove-car":
      state.confirmDelete = { type:"car", id: el.getAttribute("data-id"), label: el.getAttribute("data-label") };
      render(); break;
    case "add-driver": {
      const car = state.cars.find(c=>c.id===el.getAttribute("data-car"));
      if (car){
        car.drivers.push("");
        if (!car.driverStintMode) car.driverStintMode = car.drivers.slice(0,-1).map(()=>'60');
        car.driverStintMode.push('60');
        render();
      }
      break;
    }
    case "remove-driver": {
      const car = state.cars.find(c=>c.id===el.getAttribute("data-car"));
      const idx = +el.getAttribute("data-idx");
      if (car && car.drivers.length>1){
        car.drivers.splice(idx,1);
        if (car.driverStintMode) car.driverStintMode.splice(idx,1);
        render();
      }
      break;
    }
    case "set-stint-mode": {
      const car = state.cars.find(c=>c.id===el.getAttribute("data-car"));
      const idx = +el.getAttribute("data-idx");
      const mode = el.getAttribute("data-mode");
      if (car){
        if (!car.driverStintMode) car.driverStintMode = car.drivers.map(()=>'60');
        car.driverStintMode[idx] = mode;
        // Update this row in place rather than re-rendering the whole page,
        // which would scroll the setup form back to the top.
        const row = el.closest(".stint-len-row");
        if (row){
          row.querySelectorAll('[data-act="set-stint-mode"]').forEach(btn=>{
            btn.classList.toggle("active", btn.getAttribute("data-mode") === mode);
          });
          const sel = row.querySelector('[data-act="stint-wheel"]');
          if (sel){
            // A preset is now driving the value, so the custom select
            // reverts to its neutral "Custom" label.
            sel.value = "";
            sel.classList.remove("has-custom");
          }
        }
      }
      break;
    }
    case "createPlan":
      createRacePlan(); break;
    case "plan-edit":
      navPush();
      state.page = "setup"; render(); break;
    case "start-add-reserve": {
      const carId = el.getAttribute("data-car");
      state.addingReserve.add(carId);
      if (!(carId in state.reserveDraft)) state.reserveDraft[carId] = "";
      render();
      break;
    }
    case "cancel-add-reserve": {
      const carId = el.getAttribute("data-car");
      state.addingReserve.delete(carId);
      delete state.reserveDraft[carId];
      render();
      break;
    }
    case "confirm-add-reserve": {
      const carId = el.getAttribute("data-car");
      const name = (state.reserveDraft[carId] || "").trim();
      if (!name) return;
      const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
      if (cp){
        // Reserve drivers join the car's roster the same way a Setup-page
        // driver would — they become selectable in every stint's driver
        // dropdown immediately, defaulting to the 60min preset.
        if (!cp.car.driverStintMode) cp.car.driverStintMode = cp.car.drivers.map(()=>'60');
        cp.car.drivers.push(name);
        cp.car.driverStintMode.push('60');
      }
      state.addingReserve.delete(carId);
      delete state.reserveDraft[carId];
      await syncPlanToRaceRecord();
      render();
      break;
    }
    case "archiveRace":
      await archiveRace(); break;
    case "mylaps-open":
      state.mylapsImporting = true; state.mylapsError = null; render(); break;
    case "mylaps-cancel":
      state.mylapsImporting = false; state.mylapsError = null; render(); break;
    case "mylaps-reimport":
      state.mylapsImporting = true; state.mylapsError = null;
      state.mylapsSessionDraft = (state.races.find(r=>r.id===state.currentRaceId)?.mylaps?.sessionId) || "";
      { const race = state.races.find(r=>r.id===state.currentRaceId); if (race) race.mylaps = null; }
      render(); break;
    case "mylaps-toggle-field":
      state.mylapsShowFullField = !state.mylapsShowFullField; render(); break;
    case "mylaps-run": {
      const sessionId = state.mylapsSessionDraft.trim();
      if (!sessionId){ state.mylapsError = "Enter a session ID."; render(); break; }
      state.mylapsLoading = true; state.mylapsError = null; render();
      try {
        const race = state.races.find(r=>r.id===state.currentRaceId);
        const mylaps = await loadMylapsSession(sessionId, race);
        if (race){
          race.mylaps = mylaps;
          const saved = await saveMylapsResultsToSupabase(race.id, mylaps);
          // Data is visible for the rest of this session either way — the
          // failure mode here is just "didn't make it to Supabase", not
          // "nothing loaded". Logged to console by saveMylapsResultsToSupabase;
          // left as a residual state.mylapsError too in case Re-import is
          // opened again this session.
          if (!saved) state.mylapsError = "Results loaded, but saving to the archive failed — check the console, then try Re-import.";
        }
        state.mylapsImporting = false; state.mylapsLoading = false;
      } catch (err) {
        state.mylapsLoading = false;
        state.mylapsError = err.message.includes("Failed to fetch")
          ? "Couldn't reach MyLaps — check your connection or the session ID."
          : err.message;
      }
      render(); break;
    }
    case "clear-stint-log": {
      const cp = state.plan.carPlans.find(cp=>cp.car.id===el.getAttribute("data-car"));
      if (cp){
        cp.log = [];
        await supabase.from("stint_log").delete().eq("car_id", el.getAttribute("data-car"));
        render();
      }
      break;
    }
    case "toggle-stint-note": {
      const key = el.getAttribute("data-car")+"__"+el.getAttribute("data-stint");
      if (state.openStintNotes.has(key)) state.openStintNotes.delete(key);
      else state.openStintNotes.add(key);
      render();
      break;
    }
    case "toggle-stint-flag": {
      await toggleStintFlag(el.getAttribute("data-car"), +el.getAttribute("data-stint"), el.getAttribute("data-flag"));
      break;
    }
    case "toggle-car-plan": {
      const carId = el.getAttribute("data-car");
      if (state.expandedCarPlans.has(carId)) state.expandedCarPlans.delete(carId);
      else state.expandedCarPlans.add(carId);
      render();
      break;
    }
    case "prompt-retire-car": {
      const carId = el.getAttribute("data-car");
      const stintIdx = +el.getAttribute("data-stint");
      const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
      const label = cp ? `#${cp.car.number} ${cp.car.team}` : "this car";
      state.confirmDelete = { type:"retireCar", carId, stintIdx, label };
      render();
      break;
    }
    case "prompt-finish-stint": {
      const carId = el.getAttribute("data-car");
      const stintIdx = +el.getAttribute("data-stint");
      const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
      const stint = cp ? cp.stints[stintIdx] : null;
      const label = stint ? `${stint.driver || "This driver"}'s Stint ${stintIdx+1}` : "This stint";
      // Snapshot "now" once, at the moment the button is pressed — so the
      // confirmation dialog shows the exact time that will be applied,
      // with no drift from however long the person takes to confirm.
      const now = new Date();
      state.confirmDelete = { type:"finishStint", carId, stintIdx, label, timeStr: toTimeInputValue(now), timeLabel: formatTimeCompact(now) };
      render();
      break;
    }
  }
}

// ---- navigation history ----
// One stack drives every "go back" affordance: the on-screen Back button,
// the Esc key, and the phone/browser back gesture. Each forward navigation
// calls navPush() to record where we came from and adds a matching browser
// history entry, so popstate becomes the single place that restores a
// previous screen — the Back button and Esc just call history.back() and
// let that handler do the actual work. Keeping one code path means the
// three affordances can never disagree about where "back" leads.
function navPush(){
  state.navStack.push({ page: state.page, raceId: state.currentRaceId });
  try { history.pushState({ depth: state.navStack.length }, ""); } catch(_){}
}
// Wipe the trail — used when jumping to a root screen (Home), where
// "back" should not walk through wherever the user had been before.
function navReset(){
  state.navStack = [];
}
async function navBack(){
  const entry = state.navStack.pop();
  if (!entry){ state.page = "home"; render(); return; }
  // A plan screen needs its race refetched, not just the page name
  // flipped, since state.plan may have been replaced since we left it.
  if (entry.page === "plan" && entry.raceId){
    const full = await fetchFullRace(entry.raceId);
    if (full){ openRace(full); return; } // openRace renders
    state.page = "home"; render(); return;
  }
  state.page = entry.page;
  render();
}
// Called by the UI (Back button / Esc). Defers to the browser so the
// device back button and this stay in lockstep; falls back to Home when
// there's no history of our own left to unwind.
function requestBack(){
  if (state.navStack.length) history.back();
  else { state.page = "home"; render(); }
}

// Shifts the boundary between stint N-1 and stint N by moving stint N's
// start time. This is deliberately NOT the overrun cascade used by Finish:
// nothing downstream moves. The previous stint gives up (or gains) exactly
// the time this stint gains (or gives up), and every later stint keeps its
// original schedule. E.g. pulling Greg's 11:00 start back to 10:30 shortens
// the previous driver to 10:30 and stretches Greg to 150 min — his end time,
// and everyone after him, are untouched.
//
// Only valid while both stints are still unfinished: once a stint is
// finished its end is a recorded fact, and the next stint is already
// underway, so there is nothing left to plan.
const STINT_MIN_LENGTH = 15;   // never shrink a stint below this
const STINT_START_STEP = 15;   // stepper granularity

// Returns {canEarlier, canLater} describing whether stint N's start can
// move, so the UI can render/disable the steppers consistently.
function stintStartAdjustability(cp, idx){
  const s = cp.stints[idx];
  const prev = idx > 0 ? cp.stints[idx-1] : null;
  const off = { canEarlier:false, canLater:false };
  if (!s || s.removed) return off;
  if (idx === 0) return off;                        // race start is fixed
  if (!prev || prev.removed) return off;
  if (prev.finished || s.finished) return off;      // already run
  if (cp.retiredAtStint != null && idx > cp.retiredAtStint) return off;

  const quiet = prev.quietMinutes || 0;
  const earliestStart = addMinutes(prev.start, STINT_MIN_LENGTH + quiet);
  const latestStart = addMinutes(s.end, -STINT_MIN_LENGTH);
  return {
    canEarlier: +addMinutes(s.start, -STINT_START_STEP) >= +earliestStart,
    canLater:   +addMinutes(s.start,  STINT_START_STEP) <= +latestStart,
  };
}

async function adjustStintStart(carId, stintIdx, deltaMinutes){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const adj = stintStartAdjustability(cp, stintIdx);
  if (deltaMinutes < 0 && !adj.canEarlier) return;
  if (deltaMinutes > 0 && !adj.canLater) return;

  const s = cp.stints[stintIdx];
  const prev = cp.stints[stintIdx-1];
  const quiet = prev.quietMinutes || 0;

  // Remember where this stint sat before anyone started nudging it, so the
  // log entry can report the total shift rather than the most recent 15 min.
  // The baseline is captured once and then carried on the log entry itself.
  const existingEntry = findStintLogEntry(cp, stintIdx, "start-adjust");
  const baseline = (existingEntry && existingEntry.meta) ? existingEntry.meta : {
    origStartISO: s.start.toISOString(),
    origPrevLen: prev.lengthMin,
    origLen: s.lengthMin,
  };

  const newStart = addMinutes(s.start, deltaMinutes);
  // The previous stint ends where this one begins, less any quiet-time
  // break scheduled between them (that gap must be preserved).
  const newPrevEnd = addMinutes(newStart, -quiet);

  prev.end = newPrevEnd;
  prev.plannedEnd = new Date(newPrevEnd); // still a plan, not a recorded time
  prev.lengthMin = Math.round((+prev.end - +prev.start)/60000);

  s.start = newStart;
  s.lengthMin = Math.round((+s.end - +s.start)/60000);

  const totalDelta = Math.round((+s.start - +new Date(baseline.origStartISO))/60000);
  if (totalDelta === 0){
    // Nudged all the way back to where it started — nothing left to report.
    removeStintLogEntry(cp, stintIdx, "start-adjust");
  } else {
    // Two short lines, each naming a stint and its NEW time span, rather
    // than one sentence juggling four durations. Both figures are measured
    // against the original plan, so the entry always reads as the total
    // change so far — not the most recent 15 min nudge.
    const dir = totalDelta < 0 ? "earlier" : "later";
    const prevDelta = prev.lengthMin - baseline.origPrevLen;
    const prevWord = prevDelta < 0 ? "shorter" : "longer";
    logStintNote(cp, stintIdx,
      `Stint ${stintIdx+1} start moved **${formatDuration(Math.abs(totalDelta))}** ${dir} (${formatTimeCompact(s.start)} to ${formatTimeCompact(s.end)})\n` +
      `Stint ${stintIdx} now **${formatDuration(Math.abs(prevDelta))}** ${prevWord} (${formatTimeCompact(prev.start)} to ${formatTimeCompact(prev.end)})`,
      "info", "start-adjust", baseline);
  }

  await syncPlanToRaceRecord();
  render();
}

function openRace(race){
  state.currentRaceId = race.id;
  state.currentStatus = race.status;
  state.eventName = race.eventName;
  state.eventDate = race.eventDateISO;
  state.cars = JSON.parse(JSON.stringify(race.cars));
  state.track = TRACKS.includes(race.track) ? race.track : "Other";
  state.customTrack = TRACKS.includes(race.track) ? "" : race.track;
  state.startTime = race.startTime;
  state.durationHours = race.durationHours;

  const p = race.plan;
  state.plan = {
    startDateTime: new Date(p.startDateTimeISO),
    endDateTime: new Date(p.endDateTimeISO),
    totalMinutes: p.totalMinutes,
    track: race.track,
    carPlans: p.carPlans.map(cp=>({
      car: cp.car,
      log: cp.log||[],
      retiredAtStint: cp.retiredAtStint ?? null,
      stints: cp.stints.map(s=>({ ...s, quietMinutes: s.quietMinutes || 0, start:new Date(s.startISO), end:new Date(s.endISO), plannedEnd: new Date(s.plannedEndISO || s.endISO) })),
    })),
  };
  state.finishDrafts = {};
  state.expandedCarPlans = new Set();
  state.addingReserve = new Set();
  state.reserveDraft = {};
  state.page = "plan";
  render();
}

function addCarFromCatalog(def){
  state.cars.push({
    id: uid("car"),
    number: def.number, team: def.team, manufacturer: def.manufacturer, model: def.model,
    accent: def.accent, imageUrl: def.imageUrl || null, catalogId: def.id,
    drivers: [""], driverStintMode: ['60'], startingPosition: null, finishPosition: null,
  });
  state.addingCar = false; state.addingCustom = false;
  render();
}

async function submitNewCar(){
  const nc = state.newCar;
  if (!nc.number.trim()) return;
  const catEntry = await addCatalogEntry({
    number: nc.number.trim(), team: nc.team.trim()||"New Team",
    manufacturer: nc.manufacturer.trim()||"—", model: nc.model.trim()||"—", accent: nc.accent,
  });
  if (!catEntry) return; // insert failed — bail out rather than adding a car with no real catalog row
  state.catalog = [...state.catalog, catEntry];
  addCarFromCatalog(catEntry);
  state.newCar = { number:"", team:"", model:"", manufacturer:"", accent: ACCENT_PRESETS[0] };
}

async function createRacePlan(){
  const cars = state.cars;
  const canCreatePlan = cars.length>0 && cars.every(c=>c.drivers.some(d=>d.trim()))
      && (state.track && (state.track!=="Other" || state.customTrack.trim()))
      && state.startTime && Number(state.durationHours)>0;
  if (!canCreatePlan) return;

  const resolvedTrack = state.track === "Other" ? state.customTrack.trim() : state.track;
  const [hh,mm] = state.startTime.split(":").map(Number);
  const startDateTime = new Date(state.eventDate || Date.now());
  startDateTime.setHours(hh, mm, 0, 0);
  const totalMinutes = Number(state.durationHours) * 60;
  const endDateTime = addMinutes(startDateTime, totalMinutes);

  const raceFields = {
    event_name: state.eventName,
    event_date: (state.eventDate ? new Date(state.eventDate) : new Date()).toISOString().slice(0,10),
    track: resolvedTrack, start_time: state.startTime,
    duration_hours: Number(state.durationHours), status: "planned",
    plan_start_at: startDateTime.toISOString(), plan_end_at: endDateTime.toISOString(), total_minutes: totalMinutes,
  };

  let raceId = state.currentRaceId;
  if (raceId){
    // Re-editing an existing race's Setup and regenerating: update the
    // race row, then replace every car outright (cascades to their
    // stints/log automatically) rather than trying to reconcile which
    // cars/drivers changed — simplest correct translation of "the plan
    // gets rebuilt from whatever's currently in Setup."
    const { error } = await supabase.from("races").update(raceFields).eq("id", raceId);
    if (error){ console.error("update race failed:", error); return; }
    const { error: delErr } = await supabase.from("cars").delete().eq("race_id", raceId);
    if (delErr) console.error("delete old cars failed:", delErr);
  } else {
    const { data, error } = await supabase.from("races").insert(raceFields).select().single();
    if (error){ console.error("insert race failed:", error); return; }
    raceId = data.id;
  }

  // Postgres generates the real car/stint ids — insert cars one at a
  // time so each one's generated id is available for its own stints.
  const carPlans = [];
  for (const c of cars){
    const validIdx = c.drivers.map((d,idx)=>({d,idx})).filter(o=>o.d.trim());
    const validDrivers = validIdx.map(o=>o.d);
    const validStintModes = validIdx.map(o=>stintModeOf(c, o.idx));
    const carFields = {
      race_id: raceId, catalog_id: c.catalogId || null, number: c.number, team: c.team,
      manufacturer: c.manufacturer, model: c.model, accent: c.accent, drivers: validDrivers,
      driver_stint_mode: validStintModes,
      starting_position: parsePosition(c.startingPosition),
      finish_position: c.finishPosition != null ? parseFinishPosition(c.finishPosition) : null,
    };
    const { data: carRow, error: carErr } = await supabase.from("cars").insert(carFields).select().single();
    if (carErr){ console.error("insert car failed:", carErr); continue; }

    // Each driver's stint length comes from the 60/90/120 presets or a
    // custom 5-minute increment (45–180) on Setup. A car can mix lengths
    // freely — each driver's length is fully independent of the others. If
    // a driver's actual stint needs to run long or short of their preset,
    // use Finish on the planner page to lock in the real end time — the
    // cascade there re-times everything downstream.
    const stintLenFor = (rotationPos) => Number(validStintModes[rotationPos % validStintModes.length] || '60');

    // Scheduled quiet time (Barber / Road Atlanta on a Sunday) is a hard
    // clock-time pause, so the loop tracks a wall-clock cursor alongside
    // driven minutes rather than deriving times from elapsed alone. A stint
    // that would run through the window is cut short at the window's start
    // — the pause hangs off that stint, and the next driver picks up when
    // the window ends. Driven time is unaffected by the pause: the car
    // still completes the full race duration, so the day simply finishes
    // later by the length of the break.
    const quiet = quietWindowFor(resolvedTrack, startDateTime);

    let driven = 0, di = 0; const stints = [];
    let cursor = new Date(startDateTime);
    let quietApplied = false;

    while (driven < totalMinutes){
      // Sitting at the window start — take the break before opening
      // another stint rather than starting one we'd immediately pause.
      if (quiet && !quietApplied && +cursor >= +quiet.start){
        if (stints.length) stints[stints.length-1].quietMinutes = quiet.minutes;
        cursor = new Date(quiet.end);
        quietApplied = true;
        continue;
      }

      const wantLen = stintLenFor(di);
      let segLen = Math.min(wantLen, totalMinutes - driven);
      let end = addMinutes(cursor, segLen);

      // Would run into the pause — end it early, right on the window.
      if (quiet && !quietApplied && +end > +quiet.start){
        segLen = Math.round((+quiet.start - +cursor) / 60000);
        end = new Date(quiet.start);
      }
      if (segLen <= 0) break; // safety valve; shouldn't trigger

      stints.push({ driver: validDrivers[di % validDrivers.length], driverIndex: di % validDrivers.length, start: new Date(cursor), end, plannedEnd: new Date(end), lengthMin: segLen, position: null, notes: "", flags: [], removed: false, quietMinutes: 0, finished: false });
      driven += segLen; di += 1; cursor = new Date(end);
    }

    const stintRows = stints.map((s,i)=>({
      car_id: carRow.id, stint_index: i, driver: s.driver, driver_index: s.driverIndex,
      start_at: s.start.toISOString(), end_at: s.end.toISOString(), planned_end_at: s.plannedEnd.toISOString(),
      length_min: s.lengthMin, position: null, notes: "", flags: [], removed: false, quiet_minutes: s.quietMinutes || 0, finished: false,
    }));
    const { error: stintErr } = await supabase.from("stints").insert(stintRows);
    if (stintErr) console.error("insert stints failed:", stintErr);

    carPlans.push({ car: mapCarRowToCarRecord(carRow), stints, log: [], retiredAtStint: null });
  }

  state.plan = { startDateTime, endDateTime, totalMinutes, track: resolvedTrack, carPlans };
  state.currentRaceId = raceId;
  // A scheduled quiet-time pause pushes the finish later than
  // start + duration. The races row was inserted before the stints were
  // built, so derive the real end from the schedule and correct it.
  recomputePlanEndTime();
  if (state.plan.endDateTime > endDateTime){
    await supabase.from("races").update({
      plan_end_at: state.plan.endDateTime.toISOString(),
      total_minutes: state.plan.totalMinutes,
    }).eq("id", raceId);
  }
  state.currentStatus = "planned";
  state.finishDrafts = {};
  state.addingReserve = new Set();
  state.reserveDraft = {};
  state.page = "plan";

  state.races = await loadRaces(); // refresh the Home/Archive list to include this race
  render();
}

// Recompute the overall race end time from whichever car's stint schedule
// now runs longest, after a cascading edit.
function recomputePlanEndTime(){
  const plan = state.plan;
  let maxEnd = plan.startDateTime;
  plan.carPlans.forEach(cp=>{
    for (let k=cp.stints.length-1; k>=0; k--){
      if (!cp.stints[k].removed){
        const end = addMinutes(cp.stints[k].end, cp.stints[k].quietMinutes || 0);
        if (end > maxEnd) maxEnd = end;
        break;
      }
    }
  });
  plan.endDateTime = maxEnd;
  plan.totalMinutes = Math.round((plan.endDateTime - plan.startDateTime)/60000);
}

// Pushes the in-memory plan (after a stint edit) to Supabase: the race's
// overall computed timing, each car's retired state, and every stint for
// every car in one upsert per car (keyed on car_id+stint_index, which the
// stints table's unique constraint is built around — see schema). This
// keeps every individual mutation function below unchanged: they just
// mutate state.plan in memory exactly as before, then call this.
async function syncPlanToRaceRecord(){
  if (!state.currentRaceId) return;
  const plan = state.plan;

  await supabase.from("races").update({
    plan_start_at: plan.startDateTime.toISOString(),
    plan_end_at: plan.endDateTime.toISOString(),
    total_minutes: plan.totalMinutes,
  }).eq("id", state.currentRaceId);

  for (const cp of plan.carPlans){
    await supabase.from("cars").update({
      retired_at_stint: cp.retiredAtStint,
      drivers: cp.car.drivers,
      driver_stint_mode: cp.car.driverStintMode || [],
    }).eq("id", cp.car.id);

    const stintRows = cp.stints.map((s,i)=>({
      car_id: cp.car.id, stint_index: i, driver: s.driver, driver_index: s.driverIndex,
      start_at: s.start.toISOString(), end_at: s.end.toISOString(),
      planned_end_at: (s.plannedEnd||s.end).toISOString(), length_min: s.lengthMin,
      position: s.position ?? null, notes: s.notes||"", flags: s.flags||[],
      removed: s.removed||false, quiet_minutes: s.quietMinutes||0, finished: s.finished||false,
    }));
    const { error } = await supabase.from("stints").upsert(stintRows, { onConflict: "car_id,stint_index" });
    if (error) console.error("syncPlanToRaceRecord stints upsert failed:", error);
  }

  // Keep the shallow Home/Archive list's copy of this race's cars in sync
  // (car-level fields only — that list never holds stints).
  const raceInList = state.races.find(r=>r.id===state.currentRaceId);
  if (raceInList){
    raceInList.cars = plan.carPlans.map(cp=>({ ...cp.car }));
  }
}

// Shared cascade math for real end-time edits (updateStintEnd). Given a
// car's plan, an anchor stint index, and the cursor time the NEXT stint
// should start at, walks every stint after the anchor forward: absorbing
// a stint entirely if its own original end time has already passed by
// the time the cursor reaches it, or restoring + re-timing it otherwise.
// Finishes by re-running the driver rotation across whatever changed.
// Returns which stints were newly absorbed/newly restored, for the caller
// to log. (Quiet time does NOT use this — it's a fixed clock-time pause
// baked in when the plan is built, see quietWindowFor/createRacePlan. It
// uniformly shifts the schedule instead of absorbing anyone's stint.)
function cascadeStintsFrom(cp, anchorIdx, cursor){
  const stints = cp.stints;
  const nowRemoved = [];
  const nowRestored = [];
  const newlyNegligibleFinal = [];
  for (let j=anchorIdx+1; j<stints.length; j++){
    const s = stints[j];
    if (cp.retiredAtStint != null && j > cp.retiredAtStint){
      s.removed = true; // car retired — stays removed regardless of time math
      continue;
    }
    if (s.end <= cursor){
      if (!s.removed) nowRemoved.push(j);
      s.removed = true;
      s.negligibleFinal = false;
      s.start = new Date(cursor);
      // cursor doesn't advance — this stint contributed no time
    } else {
      if (s.removed) nowRestored.push(j);
      s.removed = false;
      s.start = new Date(cursor);
      s.lengthMin = Math.round((s.end - s.start)/60000);
      // Advance past this stint's own end AND any quiet-time break already
      // scheduled right after it — otherwise a later cascade (triggered by
      // finishing an earlier stint) would silently erase that gap when it
      // recalculates this stint's downstream neighbor.
      cursor = addMinutes(s.end, s.quietMinutes || 0);

      // "Negligible final stint" rule: the very last stint in the plan,
      // squeezed down to a sliver by an upstream overrun, isn't worth
      // creating as its own driver-assigned stint. Real start/end times
      // are untouched by this — it only changes whether it's presented
      // as a schedulable stint or folded into a note.
      const isFinalStint = j === stints.length - 1;
      const threshold = finalStintNegligibleThresholdMin();
      if (isFinalStint && s.lengthMin > 0 && s.lengthMin <= threshold){
        if (!s.negligibleFinal) newlyNegligibleFinal.push(j);
        s.negligibleFinal = true;
        s.negligibleMinutes = s.lengthMin;
      } else if (s.negligibleFinal){
        s.negligibleFinal = false;
        delete s.negligibleMinutes;
      }
    }
  }

  // Absorbing stints doesn't cancel those drivers — it just means their turn
  // hasn't come yet. So the surviving stints shift down by however many
  // slots were swallowed: if an overrun eats two stints, everyone after it
  // moves two places later and keeps the same running order. A queue does
  // this in one pass — each stint contributes its current driver to the back
  // and takes the front, while a removed stint contributes its driver but
  // claims no slot, which is exactly what pushes the sequence along.
  //
  // Restoration is the opposite: nothing was skipped, so the rotation is
  // re-run cleanly from the anchor rather than shifted. Finished stints end
  // either pass — their driver is recorded history, not a plan.
  if (nowRemoved.length){
    const queue = [];
    for (let j=anchorIdx+1; j<stints.length; j++){
      const s = stints[j];
      if (s.finished) break;
      queue.push({ driver: s.driver, driverIndex: s.driverIndex });
      if (s.removed) continue; // driver stays queued, waiting for a real slot
      const next = queue.shift();
      s.driver = next.driver;
      s.driverIndex = next.driverIndex;
    }
  } else if (nowRestored.length){
    const validDrivers = cp.car.drivers.filter(d=>d.trim());
    if (validDrivers.length){
      let rot = (stints[anchorIdx].driverIndex + 1) % validDrivers.length;
      for (let j=anchorIdx+1; j<stints.length; j++){
        if (stints[j].finished) break;
        if (stints[j].removed) continue;
        stints[j].driverIndex = rot;
        stints[j].driver = validDrivers[rot];
        rot = (rot+1) % validDrivers.length;
      }
    }
  }

  return { nowRemoved, nowRestored, newlyNegligibleFinal };
}

// Editing a stint's end time hands the freed-up (or overrun) time to
// whatever comes after it. The very next stint just has its start pushed
// to match. If the overrun is big enough to swallow that stint's own
// planned end entirely, it's marked removed (greyed out, not deleted —
// see renderStintRow) and the cascade keeps checking the stint after that,
// and so on, until it reaches one with real time left. Shrinking an earlier
// stint back down runs the same recalculation and revives anything that's
// no longer swallowed.
async function updateStintEnd(carId, stintIdx, timeStr){
  if (!timeStr) { render(); return; }
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stints = cp.stints;
  const stint = stints[stintIdx];
  if (!stint) return;

  const [hh,mm] = timeStr.split(":").map(Number);
  const newEnd = new Date(stint.start);
  newEnd.setHours(hh, mm, 0, 0);

  if (newEnd <= stint.start){
    render(); // invalid — end can't be before this stint's own start; revert the field
    return;
  }

  const deltaMin = Math.round((newEnd.getTime() - stint.end.getTime())/60000); // did this specific edit change anything?
  if (!stint.plannedEnd) stint.plannedEnd = new Date(stint.end); // backfill for stints saved before this was tracked
  stint.end = newEnd;
  stint.lengthMin = Math.round((stint.end - stint.start)/60000);
  stint.removed = false; // the stint being actively edited is never itself "removed"
  stint.finished = true; // this is the only path that confirms a real end time, so the End column now shows it instead of the Finish Stint button

  // Reported minutes always compare against this stint's ORIGINAL planned
  // end time, not just its value a moment ago — so if it already shifted
  // from an earlier edit or absorbed time from a prior stint's extension,
  // the log still reflects the true total deviation from the schedule
  // rather than just this one interaction's small remaining nudge.
  const deltaFromPlan = Math.round((stint.end.getTime() - stint.plannedEnd.getTime())/60000);

  // The overrun/underrun cascade runs on the RAW new end time only — it
  // decides whether downstream stints get absorbed or restored based on
  // genuine time gained or lost. It must NOT include the quiet-time break
  // below, or a scheduled rest period gets mistaken for lost time and ends
  // up stretching/absorbing real stints instead of just pushing the
  // schedule later untouched.
  const cursor = newEnd;
  const { nowRemoved, nowRestored, newlyNegligibleFinal } = cascadeStintsFrom(cp, stintIdx, cursor);

  // Any quiet-time break scheduled after THIS stint is dead time nobody
  // drives through. It must push everything downstream later by exactly
  // its duration, without changing anyone's stint length — a flat shift.
  // Doing this as a separate step (after the overrun cascade above) keeps a
  // scheduled rest period from ever being treated as absorbable lost time.
  if (stint.quietMinutes){
    for (let j=stintIdx+1; j<stints.length; j++){
      const ds = stints[j];
      ds.start = addMinutes(ds.start, stint.quietMinutes);
      ds.end = addMinutes(ds.end, stint.quietMinutes);
      if (ds.plannedEnd) ds.plannedEnd = addMinutes(ds.plannedEnd, stint.quietMinutes);
    }
  }

  if (nowRemoved.length){
    const list = nowRemoved.map(i=>`Stint ${i+1}`).join(", ");
    logStintNote(cp, stintIdx, `Stint ${stintIdx+1} extended by ${deltaFromPlan} min — completely absorbed ${list}. ${nowRemoved.length>1?"They've":"It's"} been removed from the schedule.`, "warn", "end-adjust");
  } else if (nowRestored.length){
    const list = nowRestored.map(i=>`Stint ${i+1}`).join(", ");
    logStintNote(cp, stintIdx, `Stint ${stintIdx+1} adjusted — ${list} restored to the schedule.`, "info", "end-adjust");
  } else if (deltaMin !== 0){
    const label = deltaFromPlan > 0
      ? `Stint ${stintIdx+1} extended by ${deltaFromPlan} min.`
      : deltaFromPlan < 0
        ? `Stint ${stintIdx+1} was short ${Math.abs(deltaFromPlan)} min.`
        : `Stint ${stintIdx+1} adjusted back to its original schedule.`;
    logStintNote(cp, stintIdx, label, "info", "end-adjust");
  }

  // The final stint got squeezed down to a sliver too small to hand a
  // driver as its own stint — not absorbed to zero, just noted. Its real
  // start/end times are untouched; only the fact that it isn't being
  // scheduled as a stand-alone stint gets logged.
  if (newlyNegligibleFinal.length){
    newlyNegligibleFinal.forEach(i=>{
      const mins = stints[i].negligibleMinutes;
      logStintNote(cp, i, `Only ${mins} min remains for the final stint — too short to schedule as its own stint. Noted here in case fuel numbers are tight near the ${finalStintNegligibleThresholdMin()} min mark.`, "warn");
    });
  }


  recomputePlanEndTime();
  await syncPlanToRaceRecord();
  render();
}

async function updateStintPosition(carId, stintIdx, value){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  stint.position = value.trim() ? value.trim() : null;
  await syncPlanToRaceRecord();
  render();
}

// Lets a stint's driver be reassigned after the plan was generated (e.g.
// swapping the rotation on the fly, or slotting someone in out of their
// usual sequence). driverIndex is kept in sync so the color dot / palette
// stays consistent with the car's driver list.
//
// Deliberately a bare name swap: no stint resize, no downstream driver
// shuffle. The rotation built at race creation already lays out lengths and
// order efficiently, and start times are now tuned directly with the ±15
// adjuster — so a dropdown change here should mean only "this stint is
// driven by someone else," never a silent re-plan of the rest of the day.
async function updateStintDriver(carId, stintIdx, driverName){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  const validDrivers = cp.car.drivers.filter(d=>d.trim());
  const idx = validDrivers.indexOf(driverName);
