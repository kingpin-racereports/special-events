  stint.driver = driverName;
  stint.driverIndex = idx >= 0 ? idx : 0;
  await syncPlanToRaceRecord();
  render();
}

async function updateStintNote(carId, stintIdx, value){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  stint.notes = value;
  await syncPlanToRaceRecord();
  render();
}

async function toggleStintFlag(carId, stintIdx, flagKey){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  if (!stint.flags) stint.flags = [];

  const idx = stint.flags.indexOf(flagKey);
  if (idx >= 0) stint.flags.splice(idx, 1); else stint.flags.push(flagKey);
  await syncPlanToRaceRecord();
  render();
}

// Retiring a car marks every stint after the retirement point as removed
// (same greyed-out treatment as an absorbed stint) and records which stint
// it happened after. recomputePlanEndTime + the cascade guard in
// updateStintEnd both already respect retiredAtStint, so the race's overall
// end time and any later time edits correctly treat this car as done.
async function retireCarAction(carId, stintIdx){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  cp.retiredAtStint = stintIdx;
  for (let j=stintIdx+1; j<cp.stints.length; j++){
    cp.stints[j].removed = true;
  }
  logStintNote(cp, stintIdx, `Car retired after Stint ${stintIdx+1}.`, "warn");
  recomputePlanEndTime();
  await syncPlanToRaceRecord();
  render();
}

async function archiveRace(){
  // Finish position is no longer entered here — MyLaps import supplies it
  // post-archive (see getEffectiveFinishPosition()). The `finish_position`
  // column on `cars` is left untouched going forward; RLS blocks writing
  // it once the race is archived anyway, so there's nothing to backfill.
  //
  // This RLS block is BY DESIGN, not a bug to route around: once a race
  // is archived, its `cars` rows are meant to be frozen at the database
  // level. Any correction to an already-archived race should be a rare,
  // deliberate action done directly in Supabase (dashboard/SQL) — not
  // something the app exposes an "edit archived race" path for. Do not
  // add a client-side workaround (e.g. a service-role bypass) for this.
  const { error: statusErr } = await supabase.from("races").update({ status: "archived" }).eq("id", state.currentRaceId);
  if (statusErr) console.error("archiveRace: status update failed:", statusErr);

  state.currentStatus = "archived";
  const raceInList = state.races.find(r=>r.id===state.currentRaceId);
  if (raceInList){
    raceInList.status = "archived";
    raceInList.cars = state.plan.carPlans.map(cp=>({ ...cp.car }));
  }
  render();
}

// ---- horizontal-scroll support for tile rows (mouse wheel + click-drag) ----
// Delegated on document so it keeps working across re-renders (bindEvents()
// re-runs on every render(), but this only needs to be wired up once).
(function enableHorizontalScrollRows(){
  const ROW_SELECTOR = ".tile-row, .catalog-row, .track-picker-row";

  // Mouse wheel / trackpad: a vertical wheel gesture over a horizontally
  // scrollable row scrolls it sideways instead of scrolling the page.
  document.addEventListener("wheel", function(e){
    const row = e.target.closest(ROW_SELECTOR);
    if (!row) return;
    if (row.scrollWidth <= row.clientWidth) return; // nothing to scroll
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // already a horizontal gesture, let it be native
    e.preventDefault();
    row.scrollLeft += e.deltaY;
  }, { passive: false });

  // Click-and-drag (mouse) support, in addition to native touch swipe which
  // overflow-x:auto already provides on mobile.
  let dragEl = null, startX = 0, startScroll = 0, moved = false;
  document.addEventListener("mousedown", function(e){
    const row = e.target.closest(ROW_SELECTOR);
    if (!row) return;
    dragEl = row; startX = e.pageX; startScroll = row.scrollLeft; moved = false;
    row.classList.add("dragging");
  });
  document.addEventListener("mousemove", function(e){
    if (!dragEl) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    dragEl.scrollLeft = startScroll - dx;
  });
  function endDrag(){
    if (!dragEl) return;
    dragEl.classList.remove("dragging");
    dragEl = null;
  }
  document.addEventListener("mouseup", endDrag);
  document.addEventListener("mouseleave", endDrag);
  // Suppress the click that would otherwise fire on a tile right after a
  // real drag (so dragging the row doesn't accidentally select a tile).
  document.addEventListener("click", function(e){
    if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
})();

// ---- AUTH BOOT ----
// This page renders for everyone, session or not — getSession() resolves
// from the client's cached session (localStorage), fast, no network
// round-trip in the common case. If a session exists, checkIsEngineer()
// (a simple "am I in the engineers table" lookup) decides whether edit
// controls unlock; maybeSingle() (not single()) since zero rows is the
// normal, expected case for a non-engineer account, not an error. The
// onAuthStateChange listener below upgrades to engineer mode if a session
// shows up shortly after load (e.g. a magic-link click landing here), and
// downgrades back to read-only on sign-out.
// ---- "currently on track" live-highlight ticker ----
// carPlanSection() already computes the correct live stint at render time,
// but if someone leaves the plan page open without triggering any other
// re-render, that highlight would go stale as time passes. Rather than
// calling the full render() on a timer — which would blow away an
// in-progress stint note edit (the textarea only commits on blur) — this
// directly patches just the timeline segments and stint-table rows that
// need to change, using the data- attributes carPlanSection() writes out
// for exactly this purpose.
function updateLiveHighlights(){
  if (!state.plan || state.currentStatus === "archived") return;
  state.plan.carPlans.forEach(cp=>{
    const liveIdx = computeLiveStintIndex(cp.stints, false);

    document.querySelectorAll(`.timeline .seg[data-car="${cp.car.id}"]`).forEach(el=>{
      const idx = +el.getAttribute("data-stint");
      const color = el.getAttribute("data-color");
      const isLive = idx === liveIdx;
      const [r,g,b] = hexToRgb(color);
      const stint = cp.stints[idx];
      el.classList.toggle("seg-live", isLive);
      el.style.background = isLive ? "rgba(226,68,92,0.10)" : `rgba(${r},${g},${b},0.14)`;
      el.style.borderColor = isLive ? "var(--red)" : "transparent";
      if (!isLive) el.style.borderTopColor = color; // border-color shorthand above also reset the top accent stripe — reassert it
      el.style.boxShadow = "none";
      if (stint) el.style.flexGrow = Math.max(stint.lengthMin, 1) * (isLive ? 1.6 : 1); // live card gets extra room for "ON TRACK"
      const dotEl = el.querySelector(".dot, .live-dot");
      if (dotEl){
        dotEl.className = isLive ? "live-dot" : "dot";
        dotEl.style.background = isLive ? "var(--red)" : color;
      }
      const tmEl = el.querySelector(".tm");
      if (tmEl){
        if (isLive){
          tmEl.style.whiteSpace = "normal";
          tmEl.style.overflow = "visible";
          tmEl.style.lineHeight = "1.1";
          tmEl.innerHTML = `<span style="color:var(--red);font-weight:600;">ON TRACK</span>`;
        } else {
          tmEl.style.whiteSpace = "";
          tmEl.style.overflow = "";
          tmEl.style.lineHeight = "";
          tmEl.innerHTML = (stint && stint.finished ? formatDuration(stint.lengthMin) : formatTimeUltraCompact(new Date(el.getAttribute("data-start-iso"))));
        }
      }
    });

    document.querySelectorAll(`.stint-table .row[data-car="${cp.car.id}"]`).forEach(el=>{
      const idx = +el.getAttribute("data-stint");
      const isLive = idx === liveIdx;
      el.classList.toggle("row-live", isLive);
    });
  });
}
setInterval(updateLiveHighlights, 30000);

async function checkIsEngineer(){
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return false;
  const { data, error } = await supabase.from("engineers").select("user_id").eq("user_id", user.id).maybeSingle();
  if (error){ console.error("checkIsEngineer failed:", error); return false; }
  return !!data;
}

// The phone/browser back gesture and the Esc key both route through the
// same stack the on-screen Back button uses. popstate is the only place
// that actually unwinds a screen; the button and Esc call history.back(),
// which triggers this.
window.addEventListener("popstate", function(){
  if (state.confirmDelete){ state.confirmDelete = null; render(); return; }
  if (state.navStack.length) navBack();
});
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  // Esc closes an open confirmation dialog first; only once nothing is
  // layered on top does it mean "go back a screen".
  if (state.confirmDelete){ state.confirmDelete = null; render(); return; }
  // Don't hijack Esc while the user is in a text field.
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")){ t.blur(); return; }
  requestBack();
});

// Re-fetches races fresh from Supabase, but preserves any fields that only
// live in memory and aren't part of the races/cars row shape itself -
// currently just `mylaps` (imported MyLaps results, attached separately by
// the open-race handler, not part of loadRaces()'s own query).
//
// Needed because Supabase's auth client can fire a SIGNED_IN-equivalent
// event on its own when a tab regains focus/visibility (routine token
// refresh behavior, not something this app triggers) - see
// onAuthStateChange below. That re-runs startApp(), which used to blindly
// replace state.races wholesale, silently wiping any currently-open race's
// loaded mylaps data even though nothing the person did should have
// discarded it. A full page reload masked this (it re-opens the race
// properly and re-fetches mylaps), which is why the bug only showed up on
// tab-switch, not on refresh.
// Re-fetches races fresh from Supabase, but preserves any fields that only
// live in memory and aren't part of the races/cars row shape itself -
// currently `mylaps` (imported MyLaps results) and `redmistPitCycles` (Red
// Mist pit-cycle data), both attached separately by the open-race handler,
// not part of loadRaces()'s own query.
//
// Needed because Supabase's auth client can fire a SIGNED_IN-equivalent
// event on its own when a tab regains focus/visibility (routine token
// refresh behavior, not something this app triggers) - see
// onAuthStateChange below. That re-runs startApp(), which used to blindly
// replace state.races wholesale, silently wiping any currently-open race's
// loaded data even though nothing the person did should have discarded it.
// A full page reload masked this (it re-opens the race properly and
// re-fetches everything), which is why the bug only showed up on
// tab-switch, not on refresh.
async function startApp(isEngineer){
  state.isEngineer = isEngineer;
  const fresh = await loadRaces();
  const prevById = new Map(state.races.map(r => [r.id, r]));
  state.races = fresh.map(r => {
    const prev = prevById.get(r.id);
    if (!prev) return r;
    const preserved = { ...r };
    if (prev.mylaps) preserved.mylaps = prev.mylaps;
    if (prev.redmistPitCycles) preserved.redmistPitCycles = prev.redmistPitCycles;
    return preserved;
  });
  state.catalog = await loadCatalog();
  render();
}

async function bootIfAuthorized(){
  // Roster/allowlist gating has been rolled back — the plan is public and
  // read-only for anyone. The only thing left to check is whether the
  // signed-in account (if any) is an engineer, which unlocks editing.
  const isEngineer = await checkIsEngineer();
  await startApp(isEngineer);
}

(async function boot(){
  const { data: { session } } = await supabase.auth.getSession();
  if (session){
    await bootIfAuthorized();
  } else {
    // No session — the plan is public and read-only, so render it
    // immediately rather than gating on (or redirecting for) a login.
    await startApp(false);
  }

  // Safety net / upgrade path: picks up a session that lands after the
  // initial render (e.g. a magic-link click that opened this same URL,
  // or the tab regaining a session), and re-checks engineer status.
  // Also downgrades back to read-only immediately on sign-out.
  supabase.auth.onAuthStateChange(function(event, newSession){
    if (event === "SIGNED_IN" && newSession){
      bootIfAuthorized();
    } else if (event === "SIGNED_OUT"){
      state.isEngineer = false;
      render();
    }
  });
})();
