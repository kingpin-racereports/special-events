<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Race Strategy Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#05215a; --panel:#031a4a; --panelRaised:#1B2456;
    --border:#2A3468; --borderLight:#3C4880;
    --text:#F4F6FB; --textMuted:#A6AFD6; --textFaint:#6870A0;
    --blue:#3D6FE8; --amber:#F2A63E; --green:#3FB27F; --red:#E2445C;
    --purple:#8B6BF0; --gold:#E0B84B; --silver:#C6CBD3; --bronze:#C97F4B;
  }
  /* Explicitly declaring the dark scheme above tells browsers (Samsung
     Internet in particular) this page already has a hand-authored dark
     theme, so their own "auto dark mode" won't additionally reprocess
     images/backgrounds — without this, Samsung Internet was dimming
     white-background assets like the track map PNG and the logo that
     Chrome left alone. */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .font-display{font-family:'Barlow Condensed',sans-serif;letter-spacing:0.02em;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--textFaint);}
  a,button{font-family:inherit;}
  button{cursor:pointer;}
  input,select{font-family:inherit;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .35s ease-out;}
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.7);}
  select option{background:var(--panelRaised);color:var(--text);}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}

  .field{
    background:var(--panel); border:1px solid var(--borderLight); color:var(--text);
    border-radius:10px; padding:10px 12px; width:100%; font-size:14px;
  }
  .label{
    color:var(--textFaint); letter-spacing:0.08em; font-family:'JetBrains Mono',monospace;
    text-transform:uppercase; font-size:11px; display:flex; align-items:center; gap:5px; margin-bottom:6px;
  }
  .page{max-width:768px;margin:0 auto;padding:32px 20px 112px;}
  .page-wide{max-width:896px;}
  .btn-back{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--textMuted);background:none;border:none;padding:0;}
  .icon{display:inline-flex;vertical-align:middle;}

  /* ---- icons (inline svg strokes, mimics lucide) ---- */
  svg.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---- Home ---- */
  .home-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 24px;}
  .home-main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .races-strip{width:100%;max-width:768px;margin-bottom:40px;}
  .races-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:12px;padding:0 4px;}
  .archive-link{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--gold);background:none;border:none;}
  .tile-row{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 8px;}
  /* Do NOT constrain touch-action on these rows. A value of pan-x lets the
     browser scroll them sideways but BLOCKS vertical touch panning over
     them, so a swipe starting on a tile can't scroll the page and it feels
     stuck. `auto` gives the browser full native control: it decides per
     gesture whether the finger is scrolling this row sideways or the page
     vertically, and pinch-zoom keeps working. Drag-to-scroll here is
     mouse-driven (mousedown/mousemove), so it never needed touch-action. */
  .tile-row,.catalog-row,.track-picker-row{-webkit-overflow-scrolling:touch;touch-action:auto;cursor:grab;}
  .tile-row.dragging,.catalog-row.dragging,.track-picker-row.dragging{cursor:grabbing;}
  .tile-row-center{justify-content:safe center;}
  /* Archive page reuses .tile-row as a wrapping grid (flex-wrap:wrap) rather
     than a horizontal scroller, so the pan-x restriction above has nothing
     to scroll horizontally but still blocks vertical touch scrolling of the
     page. Restore normal touch panning for that wrapped variant. */
  .tile-row.tile-row-wrap{touch-action:auto;cursor:default;}
  .create-circle{width:56px;height:56px;border-radius:999px;border:1px solid var(--borderLight);color:var(--textMuted);display:flex;align-items:center;justify-content:center;margin-bottom:32px;}
  .create-btn{display:flex;align-items:center;gap:12px;border-radius:999px;padding:16px 28px;background:var(--panel);border:1px solid var(--borderLight);color:var(--text);transition:border-color .15s;}
  .create-btn:hover{border-color:var(--blue);}
  .create-btn span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;}
  .name-flow{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .name-input{width:100%;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;outline:none;border-radius:12px;background:var(--panel);border:1px solid var(--borderLight);padding:14px 16px;color:var(--text);}
  .continue-btn{display:flex;align-items:center;gap:8px;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;padding:12px 24px;background:var(--blue);color:#0A0C10;border:none;}
  .continue-btn:disabled{background:var(--panel);color:var(--textFaint);opacity:.6;cursor:not-allowed;}

  /* ---- race tile ---- */
  .race-tile{flex:0 0 auto;width:min(82vw,320px);border-radius:16px;overflow:hidden;background:var(--panel);border:2px solid var(--border);position:relative;text-align:left;cursor:pointer;}
  .catalog-tile{cursor:pointer;}
  .race-tile .strip{aspect-ratio:8/7;position:relative;}
  .race-tile .strip button.del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
  .race-tile button.dup{position:absolute;bottom:8px;right:8px;width:22px;height:22px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;}
  .race-tile .body{padding:12px 30px 14px 14px;}
  .race-tile .name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;line-height:1.15;margin-bottom:3px;}
  .race-tile .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);}

  /* ---- car cards / catalog ---- */
  .car-card{flex:0 0 auto;width:152px;border-radius:16px;overflow:hidden;background:var(--panel);border:2px solid var(--border);position:relative;}
  .car-card .strip{height:200px;position:relative;}
  .car-card .num{position:absolute;bottom:-9px;left:10px;background:var(--bg);border-radius:6px;padding:0 7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;}
  .car-card .del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
  .catalog-tile .del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
  .car-card .body{padding:14px 10px 10px;font-family:'Inter',sans-serif;}
  .car-card .team{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}
  .car-card .model{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);margin-top:2px;}
  .add-car-card{flex:0 0 auto;width:152px;height:130px;border-radius:16px;background:transparent;border:1.5px dashed var(--borderLight);color:var(--textMuted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .add-car-card span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;}

  .livery{width:100%;height:100%;position:relative;overflow:hidden;}
  .track-layout-img{width:100%;height:100%;object-fit:cover;display:block;}
  .livery::before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.14) 0 10px, transparent 10px 26px);}
  .livery::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);}

  .catalog-panel{margin-top:16px;border-radius:16px;background:var(--panel);border:1px solid var(--border);padding:16px;}
  .catalog-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
  .catalog-tile{flex:0 0 auto;width:152px;border-radius:16px;overflow:hidden;background:var(--panelRaised);border:2px solid var(--border);text-align:left;position:relative;}
  .catalog-tile .strip{height:64px;position:relative;}
  .catalog-tile .num{position:absolute;bottom:-9px;left:10px;background:var(--bg);border-radius:6px;padding:0 7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;}
  .catalog-tile .body{padding:14px 10px 10px;}
  .catalog-tile .team{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}
  .catalog-tile .model{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);margin-top:2px;}

  .new-car-form{margin-top:16px;border-radius:12px;background:var(--panelRaised);border:1px solid var(--borderLight);padding:14px;max-width:320px;display:flex;flex-direction:column;gap:8px;}
  .swatches{display:flex;gap:8px;}
  .swatch{width:18px;height:18px;border-radius:999px;border:2px solid transparent;padding:0;}
  .swatch.active{border-color:var(--text);}

  /* ---- driver / car detail section ---- */
  .car-detail{border-radius:16px;overflow:hidden;background:var(--panel);border:2px solid var(--border);margin-bottom:16px;}
  .car-detail .strip{height:56px;position:relative;}
  .car-detail-plan .strip{height:200px;}
  .car-detail .num{position:absolute;bottom:-10px;left:12px;background:var(--bg);border-radius:7px;padding:0 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;}
  .car-detail .content{padding:20px 16px 16px;}
  .driver-row{display:flex;align-items:center;gap:8px;}
  .driver-row .idx{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);width:18px;}
  .driver-row button{background:none;border:none;color:var(--textFaint);display:flex;}
  .driver-group{margin-bottom:14px;}
  /* One line, always. The label is the flexible element — it shrinks (and
     ellipsises if it must) so the preset buttons and the custom select are
     never pushed onto a second row on a narrow phone. */
  .stint-len-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin:6px 0 0 26px;}
  .stint-len-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .stint-len-label svg{flex-shrink:0;}
  .stint-len-row .segmented,.stint-len-row .stint-wheel{flex-shrink:0;}
  /* Preset buttons sit alongside the custom <select> below, so they share
     its height, radius, and mono type to read as one control group. */
  .segmented{display:flex;height:30px;border:1px solid var(--borderLight);border-radius:8px;overflow:hidden;flex-shrink:0;}
  .segmented button{
    background:var(--panel);border:none;color:var(--textMuted);
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    padding:0 12px;display:flex;align-items:center;justify-content:center;
  }
  .segmented button+button{border-left:1px solid var(--borderLight);}
  .segmented button.active{background:var(--blue);color:#0A0C10;font-weight:600;}

  /* Stint-length custom picker: a native <select>. Rendered by the OS as a
     spinning wheel on iOS, a scrollable list dialog on Android, and a
     dropdown on desktop — the options list is drawn above the page by the
     browser itself, so it can never fight the page's own scrolling the way
     a hand-built scroll wheel does. Reads as "Custom" while one of the
     60/90/120 presets is active, and shows the chosen value (highlighted,
     via .has-custom) once a non-preset length is picked. */
  .stint-wheel{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    width:86px;height:30px;padding:0 22px 0 10px;
    background:var(--panel);color:var(--textMuted);
    border:1px dashed var(--borderLight);border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    text-align:center;text-align-last:center;cursor:pointer;flex-shrink:0;
    background-image:linear-gradient(45deg,transparent 50%,var(--textMuted) 50%),linear-gradient(135deg,var(--textMuted) 50%,transparent 50%);
    background-position:calc(100% - 12px) 13px,calc(100% - 8px) 13px;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  }
  .stint-wheel.has-custom{
    border-style:solid;border-color:var(--blue);color:var(--blue);font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,var(--blue) 50%),linear-gradient(135deg,var(--blue) 50%,transparent 50%);
  }
  .add-driver{margin-top:6px;display:flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;background:none;border:none;}

  /* ---- buttons general ---- */
  .btn-primary{width:100%;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;padding:16px 0;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:var(--blue);color:#0A0C10;}
  .btn-primary:disabled{background:var(--panel);color:var(--textFaint);border:1px solid var(--borderLight);cursor:not-allowed;}

  /* ---- info chips ---- */
  .chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:24px 0;}
  .summary-box{margin-bottom:16px;border-radius:12px;background:var(--panel);border:1px solid var(--border);padding:14px 16px;}
  .summary-drivers{display:flex;flex-direction:column;gap:6px;}
  .summary-driver{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;}
  .summary-driver span:first-child{color:var(--textMuted);}
  .summary-driver span:last-child{color:var(--text);font-weight:500;}
  .chip{border-radius:12px;background:var(--panel);border:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .chip .ico{color:var(--textFaint);}
  .chip .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);}
  .chip .val{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}

  /* ---- timeline ---- */
  /* Redesigned as a row of individually-rounded "stint cards" rather than
     solid color blocks glued edge-to-edge: each card gets a tinted wash
     of the driver's accent color, a bold top accent stripe, a color dot
     next to the driver name, and the start time in mono underneath.
     flex-grow is set per-segment (in JS) proportional to the stint's
     actual length in minutes, so a 90-minute stint visibly reads wider
     than a 45-minute one instead of every segment getting equal space. */
  .timeline{display:flex;gap:6px;width:100%;}
  .timeline .seg{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;border-radius:10px;border:1px solid transparent;border-top:3px solid transparent;padding:9px 10px 8px;overflow:hidden;}
  .timeline .seg .drv{display:flex;align-items:center;justify-content:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;line-height:1.15;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .timeline .seg .drv .dot{display:none;} /* per-driver dot removed — top border accent already color-codes each card; only the live red dot (see .live-dot) remains visible */
  .timeline .seg .tm{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;}

  .stint-table{margin-top:12px;border-radius:12px;border:1px solid var(--border);overflow:hidden;display:grid;grid-template-columns:minmax(68px,1.2fr) minmax(60px,0.6fr) minmax(45px,0.53fr) minmax(37px,0.43fr) minmax(25px,0.29fr);column-gap:3px;row-gap:0;}
  .stint-table .head{display:grid;grid-template-columns:subgrid;grid-column:1 / -1;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;padding:8px 5px 8px 32px;background:var(--panel);color:var(--textFaint);}
  .stint-table .row{position:relative;display:grid;grid-template-columns:subgrid;grid-column:1 / -1;align-items:center;padding:8px 5px 8px 32px;font-size:13px;border-top:1px solid var(--border);}
  .stint-table .row span, .stint-table .head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .row-removed{opacity:0.5;color:var(--textFaint);font-size:12.5px;}
  .row-removed span{color:var(--textFaint)!important;}
  .row-negligible-final{opacity:0.65;color:var(--textFaint);font-size:12.5px;}
  .row-negligible-final span{color:var(--textFaint)!important;}
  /* Ghosted stint-number watermark — replaces the old numeric Stint column. */
  .stint-ghost-num{position:absolute;left:10px;bottom:-4px;width:auto;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1;color:var(--text);opacity:0.16;z-index:1;pointer-events:none;user-select:none;overflow:visible;}
  .row-removed .stint-ghost-num{opacity:0.05;}
  .row-negligible-final .stint-ghost-num{opacity:0.08;}
  .stint-table .dot{width:7px;height:7px;border-radius:999px;display:inline-block;margin-right:4px;flex-shrink:0;}
  /* ---- "currently on track" live indicator ---- */
  /* Abrupt flash rather than a smooth breathing pulse: holds full size,
     snaps down small and dim, snaps back — reads as a blink, not a swell. */
  @keyframes livePulse{0%,42%,58%,100%{opacity:1;transform:scale(1);}50%{opacity:0.2;transform:scale(0.5);}}
  .timeline .seg .live-dot{width:7px;height:7px;border-radius:999px;flex-shrink:0;background:var(--red);animation:livePulse 1.2s ease-in-out infinite;}
  .timeline .seg.seg-live{border-color:var(--red);background:rgba(226,68,92,0.10);box-shadow:none;transform:translateY(-2px);transition:transform .2s;min-width:76px;flex-shrink:0;}
  .stint-table .row-live .dot{background:var(--red)!important;animation:livePulse 1.2s ease-in-out infinite;}
  .stint-table .row.row-live{position:relative;background:rgba(226,68,92,0.08);}
  .stint-table .row.row-live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);}
  .stint-table .row.row-finished{opacity:0.62;}
  .stint-table .fin-flag{font-size:11px;line-height:1;margin-right:4px;flex-shrink:0;}
  .stint-time{padding:4px 0;font-size:10px;width:100%;min-width:0;border-radius:6px;text-align:center;}
  .stint-pos{padding:4px 1px;font-size:11px;width:100%;min-width:0;border-radius:6px;border:1px solid var(--borderLight);text-align:center;}
  .driver-cell{display:flex;align-items:center;gap:4px;min-width:0;}
  .stint-driver{padding:4px 2px;font-size:11px;width:100%;min-width:0;border-radius:6px;}
  .stint-driver:focus{outline:none;}
  .stint-note-toggle{background:none;border:1px solid var(--borderLight);border-radius:6px;min-width:20px;min-height:22px;width:auto;height:auto;padding:3px 3px;display:flex;align-items:center;justify-content:center;color:var(--textFaint);flex-shrink:0;justify-self:end;overflow:visible;}
  .stint-note-toggle:hover{color:var(--text);border-color:var(--text);}
  .note-row{grid-column:1 / -1;padding:8px 10px 12px 14px;border-top:1px solid var(--border);background:var(--bg);}
  .note-row textarea{width:100%;background:var(--panelRaised);border:1px solid var(--borderLight);border-radius:8px;color:var(--text);padding:7px 9px;font-size:12.5px;font-family:'Inter',sans-serif;resize:vertical;min-height:38px;}
  .flag-row{display:flex;gap:5px;margin-bottom:8px;}
  .flag-btn{flex:1 1 0;min-width:0;font-size:11.5px;padding:6px 5px;border-radius:999px;background:var(--panelRaised);border:1px solid var(--borderLight);color:var(--textMuted);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
  .flag-btn .em{font-size:12px;line-height:1;flex-shrink:0;}
  .flag-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .flag-btn.active{color:var(--text);}
  .flag-badge{font-size:10px;line-height:1.6;margin-left:2px;white-space:nowrap;display:inline-block;}
  .retire-btn{margin-bottom:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(226,68,92,0.14);border:1px solid var(--red);color:var(--red);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.03em;padding:8px 0;border-radius:8px;}
  .retire-btn:hover{background:rgba(226,68,92,0.24);}
  .retire-btn .em{font-size:15px;line-height:1;}
  .finish-btn{margin-bottom:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(46,111,224,0.14);border:1px solid var(--blue);color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.03em;padding:8px 0;border-radius:8px;}
  .finish-btn:hover{background:rgba(46,111,224,0.24);}

  .local-banner{max-width:768px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);}

<div class="local-banner">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
/* ============================================================================
 * ENGINEER SIGN-IN — this page is publicly viewable (read-only) with no
 * account required. Signing in (via the "Engineer Sign In" control on the
 * home page) only unlocks edit access for accounts listed in the
 * `engineers` table — it isn't a gate on viewing the page at all.
 *
 * The session/engineer check runs in the boot sequence at the very bottom
 * of this file (search "AUTH BOOT") rather than here, since it needs
 * render()/loadRaces()/etc. to already be defined.
 * ==========================================================================
 */

/* ============================================================================
 * Race Strategy Planner — standalone HTML/JS mimic of the React prototype.
 * Visual + navigational parity with race-strategy-planner.jsx.
 *
 * PERSISTENCE — Stage 3 (Supabase)
 * ------------------------------------------------------------------------
 * loadRaces()/loadCatalog()/createRacePlan()/fetchFullRace()/
 * syncPlanToRaceRecord()/archiveRace() etc. read and write real Supabase
 * tables (races, cars, stints, stint_log, car_catalog — see the schema
 * file). The in-memory shape of state.plan/state.cars/etc. is unchanged
 * from the original localStorage-only version — only these boundary
 * functions translate to/from Supabase's normalized tables, so all
 * rendering and cascade-math logic below is untouched.
 * ==========================================================================
 */

// ---- design tokens ----
const T = {
  bg:"#0B1030", panel:"#131A45", panelRaised:"#1B2456", border:"#2A3468",
  borderLight:"#3C4880", text:"#F4F6FB", textMuted:"#A6AFD6", textFaint:"#6870A0",
  blue:"#3D6FE8", amber:"#F2A63E", green:"#3FB27F", red:"#E2445C", purple:"#8B6BF0",
  white:"#EEF0F3", gold:"#E0B84B", silver:"#C6CBD3", bronze:"#C97F4B",
};
const DRIVER_PALETTE = [T.blue, T.amber, T.green, T.purple, T.red, "#4DD0E1"];
const ACCENT_PRESETS = [T.blue, T.purple, T.amber, T.green, T.red, "#4DD0E1"];
const FLAG_TYPES = [
  { key:"yellow",   emoji:"🟡", label:"Caution", color: T.amber },
  { key:"black",    emoji:"⚫", label:"Penalty", color: "#D8DCE2" },
  { key:"meatball", emoji:"⚫🟠", label:"Meatball", color: "#E0752E" },
];
// The compact flag badge shown on a stint row (before its note is expanded)
// has room for one glance-able symbol. A meatball flag is a much more
// serious/urgent signal than a caution or quiet-time marker, so if it's
// present alongside anything else, it alone gets shown in that badge —
// the other flags are still there and still visible once the note is
// expanded, this only affects the compact field badge.
function priorityFlagBadge(flags){
  if (!flags || !flags.length) return "";
  if (flags.includes("meatball")) return FLAG_TYPES.find(f=>f.key==="meatball").emoji;
  return flags.map(fk => FLAG_TYPES.find(f=>f.key===fk)?.emoji || "").join("");
}
// Threshold for the "negligible final stint" rule: if the very last stint
// in a car's plan gets squeezed down to this many minutes or fewer by the
// overrun/absorb cascade, it's too small a sliver to hand a driver as its
// own stint. Rather than creating a real stint entry for it (which forces
// a driver assignment on a few leftover minutes), the schedule just notes
// the remaining delta — real start/end times elsewhere are never altered
// by this, it only changes what gets displayed as a schedulable stint.
const FINAL_STINT_NEGLIGIBLE_MIN = 20;
function finalStintNegligibleThresholdMin(){
  return FINAL_STINT_NEGLIGIBLE_MIN;
}
const TRACKS = [
  "Barber Motorsports Park","Canadian Tire Motorsports Park","Circuit de Spa-Francorchamps",
  "Circuit of the Americas","Daytona International Speedway","Detroit Grand Prix",
  "Eagles Canyon","Indianapolis Motor Speedway","Laguna Seca","Long Beach",
  "Mid-Ohio Sports Car Course","Nurburgring","Road America","Road Atlanta",
  "Sebring International Raceway","Virginia International Raceway","Watkins Glen International",
  "Other",
];

// ---- scheduled quiet time (automatic, not user-editable) ----
// Two tracks impose a mandated Sunday pause at a fixed local clock time.
// It is applied automatically when a plan is built and cannot be added,
// edited, or removed by hand — hence no flag, picker, or action for it.
// Keyed by the exact TRACKS entry; "Road Atlanta" is the same circuit as
// Michelin Raceway Road Atlanta.
const QUIET_TIME_TRACKS = {
  "Barber Motorsports Park": { startHour: 11, startMinute: 0, minutes: 60 },  // 11:00–12:00
  "Road Atlanta":            { startHour: 10, startMinute: 0, minutes: 120 }, // 10:00–12:00
};
// Returns {start, end, minutes} for the pause, or null when it doesn't
// apply — wrong track, not a Sunday, or the window starts at/before the
// green flag (nothing to pause).
function quietWindowFor(track, startDateTime){
  const rule = QUIET_TIME_TRACKS[track];
  if (!rule) return null;
  if (startDateTime.getDay() !== 0) return null; // 0 = Sunday, local time
  const qs = new Date(startDateTime);
  qs.setHours(rule.startHour, rule.startMinute, 0, 0);
  if (+qs <= +startDateTime) return null;
  return { start: qs, end: addMinutes(qs, rule.minutes), minutes: rule.minutes };
}
const defaultCatalog = [
  { id:"cat_18", number:"18", manufacturer:"Porsche", team:"Kingpin Racing", model:"991 GT3 Cup", accent: T.white },
  { id:"cat_4",  number:"4",  manufacturer:"Toyota", team:"Kingpin Racing",  model:"GR Supra GT4 EVO2", accent: T.purple },
  { id:"cat_11", number:"11", manufacturer:"Toyota", team:"Kingpin Racing",model:"GR Supra GT4 EVO2", accent: T.blue },
];

// ---- tiny icon set (inline SVG, mimics lucide-react) ----
const ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  // Collapse affordance for the notes toggle. An "x" there reads as delete
  // and made people wary of tapping it; a minus clearly means "close this".
  minus:'<path d="M5 12h14"/>',
  arrowRight:'<path d="M5 12h14M13 5l7 7-7 7"/>',

// ---- persistence (Supabase — see supabase-client.js for setup) ----
async function loadRaces(){
  const { data, error } = await supabase
    .from('races')
    .select('*, cars(*)')
    .order('created_at', { ascending: false });
  if (error){ console.error('loadRaces failed:', error); return []; }
  return data.map(mapRaceRowToRecord);
}

function mapRaceRowToRecord(row){
  return {
    id: row.id,
    eventName: row.event_name,
    eventDateISO: row.event_date,
    track: row.track || "",
    startTime: (row.start_time || "10:00:00").slice(0,5),
    durationHours: Number(row.duration_hours),
    status: row.status,
    cars: (row.cars || []).map(mapCarRowToCarRecord),
    plan: row.plan_start_at ? {
      startDateTimeISO: row.plan_start_at,
      endDateTimeISO: row.plan_end_at,
      totalMinutes: row.total_minutes,
      carPlans: [], // filled in lazily by fetchFullRace() when the race is actually opened
    } : null,
  };
}
function mapCarRowToCarRecord(row){
  return {
    id: row.id, catalogId: row.catalog_id, number: row.number, team: row.team,
    manufacturer: row.manufacturer, model: row.model, accent: row.accent,
    drivers: row.drivers || [], driverStintMode: row.driver_stint_mode || [],
    startingPosition: row.starting_position,
    finishPosition: parseFinishPosition(row.finish_position), retiredAtStint: row.retired_at_stint,
  };
}

// Full fetch for a single race — pulls stints + stint_log too, which the
// shallow list load above deliberately skips to avoid over-fetching every
// race just to render a home-screen tile.
async function fetchFullRace(raceId){
  const { data: raceRow, error: raceErr } = await supabase
    .from('races').select('*, cars(*)').eq('id', raceId).single();
  if (raceErr || !raceRow){ console.error('fetchFullRace failed:', raceErr); return null; }

  const carIds = raceRow.cars.map(c=>c.id);
  const [{ data: stintRows, error: stintErr }, { data: logRows, error: logErr }] = await Promise.all([
    supabase.from('stints').select('*').in('car_id', carIds).order('stint_index'),
    supabase.from('stint_log').select('*').in('car_id', carIds).order('created_at'),
  ]);
  if (stintErr) console.error('fetchFullRace stints failed:', stintErr);
  if (logErr) console.error('fetchFullRace stint_log failed:', logErr);

  const record = mapRaceRowToRecord(raceRow);
  record.plan = {
    startDateTimeISO: raceRow.plan_start_at,
    endDateTimeISO: raceRow.plan_end_at,
    totalMinutes: raceRow.total_minutes,
    carPlans: raceRow.cars.map(carRow=>{
      const carRecord = mapCarRowToCarRecord(carRow);
      const stints = (stintRows||[]).filter(s=>s.car_id===carRow.id).map(s=>({
        driver: s.driver, driverIndex: s.driver_index,
        startISO: s.start_at, endISO: s.end_at, plannedEndISO: s.planned_end_at,
        lengthMin: s.length_min, position: s.position, notes: s.notes || "",
        flags: s.flags || [], removed: s.removed, quietMinutes: s.quiet_minutes || 0,
        finished: s.finished || false,
      }));
      const log = (logRows||[]).filter(l=>l.car_id===carRow.id).map(l=>({
        stintIdx: l.stint_index, text: l.message, type: l.type, ts: new Date(l.created_at).getTime(),
        // Keep the row id and key so a keyed entry created in an earlier
        // session can still be revised in place instead of duplicated.
        dbId: l.id, key: l.entry_key || null, meta: undefined,
      }));
      return { car: carRecord, stints, log, retiredAtStint: carRow.retired_at_stint };
    }),
  };
  return record;
}

// ---- helpers ----
// ================= MyLaps Speedhive import =================
// Fetches + parses a session's classification and lap-time data directly
// from api2.mylaps.com (confirmed to allow cross-origin browser fetch —
// CORS-tested against this app's deployed origin) and computes the same
// race-detail metrics validated in the standalone archive prototype.

function mylapsTimeToSec(s){
  if (s == null || s === "") return null;
  const parts = s.split(":");
  if (parts.length === 1) return parseFloat(parts[0]);
  if (parts.length === 2) return parseInt(parts[0],10)*60 + parseFloat(parts[1]);
  return parseInt(parts[0],10)*3600 + parseInt(parts[1],10)*60 + parseFloat(parts[2]);
}

// Fetches session XML (classification or alllaptimes) via our Supabase
// Edge Function proxy (supabase/functions/mylaps-proxy) rather than
// fetching api2.mylaps.com directly from the browser. Confirmed via
// browser console that MyLaps rejects cross-origin requests from this
// app's domain with a 403 (no Access-Control-Allow-Origin header) —
// almost certainly an origin allowlist, which no client-side fix can get
// around. The Edge Function fetches server-side instead, where no browser
// Origin restriction applies, and hands back { xml: "<...>" }.
async function fetchMylapsXML(sessionId, type){
  const { data, error } = await supabase.functions.invoke("mylaps-proxy", {
    body: { sessionId, type },
  });
  if (error){
    throw new Error(`MyLaps proxy request failed for session ${sessionId} (${type}): ${error.message || error}`);
  }
  if (!data || typeof data.xml !== "string"){
    const detail = data && data.error ? data.error : "no xml field in response";
    throw new Error(`MyLaps proxy returned an unexpected response for session ${sessionId} (${type}): ${detail}`);
  }

  const text = data.xml;
  const xmlStart = text.indexOf("<");
  if (xmlStart === -1){
    throw new Error(`MyLaps returned no XML for session ${sessionId} (${type}). First 200 chars: ${text.slice(0,200)}`);
  }
  const parser = new DOMParser();
  const doc = parser.parseFromString(text.slice(xmlStart), "text/xml");
  const errNode = doc.querySelector("parsererror");
  if (errNode){
    throw new Error(`Could not parse MyLaps XML response for session ${sessionId} (${type}). First 300 chars: ${text.slice(0,300)}`);
  }
  return doc;
}

function parseMylapsClassification(doc){
  const rows = [];
  doc.querySelectorAll("rows > rows").forEach(row => {
    const get = tag => row.querySelector(`:scope > ${tag}`)?.textContent ?? "";
    const diff = row.querySelector(":scope > difference");
    rows.push({
      position: parseInt(get("position"),10),
      positionInClass: parseInt(get("positionInClass"),10),
      startNumber: get("startNumber"),
      resultClass: get("resultClass"),
      name: get("name"),
      status: get("status"),
      numberOfLaps: parseInt(get("numberOfLaps"),10) || 0,
      bestLap: parseInt(get("bestLap"),10) || 0,
      bestTime: get("bestTime"),
      bestSpeed: parseFloat(get("bestSpeed")) || 0,
      totalTime: get("totalTime"),
      totalTimeSec: mylapsTimeToSec(get("totalTime")),
      lapsBehind: diff ? parseInt(diff.querySelector("lapsBehind")?.textContent,10) : 0,
      timeDiffSec: diff ? mylapsTimeToSec(diff.querySelector("timeDifference")?.textContent) : 0,
    });
  });
  rows.sort((a,b)=>a.position-b.position);
  return rows;
}

function parseMylapsLapTimes(doc){
  // returns Map<position, Array<{lap, timeOfDay, lapTime, inPit, status}>>
  const byPos = new Map();
  doc.querySelectorAll("item").forEach(item => {
    const pos = parseInt(item.querySelector(":scope > position")?.textContent, 10);
    const laps = [];
    item.querySelectorAll(":scope > laps > laps").forEach(lap => {
      const lapTimeStr = lap.querySelector("lapTime")?.textContent ?? "";
      // MyLaps documents lap status as an ARRAY (a lap can carry more than
      // one flag color at once, e.g. during a yellow-to-red transition) —
      // .querySelector only ever returns the first, silently dropping a
      // RED that happens to be listed after a YELLOW. Check every status
      // child and take the most severe one present.
      const statusValues = Array.from(lap.querySelectorAll("status status")).map(s => s.textContent);
      const status = statusValues.includes("RED") ? "RED"
                    : statusValues.includes("YELLOW") ? "YELLOW"
                    : "GREEN";
      laps.push({
        lap: parseInt(lap.querySelector("lap")?.textContent,10),
        timeOfDay: parseInt(lap.querySelector("timeOfDay")?.textContent,10),
        lapTime: mylapsTimeToSec(lapTimeStr),
        inPit: lap.querySelector("inPit")?.textContent === "true",
        status,
      });
    });
    byPos.set(pos, laps);
  });
  return byPos;
}

// Consecutive inPit=true laps count as a single stop.
function countPitStops(laps){
  let stops = 0, prevInPit = false;
  for (const l of laps){
    if (l.inPit && !prevInPit) stops++;
    prevInPit = l.inPit;
  }
  return stops;
}

// True interval to the car directly ahead (by finish order), truncated to
// one decimal. Only meaningful when both cars share the same lap count —
// otherwise falls back to the lap deficit, since a raw time subtraction
// across different distances isn't a real gap.
function computeIntervals(classification){
  const running = classification.filter(r => r.startNumber.toLowerCase() !== "53x" && r.status !== "DNS");
  let prev = null;
  const intervals = {};
  running.forEach(r => {
    if (r.position === 1) { intervals[r.startNumber] = "Leader"; }
    else if (!prev) { intervals[r.startNumber] = "—"; }
    else if (prev.numberOfLaps === r.numberOfLaps){
      const gap = Math.floor((r.totalTimeSec - prev.totalTimeSec)*10)/10;
      intervals[r.startNumber] = `+${gap.toFixed(1)}s`;
    } else {
      const lapDiff = prev.numberOfLaps - r.numberOfLaps;
      intervals[r.startNumber] = `+${lapDiff} Lap${lapDiff===1?"":"s"}`;
    }
    prev = r;
  });
  return intervals;
}

// Clusters YELLOW-flagged laps by time gap (>10min = separate caution
// periods) across the whole field. Mirrors the caution-period reconstruction
// validated in the standalone prototype.
// Shared clustering logic for flag-status periods: groups laps carrying a
// given status by time gap (>10min = a new distinct period). Used for
// both cautions (YELLOW) and red flags (RED) below.
function computeFlagPeriods(lapsByPos, statusValue){
  const times = [];
  lapsByPos.forEach(laps => laps.forEach(l => { if (l.status === statusValue) times.push(l.timeOfDay); }));
  times.sort((a,b)=>a-b);
  if (!times.length) return [];
  const clusters = [];
  let cur = [times[0]];
  for (let i=1;i<times.length;i++){
    if (times[i] - cur[cur.length-1] > 600000){ clusters.push(cur); cur = [times[i]]; }
    else cur.push(times[i]);
  }
  clusters.push(cur);
  return clusters.map(c => ({ count: c.length, start: c[0], end: c[c.length-1] }));
}
function computeCautions(lapsByPos){
  return computeFlagPeriods(lapsByPos, "YELLOW");
}

// A genuine red flag (full-course stoppage) does NOT show up in the
// per-lap `status` field at all — confirmed against real session data
// that unambiguously had multiple red flags (driver-confirmed lap
// numbers), yet contained zero "RED" values anywhere. That makes sense:
// during an actual stoppage no car is crossing the line, so there's no
// lap being timed to attach a color to.
//
// The key discriminator (confirmed against driver-verified ground truth,
// not just guessed): a long YELLOW — cars still circulating, just slow —
// produces gaps of a few minutes (250-420s observed). A RED — cars fully
// parked — produces a SINGLE lap's gap of many multiples of that
// (1200-15000+s observed, i.e. 20+ minutes), because nothing crosses
// the line at all until the stoppage ends. Checking gap MAGNITUDE (not
// just "many cars affected," which a long yellow also triggers) is what
// actually separates the two.
//
// Deliberately does NOT exclude inPit=true laps here (unlike other gap-
// based logic in this file) — during a red flag the field is commonly
// directed to stop IN PIT LANE, which MyLaps still tags inPit=true even
// though it's not a real pit stop. Excluding those laps was confirmed
// (against real data) to silently drop the leaders — and sometimes most
// of the field — from red flag events entirely, since they're often the
// cars closest to pit lane when the flag comes out.
//
// With that fixed, a genuine red flag reliably shows 17-26+ distinct
// cars in the cluster, while coincidental unrelated single-car issues
// (a mechanical repair, a long unflagged stop) topped out at 4 across
// two different real sessions (one with 4 confirmed red flags, one with
// zero) — confirmed with no ambiguous middle ground, so MIN_CARS=10 sits
// with wide margin on both sides of that gap.
function computeRedFlags(lapsByPos){
  const SINGLE_LAP_THRESHOLD_MS = 600000;   // 10 min — a slow yellow lap doesn't get anywhere near this
  const CLUSTER_WINDOW_MS = 900000;          // 15 min — merges a stop+regroup+restart sequence into one period
  const MIN_CARS = 10;                       // wide safety margin: real reds hit 17-26 cars, noise (unrelated single-car issues, including a coincidental 4-car cluster on a different session) topped out at 4

  const events = []; // {timeOfDay, pos}
  lapsByPos.forEach((laps, pos) => {
    let prevTod = null;
    laps.forEach(l => {
      if (prevTod != null){
        const gapMs = l.timeOfDay - prevTod;
        if (gapMs > SINGLE_LAP_THRESHOLD_MS) events.push({ timeOfDay: l.timeOfDay, pos });
      }
      prevTod = l.timeOfDay;
    });
  });
  events.sort((a,b)=>a.timeOfDay-b.timeOfDay);
  if (!events.length) return [];

  const clusters = [];
  let cur = [events[0]];
  for (let i=1;i<events.length;i++){
    if (events[i].timeOfDay - cur[cur.length-1].timeOfDay > CLUSTER_WINDOW_MS){ clusters.push(cur); cur = [events[i]]; }
    else cur.push(events[i]);
  }
  clusters.push(cur);

  return clusters
    .map(c => ({ carCount: new Set(c.map(e=>e.pos)).size, times: c.map(e=>e.timeOfDay) }))
    .filter(c => c.carCount >= MIN_CARS)
    .map(c => ({ count: c.carCount, start: c.times[0], end: c.times[c.times.length-1] }));
}

// Best-pace and longest green-flag stints (>=3 consecutive non-pit GREEN
// laps), optionally scoped to a set of result classes.
// Best-pace (min minLapsForBest laps — short stints like a 5-lap opener
// can post an unrepresentative fast average) and longest (min 3 laps,
// no further floor) green-flag stints, scoped to classFilter.
function computeStints(classification, lapsByPos, classFilter, minLapsForBest){
  minLapsForBest = minLapsForBest || 3;
  const stints = [];
  classification.forEach(r => {
    if (classFilter && classFilter.size && !classFilter.has(r.resultClass)) return;
    const laps = lapsByPos.get(r.position) || [];
    let cur = [];
    const flush = () => { if (cur.length >= 3) stints.push({ num: r.startNumber, name: r.name, laps: cur.slice() }); cur = []; };
    laps.forEach(l => {
      if (l.inPit || l.status !== "GREEN" || l.lapTime == null){ flush(); return; }
      cur.push(l);
    });
    flush();
  });
  if (!stints.length) return { best: null, longest: null };

  let best = null;
  stints.forEach(s => {
    if (s.laps.length < minLapsForBest) return;
    const avg = s.laps.reduce((a,l)=>a+l.lapTime,0) / s.laps.length;
    if (!best || avg < best.avg) best = { num: s.num, name: s.name, avg, lapCount: s.laps.length };
  });

  const maxLen = Math.max(...stints.map(s=>s.laps.length));
  const longestEntries = [];
  const seenNums = new Set();
  stints.filter(s=>s.laps.length===maxLen).forEach(s => {
    if (!seenNums.has(s.num)){ seenNums.add(s.num); longestEntries.push({ num: s.num, name: s.name }); }
  });
  return { best, longest: { lapCount: maxLen, entries: longestEntries } };
}

// Reconstructs "laps led" from lap-completion order: at each point in time,
// whichever car has completed the most race laps (tie-broken by who reached
// that lap count first) is credited with leading the newly-reached lap
// number. Cross-validated against official gap data in the prototype.
function computeLapsLed(classification, lapsByPos){
  const events = [];
  lapsByPos.forEach((laps, pos) => laps.forEach(l => events.push([l.timeOfDay, pos, l.lap])));
  events.sort((a,b)=>a[0]-b[0]);
  const state = new Map();
  let globalMax = 0;
  const lapsLed = {};
  events.forEach(([tod, pos, lapNum]) => {
    state.set(pos, [lapNum, tod]);
    let leader = null, leaderLaps = -1, leaderTod = Infinity;
    state.forEach(([laps, t], p) => {
      if (laps > leaderLaps || (laps === leaderLaps && t < leaderTod)){ leader = p; leaderLaps = laps; leaderTod = t; }
    });
    const curMax = state.get(leader)[0];
    if (curMax > globalMax){
      lapsLed[leader] = (lapsLed[leader]||0) + (curMax - globalMax);
      globalMax = curMax;
    }
  });
  let topPos = null, topLaps = -1;
  Object.entries(lapsLed).forEach(([pos,laps]) => { if (laps > topLaps){ topLaps = laps; topPos = parseInt(pos,10); } });
  if (topPos == null) return null;
  const row = classification.find(r=>r.position===topPos);
  return row ? { num: row.startNumber, name: row.name, laps: topLaps } : null;
}

function mylapsFmtTime(sec){
  const m = Math.floor(sec/60), s = sec - m*60;
  return `${m}:${s.toFixed(3).padStart(6,"0")}`;
}

// Top-level: given a session id, fetch + parse + compute everything needed
// for the archive panel. Excludes non-running "x" entries throughout.
async function loadMylapsSession(sessionId, race){
  const [classDoc, lapsDoc] = await Promise.all([
    fetchMylapsXML(sessionId, "classification"),
    fetchMylapsXML(sessionId, "alllaptimes"),
  ]);
  const classification = parseMylapsClassification(classDoc).filter(r => r.startNumber.toLowerCase() !== "53x");
  const lapsByPos = parseMylapsLapTimes(lapsDoc);

  const redFlagWindows = computeRedFlags(lapsByPos);

  const pitStopsByNumber = {};
  classification.forEach(r => {
    const laps = lapsByPos.get(r.position) || [];
    pitStopsByNumber[r.startNumber] = countPitStops(laps);
  });

  const intervals = computeIntervals(classification);

  // Best Stint Pace / Longest Stint are hardcoded to GTO — Kingpin's own
  // class — rather than derived from whatever class(es) happen to be in
  // this race's car list, so the label is always accurate and stable.
  const raceClasses = new Set(["GTO"]);

  const running = classification.filter(r => r.status !== "DNS");
  const entries = classification.length;
  const finishers = classification.filter(r => r.status === "Normal").length;
  const dnf = classification.filter(r => r.status === "DNF").length;
  const dns = classification.filter(r => r.status === "DNS").length;
  const totalLaps = Math.max(...classification.map(r=>r.numberOfLaps));
  const totalPitStops = Object.values(pitStopsByNumber).reduce((a,b)=>a+b,0);
  const carsOnLeadLap = running.filter(r => r.lapsBehind === 0).length;
  const cautions = computeCautions(lapsByPos);
  const redFlags = redFlagWindows;   // computed above, reused here
  const stints = computeStints(classification, lapsByPos, raceClasses, 15);
  const lapsLed = computeLapsLed(classification, lapsByPos);

  return {
    sessionId, fetchedAt: new Date().toISOString(),
    classification, pitStopsByNumber, intervals,
    overview: { entries, finishers, dnf, dns, totalLaps, totalPitStops, carsOnLeadLap },
    cautions, redFlags, bestStint: stints.best, longestStint: stints.longest, lapsLed,
    raceClasses: [...raceClasses],
  };
}

// Persists the classification-level summary (NOT lap-by-lap data — that's
// intentionally not stored, see mylaps_results_migration.sql) so the
// import is visible to every engineer/driver, on any device, without
// needing to re-fetch from MyLaps. Upserts one row per car, keyed on
// (race_id, start_number), so re-importing updates in place.
async function saveMylapsResultsToSupabase(raceId, mylaps){
  const rows = mylaps.classification.map(r => ({
    race_id: raceId, session_id: mylaps.sessionId,
    start_number: r.startNumber, team_name: r.name, result_class: r.resultClass, status: r.status,
    position: r.position, position_in_class: r.positionInClass, laps_behind: r.lapsBehind,
    total_time: r.totalTime, best_time: r.bestTime, best_lap: r.bestLap, best_speed: r.bestSpeed,
    number_of_laps: r.numberOfLaps, pit_stops: mylaps.pitStopsByNumber[r.startNumber] ?? 0,
    fetched_at: mylaps.fetchedAt,
  }));
  const { error: resultsErr } = await supabase.from("mylaps_results").upsert(rows, { onConflict: "race_id,start_number" });
  if (resultsErr) console.error("saveMylapsResultsToSupabase (mylaps_results) failed:", resultsErr);

  // Cautions/laps-led/best-stint/longest-stint are already-computed plain
  // objects (see loadMylapsSession) — saved as-is, not recomputed here.
  const { error: summaryErr } = await supabase.from("mylaps_race_summary").upsert({
    race_id: raceId, session_id: mylaps.sessionId,
    cautions: mylaps.cautions || [],
    red_flags: mylaps.redFlags || [],
    laps_led: mylaps.lapsLed || null,
    best_stint: mylaps.bestStint || null,
    longest_stint: mylaps.longestStint || null,
    fetched_at: mylaps.fetchedAt,
  }, { onConflict: "race_id" });
  if (summaryErr) console.error("saveMylapsResultsToSupabase (mylaps_race_summary) failed:", summaryErr);

  return !resultsErr && !summaryErr;
}

// Reconstructs a mylaps-shaped object from mylaps_results +
// mylaps_race_summary, for reopening an archived race without re-fetching
// from MyLaps. Everything the fresh-import view shows comes back fully,
// including Total Cautions/Most Laps Led/Best Stint Pace/Longest Stint —
// those are read back from mylaps_race_summary rather than recomputed,
// since the raw lap-by-lap data itself isn't stored.
//
// `reconstructedFromDb: true` only when mylaps_race_summary has no row
// for this race — meaning it was imported before this table existed.
// That's the one case those four tiles still need a fresh Re-import.
async function loadMylapsResultsFromSupabase(raceId){
  const [{ data, error }, { data: summaryData, error: summaryErr }] = await Promise.all([
    supabase.from("mylaps_results").select("*").eq("race_id", raceId),
    supabase.from("mylaps_race_summary").select("*").eq("race_id", raceId).maybeSingle(),
  ]);
  if (error){ console.error("loadMylapsResultsFromSupabase (mylaps_results) failed:", error); return null; }
  if (summaryErr) console.error("loadMylapsResultsFromSupabase (mylaps_race_summary) failed:", summaryErr);
  if (!data || !data.length) return null;

  const classification = data.map(row => ({
    position: row.position, positionInClass: row.position_in_class,
    startNumber: row.start_number, resultClass: row.result_class,
    name: row.team_name, status: row.status,
    numberOfLaps: row.number_of_laps, bestLap: row.best_lap,
    bestTime: row.best_time, bestSpeed: row.best_speed != null ? Number(row.best_speed) : 0,
    totalTime: row.total_time, totalTimeSec: mylapsTimeToSec(row.total_time),
    lapsBehind: row.laps_behind ?? 0, timeDiffSec: 0,
  })).sort((a,b)=>a.position-b.position);

  const pitStopsByNumber = {};
  data.forEach(row => {
    pitStopsByNumber[row.start_number] = row.pit_stops ?? 0;
  });

  const intervals = computeIntervals(classification);

  const running = classification.filter(r => r.status !== "DNS");
  const entries = classification.length;
  const finishers = classification.filter(r => r.status === "Normal").length;
  const dnf = classification.filter(r => r.status === "DNF").length;
  const dns = classification.filter(r => r.status === "DNS").length;
  const totalLaps = classification.length ? Math.max(...classification.map(r=>r.numberOfLaps)) : 0;
  const totalPitStops = Object.values(pitStopsByNumber).reduce((a,b)=>a+b,0);
  const carsOnLeadLap = running.filter(r => r.lapsBehind === 0).length;

  return {
    sessionId: data[0].session_id, fetchedAt: data[0].fetched_at,
    classification, pitStopsByNumber, intervals,
    overview: { entries, finishers, dnf, dns, totalLaps, totalPitStops, carsOnLeadLap },
    cautions: summaryData ? (summaryData.cautions || []) : [],
    redFlags: summaryData ? (summaryData.red_flags || []) : [],
    lapsLed: summaryData ? summaryData.laps_led : null,
    bestStint: summaryData ? summaryData.best_stint : null,
    longestStint: summaryData ? summaryData.longest_stint : null,
    raceClasses: [...new Set(classification.map(r=>r.resultClass).filter(Boolean))],
    reconstructedFromDb: !summaryData,
  };
}

// Loads real pit-in/pit-out cycle data from Red Mist Timing for this race,
// when available (see the redmist-backfill project: pulls Red Mist's
// LoadCarLaps data, derives pit cycles, and upserts into redmist_pit_cycles
// keyed on race_id/car_number/stop_num).
//
// Deliberately narrow: only surfaces duration_pdm_seconds, the field
// validated against a crew stopwatch during this project (see project notes
// — pdm matched real timing within a few seconds on two independent
// stops; a separate clock-gap measure was tried and rejected as
// consistently ~60-300s too long). red_flag_overlap is surfaced because a
// stop that overlaps a session-wide red flag has an unreliable pdm (the
// clock keeps running while the field is stopped, not being serviced) —
// confirmed against a real stop that was ~26 minutes by clock time but
// pdm=81s. needs_review flags stops whose numbers don't fit a normal
// pattern at all (e.g. a confirmed 95-minute garage repair) for a human to
// annotate via the notes field — not yet exposed in this render, kept for
// a future manual-correction UI.
//
// Grouped by car_number, ordered by stop_num, so each car's tile can just
// read race.redmistPitCycles.byCarNumber[car.number] directly.
async function loadRedmistPitCyclesFromSupabase(raceId){
  const { data, error } = await supabase
    .from("redmist_pit_cycles")
    .select("car_number, stop_num, duration_pdm_seconds, red_flag_overlap, needs_review, notes")
    .eq("race_id", raceId)
    .order("car_number", { ascending: true })
    .order("stop_num", { ascending: true });

  if (error){ console.error("loadRedmistPitCyclesFromSupabase failed:", error); return null; }
  if (!data || !data.length) return null;

  const byCarNumber = {};
  for (const row of data){
    if (!byCarNumber[row.car_number]) byCarNumber[row.car_number] = [];
    byCarNumber[row.car_number].push({
      stopNum: row.stop_num,
      pdmSeconds: row.duration_pdm_seconds != null ? Number(row.duration_pdm_seconds) : null,
      redFlagOverlap: row.red_flag_overlap,
      needsReview: row.needs_review,
      notes: row.notes,
    });
  }

  return { byCarNumber };
}

// Matches this race's own cars (by car number) against imported MyLaps
// classification rows, for the compact "By Car" summary.
function matchMylapsToRaceCars(race, mylaps){
  if (!mylaps) return [];
  return race.cars.map(car => {
    const row = mylaps.classification.find(r => r.startNumber === car.number);
    if (!row) return { car, found: false };
    return {
      car, found: true,
      position: row.position, positionInClass: row.positionInClass,
      status: row.status, resultClass: row.resultClass,
      bestTime: row.bestTime, bestLap: row.bestLap, bestSpeed: row.bestSpeed,
      numberOfLaps: row.numberOfLaps,
      pitStops: mylaps.pitStopsByNumber[car.number] ?? 0,
    };
  });
}

function uid(prefix){ return prefix + "_" + Math.random().toString(36).slice(2,9); }
function formatDate(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
}
const MONTHS_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
// mmm dd yyyy, no comma — e.g. "Jul 26 2026" — used for the archived-tile label.
function formatDateCompact(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return `${MONTHS_SHORT[d.getMonth()]} ${d.getDate()} ${d.getFullYear()}`;
}
function formatTime(d){
  if(!d) return "—";
  const dt = (d instanceof Date) ? d : new Date(d);
  return dt.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}
function formatTimeCompact(d){
  if(!d) return "—";
  const dt = (d instanceof Date) ? d : new Date(d);
  let h = dt.getHours();
  const m = String(dt.getMinutes()).padStart(2,"0");
  const ap = h >= 12 ? "p" : "a";
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${m}${ap}`;
}
// Even tighter than formatTimeCompact, for the horizontal timeline's
// narrow, proportionally-sized stint cards specifically. Drops ":00" for
// the very common on-the-hour case ("9a" instead of "9:00a") — full
// precision is kept for anything off the hour ("9:15a"), which matters
// more once cascades/edits have shifted a stint's real start time.
function formatTimeUltraCompact(d){
  if(!d) return "—";
  const dt = (d instanceof Date) ? d : new Date(d);
  let h = dt.getHours();
  const m = dt.getMinutes();
  const ap = h >= 12 ? "p" : "a";
  h = h % 12; if (h === 0) h = 12;
  return m === 0 ? `${h}${ap}` : `${h}:${String(m).padStart(2,"0")}${ap}`;
}
function addMinutes(date, mins){ return new Date(date.getTime() + mins*60000); }
function toTimeInputValue(d){
  const hh = String(d.getHours()).padStart(2,"0");
  const mm = String(d.getMinutes()).padStart(2,"0");
  return `${hh}:${mm}`;
}
function toDateInputValue(iso){
  const d = iso ? new Date(iso) : new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${yyyy}-${mm}-${dd}`;
}
function formatDuration(mins){
  const total = Math.round(mins);
  const h = Math.floor(total/60), m = total%60;
  if (h===0) return `${m}m`; // under an hour — drop the "0h" prefix entirely
  return m>0 ? `${h}h ${m}m` : `${h}h`;
}
// Appends a permanent, timestamped note to a car's stint log (rendered
// beneath that car's stint table) instead of a transient toast. stintIdx
// links the entry back to whichever stint's notes/flags should be shown
// alongside it, even if those are added after the fact.
// When `key` is supplied, updates the existing entry carrying that key
// instead of adding another one. Repeated tweaks to the same thing (nudging
// a start time by 15 min over and over, revising a stint's end) should read
// as one evolving statement of where things now stand, not a pile of
// near-identical lines. `meta` carries whatever the caller needs to remember
// across those updates — typically the original values, so the entry can
// always describe the *cumulative* change rather than only the last nudge.
//
// The same coalescing has to happen in Supabase or duplicates would reappear
// on reload, so keyed entries track their row id and UPDATE it rather than
// inserting again. `entry_key` is persisted so the link survives a refetch.
function logStintNote(cp, stintIdx, text, type, key, meta){
  if (!cp.log) cp.log = [];
  const resolvedType = type || "info";

  if (key){
    const existing = cp.log.find(m => m.stintIdx === stintIdx && m.key === key);
    if (existing){
      existing.text = text;
      existing.type = resolvedType;
      existing.ts = Date.now();
      if (meta !== undefined) existing.meta = meta;
      if (existing.dbId){
        supabase.from("stint_log").update({ message: text, type: resolvedType })
          .eq("id", existing.dbId)
          .then(({ error })=>{ if (error) console.error("logStintNote update failed:", error); });
      }
      return existing;
    }
  }

  const entry = { stintIdx, text, type: resolvedType, ts: Date.now(), key: key||null, meta: meta, dbId: null };
  cp.log.push(entry);
  if (cp.car && cp.car.id){
    supabase.from("stint_log").insert({
      car_id: cp.car.id, stint_index: stintIdx, message: text, type: resolvedType, entry_key: key||null,
    }).select().single().then(({ data, error })=>{
      if (error){ console.error("logStintNote insert failed:", error); return; }
      if (data) entry.dbId = data.id; // so later revisions update this row
    });
  }
  return entry;
}
function findStintLogEntry(cp, stintIdx, key){
  return (cp.log||[]).find(m => m.stintIdx === stintIdx && m.key === key) || null;
}
// Used when an adjustment is undone back to its original value — the entry
// stops being true, so it's removed rather than left saying "moved 0 min".
function removeStintLogEntry(cp, stintIdx, key){
  if (!cp.log) return;
  const i = cp.log.findIndex(m => m.stintIdx === stintIdx && m.key === key);
  if (i < 0) return;
  const [entry] = cp.log.splice(i, 1);
  if (entry && entry.dbId){
    supabase.from("stint_log").delete().eq("id", entry.dbId)
      .then(({ error })=>{ if (error) console.error("removeStintLogEntry delete failed:", error); });
  }
}
// Retire log entries are matched by their fixed message pattern rather than
// a stored flag — the log table has no column for that, and text-matching
// survives a reload from Supabase the same way freshly-created entries do.
// A car's retirement is already fully explained by the message itself; the
// stint it happened on may carry a flag/note of its own (e.g. a meatball
// noting mechanical trouble), and that's already visible on the stint row —
// repeating it under the log line would just be noise.
function isRetireLogEntry(text){
  return /^Car retired after Stint \d+\.$/.test(text);
}
function hexToRgb(hex){
  hex = hex.replace("#","");
  const n = parseInt(hex,16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
// Heatmap for a stint's finish position relative to the car's class starting
// position — lower/better positions trend green, higher/worse trend red.
function positionCellStyle(posValue, startPos){
  const pos = parsePosition(posValue);
  const start = parsePosition(startPos);
  if (pos==null || start==null) return { bg:"transparent", color:"var(--text)" };
  const delta = pos - start; // negative = gained spots, positive = lost spots
  const maxDelta = 8;
  const clamped = Math.max(-maxDelta, Math.min(maxDelta, delta));
  const t = Math.abs(clamped) / maxDelta; // 0..1
  // Bumped up from a 0.14–0.74 range — the low end was nearly invisible for
  // small position swings, which is most of them in practice.
  const alpha = (0.32 + t*0.55).toFixed(2);
  const [r,g,b] = hexToRgb(clamped <= 0 ? T.green : T.red);
  const textColor = t > 0.35 ? "#0A0C10" : "var(--text)";
  return { bg:`rgba(${r},${g},${b},${alpha})`, color: textColor };
}
// "Currently on track" — which stint actually has a driver in the car
// right now. This is NOT simply "whichever stint's scheduled window
// contains the current time": a stint's scheduled end passing doesn't
// mean the driver actually came in — that only becomes true once the
// stint is confirmed finished (via the Finish Stint button or an end-time
// edit, which set s.finished). So this walks stints in order and picks
// the FIRST one that hasn't been finished yet — that's whoever is really
// out there, even if they're running long past their scheduled end and
// the next driver's scheduled slot has technically already started. If
// that stint hasn't reached its own (possibly cascade-adjusted) start
// time yet, nobody's confirmed on track (race hasn't started, or there's
// a genuine gap — quiet time, a pending driver change, etc).
function computeLiveStintIndex(stints, archived){
  if (archived) return -1;
  const now = new Date();
  const idx = stints.findIndex(s=>!s.removed && !s.negligibleFinal && !s.finished);
  if (idx === -1) return -1; // every stint already finished (or none exist)
  return now >= stints[idx].start ? idx : -1;
}
function parsePosition(v){
  if (v == null) return null;
  const m = String(v).match(/\d+/);
  return m ? parseInt(m[0],10) : null;
}
// Class finish position accepts either a numeric spot or "DNF" — a car that
// retires still needs to be archivable without a class position, since it
// never crossed the line. Returns a number, the literal string "DNF", or
// null if the field is empty/unrecognized. The `cars.finish_position`
// column is text, so both forms round-trip through Supabase cleanly.
function parseFinishPosition(v){
  if (v == null) return null;
  const s = String(v).trim();
  if (!s) return null;
  if (/^dnf$/i.test(s)) return "DNF";
  return parsePosition(s);
}
function buildShortNames(fullNames){
  const lastCounts = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    lastCounts[last] = (lastCounts[last]||0) + 1;
  });
  const map = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    // Last name only ("Robert Campbell" -> "Campbell"), unless another driver
    // on this car shares that last name — then disambiguate with a first
    // initial ("T. Driver" / "A. Driver").
    map[n] = (lastCounts[last] > 1 && parts.length > 1) ? `${parts[0][0]}. ${last}` : last;
  });
  return map;
}
// Compact 3-letter driver codes for the horizontal timeline specifically —
// full/short names don't reliably fit in the narrow, proportionally-sized
// stint cards. Normally the first 3 letters of the last name ("Atchley" ->
// "ATC"); if two drivers on the same car share a last name, disambiguates
// with a first-name initial + first 2 letters of the last name instead
// ("Tom Driver" / "Alex Driver" -> "TDR" / "ADR"). Scoped to the timeline
// only — the stint table keeps using buildShortNames().
function buildTimelineAbbrev(fullNames){
  const lastCounts = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    lastCounts[last] = (lastCounts[last]||0) + 1;
  });
  const map = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    const first = parts[0];
    map[n] = (lastCounts[last] > 1 && parts.length > 1)
      ? (first[0] + last.slice(0,2)).toUpperCase()
      : last.slice(0,3).toUpperCase();
  });
  return map;
}
function podiumColor(pos){
  if(pos===1) return T.gold;
  if(pos===2) return T.silver;
  if(pos===3) return T.bronze;
  return null;
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Log messages mark their key figures with **…**. This runs AFTER esc(), so
// the markers survive escaping but nothing in the text itself can inject
// markup — the only tags that reach the DOM are the ones added right here.
function logBold(escapedText){
  return escapedText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// Stint-length for a driver, chosen either from the 60/90/120 quick-pick
// buttons or the "Custom" select, which offers every 5-minute increment
// from 45 to 180. Anything unset or unrecognized (e.g. a car added before
// this feature existed, or an older '150' preset) reads as the 60 default,
// so older race records keep working.
const STINT_WHEEL_MIN = 45, STINT_WHEEL_MAX = 180, STINT_WHEEL_STEP = 5;
// The three quick-pick buttons. Any other value is reached through the
// "Custom" select, which is what that select displays whenever one of
// these presets is the active choice.
const STINT_PRESETS = ['60','90','120'];
function isStintPreset(mode){ return STINT_PRESETS.includes(String(mode)); }
function stintWheelValues(){
  const vals = [];
  for (let v = STINT_WHEEL_MIN; v <= STINT_WHEEL_MAX; v += STINT_WHEEL_STEP) vals.push(v);
  return vals;
}
function stintModeOf(car, idx){
  const raw = car.driverStintMode && car.driverStintMode[idx];
  const n = Number(raw);
  const valid = Number.isFinite(n) && n >= STINT_WHEEL_MIN && n <= STINT_WHEEL_MAX && (n - STINT_WHEEL_MIN) % STINT_WHEEL_STEP === 0;
  return valid ? String(n) : '60';
}

// ---- livery placeholder (mimics CarHeaderImage fallback) ----
// Accent color now lives on the tile's border (see raceTile/carCard/etc),
// so this placeholder uses a neutral panel tone rather than the accent fill.
function liveryDiv(accent){
  return `<div class="livery" style="background:var(--panelRaised);"></div>`;
}

// ---- track layout image, same convention/fallback as the livery image ----
// Expects images at images/tracks/<slug>.png (same directory scheme as
// wherever car header images would live, e.g. images/cars/). If that image
// is missing (404) or no track is set, falls back to the same
// color + diagonal-stripe placeholder used for cars.
function trackSlug(name){
  return (name||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
}
function handleTrackImgError(img, accent){
  const div = document.createElement("div");

function trackStripContent(track, accent){

}

// ---- detailed track map (plan page only) ----
// A larger, more detailed map than the small thumbnail used on the track
// picker and race-tile strips. Reuses the exact same slug convention as
// trackStripContent above, just with a "-detail" suffix on the filename
// (images/tracks/<slug>-detail.png) — no new table or column needed,
// since track images were never stored in the database at all; the path
// is derived purely from the track name string. Drop the higher-res file
// in alongside the existing thumbnails using that naming pattern and it
// picks it up automatically.
// Unlike the thumbnail's diagonal-stripe fallback (which always shows
// SOMETHING, since a plan always has a track), a missing detail image
// here just hides the whole section — this is a supplementary extra, not
// something every track necessarily has a file for yet.
function trackDetailSection(trackName){

    <div class="track-detail-box" id="trackDetailBox">
      <div class="track-detail-head">${icon("mapPin",13)} Track Map</div>
      <img src="images/tracks/${slug}-detail.png" alt="${esc(trackName)} detailed track map" class="track-detail-img"
           onerror="this.closest('#trackDetailBox').style.display='none';" />
    </div>`;
}

// ---- car header image, same convention/fallback as the track image ----
// Expects images at images/cars/<number>-<team-slug>.png. If that image is
// missing (404) or the car has no number, falls back to the same
// color + diagonal-stripe placeholder.
function carSlug(number, team){
  const base = `${number||""}-${team||""}`;
  return base.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
}
function carStripContent(number, team, accent){
  const slug = carSlug(number, team);
  if (!slug) return liveryDiv(accent);
  return `<img src="images/cars/${slug}.png" alt="#${esc(number)} ${esc(team)}" class="track-layout-img" onerror="handleTrackImgError(this, '${accent}')" />`;
}

let lastRenderedPage = null; // used to scroll to top only on an actual page change, not every re-render
function render(){
  const app = document.getElementById("app");
  if (state.confirmDelete){
    // modal renders on top of whatever page is current
  }
  // Capture the track picker's current scroll offset before the DOM gets
  // replaced below — innerHTML resets scrollLeft to 0, which would make
  // the row visibly jump back to the start on every selection. Restoring
  // it (instantly, not scrolled/animated) afterward means selecting a
  // track leaves the row exactly where it was.
  const existingTrackRow = document.querySelector(".track-picker-row");
  const trackScrollLeft = existingTrackRow ? existingTrackRow.scrollLeft : null;

  // Expanded stint panels (notes / flags / ±15 start adjuster) are a
  // transient working state, not something to carry around the app. Collapse
  // them whenever the page actually changes, so the planner always loads
  // clean. This runs BEFORE the HTML is built — collapsing afterwards would
  // render them open for one frame and only close on the next render.
  // Same-page re-renders are left alone, so a panel stays put while its ±15
  // steppers are being tapped.
  const pageChanged = state.page !== lastRenderedPage;
  if (pageChanged && state.openStintNotes) state.openStintNotes.clear();

  let html = "";
  if (state.page === "home") html = renderHome();
  else if (state.page === "setup") html = renderSetup();
  else if (state.page === "plan" && state.plan) html = renderPlan();
  else if (state.page === "archive") html = renderArchive();
  else html = renderHome();

  if (state.confirmDelete){
    html += renderConfirmModal();
  }
  app.innerHTML = html;
  bindEvents();

  if (pageChanged){
    window.scrollTo(0, 0);
    lastRenderedPage = state.page;
  }

  if (trackScrollLeft != null){
    const row = document.querySelector(".track-picker-row");
    if (row){
      const prevBehavior = row.style.scrollBehavior;
      row.style.scrollBehavior = "auto"; // force instant — no animated re-scroll on restore
      row.scrollLeft = trackScrollLeft;
      row.style.scrollBehavior = prevBehavior;
    }
  } else {
    // Fresh mount of the track picker (first render of Setup this visit,
    // not a re-render) — if a track is already selected, center it in the
    // scroll area instead of leaving the row parked at the start. Only
    // fires when the row didn't exist a moment ago (see capture above),
    // so it never fights the scroll-preserving restore on later
    // re-renders — that's what caused the bouncing before.
    const row = document.querySelector(".track-picker-row");
    const selectedTile = row ? row.querySelector(".track-tile.selected") : null;
    if (row && selectedTile){
      const prevBehavior = row.style.scrollBehavior;
      row.style.scrollBehavior = "auto"; // instant — no scroll animation on page open
      const rowRect = row.getBoundingClientRect();
      const tileRect = selectedTile.getBoundingClientRect();
      const tileOffsetWithinRow = row.scrollLeft + (tileRect.left - rowRect.left);
      const target = tileOffsetWithinRow - (row.clientWidth / 2) + (tileRect.width / 2);
      row.scrollLeft = Math.max(0, Math.min(target, row.scrollWidth - row.clientWidth));
      row.style.scrollBehavior = prevBehavior;
    }
  }
}

  const bottomAuthRow = state.isEngineer

// Renders one selectable tile in the track picker grid. Reuses the same
// images/tracks/<slug>.png convention (and fallback placeholder) as the
// larger strip used on race tiles/plan headers, just at a fixed 150x150.
function trackTile(trackName){
  const isOther = trackName === "Other";
  const isSelected = state.track === trackName;
  const isDimmed = !!state.track && !isSelected;
  const slug = trackSlug(trackName);
  const stripInner = isOther
    ? icon("plus",22)
    : (slug ? `<img src="images/tracks/${slug}.png" alt="${esc(trackName)} track layout" onerror="handleTrackImgError(this, '${T.blue}')" />` : "");
  return `
    <div class="track-tile ${isSelected?'selected':''} ${isOther?'other-tile':''} ${isDimmed?'dimmed':''}" data-act="select-track" data-track="${esc(trackName)}" role="button" tabindex="0">
      <div class="strip">
        ${stripInner}
        ${isSelected ? `<span class="check">✓</span>` : ""}
      </div>
      <div class="name">${esc(trackName)}</div>
    </div>`;
}

// Effective finish position for a car: MyLaps-derived (class position,
// falling back to overall; DNF/DNS status takes priority over a numeric
// position) once imported, since it's authoritative and requires no
// manual entry. Falls back to the optionally-entered `car.finishPosition`
// (still written to Supabase pre-archive, per the RLS note in
// archiveRace()) when MyLaps hasn't been imported for this race yet.
// Returns a number, "DNF", "DNS", or null.
function getEffectiveFinishPosition(car, race){
  if (race && race.mylaps){
    const m = matchMylapsToRaceCars({ cars:[car] }, race.mylaps)[0];
    if (m && m.found){
      if (m.status === "DNF") return "DNF";
      if (m.status === "DNS") return "DNS";
      return m.positionInClass || m.position;
    }
  }
  return (typeof car.finishPosition === "number" || car.finishPosition === "DNF") ? car.finishPosition : null;
}

function renderPlan(){
  const plan = state.plan;
  const archived = state.currentStatus === "archived";
  const readOnly = archived || !state.isEngineer;
  const race = state.races.find(r=>r.id===state.currentRaceId);
  // Archived results read best-to-worst by effective finish position — see
  // getEffectiveFinishPosition() above. DNFs (and anything unset) sort to
  // the end rather than staying in whatever order the cars were originally
  // entered in. Sort is stable, so ties (e.g. two DNFs) keep their
  // original relative order.
  // getEffectiveFinishPosition() can return a number, "DNF", "DNS", or
  // null — only the number case sorts meaningfully, so DNF/DNS/unset all
  // collapse to Infinity here and sink to the bottom together (stable
  // sort keeps their original relative order among themselves).
  const finishSortKey = (car) => {
    const pos = getEffectiveFinishPosition(car, race);
    return typeof pos === "number" ? pos : Infinity;
  };
  const sortedCarPlans = archived
    ? [...plan.carPlans].sort((a,b)=> finishSortKey(a.car) - finishSortKey(b.car))
    : plan.carPlans;
  const primaryCar = sortedCarPlans[0] && sortedCarPlans[0].car;
  const podium = archived && primaryCar ? podiumColor(getEffectiveFinishPosition(primaryCar, race)) : null;
  const bannerColor = podium || T.textMuted;

  return `
    <div class="page page-wide fade-in">
      <div class="top-actions">
        ${readOnly ? `<button class="btn-back" data-act="nav-back">${icon("arrowLeft",15)} Back</button>` : `<button class="btn-back" data-act="plan-edit">${icon("arrowLeft",15)} Edit</button>`}
        <div class="right">
          ${!readOnly ? `<button class="link-red" data-act="del-current-race">${icon("trash",13)} Delete</button>` : ""}
          <button class="link-muted" data-act="go-home">${icon("rotate",13)} Home</button>
        </div>
      </div>

      <h1 class="font-display" style="font-weight:700;font-size:30px;margin:16px 0 0;">${esc(state.eventName)}</h1>
      <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);margin-top:4px;">Race Date: ${formatDate(state.eventDate)}</p>

      ${archived ? `
      <div class="banner" style="border:1px solid ${bannerColor};">
        ${podium ? icon("trophy",16,"color:"+bannerColor) : ""}
        <span style="color:${bannerColor}">Archived — results below by car</span>
      </div>` : ""}

      ${archived ? renderMylapsPanel(race) : ""}

      <div style="display:flex;flex-direction:column;gap:40px;margin-top:24px;">
        ${sortedCarPlans.map(cp=>carPlanSection(cp, plan, archived)).join("")}
      </div>

      <div class="chip-grid" style="margin-top:40px;">
        ${infoChip("mapPin","Track",plan.track)}
        ${infoChip("flag","Duration",formatDuration(plan.totalMinutes))}
        ${infoChip("clock","Green Flag",formatTime(plan.startDateTime))}
        ${infoChip("timer","Checkered Flag",formatTime(plan.endDateTime))}
      </div>

      ${trackDetailSection(plan.track)}

      ${!readOnly ? `
      <div class="archive-box fade-in">
        <div class="head">${icon("archive",15)} Race Complete?</div>
        <p>Archive this race, then import MyLaps results to pull in each car's finish position, fastest lap, pit stops, and more.</p>
        <button class="btn-gold" id="archiveRace" data-act="archiveRace">${icon("trophy",14)} Archive Race</button>
      </div>` : ""}
    </div>`;
}

function infoChip(iconName,label,value){
  return `<div class="chip"><span class="ico">${icon(iconName,13)}</span><div><div class="lbl">${label}</div><div class="val">${esc(value)}</div></div></div>`;
}

// Shown once a race is archived — starting/finish position plus each
// driver's total time behind the wheel (summed across their non-removed
// stints only, so anything absorbed or dropped from a retirement doesn't
// count toward drive time).
// MyLaps Speedhive import panel — shown for archived races, engineers
// only. Either an "Import" prompt (session id input) or, once
