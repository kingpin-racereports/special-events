  finished.forEach(sess => panels.push(renderLiveQualifyingTable(race, sess.rows, { title: sess.name, status: "Finished" })));
  return panels.join("");
}

// Live counterpart to renderArchiveResultsPanel() above — same table markup/CSS
// (.results-table), reused deliberately so the two look identical, but
// sourced from redmist_live_positions/redmist_live_pit_stops for every
// car in the event (not just this team's own cars, and not just the
// class either — same "full field" scope as the archived version).
// Header says "Pos" rather than "Finish" since the race isn't over yet;
// Status is omitted entirely (no live DNF/DNS source, and asked to drop
// it) rather than shown as a column that never has anything in it.
// Result status for the final table: the saved row's own status, or —
// while still attached after the checkered — derived from the live row.
function finalResultStatus(row, leaderLaps){
  if (row.result_status) return row.result_status === "Running" ? null : row.result_status;
  const st = liveCarStatus(row, leaderLaps);
  if (!st || st.tone === "pit") return null;
  if (st.tone === "dns") return "DNS";
  return /^inactive/i.test(st.label) ? "DNF" : st.label;
}

// Final classification after the checkered. Same table styling as Live
// Standings; Best Lap replaces Last Lap and Gap is to the overall leader.
// Rows are either the live full field (still attached, flag 5) or the
// saved redmist_race_results rows (normalised to the same field names).
// Class + class position, plain. Class podiums are marked by the trophy
// beside the overall finish (classPodiumTrophy), so no color here. A
// DNF/DNS status replaces the position with its tag ("GTO DNF").
function classPosCell(cls, classPos, status){
  if (status === "DNF" || status === "DNS"){
    return `${esc(cls || "—")} <span class="results-badge ${status.toLowerCase()}">${status}</span>`;
  }
  const cp = Number(classPos);
  return `${esc(cls || "—")}${cp ? ` <span style="color:var(--textFaint);">P${cp}</span>` : ""}`;
}
// Trophy only (gold / silver / bronze) for a class P1–P3 — sits next to
// the overall finish position in the archive's full-field standings, so
// class podiums stand out while the overall order stays as it is.
function classPodiumTrophy(classPos, started = true){
  const cp = Number(classPos);
  if (!started || cp < 1 || cp > 3) return "";
  return `<span style="display:inline-flex;vertical-align:-2px;margin-left:5px;color:${podiumColor(cp)};" title="Class P${cp}">${icon("trophy",13)}</span>`;
}

function renderFinalResultsPanel(race, rows, stopCounts, subtitle){
  const ourNumbers = new Set(race.cars.map(c => c.number));
  const leaderLaps = rows.reduce((m, r) => Math.max(m, r.last_lap_completed || 0), 0);
  const classLeaderLaps = {};
  rows.forEach(r => { classLeaderLaps[r.class] = Math.max(classLeaderLaps[r.class] || 0, r.last_lap_completed || 0); });
  const sorted = [...rows].sort((a, b) => {
    const ap = a.overall_position, bp = b.overall_position;
    if (ap == null && bp != null) return 1;
    if (bp == null && ap != null) return -1;
    if (ap != null && bp != null && ap !== bp) return ap - bp;
    return (b.last_lap_completed || 0) - (a.last_lap_completed || 0);
  });
  const body = sorted.map(r => {
    const isOurs = ourNumbers.has(r.car_number);
    const status = finalResultStatus(r, leaderLaps);
    const badge = status ? `<span class="results-badge ${status === "DNS" ? "dns" : "dnf"}">${esc(status)}</span>` : "";
    // Class P1–P3 (cars that started) get a gold / silver / bronze trophy
    // in the Class column — every class's winner and podium, not just the
    // overall leader's.
    const cp = Number(r.class_position);
    const started = status !== "DNS" && (r.last_lap_completed || 0) > 0;
    const podium = started && cp >= 1 && cp <= 3 ? podiumColor(cp) : null;
    // Gap to the overall leader for every car, class winners included —
    // the gold trophy in the Class column is what marks each class winner.
    // Class Gap: behind this car's CLASS winner (Red Mist's in-class
    // difference — class_diff on saved rows, current_diff on live ones).
    // Blank for each class winner. Falls back to the lap deficit against
    // the class winner if Red Mist left it empty.
    const classDiff = r.class_diff ?? r.current_diff;
    const lapsDown = (classLeaderLaps[r.class] ?? 0) - (r.last_lap_completed || 0);
    const gap = !started || cp === 1 ? "—"
      : classDiff ? esc(classDiff)
      : lapsDown > 0 ? `${lapsDown} lap${lapsDown === 1 ? "" : "s"}` : "—";
    return `<tr ${tmRowAttrs(r.car_number, isOurs)}>
      <td class="num">P${r.overall_position ?? "—"}</td>
      <td>${tmSwatch(r.car_number)}<span class="num">#${esc(r.car_number)}</span> - <span style="font-weight:600;">${esc(r.team_name || "—")}</span></td>
      <td class="num">${badge || fmtLapTime(rmTimeToSeconds(r.best_time))}</td>
      <td class="num">${gap}</td>
      <td class="num">${r.last_lap_completed ?? 0}</td>
      <td class="stops">${stopCounts[r.car_number] ?? 0}</td>
      <td class="results-cls" style="white-space:nowrap;">${esc(r.class || "—")}${r.class_position ? (podium
        ? ` <span style="display:inline-flex;vertical-align:-2px;color:${podium};" title="Class P${r.class_position}">${icon("trophy",12)}</span>`
        : ` <span style="color:var(--textFaint);">P${r.class_position}</span>`) : ""}</td>
    </tr>`;
  }).join("");
  return `
    <div class="results-panel live-panel fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <span class="eyebrow" style="color:var(--text);">🏁 Final Results</span>
        ${subtitle ? `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);">${esc(subtitle)}</span>` : ""}
      </div>
      <div class="results-table-wrap">
      <table class="results-table live-table">
        <thead><tr><th>Pos</th><th>Car</th><th>Best Lap</th><th>Class Gap</th><th>Laps</th><th>Stops</th><th>Class</th></tr></thead>
        <tbody>${body}</tbody>
      </table>
      </div>
    </div>`;
}
function savedResultsPanel(race){
  const rr = race?.raceResults;
  if (!rr?.rows?.length) return "";
  const rows = rr.rows.map(r => ({ ...r, last_lap_completed: r.laps }));
  const stops = Object.fromEntries(rr.rows.map(r => [r.car_number, r.pit_stops ?? 0]));
  return renderFinalResultsPanel(race, rows, stops, rr.sessionName);
}

// Once the race has taken the checkered, Final Results move up under the
// race summary tiles (above the first car tile) and the lower standings
// slot — including the qualifying tables — is dropped. Source: the live
// full field while still attached at the flag, otherwise the saved results.
function renderFinalStandingsTop(race){
  if (!isRaceFinished(race)) return "";
  let panel = "";
  if (isLiveAttached(race) && state.liveSession?.type === "Race" && isCheckered()){
    panel = renderFinalResultsPanel(race, race.redmistLive?.fullField || [], race.redmistLive?.stopCountsByCarNumber || {}, state.liveSession?.name);
  } else if (race.raceResults?.rows?.length){
    panel = savedResultsPanel(race);
  } else if (race.redmistLive?.finished && race.redmistLive.fullField?.length){
    panel = renderFinalResultsPanel(race, race.redmistLive.fullField, race.redmistLive.stopCountsByCarNumber || {}, null);
  }
  return panel ? `<div style="margin-top:24px;">${panel}</div>` : "";
}

function renderLiveStandingsPanel(race){
  if (isRaceFinished(race)) return ""; // shown at the top instead — see renderFinalStandingsTop()
  // Gate on whether this race has live timing AT ALL (same signal
  // carPlanSection uses for hasLiveTiming) — the full-field data itself
  // now loads automatically (see loadRedmistLiveState/subscribeRedmistLiveChannel),
  // no click required, so this is the only gate left.
  // Race session live -> race standings replace qualifying. Otherwise
  // (qualifying live, or nothing live) -> every qualifying session so far.
  // No longer gated on this team's cars being in the session: another
  // class's qualifying still shows, badged Live.
  if (!(isLiveAttached(race) && state.liveSession?.type === "Race")){
    // Not live: a finished race shows its saved results above qualifying.
    return savedResultsPanel(race) + renderQualifyingPanels(race);
  }
  // Attached to a Race nobody has turned a lap in yet, but this plan
  // already has saved results — show those rather than an empty table.
  if (!liveLeaderLaps(race) && race.raceResults?.rows?.length) return savedResultsPanel(race);
  if (isCheckered()){
    return renderFinalResultsPanel(race, race.redmistLive?.fullField || [], race.redmistLive?.stopCountsByCarNumber || {}, state.liveSession?.name);
  }

  const ls = state.liveSession;
  return renderLiveStandingsTable(race, race.redmistLive?.fullField || [], race.redmistLive?.stopCountsByCarNumber || {},
    { trendKey: ls?.type === "Race" ? paceTrendKey(state.redmistEventId, ls.id, ls.name) : null });
}

// ===================== Live pace trend (test run) =====================
// Closing / losing on the same-class car directly ahead, from lap times
// already in redmist_live_laps. Each car's pace = average of its last 3
// clean laps (no pit lap, no out-lap after a stop, no caution lap) in the
// last 15 minutes. Shown inside the Last Lap cell of the live standings.
const PACE_TREND_LAPS = 3;          // clean laps averaged per car
const PACE_TREND_THRESHOLD = 0.2;   // s/lap — inside this reads as "holding", nothing shown
const PACE_TREND_WINDOW_MIN = 15;   // only laps captured this recently count
let paceTrend = { key: null, byCar: {} };
let paceTrendInFlight = false;

function paceTrendKey(eventId, sessionId, sessionName){
  return eventId && sessionId ? `${eventId}|${sessionId}|${sessionName}` : null;
}

async function loadPaceTrend(eventId, sessionId, sessionName){
  const key = paceTrendKey(eventId, sessionId, sessionName);
  if (!key || paceTrendInFlight) return;
  paceTrendInFlight = true;
  try {
    const since = new Date(Date.now() - PACE_TREND_WINDOW_MIN * 60000).toISOString();
    const { data, error } = await supabase.from("redmist_live_laps")
      .select("car_number, lap_number, lap_time_seconds, is_pit_lap, caution_lap")
      .eq("event_id", eventId).eq("session_id", sessionId).eq("session_name", sessionName)
      .gte("captured_at", since)
      .order("car_number").order("lap_number", { ascending: false })
      .limit(1000);
    if (error){ console.error("[pace-trend] laps fetch failed:", error); return; }
    const byCarLaps = {};
    (data || []).forEach(r => (byCarLaps[r.car_number] ||= []).push(r));
    const byCar = {};
    Object.entries(byCarLaps).forEach(([num, laps]) => {
      const pitLaps = new Set(laps.filter(l => l.is_pit_lap).map(l => l.lap_number));
      const clean = laps.filter(l =>
        !l.is_pit_lap && !l.caution_lap && !pitLaps.has(l.lap_number - 1)
        && Number(l.lap_time_seconds) > 0
      ).slice(0, PACE_TREND_LAPS);
      if (clean.length < PACE_TREND_LAPS) return;
      byCar[num] = { avg: clean.reduce((a, l) => a + Number(l.lap_time_seconds), 0) / clean.length };
    });
    paceTrend = { key, byCar };
  } catch (e){
    console.error("[pace-trend] load failed:", e);
  } finally {
    paceTrendInFlight = false;
  }
}

// Seconds/lap `myNum` is faster than `theirNum` (> 0 = faster, < 0 =
// slower) from the current pace-trend snapshot. Null when the snapshot is
// for another session, either car lacks 3 clean laps, or the difference
// is inside the threshold (reads as "holding", nothing shown).
function paceTrendDelta(myNum, theirNum, key){
  if (!key || paceTrend.key !== key) return null;
  const me = paceTrend.byCar[myNum], them = paceTrend.byCar[theirNum];
  if (!me || !them) return null;
  const delta = them.avg - me.avg;
  return Math.abs(delta) < PACE_TREND_THRESHOLD ? null : delta;
}
// Laps for a gap to close at `rate` s/lap. current_gap is Red Mist's
// in-class gap; "1 lap" etc. won't parse, and then there's no estimate.
// Anything past 99 laps isn't a useful number for anyone.
function paceTrendLaps(gapStr, rate){
  const gapSec = rmTimeToSeconds(gapStr);
  if (!gapSec || !(rate > 0)) return null;
  const n = Math.ceil(gapSec / rate);
  return n <= 99 ? n : null;
}

// { delta, ahead, catchLaps } or null. delta > 0 = this car is faster
// (closing), < 0 = slower (losing). Null when either car lacks 3 clean
// laps, there's no class car ahead, or it's inside the threshold.
function paceTrendFor(pos, sorted, key){
  if (!key || pos.overall_position == null) return null;
  const ahead = sorted.filter(r => r.class === pos.class && r.overall_position != null
    && r.overall_position < pos.overall_position).pop();
  if (!ahead) return null;
  const delta = paceTrendDelta(pos.car_number, ahead.car_number, key);
  if (delta == null) return null;
  const catchLaps = delta > 0 ? paceTrendLaps(pos.current_gap, delta) : null;
  return { delta, ahead, catchLaps };
}

// Car tile Car Ahead / Car Behind trend. `good` = the gap is moving our
// way (catching the car ahead, or pulling away from the car behind).
// Returns { arrow, line } HTML, or null when there's no trend to show.
// The car number is already shown on the tile, so the line omits it.
//   Ahead,  we're faster:  ▲  "Catching ~14 laps"
//   Ahead,  we're slower:  ▼  "Losing 0.6s/lap"
//   Behind, they're faster: ▼ "Catching ~10 laps"
//   Behind, we're faster:  ▲  "Pulling away"
function neighbourTrend(myNum, r, gapStr, role, key){
  if (!r) return null;
  const delta = paceTrendDelta(myNum, r.car_number, key);
  if (delta == null) return null;
  const rate = Math.abs(delta);
  let good, text;
  if (role === "ahead"){
    good = delta > 0;
    const laps = good ? paceTrendLaps(gapStr, rate) : null;
    text = good ? `Catching${laps ? ` ~${laps} laps` : ""}` : `Losing ${rate.toFixed(1)}s/lap`;
  } else {
    good = delta > 0; // we're faster than the car behind
    const laps = good ? null : paceTrendLaps(gapStr, rate);
    text = good ? `Pulling away` : `Catching${laps ? ` ~${laps} laps` : ""}`;
  }
  const color = good ? T.green : T.red;
  const title = `${role === "ahead" ? "Car ahead" : "Car behind"}: ${rate.toFixed(1)}s/lap over the last ${PACE_TREND_LAPS} clean laps`;
  return {
    arrow: ` <span title="${esc(title)}" style="font-size:12px;font-weight:700;white-space:nowrap;color:${color};">${good ? "▲" : "▼"} ${rate.toFixed(1)}</span>`,
    line: `<span class="trend-line" style="color:${color};">${text}</span>`,
  };
}

function paceTrendBadge(t){
  if (!t) return "";
  const closing = t.delta > 0;
  const rate = Math.abs(t.delta).toFixed(1);
  const title = `${closing ? "Closing on" : "Losing ground to"} #${t.ahead.car_number} by ${rate}s/lap over the last ${PACE_TREND_LAPS} clean laps`
    + (t.catchLaps ? ` · ~${t.catchLaps} laps to catch` : "");
  return ` <span title="${esc(title)}" style="font-size:10px;font-weight:700;white-space:nowrap;color:${closing ? T.green : T.red};">${closing ? "▲" : "▼"} ${rate}</span>`;
}
// =================== end live pace trend ===================

// The live standings table itself. `race` only supplies .cars, for the
// gold highlight on our own cars — Home passes a stand-in with just the
// car numbers, since it has no plan. opts.finished overrides the open
// race's finished state for the In Pit badge; opts.subtitle shows the
// session name in the header.
function renderLiveStandingsTable(race, fullField, stopCounts, opts = {}){
  // Sorted and numbered by OVERALL position, not class position — class
  // position alone would give every class its own P1/P2/P3, which reads
  // as duplicate positions across a mixed-class field. Class is still
  // shown as its own column for anyone who wants the in-class picture.
  // Tie-breakers (laps, then car number) keep the order deterministic if
  // two rows ever briefly share a position, instead of flipping between
  // renders.
  const sorted = [...fullField].sort((a,b)=>{
    const ap = a.overall_position, bp = b.overall_position;
    if (ap == null && bp != null) return 1;
    if (bp == null && ap != null) return -1;
    if (ap != null && bp != null && ap !== bp) return ap - bp;
    const lapDiff = (b.last_lap_completed || 0) - (a.last_lap_completed || 0);
    if (lapDiff) return lapDiff;
    return String(a.car_number).localeCompare(String(b.car_number), undefined, { numeric: true });
  });

  const leaderLaps = fullField.reduce((m, r) => Math.max(m, r.last_lap_completed || 0), 0);
  const fieldLastLap = fieldLastLapMs(fullField);
  const fieldRows = sorted.map(pos => {
    const isOurs = race.cars.some(c=>c.number===pos.car_number);
    const carStatus = liveCarStatus(pos, leaderLaps, opts.finished === undefined ? { fieldLastLapMs: fieldLastLap } : { finished: opts.finished, fieldLastLapMs: fieldLastLap });
    // Overall gap (Red Mist `og`) — this table is in overall order. It
    // used to show current_gap, which is the IN-CLASS gap: blank for every
    // class leader (#118 GP1, #83 GP2) and measured to the wrong car for
    // everyone else in a multi-class field.
    const gapLabel = pos.overall_position === 1 ? "Leader" : (pos.overall_gap || "—");
    return `<tr ${tmRowAttrs(pos.car_number, isOurs)}>
      <td class="num">P${pos.overall_position ?? "—"}</td>
      <td>${tmSwatch(pos.car_number)}<span class="num">#${esc(pos.car_number)}</span> - <span style="font-weight:600;">${esc(pos.team_name || "—")}</span></td>
      <td class="num">${carStatus ? liveStatusBadge(carStatus, false) : fmtLapTime(rmTimeToSeconds(pos.last_lap_time)) + paceTrendBadge(paceTrendFor(pos, sorted, opts.trendKey))}</td>
      <td class="num">${esc(gapLabel)}</td>
      <td class="num">${pos.last_lap_completed ?? 0}</td>
      <td class="stops">${stopCounts[pos.car_number] ?? 0}</td>
      <td class="results-cls">${esc(pos.class || "—")}</td>
    </tr>`;
  }).join("");

  return `
    <div class="results-panel live-panel fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;">
        <span class="eyebrow" style="color:${T.red};">Live Standings</span>
        ${opts.subtitle ? `<span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);">${esc(opts.subtitle)}</span>` : ""}
      </div>
      <div class="results-table-wrap">
      <table class="results-table live-table">
        <thead><tr><th>Pos</th><th>Car</th><th>Last Lap</th><th>Gap</th><th>Laps</th><th>Stops</th><th>Class</th></tr></thead>
        <tbody>${fieldRows}</tbody>
      </table>
      </div>
    </div>`;
}

// Archived result summary for a single car, shown directly in that car's
// always-visible tile header (not gated behind expand/collapse). Omits the
// car number and "Normal" status badge since those are already shown in
// the tile's own header — a DNF/DNS badge is still shown since that's
// context not duplicated elsewhere. Each stat gets its own line.
function archiveCarHeaderBlock(car){
  const race = state.races.find(r=>r.id===state.currentRaceId);
  if (!race || !race.archiveResults) return "";
  const m = matchArchiveToRaceCars({ cars:[car] }, race.archiveResults)[0];
  if (!m || !m.found) return "";

  const statusBadge = m.status === "DNF" ? `<span class="results-badge dnf">DNF</span>`
                     : m.status === "DNS" ? `<span class="results-badge dns">DNS</span>` : "";
  const tile = (label, value, sub) => `
    <div class="results-carstat-tile">
      <div class="results-stat-label">${label}</div>
      <div class="results-carstat-value">${value}</div>
      ${sub ? `<div class="results-stat-sub">${sub}</div>` : ""}
    </div>`;

  return `
    <div class="results-header-block">
      <div class="results-carstat-grid">
        ${tile("Finish", `P${m.positionInClass || m.position}`, statusBadge || null)}
        ${tile("Overall Position", `P${m.position}`)}
        ${tile("Fastest Lap", m.bestTime && m.bestTime!=="00.000" ? esc(m.bestTime) : "—")}
        ${tile("Average Lap", race.archiveResults.avgLapByNumber?.[car.number] ? fmtLapTime(race.archiveResults.avgLapByNumber[car.number]) : "—")}
        ${tile("Pit Stops", m.pitStops)}
        ${tile("Laps Completed", m.numberOfLaps)}
      </div>
    </div>`;
}

// Loose driver-name match: every word of the shorter name appears in the
// longer ("Rosso-Orcel" ~ "Tiziano Rosso-Orcel"). Mirrors the poller's
// sameDriver().
// Looser match for plan/Red Mist names that aren't a token subset of each
// other ("Bob Campbell" vs "R. Campbell"): same surname AND the given names
// don't conflict (one side is surname-only, or the first initials agree).
// Surname alone is never enough — family members share it (Tyler / Marc
// Sharinn on #81), and a bare surname match merged them into one driver.
function looseSameDriver(a, b){
  if (sameDriverName(a, b)) return true;
  const tok = n => String(n || "").toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").split(/\s+/).filter(Boolean);
  const A = tok(a), B = tok(b);
  if (!A.length || !B.length || A[A.length - 1] !== B[B.length - 1]) return false;
  if (A.length === 1 || B.length === 1) return true;
  return A[0][0] === B[0][0];
}
// Best match for a driver name in a list: exact token match first, then the
// looser rule above. Null when nothing matches.
function findDriverMatch(name, candidates){
  return candidates.find(c => sameDriverName(c, name)) || candidates.find(c => looseSameDriver(c, name)) || null;
}

function sameDriverName(a, b){
  const tok = n => String(n || "").toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").split(/\s+/).filter(Boolean);
  const A = tok(a), B = tok(b);
  if (!A.length || !B.length) return false;
  const [short, long] = A.length <= B.length ? [A, B] : [B, A];
  return short.every(t => long.includes(t));
}

// =============== Per-car Race Pace chart (archived races) ===============
// Under each car's tile: the class field's race pace through the race, this
// car's own pace on top of it, and who was driving when — each driver's
// stints shaded and their line drawn in their timeline colour, so a slow
// window can be tied to a driver and a time of day for driver-order review.
//
// Laps are only read the first time a tile is opened (a race is ~7,000
// rows), then kept for the rest of the session. Keyed by race id rather
// than stored on the race object so re-opening a race or a tab-focus
// re-fetch (startApp) doesn't throw it away.
const racePaceCache = new Map(); // race.id -> { status: "loading" | "ready" | "none", ... }

// Class pace charts for one loaded session.
function racePaceChartsFor(session){
  const { classification, stintsByNum, flagCautions, flagReds, checkered } = session;
  const clsByNum = Object.fromEntries(classification.map(c => [c.startNumber, c.resultClass]));
  const charts = {};
  [...new Set(classification.map(c => c.resultClass))].forEach(cls => {
    const nums = classification.filter(c => c.resultClass === cls).map(c => c.startNumber);
    charts[cls] = debriefPaceSeries(Object.fromEntries(nums.map(n => [n, stintsByNum[n]])), { cautions: flagCautions, redFlags: flagReds, checkered });
  });
  return { charts, clsByNum, stintsByNum };
}

// The race's local day ("YYYY-MM-DD"): plan start, else the session date.
function racePaceRaceDay(race, resultRows){
  if (race.plan?.startDateTimeISO){
    const d = new Date(race.plan.startDateTimeISO);
    if (!isNaN(d)) return d.toLocaleDateString("en-CA");
  }
  const sd = resultRows?.[0]?.session_date;
  return sd ? String(sd).slice(0, 10) : String(race.eventDateISO || "").slice(0, 10) || null;
}
const racePaceIsSunday = day => !!day && new Date(day + "T12:00:00").getDay() === 0;
function racePacePrevDay(day){
  const d = new Date(day + "T12:00:00");
  d.setDate(d.getDate() - 1);
  return d.toLocaleDateString("en-CA");
}

// Saturday's race session for a Sunday race: same Red Mist event (one id
// spans the weekend), the day before, never Sunday's own session. Falls
// back to a plan in the list that ran the day before at the same track.
async function racePaceSaturdayRows(race, sunRows, satDay){
  const { event_id, session_id, session_name } = sunRows[0];
  const { data, error } = await supabase.from("redmist_race_results").select("*").eq("event_id", event_id);
  if (error) throw error;
  const localDay = ms => ms ? new Date(ms).toLocaleDateString("en-CA") : "";
  const groups = {};
  (data || []).forEach(r => {
    if (Number(r.session_id) === Number(session_id) && r.session_name === session_name) return;
    const key = `${r.session_id}|${r.session_name}`;
    const g = (groups[key] ||= { name: r.session_name, rows: [], at: 0, date: r.session_date || null });
    g.rows.push(r);
    g.at = Math.max(g.at, new Date(r.checkered_at || r.updated_at || 0).getTime());
  });
  const cands = Object.values(groups).filter(g => classifySession(g.name) !== "Qualifying");
  let sat = cands.filter(g => (g.date ? String(g.date).slice(0, 10) : localDay(g.at)) === satDay);
  if (!sat.length) sat = cands.filter(g => String(g.name || "").toLowerCase().includes("saturday"));
  if (sat.length) return sat.sort((a, b) => b.at - a.at)[0].rows;

  const satRace = (state.races || []).find(r => r.id !== race.id && r.track === race.track
    && racePaceRaceDay(r, null) === satDay);
  return satRace ? fetchRedmistResultRows(satRace, true) : null;
}

// Show/Hide Saturday's field line — one switch for every car's chart.
// Inline onclick (not data-act) because the slot is re-filled in place
// after laps load, which bindEvents() never sees.
let racePaceShowSat = false;
function racePaceToggleSat(e){
  e?.preventDefault(); e?.stopPropagation();
  racePaceShowSat = !racePaceShowSat;
  refreshRacePaceSlots(state.currentRaceId);
}

// Fill caution / no-data gaps inside each [from, to] window by straight
// interpolation, so a driver's line runs unbroken through their own time
// in the car. Nothing is drawn outside their windows.
function racePaceBridge(points, field, windows){
  const out = points.slice();
  windows.forEach(w => {
    const idx = field.map((p, k) => p.m >= w.from && p.m <= w.to ? k : -1).filter(k => k >= 0);
    const known = idx.filter(k => out[k]);
    for (let i = 1; i < known.length; i++){
      const a = known[i - 1], b = known[i];
      for (let k = a + 1; k < b; k++){
        const f = (field[k].m - out[a].m) / (out[b].m - out[a].m);
        out[k] = { m: field[k].m, t: out[a].t + (out[b].t - out[a].t) * f };
      }
    }
  });
  return out;
}

async function loadRacePace(race){
  const key = race.id;
  racePaceCache.set(key, { status: "loading" });
  try {
    const resultRows = await fetchRedmistResultRows(race);
    const day = resultRows ? racePaceRaceDay(race, resultRows) : null;
    // Sunday only: Saturday's class field pace, an optional comparison line.
    // Loaded alongside Sunday's laps; a failure here just leaves it off.
    const satLoad = racePaceIsSunday(day)
      ? racePaceSaturdayRows(race, resultRows, racePacePrevDay(day))
          .then(rows => rows ? rmLoadSessionStints(rows) : null)
          .then(s => s ? racePaceChartsFor(s) : null)
          .catch(e => { console.warn("[race-pace] Saturday comparison unavailable:", e); return null; })
      : Promise.resolve(null);
    const [session, sat] = await Promise.all([resultRows ? rmLoadSessionStints(resultRows) : null, satLoad]);
    if (!session){ racePaceCache.set(key, { status: "none" }); }
    else {
      racePaceCache.set(key, { status: "ready", ...racePaceChartsFor(session), sat, carLines: {} });
    }
  } catch (e){
    console.error("[race-pace] load failed:", e);
    racePaceCache.set(key, { status: "none" });
  }
  refreshRacePaceSlots(race.id);
}

// In-place update of any open Race Pace slots once laps arrive — no full
// re-render, so the page doesn't jump.
function refreshRacePaceSlots(raceId){
  if (state.currentRaceId !== raceId) return;
  const race = state.races.find(r => r.id === raceId);
  if (!race) return;
  document.querySelectorAll(".race-pace-slot").forEach(el => {
    const cp = state.plan?.carPlans?.find(c => String(c.car.id) === el.dataset.carId);
    if (cp) el.innerHTML = racePaceInner(race, cp);
  });
}

// One car's pace, a point per chart bin, built stint by stint so a line
// never smooths across a driver change or a stop. Each point is the median
// of that stint's green, non-pit laps within CHART_SMOOTH_MIN either side —
// the same smoothing and outlier rule as the field line, so the two are
// directly comparable. Caution windows are left as gaps.
function racePaceCarSegments(stints, chart){
  const W = DEBRIEF.CHART_SMOOTH_MIN;
  const end = chart.start + chart.minutes * 60000;
  const toMin = ts => (ts - chart.start) / 60000;
  const inCaution = m => (chart.cautions || []).some(([a, b]) => m >= a && m < b);
  const green = l => l.t && l.ts && !l.pit && !l.caution && l.ts <= end;
  const ref = debriefMedian(stints.flatMap(s => s.laps).filter(green).map(l => l.t));
  if (!ref) return null;
  const max = ref * (1 + DEBRIEF.CHART_CAUTION_PCT); // wide cap; outliers are trimmed per point below
  return stints.map(s => {
    const first = s.laps[0], last = s.laps[s.laps.length - 1];
    if (!first.ts || !last.ts) return null;
    const from = toMin(first.ts - (first.t || 0) * 1000), to = toMin(Math.min(last.ts, end));
    if (to <= 0 || from >= chart.minutes) return null;
    const laps = s.laps.filter(l => green(l) && l.t <= max)
      .map(l => ({ m: toMin(l.ts) - l.t / 120, t: l.t })) // lap midpoint
      .filter(l => !inCaution(l.m));
    const points = chart.field.map(p => {
      if (p.m < from || p.m > to || inCaution(p.m)) return null;
      const win = laps.filter(l => Math.abs(l.m - p.m) <= W).map(l => l.t);
      if (win.length < 3) return null;
      // Outliers vs. this car's laps around this moment, not its race-long
      // normal, so a wet spell is drawn rather than dropped.
      const local = debriefMedian(win);
      const kept = win.filter(t => t <= local * (1 + DEBRIEF.CHART_OUTLIER_PCT));
      return { m: p.m, t: debriefMedian(kept.length >= 3 ? kept : win) };
    });
    return { driver: s.driver, from: Math.max(0, from), to: Math.min(chart.minutes, to), firstLap: first.lap, lastLap: last.lap, points };
  }).filter(Boolean);
}

function racePaceBlock(cp){
  const race = state.races.find(r => r.id === state.currentRaceId);
  if (!race) return "";
  return `<div class="race-pace-slot" data-car-id="${esc(cp.car.id)}">${racePaceInner(race, cp)}</div>`;
}

function racePaceInner(race, cp){
  if (!racePaceCache.has(race.id)) loadRacePace(race);
  const entry = racePaceCache.get(race.id);
  const headWith = right => `<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:10px;"><span class="fin-label" style="margin:0;">${icon("activity",12)} Race Pace</span>${right || ""}</div>`;
  const head = headWith("");
  if (entry.status === "loading"){
    return `<div class="summary-box">${head}<div style="font-size:12px;color:var(--textFaint);padding:6px 0;">Loading lap data…</div></div>`;
  }
  if (entry.status !== "ready") return "";

  const car = cp.car, num = String(car.number);
  const cls = entry.clsByNum[num];
  const chart = cls ? entry.charts[cls] : null;
  const stints = entry.stintsByNum[num];
  if (!chart || !stints?.length) return "";
  if (!(num in entry.carLines)) entry.carLines[num] = racePaceCarSegments(stints, chart);
  const segs = entry.carLines[num];
  if (!segs?.length) return "";

  // Red Mist names -> this plan's drivers (plan names are often surname-only),
  // so colours and abbreviations match the stint timeline below.
  const planIdx = {};
  cp.stints.forEach(s => { if (!s.removed && s.driver && !(s.driver in planIdx)) planIdx[s.driver] = s.driverIndex ?? Object.keys(planIdx).length; });
  const planNames = Object.keys(planIdx);
  const abbrev = buildTimelineAbbrev(car.drivers.filter(d => d.trim()));
  const toPlan = rm => findDriverMatch(rm, planNames);
  const used = new Set(Object.values(planIdx).map(i => i % DRIVER_PALETTE.length));
  const who = {};
  segs.forEach(s => {
    if (who[s.driver]) return;
    const p = toPlan(s.driver);
    let idx = p != null ? planIdx[p] : null;
    if (idx == null){
      idx = [...DRIVER_PALETTE.keys()].find(i => !used.has(i)) ?? Object.keys(who).length;
      used.add(idx % DRIVER_PALETTE.length);
    }
    who[s.driver] = {
      name: p || s.driver,
      label: (p && abbrev[p]) || driverSurname(s.driver).slice(0, 3).toUpperCase(),
      color: DRIVER_PALETTE[idx % DRIVER_PALETTE.length],
    };
  });

  // Shaded windows: back-to-back stints by the same driver (a fuel-only
  // stop) read as one window.
  const bands = [];
  segs.forEach(s => {
    const prev = bands[bands.length - 1];
    if (prev && prev.driver === s.driver){ prev.to = s.to; prev.lastLap = s.lastLap; return; }
    bands.push({ driver: s.driver, from: s.from, to: s.to, firstLap: s.firstLap, lastLap: s.lastLap });
  });
  const bandOpts = bands.map(b => ({
    from: b.from, to: b.to, color: who[b.driver].color, label: who[b.driver].label,
    title: `${who[b.driver].name} · Laps ${b.firstLap}–${b.lastLap}`,
  }));

  // One line per driver across the whole race, gaps outside their stints.
  const drivers = Object.keys(who);
  const lines = [
    { label: `${cls} field`, color: T.textMuted, points: chart.field, dash: "5 4", width: 2 },
    ...drivers.map(d => ({
      label: who[d].name, color: who[d].color, width: 2.2,
      points: racePaceBridge(
        chart.field.map((_, k) => { const s = segs.find(x => x.driver === d && x.points[k]); return s ? s.points[k] : null; }),
        chart.field, bands.filter(b => b.driver === d)),
    })),
  ];

  // Sunday: Saturday's class field pace by race hour, behind a Show/Hide
  // toggle. The field line is already continuous (cautions bridged); it's
  // cut at Sunday's length since Saturday runs longer.
  const satCls = entry.sat?.clsByNum[num];
  const satChart = satCls ? entry.sat.charts[satCls] : null;
  const satToggle = satChart
    ? `<button type="button" onclick="racePaceToggleSat(event)" style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.04em;text-transform:uppercase;padding:3px 8px;border-radius:4px;cursor:pointer;border:1px solid ${racePaceShowSat ? "#F472D0" : "var(--border)"};background:${racePaceShowSat ? "rgba(244,114,208,0.12)" : "transparent"};color:${racePaceShowSat ? "#F472D0" : "var(--textMuted)"};">${racePaceShowSat ? "Hide" : "Show"} Saturday Pace</button>`
    : "";
  if (satChart && racePaceShowSat){
    lines.push({ label: `Saturday ${satCls} field`, color: "#F472D0", points: satChart.field.filter(p => p.m <= chart.minutes), dash: "2 4", width: 2 });
  }
  const svg = debriefPaceChartSvg(chart, lines, { bands: bandOpts, height: 220, ariaLabel: `#${car.number} race pace against the ${cls} field, by driver` });
  if (!svg) return "";
  return `<div class="summary-box">${headWith(satToggle)}${svg}</div>`;
}
// =============== end Race Pace chart ===============

function raceSummaryBlock(cp){
  // One row per driver: name, the lap ranges they drove, a seat-time share
  // bar in their timeline colour, seat time + share, and lap-time
  // consistency (standard deviation over clean green-flag laps, colour
  // scale only). Plan names can be surname-only, so they're matched to
  // Red Mist's full names loosely.
  const totals = {}, colors = {};
  const order = [];
  cp.stints.forEach(s=>{
    if (s.removed || !s.driver) return;
    if (!(s.driver in totals)){
      totals[s.driver] = 0; order.push(s.driver);
      colors[s.driver] = DRIVER_PALETTE[(s.driverIndex ?? order.length - 1) % DRIVER_PALETTE.length];
    }
    totals[s.driver] += s.lengthMin;
  });
  const race = state.races.find(r=>r.id===state.currentRaceId);
  const cons = race?.archiveResults ? (race.archiveResults.driverConsistency?.[cp.car.number] || []) : null;
  const consFor = d => cons ? (cons.find(x => sameDriverName(x.driver, d))
    || cons.find(x => looseSameDriver(x.driver, d))) : null;
  const rangesText = c => c?.ranges?.length
    ? "Laps " + c.ranges.map(([a,b]) => a === b ? `${a}` : `${a}–${b}`).join(", ")
    : "";
  const cols = cons ? "minmax(0,1fr) 92px 92px" : "minmax(0,1fr) 92px";
  // Archived with Red Mist laps: seat time is what each driver actually
  // drove (their laps, as corrected), not the plan. Drivers Red Mist saw
  // who aren't in the plan are added after the plan's drivers.
  if (cons && cons.some(c => c.seconds != null)){
    order.forEach(d => { totals[d] = 0; });
    cons.forEach(c => {
      let d = findDriverMatch(c.driver, order);
      if (!d){ d = c.driver; order.push(d); colors[d] = DRIVER_PALETTE[(order.length - 1) % DRIVER_PALETTE.length]; totals[d] = 0; }
      totals[d] += (c.seconds || 0) / 60;
    });
  }

  const totalMin = Object.values(totals).reduce((a,b)=>a+b, 0) || 1;
  const rows = order.map((d, i) => {
    const c = consFor(d);
    const share = Math.round(totals[d] / totalMin * 100);
    let consCell = "";
    if (cons){
      if (!c || c.stdev == null) consCell = `<div style="text-align:right;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--textFaint);">—</div>`;
      else {
        const cv = c.avg ? c.stdev / c.avg : 0;
        const color = cv >= 0.02 ? T.red : cv >= 0.01 ? T.amber : T.green;
        consCell = `<div style="text-align:right;font-family:'JetBrains Mono',monospace;font-size:13.5px;color:${color};" title="${c.cleanLaps} clean laps of ${c.laps}">±${c.stdev.toFixed(3)}s</div>`;
      }
    }
    const lapsLine = rangesText(c);
    return `
      <div style="display:grid;grid-template-columns:${cols};gap:12px;align-items:center;padding:10px 0;${i < order.length-1 ? "border-bottom:1px solid var(--border);" : ""}">
        <div style="min-width:0;">
          <div style="font-size:14px;font-weight:600;color:var(--text);">${esc(d)}</div>
          ${lapsLine ? `<div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--textFaint);margin-top:2px;">${esc(lapsLine)}</div>` : ""}
          <div style="height:4px;border-radius:2px;background:var(--border);margin-top:7px;">
            <div style="width:${share}%;height:4px;border-radius:2px;background:${colors[d]};"></div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-family:'JetBrains Mono',monospace;font-size:13.5px;color:var(--text);">${formatDuration(totals[d])}</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--textFaint);">${share}%</div>
        </div>
        ${consCell}
      </div>`;
  }).join("");

  const canFix = state.isEngineer && race?.status === "archived" && !!race?.archiveResults;
  const fixOpen = canFix && state.lapFix && String(state.lapFix.carId) === String(cp.car.id);
  const fixBtn = canFix && !fixOpen
    ? `<button data-act="lapfix-open" data-car="${esc(cp.car.id)}" style="margin-left:10px;background:none;border:1px solid var(--borderLight);border-radius:6px;color:var(--blue);font-size:11px;padding:3px 8px;cursor:pointer;">Fix driver laps</button>` : "";
  return `
    <div class="summary-box">
      <div style="display:grid;grid-template-columns:${cols};gap:12px;padding-bottom:8px;border-bottom:1px solid var(--border);">
        <span class="fin-label" style="margin:0;">${icon("timer",12)} Drivers${fixBtn}</span>
        <span class="fin-label" style="margin:0;justify-content:flex-end;">Seat Time</span>
        ${cons ? `<span class="fin-label" style="margin:0;justify-content:flex-end;">Consistency</span>` : ""}
      </div>
      ${fixOpen ? lapFixForm(cp) : ""}
      ${rows}
    </div>`;
}

// Engineer-only: set the driver on a range of laps for one car in an
// archived race (Red Mist's driver name lags or sticks at real swaps).
// Writes redmist_live_laps, re-derives the stops at the edges of the range
// on redmist_live_pit_stops, then rebuilds the archive so the Drivers
// table, Pit Stop Times, Race Pace and any later Debrief all follow.
function lapFixForm(cp){
  const f = state.lapFix;
  const drivers = cp.car.drivers.filter(d => d && d.trim());
  const inp = "background:var(--panelRaised);border:1px solid var(--borderLight);border-radius:6px;color:var(--text);padding:7px 9px;font-size:13px;";
  const lbl = t => `<div style="font-size:11px;color:var(--textFaint);margin-bottom:4px;">${t}</div>`;
  const opts = [`<option value="">Select driver</option>`, ...drivers.map(d => `<option value="${esc(d)}" ${d === f.driver ? "selected" : ""}>${esc(d)}</option>`)].join("");
  return `
    <div style="margin:10px 0 4px;padding:10px;border:1px solid var(--border);border-radius:8px;">
      <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">
        <div>${lbl("From lap")}<input id="lapFixFrom" type="number" min="1" inputmode="numeric" value="${esc(f.from ?? "")}" style="${inp}width:80px;"></div>
        <div>${lbl("To lap")}<input id="lapFixTo" type="number" min="1" inputmode="numeric" value="${esc(f.to ?? "")}" style="${inp}width:80px;"></div>
        <div style="flex:1;min-width:160px;">${lbl("Driver")}<select id="lapFixDriver" style="${inp}width:100%;">${opts}</select></div>
        <button data-act="lapfix-save" ${f.saving ? "disabled" : ""} style="background:var(--blue);color:#0A0C10;border:none;border-radius:6px;font-weight:600;font-size:13px;padding:8px 14px;cursor:pointer;">${f.saving ? "Saving…" : "Save fix"}</button>
        <button data-act="lapfix-close" ${f.saving ? "disabled" : ""} style="background:none;border:none;color:var(--textMuted);font-size:13px;padding:8px 6px;cursor:pointer;">Close</button>
      </div>
      ${f.msg ? `<div style="font-size:12px;margin-top:8px;color:${f.ok ? T.green : T.red};">${esc(f.msg)}</div>` : ""}
    </div>`;
}

async function saveLapFix(){
  const f = state.lapFix;
  const race = state.races.find(r => r.id === state.currentRaceId);
  const car = race?.cars?.find(c => String(c.id) === String(f?.carId));
  if (!f || !race || !car) return;
  const from = parseInt(f.from, 10), to = parseInt(f.to, 10);
  if (!(from >= 1) || !(to >= from) || !f.driver){
    f.ok = false; f.msg = "Enter a lap range and pick a driver."; render(); return;
  }
  f.saving = true; f.msg = ""; render();
  try {
    const resultRows = await fetchRedmistResultRows(race);
    if (!resultRows) throw new Error("No Red Mist results for this race.");
    const { event_id, session_id, session_name } = resultRows[0];
    const scope = q => q.eq("event_id", event_id).eq("session_id", session_id).eq("session_name", session_name);
    const num = String(car.number);

    // Write Red Mist's full name when this car already has one for the
    // driver (plan names are often surname-only).
    const laps = await fetchAllRows(() => scope(supabase.from("redmist_live_laps").select("lap_number, driver_name")).eq("car_number", num).order("lap_number"));
    const pitLapOf = rmPitInLap; // stop rows record the in-lap — see rmAlignStopLaps
    const seen = [...new Set(laps.map(l => l.driver_name).filter(Boolean))];
    const name = findDriverMatch(f.driver, seen) || f.driver;

    const { data: updated, error } = await scope(supabase.from("redmist_live_laps").update({ driver_name: name }))
      .eq("car_number", num).gte("lap_number", from).lte("lap_number", to).select("lap_number");
    if (error) throw error;
    // RLS rejections come back as zero rows, not an error.
    if (!updated?.length) throw new Error(`No laps were updated for #${num} — check the range, or that lap edits are enabled for engineers.`);

    // Stops touching the range: outgoing = driver on the in-lap, incoming =
    // driver on the lap after, from the corrected laps.
    const byLap = {};
    laps.forEach(l => { byLap[l.lap_number] = l.driver_name; });
    for (let L = from; L <= to; L++) if (L in byLap) byLap[L] = name;
    const lapNums = Object.keys(byLap).map(Number).sort((a, b) => a - b);
    const atOrBefore = L => { for (let i = lapNums.length - 1; i >= 0; i--) if (lapNums[i] <= L && byLap[lapNums[i]]) return byLap[lapNums[i]]; return null; };
    const atOrAfter = L => { for (const n of lapNums) if (n >= L && byLap[n]) return byLap[n]; return null; };
    const stops = await fetchAllRows(() => scope(supabase.from("redmist_live_pit_stops")
      .select("stop_num, lap_number, driver_out, driver_in, driver_change, penalty_served")).eq("car_number", num));
    for (const st of stops){
      const L = pitLapOf(st.lap_number);
      if (rmIsPenaltyStop(st) || L < from - 1 || L > to) continue;
      const out = atOrBefore(L), inn = atOrAfter(L + 1);
      const change = !!(out && inn && !sameDriverName(out, inn));
      if (out === st.driver_out && inn === st.driver_in && change === (st.driver_change === true)) continue;
      const { error: e2 } = await scope(supabase.from("redmist_live_pit_stops").update({ driver_out: out, driver_in: inn, driver_change: change }))
        .eq("car_number", num).eq("stop_num", st.stop_num).eq("lap_number", st.lap_number);
      if (e2) throw e2;
    }

    // Rebuild everything that reads driver names.
    const [archive, pits] = await Promise.all([buildRedmistArchive(race, { save: true }), loadArchivePitStops(race)]);
    if (archive) race.archiveResults = archive;
    if (pits) race.redmistPitCycles = pits;
    racePaceCache.delete(race.id);
    state.lapFix = { carId: f.carId, from: "", to: "", driver: "", saving: false, ok: true,
      msg: `Laps ${from}–${to} set to ${name} (${updated.length} lap${updated.length === 1 ? "" : "s"}).` };
  } catch (e){
    console.error("[lap-fix] failed:", e);
    f.saving = false; f.ok = false; f.msg = e.message || "Save failed.";
  }
  render();
}

// Real pit-in/pit-out cycle times for one car, from Red Mist Timing (see
// loadRedmistPitCyclesFromSupabase). Shows duration_pdm_seconds only, per
// stop — the field validated against a crew stopwatch. A stop whose
// red_flag_overlap is true shows "Red Flag" instead of a number, since pdm
// can't be trusted when a session-wide stoppage happened during the stop
// (confirmed: pdm read 81s on a stop that was actually ~26 minutes by
// clock time because of an overlapping red flag). A stop flagged
// needsReview (numbers don't fit a normal pattern at all, e.g. a real
// garage repair) gets a wrench marker so it's visually distinct without
// implying the number itself is wrong.
// "Bruce Ledoux" -> first name(s) in a span the phone layout hides, so the
// pit stop table shows "Ledoux" on mobile and the full name elsewhere.
function pitDriverName(name){
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if (parts.length < 2) return esc(parts[0] || "\u2014");
  const last = parts.pop();
  return `<span title="${esc(parts.join(" ") + " " + last)}"><span class="dn-first">${esc(parts.join(" "))} </span>${esc(last)}</span>`;
}

function pitCycleBlock(car){
  const race = state.races.find(r=>r.id===state.currentRaceId);
  if (!race || !race.redmistPitCycles) return "";
  const stops = race.redmistPitCycles.byCarNumber[car.number];
  if (!stops || !stops.length) return "";

  const fmt = sec => {
    if (sec == null) return "—";
    const total = Math.round(sec);
    return `${Math.floor(total/60)}m ${total%60}s`;
  };

  // Garage trips (needsReview, no red flag) and red-flag stops are
  // excluded from the average - they're not representative pit-lane pace
  // and would badly skew it (a single 95-min outlier would dominate an
  // average of otherwise ~1-3 min stops). Computed before the row loop
  // since outlier coloring below compares each normal stop against it.
  const clean = stops.filter(s => !s.redFlagOverlap && !s.needsReview && !s.penalty && s.pdmSeconds != null);
  const avgSeconds = clean.length ? clean.reduce((a,s)=>a+s.pdmSeconds,0)/clean.length : null;

  const rows = stops.map(s => {
    // Genuine extended stop (garage trip, etc.) with no red flag to explain
    // it: pdm badly understates the real time lost, so show clock-gap
    // instead - that's the number actually being displayed, so severity
    // coloring below compares clockGapSeconds against average, not pdm.
    const isGarageTrip = s.needsReview && !s.redFlagOverlap;

    const wrench = s.needsReview
      ? `<span title="${esc(s.notes) || "Needs review \u2014 numbers don't fit a normal stop"}" style="margin-left:4px;">\uD83D\uDD27</span>` : "";

    // Driver column: incoming driver's name (as reported by Red Mist, or a
    // manual correction if one exists - see loadRedmistPitCyclesFromSupabase).
    // No swap indicator here anymore - the "Incoming Driver" header itself
    // makes clear this is who got in the car, whether or not it changed
    // from the previous stop.
    // Driver change: outgoing -> incoming. The outgoing driver is the stop's
    // own driver_out when recorded, else whoever got in at the previous stop.
    const prev = stops[stops.indexOf(s) - 1];
    const out = s.driverOut || prev?.driverIn || null;
    const changed = !s.penalty && !!(out && s.driverIn && !sameDriverName(out, s.driverIn));
    const driverCell = changed
      ? `<span style="color:var(--textFaint);">${pitDriverName(out)}</span> <span style="color:var(--textFaint);margin:0 2px;">→</span> <span style="color:var(--text);">${pitDriverName(s.driverIn)}</span>`
      : pitDriverName(s.driverIn);

    // Flag column: mutually exclusive text label - a stop overlapping a red
    // flag shows "Red Flag" and nothing else; caution (yellow) shows
    // "Caution"; neither shows a blank cell. This is now the single place
    // that labels red-flag/caution status - the Time column always shows
    // the real duration number (still colored red for a red-flag overlap,
    // since the number can genuinely be right or wrong there and it's
    // worth judging case by case rather than hiding it - see project notes
    // on pdm's reliability during a red flag).
    // Shown as a colour dot (hover for the label) to leave room for names.
    const dot = (c, label) => `<span title="${label}" aria-label="${label}" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${c};vertical-align:middle;"></span>`;
    let flagCell = "";
    if (s.penalty){
      flagCell = dot(T.textFaint, "Penalty");
    } else if (s.redFlagOverlap){
      flagCell = dot(T.red, "Red Flag");
    } else if (s.underCaution){
      flagCell = dot(T.amber, "Caution");
    }

    // Outlier coloring: how far this stop's real duration sits from this
    // car's own average for the race - a long fuel-only stop, a slow
    // driver change, tires taking extra time, or (at the extreme end) a
    // genuine garage trip like a confirmed real ~95-minute repair. Also
    // applied to red-flag stops - pdm during a red flag can be right or
    // wrong depending on the specific stop (confirmed both ways in this
    // project), so it's shown and colored like any other number rather
    // than hidden, with "Red Flag" in the Flag column as the context that
    // it needs a second look. Ratio-based rather than a fixed threshold
    // since pit strategy and stop length vary car to car. Applies to
    // garage trips too (compared against clockGapSeconds, the number
    // actually shown for those) so a severe outlier is never capped at the
    // same amber as a merely-long stop.
    const displaySeconds = isGarageTrip ? s.clockGapSeconds : s.pdmSeconds;
    const ratio = !s.penalty && avgSeconds && displaySeconds != null ? displaySeconds / avgSeconds : null;
    const color = ratio != null && ratio >= 3 ? T.red
                : ratio != null && ratio >= 1.5 ? T.amber
                : null;
    const timeText = fmt(displaySeconds);
    const timeCell = color ? `<span style="color:${color};">${timeText}</span>` : timeText;

    return `<tr>
      <td>${s.stopNum}${wrench}</td>
      <td class="pit-lap">${s.lap != null ? s.lap : "—"}</td>
      <td class="pit-driver">${driverCell}</td>
      <td class="pit-flag">${flagCell}</td>
      <td class="pit-time">${timeCell}</td>
    </tr>`;
  }).join("");

  const avgRow = avgSeconds != null
    ? `<div class="summary-driver" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);">
         <span class="fin-label" style="margin:0;">Average Pit Stop</span>
         <span class="font-mono">${fmt(avgSeconds)}</span>
       </div>`
    : "";

  return `
    <div class="summary-box">
      <table class="pit-table">
        <thead><tr><th>Stops</th><th>Lap</th><th>Driver</th><th>Flag</th><th style="text-align:right;">Time</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${avgRow}
    </div>`;
}

// Live Red Mist Timing data for one car, populated by subscribeRedmistLive()
// into race.redmistLive.byCarNumber / .statsByCarNumber. Average Lap and
// Consistency are scoped to the CURRENT STINT only (laps since the last
// detected driver change, pit laps excluded) — see the
// redmist_current_stint_stats view — so both reset to blank the moment a
// driver swap is detected, on purpose: a whole-race average across
// different drivers/conditions wouldn't mean much for either.
function liveTimingBlock(car){
  const race = state.races.find(r=>r.id===state.currentRaceId);
  const pos = race?.redmistLive?.byCarNumber?.[car.number];
  if (!pos) return "";
  const stats = race.redmistLive.statsByCarNumber?.[car.number];

  // RedMist's HH:mm:ss.fff lap-time format — trim the always-zero hour for
  // a normal lap so it reads as "1:35.420" rather than "00:01:35.420".
  const trimLapTime = t => {
    if (!t) return "—";
    const m = t.match(/^00:(\d{2}):(\d{2}\.\d+)$/);
    return m ? `${Number(m[1])}:${m[2]}` : t;
  };
  const fmtLapSeconds = sec => {
    if (sec == null) return "—";
    const m = Math.floor(sec/60), s = sec - m*60;
    return `${m}:${s.toFixed(3).padStart(6,"0")}`;
  };

  // Positions gained/lost this session — Red Mist computes this itself
  // (class_positions_gained), -999 means "not available yet" rather than
  // zero, so that sentinel is hidden rather than shown as "-999". A real
  // zero (no positions gained or lost) is hidden too, same as the delta
  // badge elsewhere in the app — "+0"/"0" is just noise next to a plain
  // position number, worth showing only when something actually changed.
  const tile = (label, value, sub) => `
    <div class="results-carstat-tile">
      <div class="results-stat-label">${label}</div>
      <div class="results-carstat-value">${value}</div>
      ${sub ? `<div class="results-stat-sub">${sub}</div>` : ""}
    </div>`;

  const cpg = pos.class_positions_gained;
  const gainedLabel = (cpg==null || cpg===-999 || cpg===0) ? null : (cpg>0 ? `+${cpg}` : `${cpg}`);
  const gainedColor = cpg>0 ? T.green : cpg<0 ? T.red : T.textMuted;

  // Consistency = coefficient of variation (stdev / mean) of this stint's
  // laps — scale-independent across tracks, unlike raw stdev. Thresholds
  // here are a starting assumption, not a validated figure the way the pit
  // duration fields are — worth revisiting once real session data is in.
  // Standard deviation (seconds) of this stint's CLEAN laps only — pit
  // laps, pit out-laps and any lap that saw a caution flag are excluded
  // (redmist_current_stint_consistency). Colour thresholds are on
  // stdev / mean so they hold across tracks of different lap lengths
  // (1% / 2% ≈ 1.3s / 2.5s on a 2:06 lap).
  const cons = race.redmistLive.consistencyByCarNumber?.[car.number];
  const stdevSec = cons?.stdev_lap_seconds ?? null;
  const cv = (stdevSec!=null && cons?.clean_avg_lap_seconds) ? stdevSec / cons.clean_avg_lap_seconds : null;
  const consistencyLabel = stdevSec==null ? "—" : `±${Number(stdevSec).toFixed(3)}s`;
  const consistencyColor = cv==null ? null : cv>=0.02 ? T.red : cv>=0.01 ? T.amber : T.green;


  // ---- In-class neighbours, lap count, class pace (from the full-field rows) ----
  const field = race.redmistLive?.fullField || [];
  const classCars = field.filter(r => r.class && r.class === pos.class);
  const leaderLaps = liveLeaderLaps(race);
  const neighbour = cp => cp==null ? null : classCars.find(r => r.class_position === cp);
  const ahead = pos.class_position > 1 ? neighbour(pos.class_position - 1) : null;
  const behind = neighbour((pos.class_position ?? 0) + 1);
  // current_gap is Red Mist's InClassGap: time (or "N laps") to the next
  // car ahead in class. So the gap to the car ahead is OUR current_gap,
  // and the gap to the car behind is THEIR current_gap.
  // Gap is the headline; car number + team (and any Inactive/DNS badge)
  // go in the small line underneath.
  // Pace trend (same snapshot as the standings' Last Lap arrows): arrow
  // beside the gap, and a line under the car saying which way it's going.
  // Skipped while either car is in the pit / inactive — a catch estimate
  // means nothing then.
  const ls = state.liveSession;
  const trendKey = ls?.type === "Race" && !isCheckered() ? paceTrendKey(state.redmistEventId, ls.id, ls.name) : null;
  const ownStatus = liveCarStatus(pos, leaderLaps);
  const neighbourTile = (label, r, gap) => {
    if (!r) return tile(label, "—", label === "Car Ahead" && pos.class_position === 1 ? "Class leader" : null);
    const st = liveCarStatus(r, leaderLaps);
    const trend = (st || ownStatus) ? null
      : neighbourTrend(pos.car_number, r, gap, label === "Car Ahead" ? "ahead" : "behind", trendKey);
    const sub = `#${esc(r.car_number)}${r.team_name ? ` · ${esc(r.team_name)}` : ""}${st ? liveStatusBadge(st) : ""}${trend ? trend.line : ""}`;
    return tile(label, (gap ? esc(gap) : "—") + (trend ? trend.arrow : ""), sub);
  };

  // Class Pace = median last lap of class cars that are actually running
  // (not in the pit, not inactive), with laps over 115% of the class's
  // best current lap dropped so pit-in/out laps don't drag it. Median
  // rather than mean so one slow lap doesn't swing it. Sub-line compares
  // this car's last lap to it.
  const runningLaps = classCars
    .filter(r => r.in_pit !== true && !liveCarStatus(r, leaderLaps))
    .map(r => rmTimeToSeconds(r.last_lap_time)).filter(x => x != null);
  const bestRunning = runningLaps.length ? Math.min(...runningLaps) : null;
  const paceLaps = runningLaps.filter(x => x <= bestRunning * 1.15).sort((a,b)=>a-b);
  const classPace = paceLaps.length >= 3
    ? (paceLaps.length % 2 ? paceLaps[(paceLaps.length-1)/2] : (paceLaps[paceLaps.length/2-1] + paceLaps[paceLaps.length/2]) / 2)
    : null;
  const ourLast = rmTimeToSeconds(pos.last_lap_time);
  const paceDelta = (classPace!=null && ourLast!=null && ourLast <= bestRunning * 1.15) ? ourLast - classPace : null;
  const paceSub = paceDelta==null ? null
    : `<span style="color:${paceDelta<=0?T.green:T.red}">${paceDelta<=0?"−":"+"}${Math.abs(paceDelta).toFixed(3)}s</span> this car`;

  const stintLabel = stats ? `${stats.stint_lap_count} lap${stats.stint_lap_count===1?"":"s"}` : "—";

  return `
    <div class="results-header-block">
      <div class="summary-driver" style="margin-bottom:6px;">
        <span></span>
        <span class="fin-label" style="margin:0;">${liveIndicator(race, car.number).checkered ? `<span class="chk-flag" style="margin-right:4px;vertical-align:-1px;"></span> Final Timing` : `${icon("flag",12)} Live Timing`}</span>
      </div>
      <div class="results-carstat-grid live-carstat-grid">
        ${tile("In Seat", esc(pos.driver_name || "—"))}
        ${tile("Position", `P${pos.class_position ?? "—"}` + (gainedLabel ? ` <span style="font-size:13px;color:${gainedColor}">${gainedLabel}</span>` : ""))}
        ${tile("Current Stint", stintLabel)}

        ${tile("Current Lap", pos.last_lap_completed != null ? esc(String(pos.last_lap_completed)) : "—")}
        ${tile("Last Lap", esc(trimLapTime(pos.last_lap_time)))}
        ${tile("Average Lap", stats ? fmtLapSeconds(stats.avg_lap_seconds) : "—")}

        ${tile("Class Pace", classPace!=null ? fmtLapSeconds(classPace) : "—", paceSub)}
        ${neighbourTile("Car Ahead", ahead, pos.current_gap)}
        ${neighbourTile("Car Behind", behind, behind?.current_gap)}

        ${tile("Consistency", consistencyColor ? `<span style="color:${consistencyColor}">${consistencyLabel}</span>` : consistencyLabel)}
        ${tile("Last Pit", pos.last_lap_pitted!=null ? `Lap ${pos.last_lap_pitted}` : "—")}
        ${tile("Pit Time", pos.pit_duration_ms!=null ? `${(pos.pit_duration_ms/1000).toFixed(1)}s` : "—")}
      </div>
    </div>`;
}

function carPlanSection(cp, plan, archived){
  const car = cp.car, stints = cp.stints;
  // Resolved regardless of archived status now — live timing needs it for
  // a currently-open (non-archived) race too, not just the post-race
  // view, and readOnly below now depends on it too.
  const race = state.races.find(r=>r.id===state.currentRaceId);
  // archived = the race's real status, used for status DISPLAY (podium
  // colors, seat-time summary, collapsing). readOnly = whether editing
  // controls should render at all — true once archived, OR once a race
  // is linked to a live Red Mist event (see isRaceLiveAndLocked — RedMist
  // is the sole authority for the rest of that race's duration, regardless
  // of isEngineer and regardless of feed gaps), OR whenever the signed-in
  // person isn't an engineer (the driver/public read-only view).
  const readOnly = archived || isRaceLiveAndLocked(race) || !state.isEngineer;
  // Driver names and stint notes stay editable for engineers while the race
  // is live (the crew can change driver order mid-race); everything else
  // follows readOnly.
  const canEditDriver = !archived && state.isEngineer;
  const canEditNote = !archived && state.isEngineer;
  const shortNames = buildShortNames(car.drivers.filter(d=>d.trim()));
  const timelineAbbrev = buildTimelineAbbrev(car.drivers.filter(d=>d.trim()));
  const effectivePos = archived ? getEffectiveFinishPosition(car, race) : null;
  const carPodium = archived ? podiumColor(typeof effectivePos === "number" ? effectivePos : null) : null;
  const startPos = startPosFor(car);
  const hasDelta = archived && startPos!=null && typeof effectivePos === "number";
  const delta = hasDelta ? startPos - effectivePos : null;
  const deltaLabel = delta!=null ? (delta>0?`+${delta}`:`${delta}`) : null;
  const deltaColor = delta>0?T.green:(delta<0?T.red:T.textMuted);

  // "Currently on track" — see computeLiveStintIndex() for why this keys
  // off each stint's `finished` flag rather than just the scheduled
  // window. Re-synced periodically without a full re-render — see
  // updateLiveHighlights().
  const liveIdx = computeLiveStintIndex(stints, archived);

  // Live Red Mist Timing data for this car, if a WRL event is currently
  // live and subscribeRedmistLive() has picked it up for the open race
  // (see open-race handler). Deliberately independent of archived/planned
  // status — a race stays "planned" in this app right up until someone
  // archives it after the checkered flag, so this is what actually gates
  // whether the car is being timed live right now, not the race's own
  // status field.
  const hasLiveTiming = !!(race?.redmistLive?.byCarNumber?.[car.number]);
  const livePos = hasLiveTiming ? race.redmistLive.byCarNumber[car.number] : null;
  const liveInd = liveIndicator(race, car.number);

  // Collapsible tile: enabled on the archive/plan view for archived races,
  // and now also for a race with live timing data flowing — same
  // collapse/expand mechanic (state.expandedCarPlans) either way.
  const collapsible = archived || hasLiveTiming;
  const isCollapsed = collapsible && !state.expandedCarPlans.has(car.id);
  const headerAttrs = collapsible ? `data-act="toggle-car-plan" data-car="${car.id}" role="button" tabindex="0" style="cursor:pointer;"` : "";

  return `
    <div>
      <div class="car-detail car-detail-plan" style="margin-bottom:12px;border-color:${car.accent};" ${headerAttrs}>
        <div class="strip" style="background:var(--panelRaised);">
          ${carStripContent(car.number, car.team, car.accent)}
          <span class="num" style="border:2px solid ${carPodium||car.accent};color:${carPodium||T.text}">${esc(car.number)}</span>
        </div>
        <div style="padding:20px 16px 14px;display:flex;align-items:center;justify-content:space-between;">
          <div style="flex:1 1 auto;min-width:0;">
            <div class="font-display" style="font-weight:600;font-size:17px;">${esc(car.team)}</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);">${esc(car.manufacturer)} ${esc(car.model)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;white-space:nowrap;">
            ${hasLiveTiming ? `
              <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:${liveInd.wash};">
                ${liveInd.checkered
                  ? `<span class="chk-flag"></span>`
                  : `<span style="width:6px;height:6px;border-radius:999px;background:${liveInd.color};animation:livePulse 1.2s ease-in-out infinite;"></span>`}
                <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:0.05em;color:var(--text);">${liveInd.checkered ? `Finished P${livePos.class_position ?? "—"}` : liveInd.inPit ? `In Pit · P${livePos.class_position ?? "—"}` : `Currently P${livePos.class_position ?? "—"}`}</span>
              </span>
              ${(() => { const st = liveCarStatus(livePos, liveLeaderLaps(race)); return st && st.tone !== "pit" ? liveStatusBadge(liveInd.checkered && /^inactive/i.test(st.label) ? { label: "DNF", tone: "dnf" } : st) : ""; })()}
            ` : ""}
            ${(() => {
              // Positions-gained badge from Red Mist's own calc, once live
              // timing exists for this car — starting position used to be
              // shown alongside it here too, but that's redundant now
              // that the LIVE pill itself shows the current position
              // (removed on request). Pre-live races still fall back to
              // the manually-entered plan value from Setup, same as
              // before live data existed at all.
              if (!archived && hasLiveTiming){
                const cpg = livePos.class_positions_gained;
                const gained = (cpg==null || cpg===-999 || cpg===0) ? null : (cpg>0?`+${cpg}`:`${cpg}`);
                const gainedColor = cpg>0?T.green:(cpg<0?T.red:T.textMuted);
                return gained ? `<span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:${gainedColor}">${gained}</span>` : "";
              }
              return !archived && startPos!=null
                ? `<span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);">Start P${startPos}</span>`
                : "";
            })()}
            ${archived && effectivePos!=null ? `
              ${carPodium?icon("trophy",13,"color:"+carPodium):""}
              <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:${carPodium||T.text}">${effectivePos==='DNF' ? 'DNF' : effectivePos==='DNS' ? 'DNS' : 'Finish P'+effectivePos}</span>
              ${deltaLabel?`<span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:11px;color:${deltaColor}">${deltaLabel}</span>`:""}
            ` : ""}
            ${collapsible ? `<span class="ico" style="color:var(--textFaint);display:flex;">${icon(isCollapsed?"chevronDown":"chevronUp",16)}</span>` : ""}
          </div>
        </div>
      </div>

      ${isCollapsed ? "" : `
      <div class="car-plan-body fade-in">
      ${archived ? `<div class="arch-dash">${archiveCarHeaderBlock(car)}${racePaceBlock(cp)}<div class="arch-split">${raceSummaryBlock(cp)}${pitCycleBlock(car)}</div>${competitorPitTimesPanel(race, car.number)}</div>` : ""}
      ${hasLiveTiming ? liveTimingBlock(car) : ""}

      ${archived ? stintSectionOpen(car, stints, cp) : ""}
      <div class="timeline">
        ${stints.map((s,i)=>{
          if (s.removed || s.negligibleFinal) return "";
          const color = DRIVER_PALETTE[s.driverIndex % DRIVER_PALETTE.length];
          const [r,g,b] = hexToRgb(color);
          const isLive = i === liveIdx;
          // The live card gets extra proportional width on top of its
          // normal time-based share — "ON TRACK" is the widest label in
          // the whole row, and this is already the one card we want to
          // draw the eye to, so a bit more room does double duty.
          const grow = Math.max(s.lengthMin, 1) * (isLive ? 1.6 : 1);
          // Live state overrides the driver-tinted look with the same thin
          // red border + tinted wash used for warning entries in the Stint
          // Adjustments log, so "currently on track" reads as one
          // consistent visual language across the app.
          const liveStyle = isLive ? `border-color:${liveInd.color};background:${liveInd.wash};box-shadow:none;` : "";
          const tmContent = isLive
            ? `<span style="color:${liveInd.color};font-weight:600;">${liveInd.label}</span>`
            : (s.finished ? formatDuration(s.lengthMin) : formatTimeUltraCompact(s.start));
          const tmStyle = isLive ? `white-space:normal;overflow:visible;line-height:1.1;` : "";
          return `<div class="seg ${isLive?'seg-live':''} ${isLive && liveInd.inPit?'seg-pit':''} ${isLive && liveInd.checkered?'seg-checkered':''}" data-car="${car.id}" data-stint="${i}" data-color="${color}" data-start-iso="${s.start.toISOString()}" style="flex-grow:${grow};flex-basis:0;background:rgba(${r},${g},${b},0.14);border-top-color:${color};${liveStyle}">
            <span class="drv" title="${esc(s.driver||'TBD')}">${esc(timelineAbbrev[s.driver]||s.driver||"TBD")}<span class="${isLive?'live-dot':'dot'}" style="background:${isLive?liveInd.color:color};"></span></span>
            <span class="tm" style="${tmStyle}">${tmContent}</span>
          </div>`;
        }).join("")}
      </div>

      <div class="stint-table">
        <div class="head"><span>Driver</span><span style="padding-left:14px;">Start</span><span>End</span><span>Position</span><span></span></div>
        ${stints.map((s,i)=>{
          if (s.removed){
            let msg;
            if (cp.retiredAtStint != null && i > cp.retiredAtStint){
              msg = `Car retired after Stint ${cp.retiredAtStint+1}`;
            } else {
              let absorbedBy = null;
              for (let k=i-1;k>=0;k--){ if (!stints[k].removed){ absorbedBy = k; break; } }
              msg = `Removed — absorbed by Stint ${absorbedBy!=null ? absorbedBy+1 : "an earlier stint"}`;
            }
            return `
            <div class="row row-removed">
              <span class="stint-ghost-num">${i+1}</span>
              <span style="grid-column:1 / -1;font-style:italic;text-decoration:line-through;">${msg}</span>
            </div>`;
          }
          if (s.negligibleFinal){
            // Too small a sliver of time to schedule as its own stint —
            // noted instead (see cascadeStintsFrom). Real start/end times
            // are left exactly as computed; this is presentation only.
            return `
            <div class="row row-negligible-final">
              <span class="stint-ghost-num">${i+1}</span>
              <span style="grid-column:1 / -1;font-style:italic;color:var(--textFaint);display:flex;align-items:center;gap:6px;">
                <span>⛽</span>Only ${s.negligibleMinutes} min remains — not scheduled as its own stint. Worth flagging if fuel numbers are tight.
              </span>
            </div>`;
          }
          const posStyle = positionCellStyle(s.position, startPos);
          const validDrivers = car.drivers.filter(d=>d.trim());
          const dotColor = DRIVER_PALETTE[s.driverIndex % DRIVER_PALETTE.length];
          const noteKey = car.id+"__"+i;
          const isOpen = state.openStintNotes.has(noteKey);
          const flags = s.flags || [];
          const flagBadges = priorityFlagBadge(flags);
          const hasNoteContent = flags.length>0 || !!(s.notes && s.notes.trim());
          const isLiveRow = i === liveIdx;
          const isFinishedRow = !isLiveRow && s.finished;
          // Finished rows recede slightly and swap the driver dot for a
          // checkered flag, so "done" reads at a glance without touching
          // the horizontal timeline above.
          const dotEl = isFinishedRow
            ? `<span class="fin-flag">🏁</span>`
            : `<span class="dot" style="background:${dotColor};flex-shrink:0;"></span>`;

          const driverCell = !canEditDriver
            ? `<span class="driver-cell">${dotEl}<span style="font-size:13px;">${esc(shortNames[s.driver]||s.driver||"TBD")}</span></span>`
            : `<span class="driver-cell">
                ${dotEl}
                <select class="field stint-driver" data-act="edit-stint-driver" data-car="${car.id}" data-stint="${i}">
                  ${validDrivers.length===0 ? `<option value="">TBD</option>` : validDrivers.map(d=>`<option value="${esc(d)}" ${s.driver===d?"selected":""}>${esc(shortNames[d]||d)}</option>`).join("")}
                </select>
              </span>`;

          // Start time doubles as the entry point for shifting the boundary
          // with the previous stint — tapping it opens the stint panel where
          // the ±15 steppers live (the table column is far too narrow for
          // them inline).
          const startAdj = readOnly ? { canEarlier:false, canLater:false } : stintStartAdjustability(cp, i);
          const startAdjustable = startAdj.canEarlier || startAdj.canLater;
          const startCell = startAdjustable
            ? `<button class="stint-start-btn font-mono" data-act="open-stint-adjust" data-car="${car.id}" data-stint="${i}" title="Adjust start time">${formatTimeCompact(s.start)}</button>`
            : `<span class="font-mono" style="white-space:nowrap;font-size:11px;padding-left:14px;">${formatTimeCompact(s.start)}</span>`;

          // Stints finish automatically from live timing (driver changes / the
          // checkered) — no manual Finish control.
          const endCell = `<span class="font-mono" style="white-space:nowrap;font-size:11px;text-align:center;display:block;">${formatTimeCompact(s.end)}</span>`;

          const posCell = readOnly
            ? `<span class="font-mono stint-pos stint-pos-badge" style="background:${posStyle.bg};color:${posStyle.color};display:flex;align-items:center;justify-content:center;">${s.position ? esc(s.position) : "–"}</span>`
            : `<input type="text" class="field stint-pos stint-pos-edit font-mono" placeholder="P–" value="${esc(s.position ?? '')}" data-act="edit-stint-pos" data-car="${car.id}" data-stint="${i}" style="background:${posStyle.bg};color:${posStyle.color};" />`;

          const noteToggle = (canEditNote || hasNoteContent)
            ? `<button class="stint-note-toggle" data-act="toggle-stint-note" data-car="${car.id}" data-stint="${i}" title="${isOpen?'Hide note':(canEditNote?'Add a note':'View note')}">${flagBadges ? `<span class="flag-badge">${flagBadges}</span>` : icon(isOpen?"minus":(canEditNote?"plus":"clock"),13)}</button>`
            : `<span></span>`;

          return `
          <div class="row ${isLiveRow?'row-live':''} ${isLiveRow && liveInd.inPit?'row-pit':''} ${isLiveRow && liveInd.checkered?'row-checkered':''} ${isFinishedRow?'row-finished':''}" data-car="${car.id}" data-stint="${i}">
            <span class="stint-ghost-num">${i+1}</span>
            ${driverCell}
            ${startCell}
            ${endCell}
            ${posCell}
            ${noteToggle}
          </div>
          ${isOpen ? `
          <div class="note-row">
            ${!canEditNote ? `
              ${flags.length ? `<div class="flag-row">${flags.map(fk=>{ const f=FLAG_TYPES.find(x=>x.key===fk); if(!f) return ""; return `<span class="flag-btn active"><span class="em">${f.emoji}</span>${f.label}</span>`; }).join("")}</div>` : ""}
              ${s.notes && s.notes.trim() ? `<p style="margin:0;font-size:12.5px;color:var(--textMuted);">${esc(s.notes)}</p>` : (!flags.length ? `<p style="margin:0;font-size:12.5px;color:var(--textFaint);font-style:italic;">No notes for this stint.</p>` : "")}
            ` : `
              ${!readOnly && startAdjustable ? `
              <div class="start-adjust">
                <span class="start-adjust-label">${icon("clock",11)} Start Time</span>
                <div class="start-adjust-ctl">
                  <button data-act="adjust-stint-start" data-car="${car.id}" data-stint="${i}" data-delta="-${STINT_START_STEP}" ${startAdj.canEarlier?"":"disabled"}>−${STINT_START_STEP}</button>
                  <span class="start-adjust-val font-mono">${formatTimeCompact(s.start)}</span>
                  <button data-act="adjust-stint-start" data-car="${car.id}" data-stint="${i}" data-delta="${STINT_START_STEP}" ${startAdj.canLater?"":"disabled"}>+${STINT_START_STEP}</button>
                </div>
                <span class="start-adjust-hint">Moves the handover with Stint ${i} — that stint absorbs the change. Later stints are unaffected.</span>
              </div>` : ""}
              <textarea rows="2" placeholder="Note for this stint — incident, fuel-only stop, etc." data-act="edit-stint-note" data-car="${car.id}" data-stint="${i}">${esc(s.notes||"")}</textarea>
            `}
          </div>` : ""}
          ${(!s.removed && s.quietMinutes) ? `
          <div class="row row-quiet">
            <span class="qt-text" style="grid-column:1 / -1;">💤&nbsp; Quiet Time — ${formatDuration(s.quietMinutes)} (${formatTimeCompact(s.end)}–${formatTimeCompact(addMinutes(s.end, s.quietMinutes))})</span>
          </div>` : ""}`;
        }).join("")}
      </div>
      ${startPos==null ? `<p style="font-size:11px;color:var(--textFaint);margin:6px 2px 0;">Starting position fills in automatically from ${isSundayRace(race) ? "Saturday's fastest laps" : "qualifying results"} — the finish-position heatmap turns on once it's available.</p>` : ""}

      ${!readOnly ? `
      <div class="reserve-driver-block">
        ${state.addingReserve.has(car.id) ? `
          <div style="display:flex;gap:8px;align-items:center;margin-top:10px;">
            <input class="field" style="font-size:13px;" placeholder="Reserve driver name" value="${esc(state.reserveDraft[car.id]||'')}" data-act="update-reserve-draft" data-car="${car.id}" />
            <button class="btn-primary" style="padding:8px 14px;white-space:nowrap;" data-act="confirm-add-reserve" data-car="${car.id}">Add</button>
            <button style="background:none;border:none;color:var(--textFaint);display:flex;" data-act="cancel-add-reserve" data-car="${car.id}">${icon("x",15)}</button>
          </div>
        ` : `<button class="add-driver" style="color:${car.accent};margin-top:10px;" data-act="start-add-reserve" data-car="${car.id}">${icon("plus",14)} Add Reserve Driver</button>`}
      </div>` : ""}

      ${(cp.log && cp.log.length) ? `
      <div class="log-head">
        <span class="lbl">Stint Adjustments</span>
        ${!readOnly ? `<button class="log-clear" data-act="clear-stint-log" data-car="${car.id}">Clear</button>` : ""}
      </div>
      <div class="stint-log">
        ${cp.log.map(m=>{
          const refStint = (!isRetireLogEntry(m.text) && m.stintIdx!=null) ? stints[m.stintIdx] : null;
          const refFlags = (refStint && refStint.flags) ? refStint.flags : [];
