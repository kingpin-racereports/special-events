  return (stops || []).map(s => s.lap_number != null ? { ...s, recorded_lap: s.lap_number } : s);
}
// One car's lap rows -> { inLaps, cycleLaps }: the in-lap of each pit-
// flagged run, and every lap from an in-lap through its out-lap.
function rmPitCycles(carLaps){
  const flagged = new Set((carLaps || []).filter(l => l.is_pit_lap === true).map(l => l.lap_number));
  const inLaps = new Set(), cycleLaps = new Set();
  [...flagged].sort((a, b) => a - b).forEach(L => {
    if (flagged.has(L - 1)) { cycleLaps.add(L); return; }
    inLaps.add(L);
    cycleLaps.add(L);
    if (!flagged.has(L + 1)) cycleLaps.add(L + 1);
  });
  return { inLaps, cycleLaps };
}
// Lap rows with a penalty stop's in-lap no longer marked as a pit lap, so
// it doesn't split a stint or count as a pit cycle. Laps built from the
// unmodified rows still treat it as a non-race lap.
function rmLapRowsWithoutPenaltyPits(lapRows, allStops){
  const pen = new Set((allStops || []).filter(rmIsPenaltyStop).map(s => `${s.car_number}|${s.lap_number}`));
  if (!pen.size) return lapRows;
  return lapRows.map(l => l.is_pit_lap === true && pen.has(`${l.car_number}|${l.lap_number}`) ? { ...l, is_pit_lap: false } : l);
}

// Fastest single lap of the race, any class — from each car's best lap.
function rmFastestLap(classification){
  let best = null;
  classification.forEach(c => {
    const t = rmTimeToSeconds(c.bestTime);
    if (!t || c.status === "DNS") return;
    if (!best || t < best.seconds) best = { num: c.startNumber, name: c.name, cls: c.resultClass, seconds: t, lap: c.bestLap || null };
  });
  return best;
}

// Fastest GTO pit stops by Red Mist's pit duration, split by whether the
// driver changed. Stops overlapping a red flag are excluded — the pit
// clock keeps running while the field is stopped.
function rmFastestStops(classification, pitStops, lapRows, redPeriods){
  const clsByNum = Object.fromEntries(classification.map(c => [c.startNumber, c]));
  const lapTime = {};
  lapRows.forEach(l => { lapTime[`${l.car_number}|${l.lap_number}`] = new Date(l.captured_at).getTime(); });
  const inRed = (num, lap) => {
    const t = lapTime[`${num}|${lap}`];
    return t != null && redPeriods.some(p => t >= p.start - 600000 && t <= (p.end || p.start) + 600000);
  };
  let plain = null, dc = null;
  pitStops.forEach(s => {
    const c = clsByNum[s.car_number];
    if (!c || c.resultClass !== "GTO") return;
    const ms = Number(s.pit_duration_ms);
    if (!ms || ms < RM_MIN_PIT_MS || inRed(s.car_number, s.lap_number)) return;
    const rec = { num: c.startNumber, name: c.name, seconds: ms / 1000, lap: s.lap_number, driverIn: s.driver_in || null, driverOut: s.driver_out || null };
    if (s.driver_change){ if (!dc || rec.seconds < dc.seconds) dc = rec; }
    else if (!plain || rec.seconds < plain.seconds) plain = rec;
  });
  return { plain, dc };
}

// Total time in the pits per GTO finisher (DNF / DNS cars left out — a
// retirement's long garage stay isn't a pit-work comparison). Stops that
// overlap a red flag are left out of the total: the pit clock keeps
// running while the field is stopped.
function rmPitTimes(classification, pitStops, lapRows, redPeriods){
  const lapTime = {};
  lapRows.forEach(l => { lapTime[`${l.car_number}|${l.lap_number}`] = new Date(l.captured_at).getTime(); });
  const inRed = (num, lap) => {
    const t = lapTime[`${num}|${lap}`];
    return t != null && redPeriods.some(p => t >= p.start - 600000 && t <= (p.end || p.start) + 600000);
  };
  return classification
    .filter(c => c.resultClass === "GTO" && c.status === "Normal")
    .map(c => {
      const stops = pitStops.filter(s => s.car_number === c.startNumber);
      const totalMs = stops.reduce((a, s) => a + (!inRed(s.car_number, s.lap_number) && Number(s.pit_duration_ms) > 0 ? Number(s.pit_duration_ms) : 0), 0);
      return { num: c.startNumber, name: c.name, stops: stops.length, driverChanges: stops.filter(s => s.driver_change).length, seconds: totalMs / 1000 };
    })
    .sort((a, b) => a.seconds - b.seconds);
}

// Driver in the car for each lap. Uses the driver recorded on the lap row
// when there is one; otherwise rebuilds it from the pit-stop log (driver
// out before each driver change, driver in after it).
// A car's real service stops (no penalties, no sub-15s timing noise), in
// lap order. These are the only places a stint can end or a driver change.
function rmCarStops(carNumber, pitStops){
  return (pitStops || []).filter(st => st.car_number === carNumber && !rmIsPenaltyStop(st)
      && (Number(st.pit_duration_ms) >= RM_MIN_PIT_MS || st.driver_change === true))
    .sort((a, b) => a.lap_number - b.lap_number);
}

// Driver for each lap. Red Mist's per-lap driver name lags or sticks at
// real swaps, so the driver can only change at a stop: laps are split at
// the car's stops, and each stint gets one driver — the stop's incoming
// driver when the stop records a change, otherwise whoever Red Mist named
// for most of that stint's laps. Name flicker within a car (same surname,
// different first name) resolves to the last name Red Mist reported.
function rmDriverForLaps(carNumber, laps, lapRows, pitStops, finalDriver){
  const recorded = {};
  lapRows.forEach(l => {
    if (l.car_number !== carNumber || !l.driver_name) return;
    recorded[l.lap_number] = l.driver_name;
  });
  // Fold a variant spelling (a bare "Sharinn", or a stop row's surname-only
  // name) into the one full name it matches. Was keyed on surname alone,
  // which folded Marc Sharinn into Tyler Sharinn on #81. Ambiguous names
  // (a bare surname two drivers share) are left as they are.
  const fullNames = [...new Set(Object.values(recorded))];
  const canon = n => {
    if (!n) return null;
    if (fullNames.includes(n)) return n;
    const hits = fullNames.filter(f => sameDriverName(f, n));
    return hits.length === 1 ? hits[0] : n;
  };

  const stops = rmCarStops(carNumber, pitStops);
  const segOf = lap => stops.filter(st => st.lap_number < lap).length;
  const segLaps = Array.from({ length: stops.length + 1 }, () => []);
  laps.forEach(l => segLaps[segOf(l.lap)].push(l.lap));

  const segDriver = [];
  segLaps.forEach((ls, k) => {
    const before = k > 0 ? stops[k - 1] : null;
    let d = null;
    if (before && before.driver_change === true && before.driver_in) d = canon(before.driver_in);
    if (!d){
      const count = {};
      ls.forEach(L => { const n = canon(recorded[L]); if (n) count[n] = (count[n] || 0) + 1; });
      const top = Object.entries(count).sort((a, b) => b[1] - a[1])[0];
      if (top) d = top[0];
    }
    if (!d && before?.driver_in) d = canon(before.driver_in);
    if (!d && k === 0 && stops[0]?.driver_out) d = canon(stops[0].driver_out);
    if (!d) d = segDriver[k - 1] || canon(finalDriver) || null;
    segDriver.push(d);
  });
  return laps.map(l => segDriver[segOf(l.lap)]);
}

// Track-condition factor for one class: at any moment, the median of every
// class car's green lap over its own normal lap within FACTOR_WINDOW_MIN
// either side (1.06 = the field is lapping 6% slower, e.g. a wet track).
// Hardship "x" entries are left out.
function rmConditionFactor(classCars, lapsByPos){
  const pts = [];
  classCars.filter(c => !/x$/i.test(String(c.startNumber))).forEach(c => {
    const g = (lapsByPos.get(c.position) || []).filter(l => !l.inPit && l.status === "GREEN" && l.lapTime && l.timeOfDay);
    const med = debriefMedian(g.map(l => l.lapTime));
    if (!med) return;
    g.forEach(l => { const r = l.lapTime / med; if (r < 1 + DEBRIEF.CHART_CAUTION_PCT) pts.push({ ts: l.timeOfDay, r }); });
  });
  pts.sort((a, b) => a.ts - b.ts);
  const W = DEBRIEF.FACTOR_WINDOW_MIN * 60000;
  return ts => {
    if (!ts || pts.length < 20) return 1;
    let lo = 0, hi = pts.length;
    while (lo < hi){ const m = (lo + hi) >> 1; if (pts[m].ts < ts - W) lo = m + 1; else hi = m; }
    const win = [];
    for (let k = lo; k < pts.length && pts[k].ts <= ts + W; k++) win.push(pts[k].r);
    return win.length >= 8 ? debriefMedian(win) : 1;
  };
}

// Per-driver lap-time standard deviation for this team's cars, over clean
// green-flag laps (no pit / out / caution laps, nothing over 110% of that
// driver's median). Each lap is first adjusted for track conditions (lap ÷
// the class's condition factor at that moment), so a slowdown the whole
// class saw — rain, heat, oil down — isn't counted against the driver.
// Anything left after that is the driver's own, so a fade the field didn't
// share does count as inconsistency.
function rmDriverConsistency(ourNumbers, classification, lapsByPos, lapRows, pitStops, resultRows){
  const out = {};
  const factorByClass = {};
  const factorFor = cls => (factorByClass[cls] ||= rmConditionFactor(classification.filter(x => x.resultClass === cls), lapsByPos));
  const finalDriver = Object.fromEntries(resultRows.map(r => [String(r.car_number), r.driver_name]));
  classification.filter(c => ourNumbers.has(c.startNumber)).forEach(c => {
    const laps = lapsByPos.get(c.position) || [];
    const drivers = rmDriverForLaps(c.startNumber, laps, lapRows, pitStops, finalDriver[c.startNumber]);
    const factor = factorFor(c.resultClass);
    const byDriver = {};
    laps.forEach((l, i) => {
      const d = drivers[i]; if (!d) return;
      const g = (byDriver[d] ||= { driver: d, laps: 0, times: [], ranges: [], seconds: 0 });
      g.laps++;
      g.seconds += l.lapTime || 0;
      // Contiguous lap ranges this driver was in the car, e.g. [[1,50],[90,120]].
      const last = g.ranges[g.ranges.length - 1];
      if (last && l.lap === last[1] + 1) last[1] = l.lap; else g.ranges.push([l.lap, l.lap]);
      if (!l.inPit && l.status === "GREEN" && l.lapTime) g.times.push(l.lapTime / (factor(l.timeOfDay) || 1));
    });
    out[c.startNumber] = Object.values(byDriver).map(g => {
      const med = debriefMedian(g.times);
      const clean = med ? g.times.filter(t => t <= med * 1.10) : []; // traffic, off, incident, out-lap
      const avg = clean.length ? clean.reduce((a, b) => a + b, 0) / clean.length : null;
      const stdev = clean.length >= 3 ? Math.sqrt(clean.reduce((a, x) => a + (x - avg) ** 2, 0) / (clean.length - 1)) : null;
      return { driver: g.driver, laps: g.laps, cleanLaps: clean.length, avg, stdev, ranges: g.ranges, seconds: g.seconds, adj: 4 }; // adj: summary version (4 = no rolling-median detrend)
    });
  });
  return out;
}

// ===========================================================================
// SATURDAY DEBRIEF -> SUNDAY PLAN
// ===========================================================================
// Runs once, when an engineer duplicates a race that has Red Mist results.
// Reads the source race's laps and pit stops and bakes into the duplicated
// Setup: per-driver stint lengths (shortened only where pace clearly fades
// before the planned length) and driver rotation (so each car's strongest
// closer runs the final stint). A class rival summary is shown alongside.
// Everything stays editable on Setup, and each applied change is written to
// the stint log when the plan is created. Never runs during a live race and
// never touches driver assignments after the plan exists.
const DEBRIEF = {
  DISRUPT_PCT: 0.025,  // clean green lap this far over the driver's median = disrupted (traffic, off, etc.)
  FADE_PCT: 0.01,      // pooled pace loss vs. a stint's opening pace that counts as fade
  EARLY_MIN: 25,       // opening window that sets each stint's reference pace
  BIN_MIN: 10,         // fade is checked in slices of this many minutes after the opening window
  MIN_BIN_LAPS: 4,
  HIGH_CONF_LAPS: 40,
  MED_CONF_LAPS: 20,
  FULL_STINT_MIN: 20,  // stints shorter than this (splash, final sliver) are left out of stint-length averages
  FACTOR_WINDOW_MIN: 5, // track-condition factor looks this many minutes either side of a lap
  CHART_BIN_MIN: 5,    // pace chart point spacing
  CHART_SMOOTH_MIN: 10, // each chart point = median lap within this many minutes either side
  CHART_OUTLIER_PCT: 0.07, // laps this far off a car's own pace are left out of the chart
  CHART_CAUTION_PCT: 0.25,
  BAR_RED_GAP: 2.0,    // driver bar: s/lap behind the field line that reads full red (at/ahead of it = green) // no flag data: most of the field this far off pace = caution
  TRAFFIC_PCT: 0.015,  // lap this far over the stint's typical field-relative lap = traffic lap
  FIELD_WINDOW_MIN: 5, // field pace at a moment = other class cars' laps this many minutes either side
  WARM_LAPS: 5,        // laps after a stop compared with the rest of that stint (tyres, new driver settling in)
  RARE_CHANGE_PCT: 0.3, // a driver change in a pit cycle this few of the class also made reads as unusual
  INOUT_SIGNIFICANT_S: 10, // in-lap + out-lap loss vs. the cycle's fuel-only cars shown only at/over this
};

function debriefMedian(xs){
  if (!xs.length) return null;
  const s = [...xs].sort((a, b) => a - b), m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function debriefMean(xs){ return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }

// One car's race split into stints: a new stint starts on a driver change
// or on the lap after any pit lap (same-driver fuel stops split too).
function debriefCarStints(car, lapsByPos, lapRows, pitStops, finalDriver){
  const laps = lapsByPos.get(car.position) || [];
  const drivers = rmDriverForLaps(car.startNumber, laps, lapRows, pitStops, finalDriver[car.startNumber]);
  // In-laps: each stop's lap_number, plus the first lap of any pit-flagged
  // run with no stop row (rmPitCycles).
  const pitLaps = new Set(rmPitCycles(lapRows.filter(l => l.car_number === car.startNumber)).inLaps);
  pitStops.forEach(s => { if (s.car_number === car.startNumber) pitLaps.add(s.lap_number); });
  // Stint boundaries: the car's real stops only, each ending on its in-lap.
  const stops = rmCarStops(car.startNumber, pitStops);
  const endLaps = new Set(stops.length ? stops.map(s => s.lap_number) : [...pitLaps]);

  const stints = [];
  let cur = null;
  laps.forEach((l, i) => {
    const d = drivers[i] || null;
    if (!cur || d !== cur.driver || endLaps.has(l.lap - 1)){
      cur = { driver: d, laps: [], minutes: 0 };
      stints.push(cur);
    }
    // A pit lap from either source (lap flag or the pit stop table) and the
    // out-lap after it never count as race laps.
    const pit = l.inPit || pitLaps.has(l.lap) || pitLaps.has(l.lap - 1);
    cur.laps.push({ lap: l.lap, t: l.lapTime, ts: l.timeOfDay || null, min: cur.minutes, pit, caution: l.status === "YELLOW", clean: !pit && l.status === "GREEN" && !!l.lapTime });
    cur.minutes += (l.lapTime || 0) / 60;
  });
  return stints.filter(s => s.driver && s.laps.length);
}

// Pace profile for one driver from their stints in one car.
// Traffic laps in a run of laps. Each non-pit lap is measured against the
// class field at that moment (lap − field median), which takes out
// cautions, conditions and anything everyone ran. A lap more than
// TRAFFIC_PCT over the run's typical field-relative lap was held up —
// traffic, a mistake, an incident — and the excess is time lost to it.
// Typical laps (the median) are untouched, so a uniformly slow driver
// shows up as pace, not traffic.
// Green racing laps only: the opening lap (rolling start) and any lap that
// ran into a caution or red flag are compared against a field window that
// straddles different conditions, so they'd read as time lost when the
// whole field was slow.
function debriefTraffic(laps, typical){
  const pts = laps.filter(l => l.f && !l.flagged && l.lap > 1).map(l => ({ lap: l.lap, v: l.t - l.f.median }));
  if (pts.length < 5 || !typical) return null;
  const b = debriefMedian(pts.map(p => p.v)), thresh = typical * DEBRIEF.TRAFFIC_PCT;
  const slow = pts.filter(p => p.v - b > thresh);
  return { n: pts.length, typical: b, laps: slow.length, lapList: slow.map(p => p.lap), loss: slow.reduce((a, p) => a + (p.v - b), 0) };
}

function debriefDriverProfile(stints){
  const A = l => l.adj ?? l.t; // condition-adjusted lap (raw if no field factor)
  const cleanLaps = stints.flatMap(s => s.laps.filter(l => l.clean));
  if (!cleanLaps.length) return null;
  const base = debriefMedian(cleanLaps.map(l => l.t));       // actual clean lap, for display
  const adjBase = debriefMedian(cleanLaps.map(A));           // typical condition-adjusted lap
  // Smooth-lap threshold for the fade bar and consistency keys off the
  // driver's quicker laps (25th pct), not the median — a late-stint fade
  // drags the median up and would otherwise let slow laps pass as normal.
  const sortedAdj = cleanLaps.map(A).sort((a, b) => a - b);
  const p25 = sortedAdj[Math.floor(sortedAdj.length * 0.25)];
  const smoothMax = p25 * (1 + DEBRIEF.DISRUPT_PCT);
  // Race pace: every lap except pit laps (traffic and cautions included),
  // each against the class field's average lap at the same moment.
  // Seconds per lap; negative = quicker than the field.
  const vsField = stints.flatMap(s => s.laps).filter(l => l.f);
  const raceDelta = vsField.length >= 5 ? debriefMean(vsField.map(l => l.t - l.f.mean)) : null;

  // Lap ranges driven, back-to-back stints merged: "1–34, 95–130".
  const ranges = [];
  stints.forEach(s => {
    const a = s.laps[0].lap, b = s.laps[s.laps.length - 1].lap, prev = ranges[ranges.length - 1];
    if (prev && a === prev[1] + 1) prev[1] = b; else ranges.push([a, b]);
  });
  const lapRanges = ranges.map(([a, b]) => a === b ? `${a}` : `${a}–${b}`).join(", ");

  // Pace through the stint: each smooth lap as % over its own stint's
  // opening pace, pooled across stints and sliced by stint minute.
  const pts = [];
  let earlyLaps = 0;
  stints.forEach(s => {
    const smooth = s.laps.filter(l => l.clean && A(l) <= smoothMax);
    const early = smooth.filter(l => l.min < DEBRIEF.EARLY_MIN).map(A);
    if (early.length < 3) return;
    earlyLaps += early.length;
    const ref = debriefMedian(early);
    smooth.forEach(l => { if (l.min >= DEBRIEF.EARLY_MIN) pts.push({ min: l.min, pct: A(l) / ref - 1 }); });
  });
  const longestMin = Math.max(...stints.map(s => s.minutes));
  const bins = [{ from: 0, to: DEBRIEF.EARLY_MIN, ref: true, laps: earlyLaps, pct: earlyLaps ? 0 : null }];
  for (let b = DEBRIEF.EARLY_MIN; b < longestMin; b += DEBRIEF.BIN_MIN){
    const inBin = pts.filter(p => p.min >= b && p.min < b + DEBRIEF.BIN_MIN).map(p => p.pct);
    bins.push({ from: b, to: Math.min(b + DEBRIEF.BIN_MIN, longestMin), laps: inBin.length, pct: inBin.length >= DEBRIEF.MIN_BIN_LAPS ? debriefMedian(inBin) : null });
  }

  // Fade: first slice at/over FADE_PCT that the next slice doesn't walk back.
  let fadeMin = null, fadePct = null;
  for (let k = 1; k < bins.length; k++){
    const p = bins[k].pct;
    if (p == null || p < DEBRIEF.FADE_PCT) continue;
    const next = bins[k + 1] ? bins[k + 1].pct : null;
    if (next == null || next >= DEBRIEF.FADE_PCT * 0.75){ fadeMin = bins[k].from; fadePct = p; break; }
  }
  // How far into a stint pace is confirmed held (enough laps, under FADE_PCT).
  let heldThrough = earlyLaps ? DEBRIEF.EARLY_MIN : 0;
  for (let k = 1; k < bins.length; k++){
    if (fadeMin != null && bins[k].from >= fadeMin) break;
    if (bins[k].pct != null && bins[k].pct < DEBRIEF.FADE_PCT) heldThrough = bins[k].to;
  }

  // Consistency over smooth laps before any drop-off, so a fade doesn't
  // read as inconsistency — the bar already shows the fade.
  const consistent = cleanLaps.filter(l => A(l) <= smoothMax && (fadeMin == null || l.min < fadeMin)).map(A);
  const avg = debriefMean(consistent);
  const stdev = consistent.length >= 3 ? Math.sqrt(consistent.reduce((a, x) => a + (x - avg) ** 2, 0) / (consistent.length - 1)) : null;

  const fullStints = stints.filter(s => s.minutes >= DEBRIEF.FULL_STINT_MIN).length;
  const confidence = fullStints >= 2 && cleanLaps.length >= DEBRIEF.HIGH_CONF_LAPS ? "high"
    : cleanLaps.length >= DEBRIEF.MED_CONF_LAPS ? "medium" : "low";
  return {
    base, adjBase, stdev, fadeMin, fadePct, heldThrough, longestMin, bins,
    confidence, stints: stints.length, fullStints, cleanLaps: cleanLaps.length,
    raceDelta, lapRanges,
  };
}

function debriefProfilesFor(stints){
  const byDriver = {};
  stints.forEach(s => (byDriver[s.driver] ||= []).push(s));
  const out = {};
  Object.entries(byDriver).forEach(([d, ss]) => { const p = debriefDriverProfile(ss); if (p) out[d] = p; });
  return out;
}

// Plan names are often surname-only while Red Mist has full names.
function debriefMatchDriver(planName, profiles){
  const n = String(planName || "").trim();
  if (!n) return null;
  const hit = findDriverMatch(n, Object.keys(profiles));
  return hit ? { name: hit, profile: profiles[hit] } : null;
}

// Mirrors createRacePlan()'s stint loop (including quiet time) so rotation
// choices land the same way the real plan will.
function debriefStintSequence(modes, totalMinutes, startDateTime, track){
  const quiet = quietWindowFor(track, startDateTime);
  const seq = [];
  let driven = 0, di = 0, cursor = new Date(startDateTime), quietApplied = false;
  while (driven < totalMinutes && seq.length < 500){
    if (quiet && !quietApplied && +cursor >= +quiet.start){ cursor = new Date(quiet.end); quietApplied = true; continue; }
    let segLen = Math.min(Number(modes[di % modes.length] || 60), totalMinutes - driven);
    let end = addMinutes(cursor, segLen);
    if (quiet && !quietApplied && +end > +quiet.start){
      segLen = Math.round((+quiet.start - +cursor) / 60000);
      end = new Date(quiet.start);
    }
    if (segLen <= 0) break;
    seq.push({ idx: di % modes.length, len: segLen });
    driven += segLen; di += 1; cursor = end;
  }
  return seq;
}
// The stint that actually closes the race — a final sliver too short to
// hand a driver doesn't count.
function debriefClosingStint(seq){
  for (let k = seq.length - 1; k >= 0; k--) if (seq[k].len >= finalStintNegligibleThresholdMin()) return k;
  return seq.length ? seq.length - 1 : null;
}

function setupPlanContext(){
  const track = state.track === "Other" ? state.customTrack.trim() : state.track;
  const [hh, mm] = String(state.startTime || "10:00").split(":").map(Number);
  const startDateTime = new Date(state.eventDate || Date.now());
  startDateTime.setHours(hh || 0, mm || 0, 0, 0);
  return { track, startDateTime, totalMinutes: Number(state.durationHours) * 60 };
}

// Rotates the car's driver order (sequence preserved, only the starter
// changes) so `closer` runs the closing stint. Returns true if placed.
function rotateCarForCloser(car, closer, ctx){
  const valid = car.drivers.map((d, i) => ({ d, mode: stintModeOf(car, i) })).filter(o => o.d.trim());
  const n = valid.length;
  if (n < 2 || !(ctx.totalMinutes > 0)) return false;
  for (let r = 0; r < n; r++){
    const rot = valid.slice(r).concat(valid.slice(0, r));
    const seq = debriefStintSequence(rot.map(o => o.mode), ctx.totalMinutes, ctx.startDateTime, ctx.track);
    const k = debriefClosingStint(seq);
    if (k == null || rot[seq[k].idx].d !== closer) continue;
    if (r > 0){
      car.drivers = rot.map(o => o.d);
      car.driverStintMode = rot.map(o => o.mode);
    }
    return true;
  }
  return false;
}

function debriefOrderNote(closer){
  return { driver: closer, kind: "order", text: `${closer} set to run the final stint, from Saturday closing pace` };
}

// Called per car from createRacePlan(). Race date and duration are usually
// changed on Setup after duplicating (Sunday is shorter, quiet time is
// Sunday-only), so the closer rotation is re-checked against the final
// values — unless the engineer has edited this car's drivers, in which
// case their order stands. Returns the notes still true for this car.
function finalizeDebriefForCar(car, ctx){
  const db = car.debrief;
  if (!db) return [];
  const notes = db.notes.filter(n => n.kind === "len"
    && stintModeOf(car, car.drivers.indexOf(n.driver)) === n.suggested);
  if (db.closer && !db.orderTouched && rotateCarForCloser(car, db.closer, ctx)) notes.push(debriefOrderNote(db.closer));
  return notes;
}

// Track-condition factor over time for one class: at any moment, how the
// field is lapping relative to each car's own typical clean lap (1.00 =
// normal, 1.02 = everyone 2% slower — heat, cooling, rubber, dusk). Dividing
// a lap by it puts every stint on the same footing, so a driver isn't
// credited or blamed for the conditions their stint happened to run in.
function debriefTrackFactor(stintsByCar){
  const pts = [];
  stintsByCar.forEach(stints => {
    const laps = stints.flatMap(s => s.laps).filter(l => l.clean && l.ts);
    const med = debriefMedian(laps.map(l => l.t));
    if (!med) return;
    laps.forEach(l => { const r = l.t / med; if (r < 1 + 4 * DEBRIEF.DISRUPT_PCT) pts.push({ ts: l.ts, r }); });
  });
  pts.sort((a, b) => a.ts - b.ts);
  const W = DEBRIEF.FACTOR_WINDOW_MIN * 60000;
  return ts => {
    if (!ts || pts.length < 20) return 1;
    let lo = 0, hi = pts.length;
    while (lo < hi){ const m = (lo + hi) >> 1; if (pts[m].ts < ts - W) lo = m + 1; else hi = m; }
    const win = [];
    for (let k = lo; k < pts.length && pts[k].ts <= ts + W; k++) win.push(pts[k].r);
    return win.length >= 8 ? debriefMedian(win) : 1;
  };
}

// Time lost settling in after each stop: the first WARM_LAPS green laps of
// a stint vs. the rest of the same stint, both against the class field
// at the time. Measured against the stint's own settled pace, so it's the
// cost of the stop (cold tyres, a new driver getting up to speed), not
// how quick the driver is. change = the stint began with a driver change.
function debriefWarmups(stints){
  const out = [];
  stints.forEach((s, i) => {
    if (!i) return;
    const d = s.laps.filter(l => l.f && !l.pit && !l.flagged && l.t).map(l => l.t - l.f.mean);
    if (d.length < DEBRIEF.WARM_LAPS + 5) return;
    out.push({
      change: s.driver !== stints[i - 1].driver,
      cost: debriefMean(d.slice(0, DEBRIEF.WARM_LAPS)) - debriefMedian(d.slice(DEBRIEF.WARM_LAPS)),
    });
  });
  return out;
}

function debriefStintReport(stints, field, num, stops, stopRef, stopTime){
  const typ = field.typical[num];
  if (!typ) return [];
  return stints.map((s, i) => {
    const laps = s.laps.filter(l => l.f); // every non-pit lap
    const tr = debriefTraffic(laps, typ);
    // Time lost to the class field during this stint:
    //  pace    — our typical lap vs. the field's at the same moments, every lap
    //  traffic — held-up laps' excess over that typical lap (debriefTraffic)
    //  pit     — Red Mist duration of the stop that ended this stint vs. the
    //            class median for that kind of stop (any flag, so caution
    //            stops count too)
    const pace = tr ? tr.n * tr.typical : null;
    const traffic = tr ? tr.loss : null;
    const lapSet = new Set(s.laps.map(l => l.lap));
    const stop = i < stints.length - 1 ? (stops || []).find(st => lapSet.has(st.lap_number)) : null;
    const ref = stop && stopRef ? (stop.driver_change ? stopRef.change : stopRef.service) : null;
    const st = stop ? (stopTime ? stopTime(stop) : { sec: Number(stop.pit_duration_ms) / 1000, repair: false }) : null;
    const pit = st && ref != null ? st.sec - ref : null;
    const first = s.laps[0], last = s.laps[s.laps.length - 1];
    // Only losses add up: a quick driver doesn't hide a slow stop, and a
    // quick stop doesn't hide slow pace.
    const total = Math.max(0, pace || 0) + Math.max(0, traffic || 0) + Math.max(0, pit || 0);
    return {
      num: i + 1, driver: s.driver, firstLap: first.lap, lastLap: last.lap,
      stopSec: st ? st.sec : null, stopRepair: !!st?.repair, stopRef: ref, hasStop: !!stop,
      start: first.ts ? first.ts - (first.t || 0) * 1000 : null, end: last.ts || null,
      pace, paceLaps: tr ? tr.n : 0, traffic, trafficLaps: tr ? tr.laps : null, trafficLapList: tr ? tr.lapList : [], pit, total,
      delta: laps.length ? debriefMean(laps.map(l => l.t - l.f.mean)) : null, // race pace this stint, s/lap vs. field
    };
  });
}

// Class positions gained/lost per stint, on track vs. through the stop
// that ended it, from lap crossing times (class order at any moment = most
// laps completed, then earliest to complete it).
function debriefBattle(carNum, cls, stints, classification, lapRows, pitStops){
  const cross = {}, pits = {};
  lapRows.forEach(l => {
    (cross[l.car_number] ||= {})[l.lap_number] = new Date(l.captured_at).getTime();
    if (l.is_pit_lap === true) (pits[l.car_number] ||= new Set()).add(l.lap_number);
  });
  pitStops.forEach(s => (pits[s.car_number] ||= new Set()).add(s.lap_number));
  const classCars = classification.filter(c => c.resultClass === cls && cross[c.startNumber]);
  const sorted = {};
  classCars.forEach(c => { sorted[c.startNumber] = Object.values(cross[c.startNumber]).sort((a, b) => a - b); });
  const posAt = t => classCars.map(c => {
    const arr = sorted[c.startNumber];
    let lo = 0, hi = arr.length;
    while (lo < hi){ const m = (lo + hi) >> 1; if (arr[m] <= t) lo = m + 1; else hi = m; }
    return { num: c.startNumber, laps: lo, last: lo ? arr[lo - 1] : Infinity };
  }).sort((a, b) => b.laps - a.laps || a.last - b.last).findIndex(r => r.num === carNum) + 1;

  const me = cross[carNum] || {}, myPits = pits[carNum] || new Set();
  const windows = stints.map(s => {
    const laps = s.laps.map(l => l.lap);
    const onTrack = laps.filter(L => !myPits.has(L));
    return onTrack.length >= 2 ? { Ls: onTrack[0], Le: onTrack[onTrack.length - 1], pitLap: laps.find(L => myPits.has(L)) ?? null } : null;
  });
  return stints.map((s, i) => {
    const w = windows[i];
    if (!w || me[w.Ls] == null || me[w.Le] == null) return null;
    const next = windows[i + 1];
    return {
      trackDelta: posAt(me[w.Ls]) - posAt(me[w.Le]), // + = places gained
      pitDelta: w.pitLap != null && next && me[next.Ls] != null ? posAt(me[w.Le]) - posAt(me[next.Ls]) : null,
    };
  });
}

// Field model for one class: what the class field was lapping at any
// moment (mean, median, spread of every other class car's green laps within
// FIELD_WINDOW_MIN either side), each car's typical lap, and the class
// median cost of a pit stop. Race pace and stint losses are all measured
// against this, so they compare a driver to the cars actually on track.
function debriefStopCost(stint, next, typical){
  if (!next || !typical) return null;
  const inLap = stint.laps[stint.laps.length - 1], outLap = next.laps[0];
  if (!inLap?.pit || !inLap.t || !outLap?.t || inLap.caution || outLap.caution) return null;
  return inLap.t + outLap.t - 2 * typical;
}
function debriefFieldModel(stintsByNum){
  const pts = [], typical = {};
  Object.entries(stintsByNum).forEach(([num, stints]) => {
    const laps = stints.flatMap(s => s.laps).filter(l => l.clean && l.ts);
    const med = debriefMedian(laps.map(l => l.t));
    typical[num] = med;
  });
  Object.entries(stintsByNum).forEach(([num, stints]) => stints.forEach(s => s.laps.forEach(l => {
    if (!l.pit && l.t && l.ts) pts.push({ ts: l.ts, t: l.t, num });
  })));
  pts.sort((a, b) => a.ts - b.ts);
  const W = DEBRIEF.FIELD_WINDOW_MIN * 60000;
  const at = (ts, excludeNum) => {
    if (!ts) return null;
    let lo = 0, hi = pts.length;
    while (lo < hi){ const m = (lo + hi) >> 1; if (pts[m].ts < ts - W) lo = m + 1; else hi = m; }
    const win = [];
    for (let k = lo; k < pts.length && pts[k].ts <= ts + W; k++) if (pts[k].num !== excludeNum) win.push(pts[k].t);
    if (win.length < 8) return null;
    const mean = debriefMean(win);
    const sd = Math.sqrt(win.reduce((a, x) => a + (x - mean) ** 2, 0) / (win.length - 1));
    return sd > 0 ? { mean, median: debriefMedian(win), sd } : null;
  };
  const costs = [];
  Object.entries(stintsByNum).forEach(([num, stints]) => stints.forEach((s, i) => {
    const c = debriefStopCost(s, stints[i + 1], typical[num]);
    if (c != null && c > 0) costs.push(c);
  }));
  return { at, typical, stopMedian: debriefMedian(costs) };
}

// Race pace through the race for one class, a point every CHART_BIN_MIN.
// Each car is measured against its own normal lap, so the line follows how
// conditions changed rather than which cars happen to still be running:
// point = (class's typical lap) x (median of every car's lap / its own
// normal lap) within CHART_SMOOTH_MIN either side. Laps more than
// CHART_OUTLIER_PCT off a car's own pace (incidents, slow cool-down laps)
// don't count, nor does anything after the checkered flag. Cautions come
// from the flag periods; when a race has none recorded, a slice where most
// of the field is lapping far off pace is treated as a caution. Caution
// slices are bridged so the line never breaks, and get a dot instead.
function debriefPaceSeries(stintsByNum, opts = {}){
  const flagCautions = opts.cautions || [];
  const checkered = opts.checkered || null;
  // Logged flag periods (cautions and red flags), as real time spans. These
  // are authoritative: any 5-min slice that overlaps one by a minute or more
  // is a flag slice, whether or not the laps in it were marked caution — a
  // red flag in particular has no laps at all, so lap marking alone can't
  // see it.
  const spans = [
    ...flagCautions.map(c => ({ kind: "caution", a: c.start, b: c.end })),
    ...(opts.redFlags || []).map(r => ({ kind: "red", a: r.start, b: r.end })),
  ].filter(f => f.a != null && f.b != null && f.b > f.a);
  const inFlag = ts => spans.some(f => ts >= f.a && ts <= f.b);
  const all = [];
  Object.entries(stintsByNum).forEach(([num, stints]) => stints.forEach(s => s.laps.forEach(l => {
    if (!l.t || !l.ts || (checkered && l.ts > checkered)) return;
    all.push({ num, ts: l.ts, t: l.t, pit: l.pit, caution: l.caution || inFlag(l.ts) });
  })));
  const pts = all.filter(p => !p.pit);
  if (pts.length < 20) return null;

  const ref = {};
  Object.keys(stintsByNum).forEach(n => {
    const ts = pts.filter(p => p.num === n && !p.caution).map(p => p.t);
    if (ts.length >= 5) ref[n] = debriefMedian(ts);
  });
  const refs = Object.values(ref);
  if (!refs.length) return null;
  const base = debriefMedian(refs);
  all.forEach(p => { p.rel = ref[p.num] ? p.t / ref[p.num] : null; });

  const firsts = Object.values(stintsByNum).map(st => st[0]?.laps[0]).filter(f => f?.ts);
  const start = Math.min(...firsts.map(f => f.ts - (f.t || 0) * 1000));
  const end = checkered || Math.max(...pts.map(p => p.ts));
  const binMin = DEBRIEF.CHART_BIN_MIN, B = binMin * 60000;
  const nb = Math.max(1, Math.ceil((end - start) / B));
  const binOf = ts => Math.min(nb - 1, Math.max(0, Math.floor((ts - start) / B)));
  const bins = Array.from({ length: nb }, () => ({ green: [], flagged: 0, total: 0, cars: new Set(), slowCars: new Set() }));
  all.forEach(p => {
    const b = bins[binOf(p.ts)];
    if (p.rel != null){ b.cars.add(p.num); if (p.rel > 1 + DEBRIEF.CHART_CAUTION_PCT) b.slowCars.add(p.num); }
    if (p.pit) return;
    b.total++;
    if (p.caution) b.flagged++;
    else if (p.rel != null && p.rel <= 1 + DEBRIEF.CHART_CAUTION_PCT) b.green.push(p.rel);
  });
  const hasFlags = spans.length > 0 || all.some(p => p.caution);
  const MIN_OVERLAP = 60000;
  const spanHit = bins.map((_, k) => {
    const a = start + k * B, b = a + B;
    return spans.some(f => Math.min(b, f.b) - Math.max(a, f.a) >= MIN_OVERLAP);
  });
  const slowField = bins.map(b => b.cars.size >= 4 && b.slowCars.size / b.cars.size >= 0.6);
  // Without flag data, only a sustained slowdown (10+ minutes) counts, so a
  // cluster of pit stops isn't mistaken for a caution.
  const inferred = slowField.map((x, k) => x && (slowField[k - 1] || slowField[k + 1]));
  bins.forEach((b, k) => { b.caution = spanHit[k] || (hasFlags ? b.total > 0 && b.flagged / b.total >= 0.5 : inferred[k]); });
  const isCaution = b => b.caution;

  const mid = k => (k + 0.5) * binMin;
  const reach = Math.round(DEBRIEF.CHART_SMOOTH_MIN / binMin);
  const raw = bins.map((b, k) => {
    if (isCaution(b)) return null;
    const rels = [];
    for (let j = Math.max(0, k - reach); j <= Math.min(nb - 1, k + reach); j++){
      if (!isCaution(bins[j])) rels.push(...bins[j].green);
    }
    if (rels.length < 8) return null;
    // Outliers are judged against the field at this moment, not each car's
    // normal lap, so a whole-field slowdown (rain) stays on the line.
    const local = debriefMedian(rels);
    const kept = rels.filter(r => r <= local * (1 + DEBRIEF.CHART_OUTLIER_PCT));
    return base * debriefMedian(kept.length >= 8 ? kept : rels);
  });
  const known = raw.map((t, k) => t == null ? null : k).filter(k => k != null);
  if (!known.length) return null;
  const field = raw.map((t, k) => {
    if (t != null) return { m: mid(k), t };
    const before = known.filter(i => i < k).pop(), after = known.find(i => i > k);
    if (before == null) return { m: mid(k), t: raw[after] };
    if (after == null) return { m: mid(k), t: raw[before] };
    return { m: mid(k), t: raw[before] + (raw[after] - raw[before]) * (k - before) / (after - before) };
  });

  const cautions = [];
  bins.forEach((b, k) => {
    if (!isCaution(b)) return;
    const last = cautions[cautions.length - 1];
    if (last && last[1] === k * binMin) last[1] = (k + 1) * binMin; else cautions.push([k * binMin, (k + 1) * binMin]);
  });
  // Shaded on the chart: logged periods at their real times; with no flag
  // log, the caution slices found from lap data.
  const minutes = (end - start) / 60000;
  const toM = ts => (ts - start) / 60000;
  const flags = spans.length
    ? spans.map(f => ({ kind: f.kind, from: Math.max(0, toM(f.a)), to: Math.min(minutes, toM(f.b)) })).filter(f => f.to > f.from)
    : cautions.map(([a, b]) => ({ kind: "caution", from: a, to: b }));
  return { start, minutes, field, cautions, flags };
}

// Line chart that always fills its container's width: the plot is a
// stretched SVG (lines keep their thickness via non-scaling strokes) and the
// labels and caution dots are HTML laid over it, so nothing distorts.
// Lap time up = faster, an hour mark every 60 min, a yellow dot on the first
// line for each caution. lines: [{ label, color, points, dash, width }].
// opts.bands: shaded time windows behind the lines, e.g. who was driving —
// [{ from, to, color, label, title }] in race minutes.
function debriefPaceChartSvg(chart, lines, opts = {}){
  const bands = opts.bands || [];
  const height = opts.height || 200;
  const vals = lines.flatMap(l => l.points.filter(Boolean).map(p => p.t)).sort((a, b) => a - b);
  if (vals.length < 4 || !(chart.minutes > 0)) return "";
  // Full range of what's drawn: every point is already a smoothed median,
  // so trimming percentiles only clipped real slow spells (e.g. a wet track).
  let lo = vals[0], hi = vals[vals.length - 1];
  const pad = Math.max(0.3, (hi - lo) * 0.12);
  lo -= pad; hi += pad;
  const VW = 1000, VH = 100;
  const fx = m => Math.min(1, Math.max(0, m / chart.minutes));
  const fy = t => (Math.min(hi, Math.max(lo, t)) - lo) / (hi - lo);
  const path = pts => {
    let d = "", pen = false;
    pts.forEach(p => {
      if (!p){ pen = false; return; }
      d += `${pen ? "L" : "M"}${(fx(p.m) * VW).toFixed(1)},${(fy(p.t) * VH).toFixed(2)}`;
      pen = true;
    });
    return d;
  };
  const hours = [];
  for (let h = 1; h * 60 <= chart.minutes + 1; h++) hours.push(h);
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  const base = (lines[0]?.points || []).filter(Boolean);
  const lineAt = m => {
    const i = base.findIndex(p => p.m >= m);
    if (i < 0) return base[base.length - 1]?.t;
    if (i === 0) return base[0].t;
    const a = base[i - 1], b = base[i];
    return a.t + (b.t - a.t) * (m - a.m) / (b.m - a.m);
  };
  // Caution / red flag windows, shaded over the driver bands. Red flags are
  // drawn last so they sit on top where a caution runs into one.
  const flagBands = (chart.flags || (chart.cautions || []).map(([a, b]) => ({ kind: "caution", from: a, to: b })))
    .slice().sort((x, y) => (x.kind === "red") - (y.kind === "red"));
  const hasCaution = flagBands.some(f => f.kind === "caution"), hasRed = flagBands.some(f => f.kind === "red");
  const pct = f => `${(f * 100).toFixed(2)}%`;
  const mono = "font-family:'JetBrains Mono',monospace;";
  // Plot area inset: room for the lap-time labels on the left and the hour labels below.
  const PL = 50, PR = 8, PT = bands.length ? 24 : 8, PB = 22;
  const wash = (hex, a) => { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; };
  // Driver windows: no colour wash — the plot keeps one plain background so
  // the driver lines and flag shading carry the colour. Each window is just
  // a neutral divider at the driver change plus a muted name label (and a
  // hover title), enough to see who was in the car when.
  const bandHtml = bands.map((b, i) => {
    const x0 = fx(b.from), w = Math.max(0, fx(b.to) - x0);
    return `<div title="${esc(b.title || b.label || "")}" style="position:absolute;top:0;bottom:0;left:${pct(x0)};width:${pct(w)};${i ? `border-left:1px dashed ${T.borderLight};` : ""}">
      ${b.label && w >= 0.045 ? `<span style="position:absolute;left:4px;top:-18px;font-size:10px;font-weight:700;letter-spacing:0.04em;color:${T.textFaint};${mono}white-space:nowrap;">${esc(b.label)}</span>` : ""}
    </div>`;
  }).join("");
  return `
    <div style="position:relative;width:100%;height:${height}px;" role="img" aria-label="${esc(opts.ariaLabel || "Race pace by hour")}">
      ${ticks.map(t => `<div style="position:absolute;left:0;width:${PL - 6}px;top:calc(${PT}px + (100% - ${PT + PB}px) * ${fy(t).toFixed(4)});transform:translateY(-50%);text-align:right;font-size:10px;color:${T.textFaint};${mono}">${fmtLapTime(t).replace(/\.\d+$/, m => m.slice(0, 2))}</div>`).join("")}
      <div style="position:absolute;left:${PL}px;right:${PR}px;top:${PT}px;bottom:${PB}px;">
        ${bandHtml}
        ${flagBands.map(f => {
          const x0 = fx(f.from), w = Math.max(0.002, fx(f.to) - x0);
          const c = f.kind === "red" ? T.red : T.amber;
          const fmtM = m => `${Math.floor(m / 60)}:${String(Math.round(m % 60)).padStart(2, "0")}`;
          return `<div title="${f.kind === "red" ? "Red flag" : "Caution"} ${fmtM(f.from)}–${fmtM(f.to)}" style="position:absolute;top:0;bottom:0;left:${pct(x0)};width:${pct(w)};background:${wash(c, f.kind === "red" ? 0.22 : 0.16)};">
            <span style="position:absolute;left:0;right:0;top:0;height:3px;background:${c};"></span>
          </div>`;
        }).join("")}
        <svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible;">
          ${ticks.map(t => `<line x1="0" x2="${VW}" y1="${(fy(t) * VH).toFixed(2)}" y2="${(fy(t) * VH).toFixed(2)}" stroke="${T.border}" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}
          ${hours.map(h => `<line x1="${(fx(h * 60) * VW).toFixed(1)}" x2="${(fx(h * 60) * VW).toFixed(1)}" y1="0" y2="${VH}" stroke="${T.borderLight}" stroke-width="1" stroke-dasharray="2 3" vector-effect="non-scaling-stroke"/>`).join("")}
          ${lines.map(l => `<path d="${path(l.points)}" fill="none" stroke="${l.color}" stroke-width="${l.width || 1.6}" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"${l.dash ? ` stroke-dasharray="${l.dash}"` : ""}/>`).join("")}
        </svg>
        ${hours.map(h => `<div style="position:absolute;left:${pct(fx(h * 60))};top:calc(100% + 5px);transform:translateX(-50%);font-size:10px;color:${T.textMuted};${mono}">${h}h</div>`).join("")}
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px;color:var(--textMuted);margin-top:6px;">
      ${lines.map(l => `<span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:14px;height:0;border-top:2px ${l.dash ? "dashed" : "solid"} ${l.color};"></span>${esc(l.label)}</span>`).join("")}
      ${hasCaution ? `<span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:8px;border-radius:2px;background:${wash(T.amber, 0.35)};border-top:2px solid ${T.amber};"></span>Caution</span>` : ""}
      ${hasRed ? `<span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:12px;height:8px;border-radius:2px;background:${wash(T.red, 0.4)};border-top:2px solid ${T.red};"></span>Red flag</span>` : ""}
    </div>`;
}

// One Red Mist session read the same way everywhere: laps, flag timeline
// and pit stops, with every car's race split into driver stints. Shared by
// the Saturday Debrief and the per-car Race Pace chart. Null if the
// session has no laps.
async function rmLoadSessionStints(resultRows){
  const { event_id, session_id, session_name } = resultRows[0];
  const classification = rmClassification(resultRows);
  const scope = q => q.eq("event_id", event_id).eq("session_id", session_id).eq("session_name", session_name);

  const [rawLapRows, periods, allPitStops] = await Promise.all([
    fetchAllRows(() => scope(supabase.from("redmist_live_laps")
      .select("car_number, lap_number, lap_time_seconds, is_pit_lap, caution_lap, captured_at, driver_name"))
      .order("car_number").order("lap_number")),
    fetchAllRows(() => scope(supabase.from("redmist_flag_periods").select("flag, started_at, ended_at")).order("started_at")).catch(() => []),
    fetchAllRows(() => scope(supabase.from("redmist_live_pit_stops")
      .select("car_number, lap_number, pit_duration_ms, driver_change, driver_out, driver_in, class_position_entering, class_position_exiting, penalty_served"))).catch(() => []),
  ]);
  if (!rawLapRows.length) return null;

  // Penalty laps stay non-race laps (lapsByPos keeps the pit flag) but
  // don't split stints or count as pit cycles (lapRows / pitStops drop them).
  const lapsByPos = rmLapsByPos(classification, rawLapRows);
  const raceStops = rmDropPostRaceStops(allPitStops, rawLapRows, resultRows);
  const lapRows = rmLapRowsWithoutPenaltyPits(rawLapRows, raceStops);
  const pitStops = rmServiceStops(rmAlignStopLaps(raceStops));
  const finalDriver = Object.fromEntries(resultRows.map(r => [String(r.car_number), r.driver_name]));
  // Charts stop at the checkered flag: the overall winner's last lap.
  const leader = classification[0]?.startNumber;
  const checkered = lapRows.reduce((m, l) => l.car_number === leader ? Math.max(m, new Date(l.captured_at).getTime()) : m, 0) || null;
  const flagSummary = periods.length ? rmFlagSummary(periods) : { cautions: [], redFlags: [] };
  const flagCautions = flagSummary.cautions, flagReds = flagSummary.redFlags;
  const stintsByNum = {};
  classification.forEach(c => { stintsByNum[c.startNumber] = debriefCarStints(c, lapsByPos, lapRows, pitStops, finalDriver); });
  return { classification, lapRows, periods, pitStops, finalDriver, checkered, flagCautions, flagReds, stintsByNum };
}

async function buildSaturdayDebrief(src){
  // Always the source race's own day — Saturday's data, never Sunday's.
  const resultRows = await fetchRedmistResultRows(src, true);
  if (!resultRows) return null;
  const session = await rmLoadSessionStints(resultRows);
  if (!session) return null;
  const { classification, lapRows, periods, pitStops, checkered, flagCautions, flagReds, stintsByNum } = session;
  // Laps that ran into any part of a caution or red flag (or were marked
  // caution) — left out of traffic, which only judges green racing laps.
  const flagSpans = [...flagCautions, ...flagReds].filter(f => f.start != null);
  Object.values(stintsByNum).forEach(stints => stints.forEach(s => s.laps.forEach(l => {
    const end = l.ts, start = l.ts && l.t ? l.ts - l.t * 1000 : l.ts;
    l.flagged = l.caution || (end != null && flagSpans.some(f => start <= (f.end ?? f.start) && end >= f.start));
  })));
  const redPeriods = periods.length ? rmFlagSummary(periods).redFlags : [];
  const lapTime = {};
  lapRows.forEach(l => { lapTime[`${l.car_number}|${l.lap_number}`] = new Date(l.captured_at).getTime(); });
  const inRed = s => {
    const t = lapTime[`${s.car_number}|${s.lap_number}`];
    return t != null && redPeriods.some(p => t >= p.start - 600000 && t <= (p.end || p.start) + 600000);
  };

  // Every car, not just ours — rival driver profiles feed the matchup.
  const fieldByNum = {}, paceCharts = {};
  // Condition-adjust every lap against its own class's field.
  [...new Set(classification.map(c => c.resultClass))].forEach(cls => {
    const inClass = classification.filter(c => c.resultClass === cls).map(c => stintsByNum[c.startNumber]);
    const factor = debriefTrackFactor(inClass);
    inClass.forEach(stints => stints.forEach(s => s.laps.forEach(l => { if (l.t) l.adj = l.t / factor(l.ts); })));
    const classNums = classification.filter(c => c.resultClass === cls).map(c => c.startNumber);
    const field = debriefFieldModel(Object.fromEntries(classNums.map(n => [n, stintsByNum[n]])));
    paceCharts[cls] = debriefPaceSeries(Object.fromEntries(classNums.map(n => [n, stintsByNum[n]])), { cautions: flagCautions, redFlags: flagReds, checkered });
    classNums.forEach(n => {
      fieldByNum[n] = field;
      stintsByNum[n].forEach(s => s.laps.forEach(l => { if (!l.pit && l.t) l.f = field.at(l.ts, n); }));
    });
  });

  // Stop time, the same figure Pit Stop Times shows: Red Mist's pit duration,
  // except a garage trip flagged for review (no red flag), where that
  // understates the real loss and the clock gap is used instead.
  let cycles = null;
  try { cycles = await loadArchivePitStops(src); } catch (e){ console.warn("[debrief] pit cycles unavailable:", e); }
  const cycleFor = s => {
    const list = cycles?.byCarNumber?.[s.car_number] || [];
    return list.find(c => c.lap === s.lap_number)
      || list.filter(c => c.lap != null && Math.abs(c.lap - s.lap_number) <= 2).sort((a, b) => Math.abs(a.lap - s.lap_number) - Math.abs(b.lap - s.lap_number))[0] || null;
  };
  const stopTime = s => {
    const c = cycleFor(s);
    if (c && c.needsReview && !c.redFlagOverlap && c.clockGapSeconds != null) return { sec: Number(c.clockGapSeconds), repair: true };
    return { sec: Number(s.pit_duration_ms) / 1000, repair: false };
  };
  const keptStop = s => Number(s.pit_duration_ms) >= RM_MIN_PIT_MS && !inRed(s);
  // Class median stop, split driver-change vs. service-only when each kind
  // has enough stops; otherwise the class median of all stops.
  const stopRefByClass = {};
  [...new Set(classification.map(c => c.resultClass))].forEach(cls => {
    const nums = new Set(classification.filter(c => c.resultClass === cls).map(c => c.startNumber));
    // Garage trips stay out of the class median.
    const secs = f => pitStops.filter(s => nums.has(s.car_number) && keptStop(s) && !stopTime(s).repair && f(s)).map(s => Number(s.pit_duration_ms) / 1000);
    const all = debriefMedian(secs(() => true));
    const ch = secs(s => s.driver_change), sv = secs(s => !s.driver_change);
    stopRefByClass[cls] = { change: ch.length >= 3 ? debriefMedian(ch) : all, service: sv.length >= 3 ? debriefMedian(sv) : all };
  });

  // Key takeaways: how each class approached its stops — per stop number,
  // how many cars stopped and how many of those changed drivers — plus
  // every car's settling-in cost after its stops.
  const classKeys = {};
  [...new Set(classification.map(c => c.resultClass))].forEach(cls => {
    const nums = classification.filter(c => c.resultClass === cls && c.status !== "DNS").map(c => c.startNumber);
    const byCar = Object.fromEntries(nums.map(n => [n,
      pitStops.filter(s => s.car_number === n && keptStop(s)).sort((a, b) => a.lap_number - b.lap_number)]));
    const most = Math.max(0, ...Object.values(byCar).map(l => l.length));
    const byIndex = Array.from({ length: most }, (_, k) => {
      const at = nums.filter(n => byCar[n][k]);
      // Stop times of the cars that did NOT change drivers at this stop
      // number (garage trips left out) — what a fuel-only stop cost then.
      const svc = at.filter(n => !byCar[n][k].driver_change).map(n => stopTime(byCar[n][k])).filter(t => !t.repair).map(t => t.sec);
      return { cars: at.length, changes: at.filter(n => byCar[n][k].driver_change).length, svcSecs: svc };
    });
    classKeys[cls] = {
      cars: nums.length,
      changedCars: nums.filter(n => byCar[n].some(s => s.driver_change)).length,
      byIndex,
      stopRef: stopRefByClass[cls],
      warmByCar: Object.fromEntries(nums.map(n => [n, debriefWarmups(stintsByNum[n] || [])])),
    };
  });

  // Pit cycle comparison: the class cars that stopped in the same window as
  // a given stop (in-laps completed within CYCLE_WINDOW_MIN of each other —
  // a caution cycle or a shared fuel window), so a stop is judged against
  // the stops made in the same conditions, not against "everyone's 1st
  // stop" (which mixes lap-4 splashes with lap-23 caution stops). Garage
  // trips and anything over 1.5x the window's median are left out. Each
  // stop also gets its in-lap + out-lap time, which carries the whole cost
  // of the cycle (pit lane, stationary time, a cold out-lap).
  const lapInfo = {};
  lapRows.forEach(l => { lapInfo[`${l.car_number}|${l.lap_number}`] = { t: Number(l.lap_time_seconds) || null, ts: new Date(l.captured_at).getTime() }; });
  const stopEvents = {};
  [...new Set(classification.map(c => c.resultClass))].forEach(cls => {
    const nums = new Set(classification.filter(c => c.resultClass === cls && c.status !== "DNS" && !/x$/i.test(String(c.startNumber))).map(c => c.startNumber));
    stopEvents[cls] = pitStops.filter(st => nums.has(st.car_number) && keptStop(st)).map(st => {
      const inL = lapInfo[`${st.car_number}|${st.lap_number}`], outL = lapInfo[`${st.car_number}|${st.lap_number + 1}`];
      const t = stopTime(st);
      return { num: st.car_number, lap: st.lap_number, change: !!st.driver_change, sec: t.sec, repair: t.repair,
        at: inL?.ts ?? null, cycle: inL?.t && outL?.t ? inL.t + outL.t : null };
    }).filter(e => e.at != null);
  });
  const CYCLE_WINDOW_MIN = 6;
  const stopPeers = (cls, num, lap) => {
    const ev = stopEvents[cls] || [];
    const me = ev.find(e => e.num === num && e.lap === lap);
    if (!me) return null;
    const near = ev.filter(e => e.num !== num && Math.abs(e.at - me.at) <= CYCLE_WINDOW_MIN * 60000);
    const svcAll = near.filter(e => !e.change && !e.repair);
    const cap = svcAll.length ? debriefMedian(svcAll.map(e => e.sec)) * 1.5 : Infinity;
    const svc = svcAll.filter(e => e.sec <= cap);
    const quick = near.filter(e => !e.repair).sort((a, b) => a.sec - b.sec)[0] || null;
    const svcCycles = svc.map(e => e.cycle).filter(Boolean);
    return {
      cars: near.length + 1,
      changes: near.filter(e => e.change).length + (me.change ? 1 : 0),
      svcN: svc.length,
      svcMedian: svc.length >= 3 ? debriefMedian(svc.map(e => e.sec)) : null,
      quick: quick ? { num: quick.num, sec: quick.sec, change: quick.change } : null,
      cycle: me.cycle,
      svcCycleMedian: svcCycles.length >= 3 ? debriefMedian(svcCycles) : null,
    };
  };

  // Gap to each class car that finished ahead, taken where both crossed our
  // final lap count (cars a lap or more up are still measured on that lap).
  const crossAt = {};
  lapRows.forEach(l => { (crossAt[l.car_number] ||= {})[l.lap_number] = new Date(l.captured_at).getTime(); });
  const gapsAhead = c => {
    const mine = crossAt[c.startNumber];
    if (!mine || c.positionInClass == null) return [];
    const L = Math.max(...Object.keys(mine).map(Number)), t = mine[L];
    return classification
      .filter(o => o.resultClass === c.resultClass && o.positionInClass != null && o.positionInClass < c.positionInClass && !/x$/i.test(String(o.startNumber)))
      .map(o => { const ot = crossAt[o.startNumber]?.[L]; return ot == null ? null : { num: o.startNumber, pos: o.positionInClass, gap: (t - ot) / 1000 }; })
      .filter(g => g && g.gap >= 0).sort((a, b) => a.gap - b.gap);
  };

  const cars = {};
  classification.forEach(c => {
    const stints = stintsByNum[c.startNumber];
    const profiles = debriefProfilesFor(stints);
    const stops = pitStops.filter(s => s.car_number === c.startNumber && keptStop(s));
    const moves = stops.filter(s => s.class_position_entering != null && s.class_position_exiting != null)
      .map(s => s.class_position_entering - s.class_position_exiting);
    const full = stints.filter(s => s.minutes >= DEBRIEF.FULL_STINT_MIN);
    const closing = full.length ? full[full.length - 1] : stints[stints.length - 1];
    // Driver bars: the same driver lines and field line the car's Race Pace
    // chart draws, as the gap to the field at each chart point.
    const chart = paceCharts[c.resultClass];
    const segs = chart ? racePaceCarSegments(stints, chart) : null;
    const driverBars = {};
    (segs || []).forEach(sg => {
      const pts = sg.points.map((p, k) => p && chart.field[k] ? { m: p.m, g: p.t - chart.field[k].t } : null).filter(Boolean);
      const list = (driverBars[sg.driver] ||= []), prev = list[list.length - 1];
      // Back-to-back stints by the same driver (fuel-only stop) are one window, as on the chart.
      if (prev && prev.lastLap + 1 >= sg.firstLap && prev.idx === segs.indexOf(sg) - 1){
        prev.to = sg.to; prev.lastLap = sg.lastLap; prev.idx++; prev.pts.push(...pts);
      } else list.push({ from: sg.from, to: sg.to, lastLap: sg.lastLap, idx: segs.indexOf(sg), pts });
    });
    cars[c.startNumber] = {
      driverBars,
      paceSegs: segs || [],
      gapsAhead: gapsAhead(c),
      num: c.startNumber, name: c.name, cls: c.resultClass, classPos: c.positionInClass, status: c.status,
      stints, profiles, stintReport: debriefStintReport(stints, fieldByNum[c.startNumber], c.startNumber, stops, stopRefByClass[c.resultClass], stopTime),
      battle: debriefBattle(c.startNumber, c.resultClass, stints, classification, lapRows, pitStops),
      stops: stops.length,
      medianStop: debriefMedian(stops.map(s => Number(s.pit_duration_ms) / 1000)),
      netPerStop: moves.length ? debriefMean(moves) : null,
      avgStintMin: debriefMean(full.map(s => s.minutes)),
      closer: closing ? closing.driver : null,
      // Key takeaways inputs: this car's stops in order (driver change or
      // not, time stationary) and the class picture they're judged against.
      keyStops: stops.slice().sort((a, b) => a.lap_number - b.lap_number)
        .map(st => { const t = stopTime(st); return { change: !!st.driver_change, sec: t.sec, repair: t.repair, peers: stopPeers(c.resultClass, c.startNumber, st.lap_number) }; }),
      classKeys: classKeys[c.resultClass] || null,
    };
  });
  return { sourceName: src.eventName, cars, paceCharts };
}

// Bakes the debrief into state.cars (Setup) and builds the panel summary.
function applySaturdayDebrief(debrief){
  const ctx = setupPlanContext();
  const summary = { sourceName: debrief.sourceName, cars: [], classes: {} };
  const floor5 = m => Math.min(STINT_WHEEL_MAX, Math.max(STINT_WHEEL_MIN, Math.floor(m / STINT_WHEEL_STEP) * STINT_WHEEL_STEP));

  state.cars.forEach(car => {
    const sat = debrief.cars[String(car.number)];
    if (!sat) return;
    const notes = [], decisions = {};

    // Stint length: shorten to where pace drops off; lengthen only as far
    // as the driver was seen holding pace on Saturday.
    car.drivers.forEach((d, i) => {
      const m = debriefMatchDriver(d, sat.profiles);
      const current = Number(stintModeOf(car, i));
      if (!m){ decisions[d] = { kind: "none", from: current }; return; }
      const p = m.profile;
      if (p.confidence === "low"){ decisions[d] = { kind: "low", from: current }; return; }
      let kind = "hold", to = current;
      if (p.fadeMin != null && floor5(p.fadeMin) < current){ kind = "shorten"; to = floor5(p.fadeMin); }
      else {
        const reach = p.fadeMin != null ? p.fadeMin : p.heldThrough;
        if (floor5(reach) >= current + 2 * STINT_WHEEL_STEP){ kind = "lengthen"; to = floor5(reach); }
      }
      decisions[d] = { kind, from: current, to };
      if (kind === "hold") return;
      if (!car.driverStintMode) car.driverStintMode = car.drivers.map(() => '60');
      car.driverStintMode[i] = String(to);
      notes.push({ driver: d, kind: "len", suggested: String(to),
        text: `Stint length ${current} → ${to} min for ${d}, from Saturday pace data` });
    });

    // Closer: best race-condition pace among drivers with enough data.
    const candidates = car.drivers
      .map(d => ({ d, m: debriefMatchDriver(d, sat.profiles) }))
      .filter(o => o.m && o.m.profile.confidence !== "low" && o.m.profile.raceDelta != null)
      .sort((a, b) => a.m.profile.raceDelta - b.m.profile.raceDelta);
    const closer = candidates.length >= 2 ? candidates[0].d : null;
    let closerPlaced = false;
    if (closer){
      closerPlaced = rotateCarForCloser(car, closer, ctx);
      if (closerPlaced) notes.push(debriefOrderNote(closer));
    }

    const drivers = car.drivers.map(d => {
      const m = debriefMatchDriver(d, sat.profiles);
      return { name: d, satName: m ? m.name : null, profile: m ? m.profile : null, raceDelta: m ? m.profile.raceDelta : null, decision: decisions[d] };
    });
    car.debrief = { closer, closerPlaced, orderTouched: false, notes };
    summary.cars.push({ number: car.number, accent: car.accent, notes, drivers, closer, closerPlaced, sat });
    summary.classes[sat.cls] = true;
  });

  // Rival summary per class we're racing in.
  const ourNums = new Set(state.cars.map(c => String(c.number)));
  Object.keys(summary.classes).forEach(cls => { summary.classes[cls] = debriefClassSummary(debrief, cls, ourNums); });
  return summary;
}

// Class picture the debrief judges our cars against (top 3 stops/stint
// length, stop times, closers, pace chart). Shared by the Setup debrief
// and the archived Race Debrief.
function debriefClassSummary(debrief, cls, ourNums){
    const field = Object.values(debrief.cars).filter(c => c.cls === cls);
    const ranked = field.filter(c => c.status === "Normal" && c.classPos != null).sort((a, b) => a.classPos - b.classPos);
    const top = ranked.slice(0, 3), rest = ranked.slice(3);
    const avg = (xs, k) => debriefMean(xs.map(c => c[k]).filter(v => v != null));
    const stopTimes = field.filter(c => c.medianStop != null).sort((a, b) => a.medianStop - b.medianStop);
    const movers = field.filter(c => c.netPerStop != null && c.stops >= 2).sort((a, b) => b.netPerStop - a.netPerStop);
    const rivalClosers = top.filter(c => !ourNums.has(c.num) && c.closer && c.profiles[c.closer]?.raceDelta != null)
      .map(c => ({ num: c.num, name: c.name, driver: c.closer, raceDelta: c.profiles[c.closer].raceDelta }));
    return {
      top: top.length ? { stops: avg(top, "stops"), stintMin: avg(top, "avgStintMin"), nums: top.map(c => c.num) } : null,
      rest: rest.length ? { stops: avg(rest, "stops"), stintMin: avg(rest, "avgStintMin") } : null,
      bestStop: stopTimes[0] || null,
      ourStops: stopTimes.filter(c => ourNums.has(c.num)),
      mover: movers[0] || null,
      rivalClosers,
      chart: debrief.paceCharts?.[cls] || null,
    };
}

// Archived Race Debrief: the same per-car read-out as the Setup debrief,
// built for this race's own session and its own drivers — nothing is
// applied to the plan (no stint lengths, no closer).
function archiveDebriefSummary(race, debrief){
  const summary = { sourceName: race.eventName, cars: [], classes: {} };
  (race.cars || []).forEach(car => {
    if (isHardshipCar(car.number)) return;
    const sat = debrief.cars[String(car.number)];
    // Finishers only — a DNF/DNS car's story is already known.
    if (!sat || sat.status !== "Normal") return;
    const drivers = (car.drivers || []).filter(d => d && d.trim()).map(d => {
      const m = debriefMatchDriver(d, sat.profiles);
      return { name: d, satName: m ? m.name : null, profile: m ? m.profile : null, raceDelta: m ? m.profile.raceDelta : null };
    });
    summary.cars.push({ number: car.number, accent: car.accent, notes: [], drivers, closer: null, closerPlaced: false, sat });
    summary.classes[sat.cls] = true;
  });
  const ourNums = new Set(summary.cars.map(c => String(c.number)));
  Object.keys(summary.classes).forEach(cls => { summary.classes[cls] = debriefClassSummary(debrief, cls, ourNums); });
  return summary;
}

// Duplicating: drivers live timing put on a source car who never actually
// drove it. When Red Mist names the wrong driver after a stop, the poller
// adds that name to the car's roster ("…but X got in the car") and puts
// them on the next stint; Red Mist fixes the name a lap or two later, but
// the roster entry stays and would carry into every copy of the race.
// A driver is dropped from the copy when live timing added them AND they
// have no laps in the source race's session — or, with no session to
// check, no stint left in its plan. Drivers the engineer entered are
// never touched. Returns true if any car changed.
async function pruneGhostDrivers(src, cars){
  const srcCars = (src.cars || []).filter(c => c.id);
  if (!srcCars.length) return false;
  const ids = srcCars.map(c => c.id);
  const [logRes, stintRes] = await Promise.all([
    supabase.from("stint_log").select("car_id, message").in("car_id", ids).eq("entry_key", "redmist-driver-swap"),
    supabase.from("stints").select("car_id, driver").in("car_id", ids),
  ]);
  if (logRes.error) throw logRes.error;
  const autoAdded = {}; // source car id -> names live timing put in the car
  (logRes.data || []).forEach(l => {
    const m = /but (.+?) got in the car/.exec(l.message || "");
    if (m) (autoAdded[l.car_id] ||= []).push(m[1].trim());
  });
  if (!Object.keys(autoAdded).length) return false;

  // Who actually drove, per car number, from the source session's laps.
  let lapDrivers = null;
  if (src.redmistEventId != null && src.redmistSessionId != null){
    const nums = srcCars.map(c => String(c.number));
    const rows = await fetchAllRows(() => {
      let q = supabase.from("redmist_live_laps").select("car_number, driver_name")
        .eq("event_id", src.redmistEventId).eq("session_id", src.redmistSessionId).in("car_number", nums);
      if (src.redmistSessionName) q = q.eq("session_name", src.redmistSessionName);
      return q.order("car_number").order("lap_number");
    });
    if (rows.length){
      lapDrivers = {};
      rows.forEach(r => { if (r.driver_name) (lapDrivers[r.car_number] ||= new Set()).add(r.driver_name); });
    }
  }
  const stintDrivers = {};
  (stintRes.data || []).forEach(r => { if (r.driver) (stintDrivers[r.car_id] ||= []).push(r.driver); });

  let changed = false;
  srcCars.forEach(sc => {
    const added = autoAdded[sc.id];
    const car = cars.find(c => String(c.number) === String(sc.number));
    if (!added || !car) return;
    const drove = lapDrivers
      ? d => [...(lapDrivers[String(sc.number)] || [])].some(n => sameDriverName(n, d))
      : d => (stintDrivers[sc.id] || []).some(n => sameDriverName(n, d));
    const keep = car.drivers.map(d => !(added.some(a => sameDriverName(a, d)) && !drove(d)));
    if (keep.every(Boolean)) return;
    console.log(`[duplicate] #${car.number}: dropping`, car.drivers.filter((_, i) => !keep[i]), "— added by live timing, never drove");
    car.drivers = car.drivers.filter((_, i) => keep[i]);
    car.driverStintMode = (car.driverStintMode || []).filter((_, i) => keep[i]);
    changed = true;
  });
  return changed;
}

// Kicked off from "confirmName" when duplicating. Async so Setup appears
// immediately; the debrief lands on it a moment later.
async function runSaturdayDebrief(src){
  const token = uid("debrief");
  state.debrief = { token, status: "loading", sourceName: src.eventName };
  try {
    const debrief = await buildSaturdayDebrief(src);
    if (state.debrief?.token !== token || state.page !== "setup" || state.currentRaceId) return; // engineer moved on
    if (!debrief){ state.debrief = null; render(); return; }
    state.debrief = { token, status: "ready", ...applySaturdayDebrief(debrief) };
  } catch (err){
    console.error("[debrief] failed:", err);
    if (state.debrief?.token === token) state.debrief = null;
  }
  render();
}

// Driver color scale within a car — faster race pace toward green,
// slower toward amber. Color only, no labels.
function debriefPaceColor(drivers, raceDelta){
  const vals = drivers.map(d => d.raceDelta).filter(v => v != null);
  if (raceDelta == null || vals.length < 2) return T.textFaint;
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const f = hi > lo ? (raceDelta - lo) / (hi - lo) : 0;
  const a = hexToRgb(T.green), b = hexToRgb(T.amber);
  const mix = k => Math.round(a[k] + (b[k] - a[k]) * f);
  return `rgb(${mix(0)},${mix(1)},${mix(2)})`;
}



// Same green -> amber -> red stops as the Competitors Pit Times bars.
function debriefScaleColor(t){
  const stops = [[63,178,127],[242,166,62],[226,68,92]];
  t = Math.max(0, Math.min(1, t));
  const a = t < 0.5 ? stops[0] : stops[1], b = t < 0.5 ? stops[1] : stops[2], u = t < 0.5 ? t * 2 : (t - 0.5) * 2;
  return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * u)).join(",")})`;
}

// One bar per driver across their Saturday seat time, one segment per stint
// window in race order, colored by the gap between their line and the
// field line on the car's Race Pace chart at each moment: green at or ahead
// of the field, amber ~1s/lap behind, red BAR_RED_GAP behind. Caution
// stretches carry the last color, as the chart bridges them.
function debriefPaceBar(segs, fadeMin){
  const total = segs.reduce((a, s) => a + Math.max(0, s.to - s.from), 0);
  if (!(total > 0) || !segs.some(s => s.pts.length)) return "";
  const color = g => debriefScaleColor(g / DEBRIEF.BAR_RED_GAP);
  let acc = 0, labelAt = null;
  const parts = segs.map(s => {
    const dur = Math.max(0.1, s.to - s.from);
    const pos = m => Math.max(0, Math.min(100, (m - s.from) / dur * 100)).toFixed(1);
    const grad = s.pts.length ? s.pts.map(p => `${color(p.g)} ${pos(p.m)}%`) : ["var(--border) 0%"];
    if (grad.length === 1) grad.push(grad[0].replace(/[\d.]+%$/, "100%"));
    const tick = fadeMin != null && dur > fadeMin
      ? `<span style="position:absolute;left:${(fadeMin / dur * 100).toFixed(1)}%;top:-3px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--text);"></span>` : "";
    if (tick && labelAt == null) labelAt = (acc + fadeMin) / total * 100;
    acc += dur;
    return `<div style="position:relative;flex:${dur.toFixed(2)} 1 0;height:8px;border-radius:4px;background:linear-gradient(90deg, ${grad.join(", ")});">${tick}</div>`;
  }).join("");
  const label = labelAt == null ? "" : `<div style="position:relative;height:16px;margin-top:4px;font-size:11px;"><span style="position:absolute;left:${labelAt.toFixed(1)}%;transform:${labelAt > 80 ? "translateX(-100%)" : labelAt < 20 ? "none" : "translateX(-50%)"};white-space:nowrap;color:${T.red};font-weight:600;">Drop-off ${fadeMin}m</span></div>`;
  return `<div style="margin:10px 0 ${label ? 4 : 10}px;"><div style="display:flex;gap:3px;">${parts}</div>${label}</div>`;
}

// Fallback bar (no race pace chart data): the driver's longest Saturday
// stint, colored by pace vs. the stint's opening, drop-off marked.
function debriefFadeBar(p){
  const total = p.longestMin;
  if (!(total > 0)) return "";
  const pos = m => Math.max(0, Math.min(100, m / total * 100));
  let last = debriefScaleColor(0);
  const grad = p.bins.map(b => {
    if (b.pct != null) last = debriefScaleColor(Math.max(0, b.pct) / (DEBRIEF.FADE_PCT * 1.5));
    return `${last} ${pos((b.from + b.to) / 2).toFixed(1)}%`;
  });
  if (grad.length === 1) grad.push(grad[0].replace(/[\d.]+%$/, "100%"));
  const marks = [];
  if (p.fadeMin != null) marks.push({ at: p.fadeMin, label: `Drop-off ${p.fadeMin}m`, color: T.red });
  const tick = m => `<span style="position:absolute;left:${pos(m.at)}%;top:-3px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--text);"></span>`;
  const label = m => {
    const x = pos(m.at), align = x > 80 ? "translateX(-100%)" : x < 20 ? "none" : "translateX(-50%)";
    return `<span style="position:absolute;left:${x}%;top:0;transform:${align};white-space:nowrap;color:${m.color};font-weight:600;">${m.label}</span>`;
  };
  // No drop-off: just the bar, no labels.
  return `
    <div style="margin:10px 0 ${marks.length ? 4 : 10}px;">
      <div style="position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg, ${grad.join(", ")});">${marks.map(tick).join("")}</div>
      ${marks.length ? `<div style="position:relative;height:16px;margin-top:4px;font-size:11px;">${marks.map(label).join("")}</div>` : ""}
    </div>`;
}

function renderDebriefPanel(dbArg, opts = {}){
  const db = dbArg || state.debrief;
  if (!dbArg && (!db || state.currentRaceId)) return "";
  if (db.status === "loading"){
    return `<section style="margin-bottom:32px;"><h2>Saturday Debrief</h2>
      <div class="catalog-panel" style="margin-top:0;color:var(--textMuted);font-size:13px;">Reading ${esc(db.sourceName)}…</div></section>`;
  }
  const line = t => `<div style="font-size:13px;line-height:1.5;color:var(--textMuted);margin:3px 0;">${t}</div>`;
  const fmtSec = x => `${x < 0 ? "−" : "+"}${Math.abs(x).toFixed(1)}s`;
  const stat = (label, value) => `<span style="white-space:nowrap;"><span style="color:var(--textFaint);">${label}</span> ${value}</span>`;

  const driverCard = (c, d) => {
    const p = d.profile;
    const dot = `<span style="width:8px;height:8px;border-radius:999px;background:${debriefPaceColor(c.drivers, d.raceDelta)};display:inline-block;"></span>`;
    const head = `<div style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;">${dot}${esc(d.name)}${d.name === c.closer && c.closerPlaced ? ` <span style="color:var(--textFaint);font-weight:400;">· closer</span>` : ""}</div>`;
    if (!p) return `<div style="padding:10px 0;border-top:1px solid var(--border);">${head}</div>`;
    const stats = [
      stat("Laps", esc(p.lapRanges)),
      stat("Clean lap", fmtLapTime(p.adjBase)),
      stat("Race Pace", p.raceDelta != null ? fmtSec(p.raceDelta) : "—"),
      stat("Consistency", p.stdev != null ? `±${p.stdev.toFixed(2)}s` : "—"),
    ].join(`<span style="color:var(--border);margin:0 6px;">|</span>`);
    return `
      <div style="padding:10px 0;border-top:1px solid var(--border);">
        ${head}
        <div style="font-size:12px;color:var(--textMuted);display:flex;flex-wrap:wrap;gap:4px 0;margin-top:4px;">${stats}</div>
        ${(c.sat.driverBars && c.sat.driverBars[d.satName] && debriefPaceBar(c.sat.driverBars[d.satName], p.fadeMin)) || debriefFadeBar(p)}
      </div>`;
  };

  // The closer is tagged on their driver card; only say something here
  // when the best driver couldn't be put on the final stint.
  const closerLine = c => c.closer && !c.closerPlaced
    ? line(`${esc(c.closer)} has the best race pace but can't be placed on the final stint with current stint lengths.`)
    : "";

  // Key takeaways: where this car lost time against its class, and how its
  // stop strategy differed from the field's — car-level only, no driver
  // named, so the point is what to change, not who.
  const ourNums = new Set(db.cars.map(c => String(c.number)));
  const fmtDur = s => { const a = Math.round(Math.abs(s)); return a >= 60 ? `${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}` : `${a}s`; };
  // Estimated time lost to the class over the race (pace, traffic, pit
  // stops — losses only), and which class cars ahead finished within it.
  const timeLossBlock = c => {
    const sat = c.sat;
    const rep = (sat.stintReport || []).filter(Boolean);
    if (!rep.length) return "";
    const pos = k => rep.filter(r => (r[k] || 0) > 0);
    const sum = k => pos(k).reduce((a, r) => a + r[k], 0);
    const paceLaps = pos("pace").reduce((a, r) => a + (r.paceLaps || 0), 0);
    const trafficLaps = rep.reduce((a, r) => a + (r.trafficLaps || 0), 0);
    const slowStops = pos("pit").length, allStops = rep.filter(r => r.hasStop && r.pit != null).length;
    // [label, seconds, the figure behind it]
    const parts = [
      ["Pace", sum("pace"), paceLaps ? `+${(sum("pace") / paceLaps).toFixed(1)}s/lap × ${paceLaps} laps` : ""],
      ["Traffic", sum("traffic"), trafficLaps ? `${trafficLaps} laps held up` : ""],
      ["Pit stops", sum("pit"), allStops ? `${slowStops} of ${allStops} stops over class median` : ""],
    ].filter(k => k[1] >= 5);
    const total = parts.reduce((a, k) => a + k[1], 0);
    if (total < 5) return "";
    const reach = (sat.gapsAhead || []).filter(g => g.gap <= total).sort((a, b) => a.pos - b.pos);
    const next = (sat.gapsAhead || [])[0];
    const reachLine = reach.length
      ? `<span style="font-weight:600;color:var(--text);">P${reach[0].pos} within reach</span> — ${reach.slice().sort((a, b) => a.gap - b.gap).map(g => `P${g.pos} #${esc(g.num)} ${fmtDur(g.gap)} ahead`).join(" · ")}`
      : next ? `Next car ahead (P${next.pos} #${esc(next.num)}) finished ${fmtDur(next.gap)} ahead` : "";
    return `
      <div style="margin:6px 0 12px;padding:10px 12px;border-radius:8px;background:var(--panelRaised);">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;">
          <span class="eyebrow">Estimated Time Loss</span>
          <span class="font-mono" style="font-size:18px;font-weight:700;color:${T.red};">${fmtDur(total)}</span>
        </div>
        <div style="font-size:12px;color:var(--textMuted);margin-top:4px;">
          ${parts.map(([l, v, why]) => `<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0;"><span><span style="color:var(--textFaint);">${l}</span>${why ? ` <span style="color:var(--textFaint);">· ${why}</span>` : ""}</span><span class="font-mono" style="font-weight:600;">${fmtDur(v)}</span></div>`).join("")}
        </div>
        ${reachLine ? `<div style="font-size:12px;color:var(--textMuted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">${reachLine}</div>` : ""}
      </div>`;
  };

  const keyTakeaways = c => {
    const sat = c.sat, ck = sat.classKeys, out = [];
    const red = t => `<span style="font-weight:600;color:${T.red};">${t}</span>`;
    const ourStops = sat.keyStops || [];
    const cls = esc(sat.cls);
    const mmss = x => { const a = Math.round(x); return `${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}`; };

    if (ck){
      // Driver change at a stop most of the class used as fuel-only: our
      // stop time vs. the median of the cars that didn't change there.
      const sgn = d => d > 0 ? red(`+${Math.round(d)}s`) : `${d < 0 ? "−" : ""}${Math.abs(Math.round(d))}s`;
      ourStops.forEach((st, k) => {
        const p = st.peers;
        if (!st.change || st.repair || !p || p.cars < 4 || p.changes / p.cars > DEBRIEF.RARE_CHANGE_PCT || p.svcMedian == null) return;
        // Stop time vs. the cycle's fuel-only median.
        out.push(`Stop ${k + 1}: Only ${p.changes} of ${p.cars} ${cls} cars changed drivers — (${sgn(st.sec - p.svcMedian)})`);
        // In-lap + out-lap vs. the same cars — only when it's a real loss.
        const lapLoss = p.cycle && p.svcCycleMedian != null ? p.cycle - p.svcCycleMedian : null;
        if (lapLoss != null && lapLoss >= DEBRIEF.INOUT_SIGNIFICANT_S) out.push(`Proceeding with Caution - In/Out Laps (${sgn(lapLoss)})`);
      });

      // Cost of a driver change over a fuel-only stop, and what double
      // stints (one change per driver) would have saved.
      const changeSecs = ourStops.filter(st => st.change && !st.repair).map(st => st.sec);
      const svc = ck.stopRef?.service;
