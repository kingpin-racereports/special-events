<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Race Strategy Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg:#05215a; --panel:#031a4a; --panelRaised:#1B2456;
    --border:#2A3468; --borderLight:#3C4880;
    --text:#F4F6FB; --textMuted:#A6AFD6; --textFaint:#6870A0;
    --blue:#3D6FE8; --amber:#F2A63E; --green:#3FB27F; --red:#E2445C;
    --purple:#8B6BF0; --gold:#E0B84B; --silver:#C6CBD3; --bronze:#C97F4B;
  }
  /* Explicitly declaring the dark scheme above tells browsers (Samsung
     Internet in particular) this page already has a hand-authored dark
     theme, so their own "auto dark mode" won't additionally reprocess
     images/backgrounds — without this, Samsung Internet was dimming
     white-background assets like the track map PNG and the logo that
     Chrome left alone. */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .font-display{font-family:'Barlow Condensed',sans-serif;letter-spacing:0.02em;}
  .font-mono{font-family:'JetBrains Mono',monospace;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--textFaint);}
  a,button{font-family:inherit;}
  button{cursor:pointer;}
  input,select{font-family:inherit;}
  .no-scrollbar::-webkit-scrollbar{display:none;}
  .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fade-in{animation:fadeIn .35s ease-out;}
  /* Entrance animation only on an actual page change — a same-page
     re-render (live data arriving) must not replay the fade/slide, which
     is what made the whole page "blink" on every Realtime update. */
  #app.same-page-render .fade-in{animation:none;}
  /* Every rebuilt pulse dot would otherwise restart its cycle at 0 on each
     re-render (a visible stutter). --pulse-phase is set in render() to a
     negative delay from a shared clock, so a rebuilt dot resumes exactly
     where the old one was. !important so it beats inline animation:
     shorthands on the ad-hoc dots. */
  #app .live-badge .dot, #app .live-dot, #app .row-live .dot, #app [style*="livePulse"]{animation-delay:var(--pulse-phase,0ms)!important;}
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(0.7);}
  select option{background:var(--panelRaised);color:var(--text);}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}

  .field{
    background:var(--panel); border:1px solid var(--borderLight); color:var(--text);
    border-radius:10px; padding:10px 12px; width:100%; font-size:14px;
  }
  .label{
    color:var(--textFaint); letter-spacing:0.08em; font-family:'JetBrains Mono',monospace;
    text-transform:uppercase; font-size:11px; display:flex; align-items:center; gap:5px; margin-bottom:6px;
  }
  .page{max-width:768px;margin:0 auto;padding:32px 20px 112px;}
  .page-wide{max-width:896px;}
  .btn-back{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--textMuted);background:none;border:none;padding:0;}
  .icon{display:inline-flex;vertical-align:middle;}

  /* ---- icons (inline svg strokes, mimics lucide) ---- */
  svg.i{stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

  /* ---- Home ---- */
  .home-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 24px;}
  .home-main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .races-strip{width:100%;max-width:768px;margin-bottom:40px;}
  /* Live event standings on Home — same width rules as the races strip.
     Qualifying sessions sit side by side once there's room for two. */
  .event-standings{width:100%;max-width:768px;margin-bottom:40px;}
  .event-standings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));column-gap:24px;}
  .races-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:12px;padding:0 4px;}
  .archive-link{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--gold);background:none;border:none;}
  .tile-row{display:flex;gap:16px;overflow-x:auto;padding:4px 4px 8px;}
  /* Do NOT constrain touch-action on these rows. A value of pan-x lets the
     browser scroll them sideways but BLOCKS vertical touch panning over
     them, so a swipe starting on a tile can't scroll the page and it feels
     stuck. `auto` gives the browser full native control: it decides per
     gesture whether the finger is scrolling this row sideways or the page
     vertically, and pinch-zoom keeps working. Drag-to-scroll here is
     mouse-driven (mousedown/mousemove), so it never needed touch-action. */
  .tile-row,.catalog-row,.track-picker-row{-webkit-overflow-scrolling:touch;touch-action:auto;cursor:grab;}
  .tile-row.dragging,.catalog-row.dragging,.track-picker-row.dragging{cursor:grabbing;}
  .tile-row-center{justify-content:safe center;}
  /* Archive page reuses .tile-row as a wrapping grid (flex-wrap:wrap) rather
     than a horizontal scroller, so the pan-x restriction above has nothing
     to scroll horizontally but still blocks vertical touch scrolling of the
     page. Restore normal touch panning for that wrapped variant. */
  .tile-row.tile-row-wrap{touch-action:auto;cursor:default;}
  .create-btn{display:flex;align-items:center;gap:12px;border-radius:999px;padding:16px 28px;background:var(--panel);border:1px solid var(--borderLight);color:var(--text);transition:border-color .15s;}
  .create-btn:hover{border-color:var(--blue);}
  .create-btn span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:20px;}
  .name-flow{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:16px;}
  .name-input{width:100%;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:24px;font-weight:600;outline:none;border-radius:12px;background:var(--panel);border:1px solid var(--borderLight);padding:14px 16px;color:var(--text);}
  .continue-btn{display:flex;align-items:center;gap:8px;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;padding:12px 24px;background:var(--blue);color:#0A0C10;border:none;}
  .continue-btn:disabled{background:var(--panel);color:var(--textFaint);opacity:.6;cursor:not-allowed;}

  /* ---- race tile ---- */
  .race-tile{flex:0 0 auto;width:min(82vw,320px);border-radius:16px;overflow:hidden;background:var(--panel);border:2px solid var(--border);position:relative;text-align:left;cursor:pointer;}
  .catalog-tile{cursor:pointer;}
  .race-tile .strip{aspect-ratio:8/7;position:relative;}
  .race-tile .strip button.del{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
  .race-tile .strip .live-badge{position:absolute;top:6px;left:6px;display:flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:999px;z-index:2;backdrop-filter:blur(2px);}
  .race-tile .strip .live-badge .dot{width:6px;height:6px;border-radius:999px;flex-shrink:0;animation:livePulse 1.2s ease-in-out infinite;}
  .race-tile .strip .live-badge .lbl{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.05em;}
  .race-tile button.dup{position:absolute;bottom:8px;right:8px;width:22px;height:22px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;}
  .race-tile .body{padding:12px 30px 14px 14px;}
  .race-tile .name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;line-height:1.15;margin-bottom:3px;}
  .race-tile .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);}

  /* ---- car cards / catalog ---- */
  .car-card{flex:0 0 auto;width:152px;border-radius:16px;overflow:hidden;background:var(--panel);border:2px solid var(--border);position:relative;}
  .car-card .strip{height:200px;position:relative;}
  .car-card .num{position:absolute;bottom:-9px;left:10px;background:var(--bg);border-radius:6px;padding:0 7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;}
  .car-card .del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
  .catalog-tile .del{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:999px;background:rgba(10,12,16,0.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;}
  .car-card .body{padding:14px 10px 10px;font-family:'Inter',sans-serif;}
  .car-card .team{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}
  .car-card .model{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);margin-top:2px;}
  .add-car-card{flex:0 0 auto;width:152px;height:130px;border-radius:16px;background:transparent;border:1.5px dashed var(--borderLight);color:var(--textMuted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .add-car-card span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;}

  .livery{width:100%;height:100%;position:relative;overflow:hidden;}
  .track-layout-img{width:100%;height:100%;object-fit:cover;display:block;}
  .livery::before{content:"";position:absolute;inset:0;background:
    repeating-linear-gradient(115deg, rgba(255,255,255,0.14) 0 10px, transparent 10px 26px);}
  .livery::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.35) 100%);}

  .catalog-panel{margin-top:16px;border-radius:16px;background:var(--panel);border:1px solid var(--border);padding:16px;}
  .catalog-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;}
  .catalog-tile{flex:0 0 auto;width:152px;border-radius:16px;overflow:hidden;background:var(--panelRaised);border:2px solid var(--border);text-align:left;position:relative;}
  .catalog-tile .strip{height:64px;position:relative;}
  .catalog-tile .num{position:absolute;bottom:-9px;left:10px;background:var(--bg);border-radius:6px;padding:0 7px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;}
  .catalog-tile .body{padding:14px 10px 10px;}
  .catalog-tile .team{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}
  .catalog-tile .model{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);margin-top:2px;}

  .new-car-form{margin-top:16px;border-radius:12px;background:var(--panelRaised);border:1px solid var(--borderLight);padding:14px;max-width:320px;display:flex;flex-direction:column;gap:8px;}
  .swatches{display:flex;gap:8px;}
  .swatch{width:18px;height:18px;border-radius:999px;border:2px solid transparent;padding:0;}
  .swatch.active{border-color:var(--text);}

  /* ---- driver / car detail section ---- */
  .car-detail{border-radius:16px;overflow:hidden;background:var(--panel);border:2px solid var(--border);margin-bottom:16px;}
  .car-detail .strip{height:56px;position:relative;}
  .car-detail-plan .strip{height:200px;}
  .car-detail .num{position:absolute;bottom:-10px;left:12px;background:var(--bg);border-radius:7px;padding:0 8px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;}
  .car-detail .content{padding:20px 16px 16px;}
  .driver-row{display:flex;align-items:center;gap:8px;}
  .driver-row .idx{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);width:18px;}
  .driver-row button{background:none;border:none;color:var(--textFaint);display:flex;}
  .driver-group{margin-bottom:14px;}
  /* One line, always. The label is the flexible element — it shrinks (and
     ellipsises if it must) so the preset buttons and the custom select are
     never pushed onto a second row on a narrow phone. */
  .stint-len-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin:6px 0 0 26px;}
  .stint-len-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:4px;}
  .stint-len-label svg{flex-shrink:0;}
  .stint-len-row .segmented,.stint-len-row .stint-wheel{flex-shrink:0;}
  /* Preset buttons sit alongside the custom <select> below, so they share
     its height, radius, and mono type to read as one control group. */
  .segmented{display:flex;height:30px;border:1px solid var(--borderLight);border-radius:8px;overflow:hidden;flex-shrink:0;}
  .segmented button{
    background:var(--panel);border:none;color:var(--textMuted);
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    padding:0 12px;display:flex;align-items:center;justify-content:center;
  }
  .segmented button+button{border-left:1px solid var(--borderLight);}
  .segmented button.active{background:var(--blue);color:#0A0C10;font-weight:600;}

  /* Stint-length custom picker: a native <select>. Rendered by the OS as a
     spinning wheel on iOS, a scrollable list dialog on Android, and a
     dropdown on desktop — the options list is drawn above the page by the
     browser itself, so it can never fight the page's own scrolling the way
     a hand-built scroll wheel does. Reads as "Custom" while one of the
     60/90/120 presets is active, and shows the chosen value (highlighted,
     via .has-custom) once a non-preset length is picked. */
  .stint-wheel{
    appearance:none;-webkit-appearance:none;-moz-appearance:none;
    width:86px;height:30px;padding:0 22px 0 10px;
    background:var(--panel);color:var(--textMuted);
    border:1px dashed var(--borderLight);border-radius:8px;
    font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;
    text-align:center;text-align-last:center;cursor:pointer;flex-shrink:0;
    background-image:linear-gradient(45deg,transparent 50%,var(--textMuted) 50%),linear-gradient(135deg,var(--textMuted) 50%,transparent 50%);
    background-position:calc(100% - 12px) 13px,calc(100% - 8px) 13px;
    background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  }
  .stint-wheel.has-custom{
    border-style:solid;border-color:var(--blue);color:var(--blue);font-weight:600;
    background-image:linear-gradient(45deg,transparent 50%,var(--blue) 50%),linear-gradient(135deg,var(--blue) 50%,transparent 50%);
  }
  .add-driver{margin-top:6px;display:flex;align-items:center;gap:4px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;background:none;border:none;}

  /* ---- buttons general ---- */
  .btn-primary{width:100%;border-radius:999px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;padding:16px 0;display:flex;align-items:center;justify-content:center;gap:8px;border:none;background:var(--blue);color:#0A0C10;}
  .btn-primary:disabled{background:var(--panel);color:var(--textFaint);border:1px solid var(--borderLight);cursor:not-allowed;}

  /* ---- info chips ---- */
  .chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:24px 0;}
  .summary-box{margin-bottom:16px;border-radius:12px;background:var(--panel);border:1px solid var(--border);padding:14px 16px;}
  .summary-drivers{display:flex;flex-direction:column;gap:6px;}
  .summary-driver{display:flex;align-items:center;justify-content:space-between;font-size:13.5px;}
  .summary-driver span:first-child{color:var(--textMuted);}
  .summary-driver span:last-child{color:var(--text);font-weight:500;}

  /* Pit Stop Times table (inside a car's collapsible tile) - own columns
     for Stop / Time / Driver / Flag rather than cramming icons after the
     stop number, so caution/driver-change/red-flag markers read as their
     own scannable column instead of inline clutter. */
  .pit-table{width:100%;border-collapse:collapse;}
  .pit-table thead th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);padding:0 6px 6px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap;}
  .pit-table tbody td{padding:6px;font-size:12.5px;border-bottom:1px solid rgba(42,52,104,0.5);white-space:nowrap;}
  .pit-table tbody tr:last-child td{border-bottom:none;}
  .pit-table td.pit-time{font-family:'JetBrains Mono',monospace;font-weight:600;text-align:right;}
  .pit-table td.pit-driver{color:var(--textMuted);white-space:normal;}
  .pit-table td.pit-flag{text-align:center;}
  .pit-table td.pit-lap{font-family:'JetBrains Mono',monospace;color:var(--textMuted);}
  /* Phones: surname only in the pit stop table (full name stays in the title). */
  @media(max-width:560px){ .pit-table .dn-first{display:none;} }
  .chip{border-radius:12px;background:var(--panel);border:1px solid var(--border);padding:10px 12px;display:flex;align-items:center;gap:8px;}
  .chip .ico{color:var(--textFaint);}
  .chip .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);}
  .chip .val{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}

  /* ---- timeline ---- */
  /* Redesigned as a row of individually-rounded "stint cards" rather than
     solid color blocks glued edge-to-edge: each card gets a tinted wash
     of the driver's accent color, a bold top accent stripe, a color dot
     next to the driver name, and the start time in mono underneath.
     flex-grow is set per-segment (in JS) proportional to the stint's
     actual length in minutes, so a 90-minute stint visibly reads wider
     than a 45-minute one instead of every segment getting equal space. */
  .timeline{display:flex;gap:6px;width:100%;}
  .timeline .seg{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0;border-radius:10px;border:1px solid transparent;border-top:3px solid transparent;padding:9px 10px 8px;overflow:hidden;}
  .timeline .seg .drv{display:flex;align-items:center;justify-content:center;gap:5px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;line-height:1.15;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .timeline .seg .drv .dot{display:none;} /* per-driver dot removed — top border accent already color-codes each card; only the live red dot (see .live-dot) remains visible */
  .timeline .seg .tm{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textFaint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;}

  .stint-table{margin-top:12px;border-radius:12px;border:1px solid var(--border);overflow:hidden;display:grid;grid-template-columns:minmax(68px,1.2fr) minmax(60px,0.6fr) minmax(45px,0.53fr) minmax(37px,0.43fr) minmax(25px,0.29fr);column-gap:3px;row-gap:0;}
  .stint-table .head{display:grid;grid-template-columns:subgrid;grid-column:1 / -1;font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;padding:8px 5px 8px 32px;background:var(--panel);color:var(--textFaint);}
  .stint-table .row{position:relative;display:grid;grid-template-columns:subgrid;grid-column:1 / -1;align-items:center;padding:8px 5px 8px 32px;font-size:13px;border-top:1px solid var(--border);}
  .stint-table .row span, .stint-table .head span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .row-removed{opacity:0.5;color:var(--textFaint);font-size:12.5px;}
  .row-removed span{color:var(--textFaint)!important;}
  .row-negligible-final{opacity:0.65;color:var(--textFaint);font-size:12.5px;}
  .row-negligible-final span{color:var(--textFaint)!important;}
  /* Ghosted stint-number watermark — replaces the old numeric Stint column. */
  .stint-ghost-num{position:absolute;left:10px;bottom:-4px;width:auto;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1;color:var(--text);opacity:0.16;z-index:1;pointer-events:none;user-select:none;overflow:visible;}
  .row-removed .stint-ghost-num{opacity:0.05;}
  .row-negligible-final .stint-ghost-num{opacity:0.08;}
  .stint-table .dot{width:7px;height:7px;border-radius:999px;display:inline-block;margin-right:4px;flex-shrink:0;}
  /* ---- "currently on track" live indicator ---- */
  /* Abrupt flash rather than a smooth breathing pulse: holds full size,
     snaps down small and dim, snaps back — reads as a blink, not a swell. */
  @keyframes livePulse{0%,42%,58%,100%{opacity:1;transform:scale(1);}50%{opacity:0.2;transform:scale(0.5);}}
  .timeline .seg .live-dot{width:7px;height:7px;border-radius:999px;flex-shrink:0;background:var(--red);animation:livePulse 1.2s ease-in-out infinite;}
  .timeline .seg.seg-live{border-color:var(--red);background:rgba(226,68,92,0.10);box-shadow:none;transform:translateY(-2px);transition:transform .2s;min-width:76px;flex-shrink:0;}
  .stint-table .row-live .dot{background:var(--red)!important;animation:livePulse 1.2s ease-in-out infinite;}
  .stint-table .row.row-live{position:relative;background:rgba(226,68,92,0.08);}
  .stint-table .row.row-live::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red);}
  /* Checkered variant of the live indicators — shown from the checkered
     flag until the race is archived. Static (no pulse) checkered square. */
  .chk-flag{display:inline-block;width:8px;height:8px;border-radius:1px;flex-shrink:0;background:repeating-conic-gradient(#fff 0 25%, #1b1f27 0 50%) 0 0/4px 4px;box-shadow:0 0 0 1px rgba(255,255,255,0.35);}
  .timeline .seg.seg-checkered .live-dot{animation:none!important;border-radius:1px;background:repeating-conic-gradient(#fff 0 25%, #1b1f27 0 50%) 0 0/4px 4px!important;}
  .stint-table .row-live.row-checkered .dot{animation:none!important;border-radius:1px;background:repeating-conic-gradient(#fff 0 25%, #1b1f27 0 50%) 0 0/4px 4px!important;}
  .stint-table .row.row-live.row-checkered{background:rgba(255,255,255,0.05);}
  .stint-table .row.row-live.row-checkered::before{background:var(--text);}
  /* In-pit variant of the live indicators — same shapes, blue accent */
  .timeline .seg.seg-pit .live-dot{background:var(--blue)!important;}
  .stint-table .row-live.row-pit .dot{background:var(--blue)!important;}
  .stint-table .row.row-live.row-pit{background:rgba(61,111,232,0.10);}
  .stint-table .row.row-live.row-pit::before{background:var(--blue);}
  .stint-table .row.row-finished{opacity:0.62;}
  .stint-table .fin-flag{font-size:11px;line-height:1;margin-right:4px;flex-shrink:0;}
  .stint-time{padding:4px 0;font-size:10px;width:100%;min-width:0;border-radius:6px;text-align:center;}
  .stint-pos{padding:4px 1px;font-size:11px;width:100%;min-width:0;border-radius:6px;border:1px solid var(--borderLight);text-align:center;}
  .driver-cell{display:flex;align-items:center;gap:4px;min-width:0;}
  .stint-driver{padding:4px 2px;font-size:11px;width:100%;min-width:0;border-radius:6px;}
  .stint-driver:focus{outline:none;}
  .stint-note-toggle{background:none;border:1px solid var(--borderLight);border-radius:6px;min-width:20px;min-height:22px;width:auto;height:auto;padding:3px 3px;display:flex;align-items:center;justify-content:center;color:var(--textFaint);flex-shrink:0;justify-self:end;overflow:visible;}
  .stint-note-toggle:hover{color:var(--text);border-color:var(--text);}
  .note-row{grid-column:1 / -1;padding:8px 10px 12px 14px;border-top:1px solid var(--border);background:var(--bg);}
  .note-row textarea{width:100%;background:var(--panelRaised);border:1px solid var(--borderLight);border-radius:8px;color:var(--text);padding:7px 9px;font-size:12.5px;font-family:'Inter',sans-serif;resize:vertical;min-height:38px;}
  .flag-row{display:flex;gap:5px;margin-bottom:8px;}
  .flag-btn{flex:1 1 0;min-width:0;font-size:11.5px;padding:6px 5px;border-radius:999px;background:var(--panelRaised);border:1px solid var(--borderLight);color:var(--textMuted);display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
  .flag-btn .em{font-size:12px;line-height:1;flex-shrink:0;}
  .flag-btn .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .flag-btn.active{color:var(--text);}
  .flag-badge{font-size:10px;line-height:1.6;margin-left:2px;white-space:nowrap;display:inline-block;}
  .retire-btn{margin-bottom:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(226,68,92,0.14);border:1px solid var(--red);color:var(--red);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.03em;padding:8px 0;border-radius:8px;}
  .retire-btn:hover{background:rgba(226,68,92,0.24);}
  .retire-btn .em{font-size:15px;line-height:1;}
  .finish-btn{margin-bottom:8px;width:100%;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(46,111,224,0.14);border:1px solid var(--blue);color:var(--blue);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:0.03em;padding:8px 0;border-radius:8px;}
  .finish-btn:hover{background:rgba(46,111,224,0.24);}
  .finish-btn .em{font-size:15px;line-height:1;}
  .finish-stint-cell{width:100%;min-width:0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:0.01em;padding:4px 2px;border-radius:6px;background:rgba(46,111,224,0.16);border:1px solid var(--blue);color:var(--blue);display:flex;align-items:center;justify-content:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .finish-stint-cell:hover{background:rgba(46,111,224,0.28);}
  .finish-stint-cell .em{font-size:11px;line-height:1;flex-shrink:0;}
  /* Start time shown as a tappable control in the stint table. */
  .stint-start-btn{white-space:nowrap;font-size:11px;background:none;border:none;color:var(--text);padding:4px 2px 4px 14px;text-align:left;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;text-decoration-color:var(--textFaint);}
  /* ±15 stepper inside the expanded stint panel. */
  .start-adjust{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;}
  .start-adjust-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);display:flex;align-items:center;gap:4px;}
  .start-adjust-ctl{display:flex;align-items:center;gap:8px;}
  .start-adjust-ctl button{min-width:52px;height:30px;border-radius:8px;background:var(--panelRaised);border:1px solid var(--borderLight);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;}
  .start-adjust-ctl button:disabled{opacity:0.35;cursor:default;}
  .start-adjust-val{font-size:14px;font-weight:600;min-width:62px;text-align:center;}
  .start-adjust-hint{font-size:11px;color:var(--textFaint);line-height:1.35;}
  .row-quiet{background:rgba(139,107,240,0.08);}
  /* The stint table clips its cells to one nowrap line with an ellipsis;
     the quiet row is a single full-width caption, so it opts out of that
     or it truncates to "Quiet Ti..." on narrow screens. */
  .row-quiet .qt-text{font-style:italic;color:var(--textMuted);white-space:normal!important;overflow:visible!important;text-overflow:clip!important;}
  .stint-pos::placeholder{color:var(--textFaint);}
  /* Read-only position badge (finished/archived stints) — square, fixed
     size, centered in its column, rather than stretching to the full
     column width like the editable input does. */
  .stint-pos-badge{width:26px;height:26px;padding:0;margin:0 auto;flex-shrink:0;}
  /* Editable position input — same square-badge treatment as the read-only
     version, just a few pixels wider so there's room to actually see the
     cursor/typed digits while editing. */
  .stint-pos-edit{width:32px;height:28px;padding:0;margin:0 auto;flex-shrink:0;}
  .stint-table .head span:nth-child(3), .stint-table .head span:nth-child(4){text-align:center;}

  .archive-box{margin:24px 0 40px;border-radius:16px;background:var(--panel);border:1px solid var(--border);padding:16px;max-width:460px;display:flex;flex-direction:column;gap:14px;}
  .archive-box .head{display:flex;align-items:center;gap:8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;}
  .archive-box p{margin:0;font-size:14px;color:var(--textMuted);}

  .track-detail-box{margin-top:24px;margin-bottom:40px;border-radius:16px;background:var(--panel);border:1px solid var(--border);padding:16px;}
  .track-detail-head{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--textFaint);margin-bottom:12px;}
  .track-detail-img{width:100%;height:auto;display:block;border-radius:10px;}
  /* Live track map: Red Mist GPS outline + Kingpin cars (see liveTrackMapSection) */
  .tm-map{width:100%;height:auto;display:block;max-height:420px;}
  .tm-car text{font-family:'JetBrains Mono',monospace;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;}
  .tm-turn{font-family:'JetBrains Mono',monospace;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:var(--textFaint);}
  .tm-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textMuted);}
  .tm-legend .sw{width:9px;height:9px;border-radius:999px;display:inline-block;margin-right:6px;vertical-align:-1px;}
  .tm-legend b{color:var(--text);font-weight:700;}
  .tm-other circle{fill:#F4F6FB;stroke:#05215a;}
  .tm-selectable{cursor:pointer;}
  .live-table tr[data-class-break] td{border-top:1px solid var(--borderLight, #3C4880);}
  @media(hover:hover){ .tm-selectable:hover td{background:rgba(255,255,255,0.05);} }
  .tm-row-sw{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:6px;vertical-align:0;}
  .tm-clear{margin-left:auto;background:none;border:1px solid var(--border);border-radius:6px;color:var(--textMuted);font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;padding:2px 8px;cursor:pointer;}
  .home-track-map .track-detail-box{margin:0;}
  .trend-line{display:block;margin-top:2px;}
  .fin-label{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--textFaint);display:flex;align-items:center;gap:6px;margin-bottom:4px;}
  .btn-gold{border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;padding:10px 0;display:flex;align-items:center;justify-content:center;gap:6px;border:none;background:var(--gold);color:#0A0C10;}

  /* ---- Results panels (archive overview + live standings) ---- */
  .results-panel{margin-top:24px;padding:18px 12px;border:1px solid var(--gold);border-radius:14px;background:rgba(224,184,75,0.04);}
  @media(max-width:560px){ .results-panel{padding:16px 10px;} }
  .results-overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .results-stat-tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 12px 10px;}
  .results-stat-label{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--textFaint);margin-bottom:5px;}
  .results-stat-value{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;line-height:1;color:var(--text);}
  .results-stat-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--textMuted);margin-top:5px;}
  @media(max-width:480px){ .results-overview-grid{grid-template-columns:repeat(2,1fr);} }
  .results-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 16px;margin-top:10px;}
  .results-stat{display:flex;justify-content:space-between;font-size:13px;}
  .results-stat .lbl{color:var(--textFaint);}

  /* ---- Per-car stat tiles ---- */
  .results-header-block{margin-top:0;}
  .results-carstat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px;}
  .live-summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px;}
  /* Competitors Pit Times (archive) */
  .pit-times-row{display:grid;grid-template-columns:minmax(0,1fr) 64px 92px 210px;gap:14px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--border);}
  .pit-times-row:last-child{border-bottom:none;}
  .pit-times-row.ours{background:rgba(224,184,75,0.09);box-shadow:inset 2px 0 0 var(--gold);}
  .pit-times-head{padding-top:0;padding-bottom:8px;}
  .pit-times-name{font-size:13.5px;min-width:0;}
  .pit-times-num{font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;}
  .pit-times-time{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:13px;}
  .pit-times-time .font-mono{min-width:48px;text-align:right;}
  .pit-times-bar{flex:1;max-width:130px;height:5px;border-radius:3px;background:var(--border);}
  .pit-times-bar > span{display:block;height:5px;border-radius:3px;}
  .pit-times-head .lbl-short{display:none;}
  @media(max-width:560px){
    .pit-times-row{grid-template-columns:minmax(0,1fr) 34px 34px 50px;gap:8px;padding:8px 6px;}
    .pit-times-head{padding-top:0;}
    .pit-times-name{font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .pit-times-num,.pit-times-time{font-size:12.5px;}
    .pit-times-time .font-mono{min-width:0;}
    .pit-times-bar{display:none;}
    .pit-times-head .lbl-full{display:none;}
    .pit-times-head .lbl-short{display:inline;}
  }
  .live-carstat-grid{grid-template-columns:repeat(3,1fr);}
  .live-carstat-grid .results-carstat-tile{min-width:0;}
  .live-carstat-grid .results-carstat-value{overflow-wrap:anywhere;}
  @media(max-width:480px){
    .live-carstat-grid{gap:6px;}
    .live-carstat-grid .results-carstat-tile{padding:8px 7px 7px;}
    .live-carstat-grid .results-carstat-value{font-size:15px;}
    .live-carstat-grid .results-stat-sub{font-size:9px;}
  }
  @media(max-width:640px){ .live-summary-grid{grid-template-columns:repeat(2,1fr);} }
  .results-carstat-tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 10px 8px;}
  .results-carstat-value{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;line-height:1;color:var(--text);}
  .results-stat .val{font-family:'JetBrains Mono',monospace;color:var(--text);}
  .results-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;}
  .results-table{width:100%;min-width:480px;border-collapse:collapse;}
  .results-table thead th{text-align:left;font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.07em;color:var(--textFaint);padding:0 8px 6px;border-bottom:1px solid var(--border);font-weight:500;white-space:nowrap;}
  .results-table tbody td{padding:7px 8px;font-size:12.5px;border-bottom:1px solid rgba(42,52,104,0.5);white-space:nowrap;}
  .results-table thead th:nth-child(1), .results-table tbody td:nth-child(1),
  .results-table thead th:nth-child(2), .results-table tbody td:nth-child(2){padding-left:6px;padding-right:6px;}
  .results-table .num{font-family:'JetBrains Mono',monospace;color:var(--textMuted);}
  .results-table .stops{font-family:'JetBrains Mono',monospace;font-weight:600;}
  .results-table .results-cls{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);}
  @media(max-width:480px){
    .results-table thead th:nth-child(6), .results-table tbody td:nth-child(6){display:none;}
    .results-table thead th:nth-child(7), .results-table tbody td:nth-child(7){display:none;}
    .results-table{min-width:0;}
    /* Archive full-field standings keep every column; the wrap scrolls sideways. */
    .results-table.archive-field{min-width:520px;}
    .results-table.archive-field thead th:nth-child(6), .results-table.archive-field tbody td:nth-child(6){display:table-cell;}
    /* Live quali/race standings: tighter on phones so every column fits
       without sideways scrolling. The team name absorbs the squeeze and
       truncates with an ellipsis instead of pushing Laps/Class off-screen. */
    .live-panel{padding:14px 10px;}
    .live-table thead th{font-size:9px;letter-spacing:0.04em;padding:0 4px 5px;}
    .live-table tbody td{font-size:11px;padding:6px 4px;}
    .live-table thead th:nth-child(1), .live-table tbody td:nth-child(1),
    .live-table thead th:nth-child(2), .live-table tbody td:nth-child(2){padding-left:4px;padding-right:4px;}
    .live-table tbody td:nth-child(2){width:100%;max-width:0;overflow:hidden;text-overflow:ellipsis;}
    .live-table .results-cls{font-size:10px;}
  }
  .results-badge{font-family:'JetBrains Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:0.07em;padding:2px 6px;border-radius:5px;}
  .results-badge.dnf{background:rgba(226,68,92,0.15);color:var(--red);}
  .results-badge.dns{background:#000;color:#7A7F8C;}
  .results-spinner{
    width:28px;height:28px;border-radius:50%;
    border:3px solid rgba(224,184,75,0.18);border-top-color:var(--gold);
    animation:results-spin 0.8s linear infinite;
  }
  @keyframes results-spin{ to{ transform:rotate(360deg); } }
  .btn-gold:disabled{background:var(--panelRaised);color:var(--textFaint);cursor:not-allowed;}

  .top-actions{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .top-actions .right{display:flex;align-items:center;gap:16px;}
  .link-red{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--red);background:none;border:none;}
  .link-muted{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--textMuted);background:none;border:none;}

  .banner{display:flex;align-items:center;gap:8px;margin-top:16px;border-radius:12px;padding:10px 14px;width:fit-content;background:var(--panel);}
  .banner span{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;}

  /* ---- modal ---- */
  .modal-overlay{position:fixed;inset:0;background:rgba(10,12,16,0.75);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .modal{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--borderLight);border-radius:16px;padding:24px;}
  .modal h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .modal p{font-size:14px;color:var(--textMuted);margin:0 0 24px;}
  .modal .row{display:flex;gap:12px;}
  .modal .row button{flex:1;border-radius:8px;padding:10px 0;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;border:none;}
  .modal .cancel{background:transparent;border:1px solid var(--borderLight)!important;color:var(--textMuted);}
  .modal .confirm{background:var(--red);color:#0A0C10;}
  .modal .confirm.positive{background:var(--blue);}

  /* ---- engineer sign-in ---- */
  .auth-row{display:flex;justify-content:center;align-items:center;gap:10px;}
  .auth-status{font-size:12px;color:var(--textMuted);display:flex;align-items:center;gap:6px;}
  .auth-link{background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 2px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.08em;}
  .auth-link:hover{text-decoration:underline;}
  .auth-row-bottom{padding-top:40px;display:flex;justify-content:center;width:100%;}
  .google-btn{width:100%;box-sizing:border-box;padding:11px 0;border-radius:8px;border:1px solid var(--borderLight);background:var(--panelRaised);color:var(--text);font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;}
  .google-btn:hover{border-color:var(--blue);}
  .google-btn:disabled{opacity:.5;cursor:default;}
  .or-divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--textFaint);font-size:11px;text-transform:uppercase;letter-spacing:0.08em;font-family:'JetBrains Mono',monospace;}
  .or-divider::before,.or-divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .login-email-input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:8px;border:1px solid var(--borderLight);background:var(--bg);color:var(--text);font-size:14px;margin-bottom:10px;}
  .magic-btn{width:100%;padding:11px 0;border-radius:8px;border:none;background:var(--blue);color:#0A0C10;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;cursor:pointer;}
  .magic-btn:disabled{opacity:.5;cursor:default;}
  .login-sent{font-size:13px;color:var(--green);margin:0;}
  .login-error{font-size:12px;color:var(--red);margin:10px 0 0;}

  .empty-note{font-size:14px;color:var(--textFaint);padding:0 4px;}
  /* ---- Archer (empty home state) ----
     Body + tail are separate cut-outs on the same canvas; the tail sits
     BEHIND the body and rotates from its base on the rump. Tail box is in
     % of the 440x421 canvas so it scales with the container. */
  .archer-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:4px 4px 8px;}

  @keyframes archerWag{from{transform:rotate(-14deg);}to{transform:rotate(14deg);}}
  @media (prefers-reduced-motion:reduce){.archer-tail{animation:none;}}
  .archer-title{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;color:var(--text);margin:8px 0 0;}
  .archer-sub{font-size:14px;color:var(--textFaint);margin:0;max-width:340px;line-height:1.45;}
  section h2{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:18px;margin:0 0 12px;}

  .stint-log{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
  .log-head{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 2px;}
  /* Archived races: stint timeline, stint table and adjustment log folded
     into one collapsible section (collapsed by default). */
  .stint-section{margin-bottom:16px;}
  .stint-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;border-radius:12px;background:var(--panel);border:1px solid var(--border);padding:12px 16px;cursor:pointer;user-select:none;}
  .stint-section-head .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);display:flex;align-items:center;gap:10px;}
  .stint-section-body{display:none;margin-top:12px;}
  .stint-section.open .stint-section-body{display:block;}
  .log-head .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--textFaint);}
  .log-clear{background:none;border:none;color:var(--textFaint);font-size:11px;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
  .log-item{font-size:13px;line-height:1.45;padding:9px 11px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:flex-start;gap:7px;color:var(--textMuted);}
  .log-item .ico{flex-shrink:0;margin-top:2px;color:var(--textFaint);}
  /* Log messages may contain \n to split related facts onto their own
     lines. pre-line honours those newlines while still collapsing ordinary
     runs of whitespace. */
  .log-item .log-text{white-space:pre-line;}
  .log-item .log-text strong{font-weight:700;color:var(--text);}
  .log-item.warn{border-color:var(--red);color:var(--text);background:rgba(226,68,92,0.08);}
  .log-item.warn .ico{color:var(--amber);}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .col-2{grid-column:1 / -1;min-width:0;}

  /* ---- track picker (replaces plain <select> for track choice) ---- */
  .track-picker-row{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;}
  .track-tile{flex:0 0 auto;width:150px;border-radius:14px;overflow:hidden;background:var(--panel);border:2px solid var(--border);text-align:left;position:relative;transition:border-color .12s,opacity .2s;}
  .track-tile.dimmed{opacity:0.4;}
  .track-tile .strip{width:150px;height:150px;position:relative;background:var(--panelRaised);}
  .track-tile .strip img{width:150px;height:150px;object-fit:cover;display:block;}
  .track-tile .check{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:999px;background:var(--blue);color:#0A0C10;display:flex;align-items:center;justify-content:center;}
  .track-tile .name{padding:8px 9px 10px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;line-height:1.2;}
  .track-tile.selected{border-color:var(--blue);}
  .track-tile.other-tile{border-style:dashed;border-color:var(--borderLight);}
  .track-tile.other-tile .strip{display:flex;align-items:center;justify-content:center;color:var(--textMuted);}
  .track-tile.other-tile.selected{border-style:solid;border-color:var(--blue);}

  .local-banner{max-width:768px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);}
  .local-banner img{height:28px;width:auto;flex-shrink:0;}
  .local-banner a{display:flex;line-height:0;}

  @media (max-width:480px){
    .setup-grid{grid-template-columns:1fr;}
    .setup-grid .col-2{grid-column:auto;}
    .chip-grid{grid-template-columns:1fr;}
    .timeline{gap:3px;}
    .timeline .seg{padding:6px 4px 5px;}
    .timeline .seg .drv{font-size:12px;}
    .timeline .seg .tm{font-size:9px;}
    .timeline .seg.seg-live{min-width:60px;}
    .stint-table{grid-template-columns:minmax(71px,1.35fr) minmax(55px,0.54fr) minmax(42px,0.48fr) minmax(34px,0.38fr) minmax(23px,0.26fr);}
    .stint-driver{font-size:10.8px;padding:4px 1.5px;}
    .stint-pos{font-size:10.5px;padding:4px 0;}
    .stint-pos-badge{width:22px;height:22px;}
    .stint-pos-edit{width:27px;height:24px;}
    /* Reclaim horizontal space so the stint-length controls stay on one
       line: less indent, tighter gaps, narrower buttons and select. */
    .stint-len-row{margin-left:8px;gap:6px;}
    .stint-len-label{font-size:9.5px;letter-spacing:0.03em;}
    .segmented button{padding:0 9px;}
    .stint-wheel{width:74px;padding:0 19px 0 8px;background-position:calc(100% - 11px) 13px,calc(100% - 7px) 13px;}
  }
  /* ---- Desktop tiers ----
     Phones and tablets keep the single 768px column above. From 900px the
     column widens and per-car content gets room to breathe; from 1280px
     the plan page splits into cars + a side column (info, track map,
     standings/qualifying), capped at 1600px so an ultrawide doesn't turn
     every row into a head-turn. Setup stays a narrower form page. */
  .plan-cols{display:block;}
  .car-plans{display:flex;flex-direction:column;gap:40px;margin-top:24px;}
  .archive-top{display:block;}
  /* Archived car dashboard: stat tiles, full-width Race Pace, then Drivers
     and Pit Stop Times side by side. Sized by the car column's own width
     (container queries), not the viewport, since that column narrows when
     the side column is present. */
  .arch-dash{container-type:inline-size;}
  .arch-split{display:block;}
  @container (min-width:480px){
    .arch-dash .results-carstat-grid{grid-template-columns:repeat(3,1fr);}
  }
  @container (min-width:720px){
    .arch-dash .results-carstat-grid{grid-template-columns:repeat(6,1fr);}
    .arch-dash .race-pace-slot [role="img"]{height:300px!important;}
    .arch-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch;}
  }
  .ff-panel{margin-top:40px;}
  @media (min-width:900px){
    .page,.page-wide,.local-banner,.races-strip,.event-standings{max-width:1120px;}
    .page{padding-left:32px;padding-right:32px;}
    .car-plans-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:32px;align-items:start;}
    /* Race Overview tiles: three rows at this width, two rows from 1440px,
       column count driven by how many tiles the race has (--c3 / --c2). */
    .results-overview-grid{grid-template-columns:repeat(var(--c3,4),minmax(0,1fr));}
    .pit-times-row{grid-template-columns:minmax(200px,1.2fr) 72px 104px minmax(240px,2fr);gap:18px;}
    .pit-times-bar{max-width:none;}
  }
  @media (min-width:1280px){
    .page,.page-wide,.local-banner,.races-strip,.event-standings{max-width:1600px;}
    .page{padding-left:40px;padding-right:40px;}
    .page.page-setup{max-width:1120px;}
    .plan-cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start;margin-top:24px;}
    .plan-cols.side-wide{grid-template-columns:minmax(0,1fr) minmax(480px,560px);}
    .plan-cols .car-plans{margin-top:0;}
    .plan-side .chip-grid{margin:16px 0!important;max-width:none;}
    .plan-side > .chip-grid:first-child{margin-top:0!important;}
    .plan-side .track-detail-box{margin:16px 0;}
    .plan-side > :first-child,.plan-side .results-panel:first-child{margin-top:0;}
  }
  @media (min-width:1440px){
    .results-overview-grid{grid-template-columns:repeat(var(--c2,6),minmax(0,1fr));}
  }

  /* ---- Main action buttons: kingpinracing.com style ----
     Square, transparent, thin white border, small bold uppercase with wide
     tracking; fills white with navy text on hover. Applies to the main
     action buttons only — flag, retire/finish, back and inline text links
     keep their own look. Placed last so it overrides the earlier rules. */
  .create-btn, .continue-btn, .btn-primary, .btn-gold, .google-btn, .magic-btn{
    border-radius:0; background:transparent; border:1px solid rgba(255,255,255,0.85); color:#FFFFFF;
    font-family:'Inter',sans-serif; font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:0.2em;
    padding:16px 32px; transition:background-color .2s, color .2s, border-color .2s;
  }
  .create-btn span{font-family:inherit; font-weight:inherit; font-size:inherit;}
  .create-btn svg, .btn-gold svg, .btn-primary svg, .continue-btn svg{color:currentColor !important;}
  .create-btn:hover, .continue-btn:hover:not(:disabled), .btn-primary:hover:not(:disabled), .btn-gold:hover:not(:disabled),
  .google-btn:hover:not(:disabled), .magic-btn:hover:not(:disabled){
    background:#FFFFFF; color:#0C1030; border-color:#FFFFFF;
  }
  .continue-btn:disabled, .btn-primary:disabled, .btn-gold:disabled, .google-btn:disabled, .magic-btn:disabled{
    background:transparent; color:var(--textFaint); border:1px solid var(--borderLight); opacity:1; cursor:not-allowed;
  }
  .btn-primary, .google-btn, .magic-btn{padding-left:0; padding-right:0;}
  /* Race Archive: same outline look, sized down to sit in the strip header. */
  .archive-link{
    gap:8px; border-radius:0; background:transparent; border:1px solid rgba(255,255,255,0.85); color:#FFFFFF;
    font-family:'Inter',sans-serif; font-weight:600; font-size:11px; letter-spacing:0.2em;
    padding:10px 18px; transition:background-color .2s, color .2s, border-color .2s;
  }
  .archive-link:hover{background:#FFFFFF; color:#0C1030; border-color:#FFFFFF;}
</style>

<script>
/* ============================================================================
 * ENGINEER SIGN-IN — this page is publicly viewable (read-only) with no

 * home page) only unlocks edit access for accounts listed in the
 * `engineers` table — it isn't a gate on viewing the page at all.
 *
 * The session/engineer check runs in the boot sequence at the very bottom

 * ==========================================================================
 */

/* ============================================================================
 * Race Strategy Planner — standalone HTML/JS mimic of the React prototype.
 * Visual + navigational parity with race-strategy-planner.jsx.
 *
 * PERSISTENCE — Stage 3 (Supabase)
 * ------------------------------------------------------------------------
 * loadRaces()/loadCatalog()/createRacePlan()/fetchFullRace()/
 * syncPlanToRaceRecord()/archiveRace() etc. read and write real Supabase
 * tables (races, cars, stints, stint_log, car_catalog — see the schema
 * file). The in-memory shape of state.plan/state.cars/etc. is unchanged
 * from the original localStorage-only version — only these boundary

const FLAG_TYPES = [

  { key:"black",    emoji:"⚫", label:"Penalty", color: "#D8DCE2" },

// The compact flag badge shown on a stint row (before its note is expanded)
// has room for one glance-able symbol. A meatball flag is a much more
// serious/urgent signal than a caution or quiet-time marker, so if it's
// present alongside anything else, it alone gets shown in that badge —
// the other flags are still there and still visible once the note is
// expanded, this only affects the compact field badge.
function priorityFlagBadge(flags){
  if (!flags || !flags.length) return "";
  if (flags.includes("meatball")) return FLAG_TYPES.find(f=>f.key==="meatball").emoji;
  return flags.map(fk => FLAG_TYPES.find(f=>f.key===fk)?.emoji || "").join("");
}
// Threshold for the "negligible final stint" rule: if the very last stint
// in a car's plan gets squeezed down to this many minutes or fewer by the
// overrun/absorb cascade, it's too small a sliver to hand a driver as its
// own stint. Rather than creating a real stint entry for it (which forces
// a driver assignment on a few leftover minutes), the schedule just notes
// the remaining delta — real start/end times elsewhere are never altered
// by this, it only changes what gets displayed as a schedulable stint.
const FINAL_STINT_NEGLIGIBLE_MIN = 20;
function finalStintNegligibleThresholdMin(){
  return FINAL_STINT_NEGLIGIBLE_MIN;
}
const TRACKS = [
  "Barber Motorsports Park","Canadian Tire Motorsports Park","Circuit de Spa-Francorchamps",
  "Circuit of the Americas","Daytona International Speedway","Detroit Grand Prix",
  "Eagles Canyon","Indianapolis Motor Speedway","Laguna Seca","Long Beach",
  "Mid-Ohio Sports Car Course","Nurburgring","Road America","Road Atlanta",
  "Sebring International Raceway","Virginia International Raceway","Watkins Glen International",
  "Other",
];

// Corner numbers per track, keyed by the exact TRACKS entry: [turn
// number, fraction of the lap from start/finish in the direction of
// travel]. The live track map places each number that far along Red
// Mist's GPS outline, so they survive map rebuilds and any drawn size.
// Numbers are explicit because official numbering can skip (Sebring has
// no Turn 12). Labels sit on the outside of the bend; an optional third
// value ("n", "e", "sw" …) forces a side where a kink is too slight to
// tell, or the outside lands on another part of the track. Tracks not
// listed get no corner numbers.
const TRACK_CORNERS = {
  "Sebring International Raceway": [
    [1, 0.0778], [2, 0.1341], [3, 0.1589], [4, 0.1728], [5, 0.1920], [6, 0.2347],
    [7, 0.3402], [8, 0.3577], [9, 0.4108], [10, 0.4742], [11, 0.5148], [13, 0.5561],
    [14, 0.6236, "e"], [15, 0.6881], [16, 0.7317], [17, 0.9192],
  ],
};
// Red Mist's track names don't always match TRACKS ("Michelin Raceway
// Road Atlanta"), so a name matches an entry when it contains every
// distinctive word of it — generic words like "International" ignored.
const TRACK_NAME_FILLER = new Set(["international","raceway","motorsports","motorsport","park","circuit","speedway","course","sports","car","grand","prix","the","of","de"]);
function trackCornersFor(...names){
  for (const name of names){
    if (!name) continue;
    if (TRACK_CORNERS[name]) return TRACK_CORNERS[name];
    const words = String(name).toLowerCase().match(/[a-z]+/g) || [];
    for (const [key, list] of Object.entries(TRACK_CORNERS)){
      const keyWords = (key.toLowerCase().match(/[a-z]+/g) || []).filter(w => !TRACK_NAME_FILLER.has(w));
      if (keyWords.length && keyWords.every(w => words.includes(w))) return list;
    }
  }
  return null;
}

// ---- scheduled quiet time (automatic, not user-editable) ----
// Two tracks impose a mandated Sunday pause at a fixed local clock time.
// It is applied automatically when a plan is built and cannot be added,
// edited, or removed by hand — hence no flag, picker, or action for it.
// Keyed by the exact TRACKS entry; "Road Atlanta" is the same circuit as
// Michelin Raceway Road Atlanta.
const QUIET_TIME_TRACKS = {
  "Barber Motorsports Park": { startHour: 11, startMinute: 0, minutes: 60 },  // 11:00–12:00
  "Road Atlanta":            { startHour: 10, startMinute: 0, minutes: 120 }, // 10:00–12:00
};
// Returns {start, end, minutes} for the pause, or null when it doesn't
// apply — wrong track, not a Sunday, or the window starts at/before the
// green flag (nothing to pause).
function quietWindowFor(track, startDateTime){
  const rule = QUIET_TIME_TRACKS[track];
  if (!rule) return null;
  if (startDateTime.getDay() !== 0) return null; // 0 = Sunday, local time
  const qs = new Date(startDateTime);
  qs.setHours(rule.startHour, rule.startMinute, 0, 0);
  if (+qs <= +startDateTime) return null;
  return { start: qs, end: addMinutes(qs, rule.minutes), minutes: rule.minutes };
}

// ---- persistence (Supabase — see supabase-client.js for setup) ----
async function loadRaces(){
  const { data, error } = await supabase
    .from('races')
    .select('*, cars(*)')
    .order('created_at', { ascending: false });
  if (error){ console.error('loadRaces failed:', error); return []; }
  return data.map(mapRaceRowToRecord);
}

function mapRaceRowToRecord(row){
  return {
    id: row.id,
    eventName: row.event_name,
    eventDateISO: row.event_date,
    redmistEventId: row.redmist_event_id ?? null, // links this race to a WRL event for the Home-tile LIVE badge — see subscribeHomeLiveWatch()
    // The exact Red Mist session this race ran as — stamped by the poller when
    // the race goes green (or on first confident match). An event holds several
    // sessions (quali, Saturday, Sunday), so results/debrief key off this.
    redmistSessionId: row.redmist_session_id ?? null,
    redmistSessionName: row.redmist_session_name ?? null,
    track: row.track || "",
    startTime: (row.start_time || "10:00:00").slice(0,5),
    durationHours: Number(row.duration_hours),
    status: row.status,
    cars: (row.cars || []).map(mapCarRowToCarRecord),
    plan: row.plan_start_at ? {
      startDateTimeISO: row.plan_start_at,
      endDateTimeISO: row.plan_end_at,
      totalMinutes: row.total_minutes,
      carPlans: [], // filled in lazily by fetchFullRace() when the race is actually opened
    } : null,
  };
}
function mapCarRowToCarRecord(row){
  return {
    id: row.id, catalogId: row.catalog_id, number: row.number, team: row.team,
    manufacturer: row.manufacturer, model: row.model, accent: row.accent,
    drivers: row.drivers || [], driverStintMode: row.driver_stint_mode || [],
    startingPosition: row.starting_position,
    finishPosition: parseFinishPosition(row.finish_position), retiredAtStint: row.retired_at_stint,
  };
}

// Full fetch for a single race — pulls stints + stint_log too, which the
// shallow list load above deliberately skips to avoid over-fetching every
// race just to render a home-screen tile.
async function fetchFullRace(raceId){
  const { data: raceRow, error: raceErr } = await supabase
    .from('races').select('*, cars(*)').eq('id', raceId).single();
  if (raceErr || !raceRow){ console.error('fetchFullRace failed:', raceErr); return null; }

  const carIds = raceRow.cars.map(c=>c.id);
  const [{ data: stintRows, error: stintErr }, { data: logRows, error: logErr }] = await Promise.all([
    supabase.from('stints').select('*').in('car_id', carIds).order('stint_index'),
    supabase.from('stint_log').select('*').in('car_id', carIds).order('created_at'),
  ]);
  if (stintErr) console.error('fetchFullRace stints failed:', stintErr);
  if (logErr) console.error('fetchFullRace stint_log failed:', logErr);

  const record = mapRaceRowToRecord(raceRow);
  record.plan = {
    startDateTimeISO: raceRow.plan_start_at,
    endDateTimeISO: raceRow.plan_end_at,
    totalMinutes: raceRow.total_minutes,
    carPlans: raceRow.cars.map(carRow=>{
      const carRecord = mapCarRowToCarRecord(carRow);
      const stints = (stintRows||[]).filter(s=>s.car_id===carRow.id).map(s=>({
        driver: s.driver, driverIndex: s.driver_index,
        startISO: s.start_at, endISO: s.end_at, plannedEndISO: s.planned_end_at,
        lengthMin: s.length_min, position: s.position, notes: s.notes || "",
        flags: s.flags || [], removed: s.removed, quietMinutes: s.quiet_minutes || 0,
        finished: s.finished || false,
      }));
      const log = (logRows||[]).filter(l=>l.car_id===carRow.id).map(l=>({
        stintIdx: l.stint_index, text: l.message, type: l.type, ts: new Date(l.created_at).getTime(),
        // Keep the row id and key so a keyed entry created in an earlier
        // session can still be revised in place instead of duplicated.
        dbId: l.id, key: l.entry_key || null, meta: undefined,
      }));
      return { car: carRecord, stints, log, retiredAtStint: carRow.retired_at_stint };
    }),
  };
  return record;
}

// ---- helpers ----
// ================= Race results: shared lap computations =================
// Classification + per-lap helpers used by the Red Mist archive build.

// Clusters YELLOW-flagged laps by time gap (>10min = separate caution
// periods) across the whole field. Mirrors the caution-period reconstruction
// validated in the standalone prototype.
// Shared clustering logic for flag-status periods: groups laps carrying a
// given status by time gap (>10min = a new distinct period). Used for
// both cautions (YELLOW) and red flags (RED) below.
function computeFlagPeriods(lapsByPos, statusValue){
  const times = [];
  lapsByPos.forEach(laps => laps.forEach(l => { if (l.status === statusValue) times.push(l.timeOfDay); }));
  times.sort((a,b)=>a-b);
  if (!times.length) return [];
  const clusters = [];
  let cur = [times[0]];
  for (let i=1;i<times.length;i++){
    if (times[i] - cur[cur.length-1] > 600000){ clusters.push(cur); cur = [times[i]]; }
    else cur.push(times[i]);
  }
  clusters.push(cur);
  return clusters.map(c => ({ count: c.length, start: c[0], end: c[c.length-1] }));
}
function computeCautions(lapsByPos){
  return computeFlagPeriods(lapsByPos, "YELLOW");
}

// A genuine red flag (full-course stoppage) does NOT show up in the
// per-lap `status` field at all — confirmed against real session data
// that unambiguously had multiple red flags (driver-confirmed lap
// numbers), yet contained zero "RED" values anywhere. That makes sense:
// during an actual stoppage no car is crossing the line, so there's no
// lap being timed to attach a color to.
//
// The key discriminator (confirmed against driver-verified ground truth,
// not just guessed): a long YELLOW — cars still circulating, just slow —
// produces gaps of a few minutes (250-420s observed). A RED — cars fully
// parked — produces a SINGLE lap's gap of many multiples of that
// (1200-15000+s observed, i.e. 20+ minutes), because nothing crosses
// the line at all until the stoppage ends. Checking gap MAGNITUDE (not
// just "many cars affected," which a long yellow also triggers) is what
// actually separates the two.
//
// Deliberately does NOT exclude inPit=true laps here (unlike other gap-
// based logic in this file) — during a red flag the field is commonly
// directed to stop IN PIT LANE, which timing still tags as in-pit even
// though it's not a real pit stop. Excluding those laps was confirmed
// (against real data) to silently drop the leaders — and sometimes most
// of the field — from red flag events entirely, since they're often the
// cars closest to pit lane when the flag comes out.
//
// With that fixed, a genuine red flag reliably shows 17-26+ distinct
// cars in the cluster, while coincidental unrelated single-car issues
// (a mechanical repair, a long unflagged stop) topped out at 4 across
// two different real sessions (one with 4 confirmed red flags, one with
// zero) — confirmed with no ambiguous middle ground, so MIN_CARS=10 sits
// with wide margin on both sides of that gap.
function computeRedFlags(lapsByPos){
  const SINGLE_LAP_THRESHOLD_MS = 600000;   // 10 min — a slow yellow lap doesn't get anywhere near this
  const CLUSTER_WINDOW_MS = 900000;          // 15 min — merges a stop+regroup+restart sequence into one period
  const MIN_CARS = 10;                       // wide safety margin: real reds hit 17-26 cars, noise (unrelated single-car issues, including a coincidental 4-car cluster on a different session) topped out at 4

  const events = []; // {timeOfDay, pos}
  lapsByPos.forEach((laps, pos) => {
    let prevTod = null;
    laps.forEach(l => {
      if (prevTod != null){
        const gapMs = l.timeOfDay - prevTod;
        if (gapMs > SINGLE_LAP_THRESHOLD_MS) events.push({ timeOfDay: l.timeOfDay, pos });
      }
      prevTod = l.timeOfDay;
    });
  });
  events.sort((a,b)=>a.timeOfDay-b.timeOfDay);
  if (!events.length) return [];

  const clusters = [];
  let cur = [events[0]];
  for (let i=1;i<events.length;i++){
    if (events[i].timeOfDay - cur[cur.length-1].timeOfDay > CLUSTER_WINDOW_MS){ clusters.push(cur); cur = [events[i]]; }
    else cur.push(events[i]);
  }
  clusters.push(cur);

  return clusters
    .map(c => ({ carCount: new Set(c.map(e=>e.pos)).size, times: c.map(e=>e.timeOfDay) }))
    .filter(c => c.carCount >= MIN_CARS)
    .map(c => ({ count: c.carCount, start: c.times[0], end: c.times[c.times.length-1] }));
}

// Best-pace and longest green-flag stints (>=3 consecutive non-pit GREEN
// laps), optionally scoped to a set of result classes.
// Best-pace (min minLapsForBest laps — short stints like a 5-lap opener
// can post an unrepresentative fast average) and longest (min 3 laps,
// no further floor) green-flag stints, scoped to classFilter.
function computeStints(classification, lapsByPos, classFilter, minLapsForBest){
  minLapsForBest = minLapsForBest || 3;
  const stints = [];
  classification.forEach(r => {
    if (classFilter && classFilter.size && !classFilter.has(r.resultClass)) return;
    const laps = lapsByPos.get(r.position) || [];
    let cur = [];
    const flush = () => { if (cur.length >= 3) stints.push({ num: r.startNumber, name: r.name, laps: cur.slice() }); cur = []; };
    laps.forEach(l => {
      if (l.inPit || l.status !== "GREEN" || l.lapTime == null){ flush(); return; }
      cur.push(l);
    });
    flush();
  });
  if (!stints.length) return { best: null, longest: null };

  let best = null;
  stints.forEach(s => {
    if (s.laps.length < minLapsForBest) return;
    const avg = s.laps.reduce((a,l)=>a+l.lapTime,0) / s.laps.length;
    if (!best || avg < best.avg) best = { num: s.num, name: s.name, avg, lapCount: s.laps.length };
  });

  const maxLen = Math.max(...stints.map(s=>s.laps.length));
  const longestEntries = [];
  const seenNums = new Set();
  stints.filter(s=>s.laps.length===maxLen).forEach(s => {
    if (!seenNums.has(s.num)){ seenNums.add(s.num); longestEntries.push({ num: s.num, name: s.name }); }
  });
  return { best, longest: { lapCount: maxLen, entries: longestEntries } };
}

// Reconstructs "laps led" from lap-completion order: at each point in time,
// whichever car has completed the most race laps (tie-broken by who reached
// that lap count first) is credited with leading the newly-reached lap
// number. Cross-validated against official gap data in the prototype.
function computeLapsLed(classification, lapsByPos){
  const events = [];
  lapsByPos.forEach((laps, pos) => laps.forEach(l => events.push([l.timeOfDay, pos, l.lap])));
  events.sort((a,b)=>a[0]-b[0]);
  const state = new Map();
  let globalMax = 0;
  const lapsLed = {};
  events.forEach(([tod, pos, lapNum]) => {
    state.set(pos, [lapNum, tod]);
    let leader = null, leaderLaps = -1, leaderTod = Infinity;
    state.forEach(([laps, t], p) => {
      if (laps > leaderLaps || (laps === leaderLaps && t < leaderTod)){ leader = p; leaderLaps = laps; leaderTod = t; }
    });
    const curMax = state.get(leader)[0];
    if (curMax > globalMax){
      lapsLed[leader] = (lapsLed[leader]||0) + (curMax - globalMax);
      globalMax = curMax;
    }
  });
  let topPos = null, topLaps = -1;
  Object.entries(lapsLed).forEach(([pos,laps]) => { if (laps > topLaps){ topLaps = laps; topPos = parseInt(pos,10); } });
  if (topPos == null) return null;
  const row = classification.find(r=>r.position===topPos);
  return row ? { num: row.startNumber, name: row.name, laps: topLaps } : null;
}

// =============== Red Mist race archive ===============
// Builds the archived race's results (race.archiveResults) from Red Mist
// data — the Race Overview tiles, full-field standings, per-car result
// tiles and finish positions all render from this one object.
//
// Sources:
//   redmist_race_results  — final classification, written by the poller
//                           at the checkered (one row per car)
//   redmist_live_laps     — every lap, for laps led / stints / lap-based
//                           caution + red-flag fallback
//   redmist_flag_periods  — logged flag timeline; when present it is the
//                           source for Total Cautions / Red Flags
//   redmist_race_summary  — the computed overview, saved at archive time so
//                           reopening an archived race doesn't re-read laps
const RM_CAUTION_FLAGS = new Set([2, 7, 8, 11, 12]); // yellow, code 35, code 60, debris, waving yellow
const RM_GREEN = 1, RM_RED = 3;

// PostgREST caps a response at 1,000 rows; a race has ~7,000 laps.
async function fetchAllRows(makeQuery, pageSize = 1000){
  const out = [];
  for (let from = 0; ; from += pageSize){
    const { data, error } = await makeQuery().range(from, from + pageSize - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < pageSize) break;
  }
  return out;
}

// The race plan's saved Red Mist results, grouped by session; latest race
// session wins (matches loadRaceResults()).
async function fetchRedmistResultRows(race, strict = false){
  let { data, error } = await supabase.from("redmist_race_results").select("*").eq("race_id", String(race.id));
  if (error) throw error;
  if (!data?.length && race.redmistEventId != null){
    const res = await supabase.from("redmist_race_results").select("*").eq("event_id", race.redmistEventId).is("race_id", null);
    if (res.error) throw res.error;
    data = res.data;
  }
  if (!data?.length) return null;
  // Stamped session: use exactly that one, no guessing.
  if (race.redmistSessionId != null){
    const own = data.filter(r => Number(r.session_id) === Number(race.redmistSessionId)
      && (!race.redmistSessionName || r.session_name === race.redmistSessionName));
    if (own.length || strict) return own.length ? own : null;
  }
  const picked = pickResultSession(data, race, strict);
  if (!picked) return null;
  // Strict picks only ever come from a same-day match — stamp it on the race
  // so every later lookup is exact (backfills races from before stamping).
  if (strict && race.redmistSessionId == null){
    const sid = Number(picked.rows[0].session_id), sname = picked.rows[0].session_name;
    race.redmistSessionId = sid; race.redmistSessionName = sname;
    const cached = state.races?.find(r => r.id === race.id);
    if (cached && cached !== race){ cached.redmistSessionId = sid; cached.redmistSessionName = sname; }
    supabase.from("races").update({ redmist_session_id: sid, redmist_session_name: sname })
      .eq("id", race.id).is("redmist_session_id", null)
      .then(({ error }) => { if (error) console.warn("[race-results] couldn't stamp session on race", race.id, error); });
  }
  return picked.rows;
}

function rmResultStatus(s){
  if (s === "DNS") return "DNS";
  if (!s || s === "Running") return "Normal";
  return "DNF"; // DNF, or a Red Mist status like Mechanical / Contact
}

// Final classification, one row per car. Positions are re-numbered 1..n in
// Red Mist's overall order so they're guaranteed unique (the lap-based
// helpers key laps by position).
function rmClassification(resultRows){
  const rows = resultRows
    .filter(r => String(r.car_number).toLowerCase() !== "53x")
    .sort((a, b) => {
      const ad = a.result_status === "DNS", bd = b.result_status === "DNS";
      if (ad !== bd) return ad ? 1 : -1;
      const ap = a.overall_position ?? 9999, bp = b.overall_position ?? 9999;
      if (ap !== bp) return ap - bp;
      return (b.laps || 0) - (a.laps || 0);
    });
  const winnerLaps = rows.reduce((m, r) => Math.max(m, r.laps || 0), 0);
  const classPos = {};
  return rows.map((r, i) => {
    const cls = r.class || "";
    classPos[cls] = (classPos[cls] || 0) + 1;
    const best = rmTimeToSeconds(r.best_time);
    return {
      position: i + 1,
      positionInClass: r.class_position ?? classPos[cls],
      startNumber: String(r.car_number),
      resultClass: cls,
      name: r.team_name || "",
      status: rmResultStatus(r.result_status),
      numberOfLaps: r.laps || 0,
      bestLap: r.best_lap || 0,
      bestTime: best != null ? fmtLapTime(best) : "",
      totalTime: "", totalTimeSec: null,
      lapsBehind: winnerLaps - (r.laps || 0),
      timeDiffSec: 0,
      _gap: r.overall_gap || "",
      _pitStops: r.pit_stops ?? 0,
    };
  });
}

// Laps per car: { lap, timeOfDay, lapTime, inPit, status }.
// inPit covers the pit lap, the out-lap after it, and — as a fallback for
// laps recorded before pit detection worked — any lap over 150% of that
// car's median, so a stint never runs straight through an unflagged stop.
function rmLapsByPos(classification, lapRows){
  const byNum = {};
  lapRows.forEach(l => (byNum[l.car_number] ||= []).push(l));
  const lapsByPos = new Map();
  classification.forEach(c => {
    const laps = (byNum[c.startNumber] || []).sort((a, b) => a.lap_number - b.lap_number);
    const times = laps.map(l => Number(l.lap_time_seconds)).filter(x => x > 0).sort((a, b) => a - b);
    const median = times.length ? times[Math.floor(times.length / 2)] : null;
    // In-lap through out-lap of every pit cycle (see rmPitCycles) are
    // non-racing laps.
    const { cycleLaps } = rmPitCycles(laps);
    lapsByPos.set(c.position, laps.map((l, i) => {
      const t = Number(l.lap_time_seconds) > 0 ? Number(l.lap_time_seconds) : null;
      const slow = median != null && t != null && t > median * 1.5;
      const inPit = cycleLaps.has(l.lap_number) || slow;
      return { lap: l.lap_number, timeOfDay: new Date(l.captured_at).getTime(), lapTime: t, inPit, status: l.caution_lap === true ? "YELLOW" : "GREEN" };
    }));
  });
  return lapsByPos;
}

// Cautions / red flags from the logged flag timeline. A caution runs from
// the first caution flag until the next green (a Yellow that becomes a
// Code 35 is one caution); consecutive red periods count once.
function rmFlagSummary(periods){
  const sorted = [...periods].sort((a, b) => new Date(a.started_at) - new Date(b.started_at));
  const cautions = [], redFlags = [];
  let caution = null, red = null;
  sorted.forEach(p => {
    const f = Number(p.flag), start = new Date(p.started_at).getTime();
    const end = p.ended_at ? new Date(p.ended_at).getTime() : start;
    if (f === RM_GREEN || f === 5){ caution = null; }
    else if (RM_CAUTION_FLAGS.has(f) || f === RM_RED){
      if (!caution && RM_CAUTION_FLAGS.has(f)){ caution = { count: 1, start, end }; cautions.push(caution); }
      else if (caution) caution.end = end;
    }
    if (f === RM_RED){
      if (!red){ red = { count: 1, start, end }; redFlags.push(red); } else red.end = end;
    } else red = null;
  });
  return { cautions, redFlags };
}

// Clean average lap per car across the whole race (no pit/out/caution
// laps, nothing over 110% of the car's median).
function rmAvgLaps(classification, lapsByPos){
  const out = {};
  classification.forEach(c => {
    const t = (lapsByPos.get(c.position) || []).filter(l => !l.inPit && l.status === "GREEN" && l.lapTime).map(l => l.lapTime).sort((a, b) => a - b);
    if (!t.length) return;
    const med = t[Math.floor(t.length / 2)];
    const clean = t.filter(x => x <= med * 1.10);
    if (clean.length) out[c.startNumber] = clean.reduce((a, b) => a + b, 0) / clean.length;
  });
  return out;
}

// ---- Archive extras: fastest lap, fastest stops, per-driver consistency ----
const RM_MIN_PIT_MS = 15000; // shorter "stops" are drive-throughs / timing noise

// Stops that served a penalty (drive-through / stop-and-go), marked by the
// archive backfill from Red Mist's control log or the track's drive-through
// time. They count toward no metric: not fastest stops, pit totals, stop
// counts, driver changes, stint splits or pit cycles.
const rmIsPenaltyStop = s => s?.penalty_served === true;
// Stops made after a car took the checkered (driving back to the paddock)
// aren't race stops. A stop's lap_number is its in-lap, the lap the car
// entered the pits on, so the lap before it must have finished before the
// checkered; a stop that started after the checkered is dropped. Checkered time is the session's
// checkered_at from the results snapshot, else the overall leader crossing
// its final classified lap. With no lap time to check, a stop recorded past
// the car's final classified lap is dropped.
function rmCheckeredMs(resultRows, lapRows){
  const at = (resultRows || []).map(r => r.checkered_at ? Date.parse(r.checkered_at) : NaN).filter(Number.isFinite);
  if (at.length) return Math.min(...at);
  const leader = [...(resultRows || [])].sort((a, b) => (b.laps || 0) - (a.laps || 0))[0];
  if (!leader) return null;
  const l = (lapRows || []).find(x => String(x.car_number) === String(leader.car_number) && x.lap_number === leader.laps);
  return l ? new Date(l.captured_at).getTime() : null;
}
function rmDropPostRaceStops(stops, lapRows, resultRows){
  if (!stops?.length) return stops || [];
  const checkered = rmCheckeredMs(resultRows, lapRows);
  const cross = {};
  (lapRows || []).forEach(l => { cross[`${l.car_number}|${l.lap_number}`] = new Date(l.captured_at).getTime(); });
  const finalLap = Object.fromEntries((resultRows || []).map(r => [String(r.car_number), r.laps || 0]));
  return stops.filter(st => {
    const t = cross[`${st.car_number}|${st.lap_number - 1}`];
    if (checkered != null && t != null) return t < checkered - 1000;
    const fl = finalLap[String(st.car_number)];
    return !(fl && st.lap_number > fl);
  });
}
const rmServiceStops = stops => (stops || []).filter(s => !rmIsPenaltyStop(s));
// A pit cycle spans the in-lap (the lap the car entered the pits on — the
// stop happens on it) and the out-lap (the lap it leaves pit lane on). A
// stop row's lap_number is already the in-lap: the poller records the lap
// in progress at pit entry. The in-lap ends the stint, the out-lap starts
// the next, and both are non-racing laps.
// Lap flags: is_pit_lap marks the in-lap. Where the timing line runs
// through pit lane past the box, the car crosses it still in pit lane and
// the out-lap is flagged too (#81 Sun: 119 in-lap with the stop, 120 the
// crawl down pit lane). So in a run of consecutive pit-flagged laps the
// first is the in-lap and the last the out-lap; a single flagged lap is
// the in-lap and the lap after it the out-lap.
const rmPitInLap = lap => lap;
function rmAlignStopLaps(stops){
