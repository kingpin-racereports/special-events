      const extraStop = changeSecs.length && svc != null ? debriefMedian(changeSecs) - svc : null;
      if (extraStop != null && extraStop >= 3)
        out.push(`Driver-change stops: ${mmss(debriefMedian(changeSecs))} median vs. ${mmss(svc)} fuel-only — ${red(`+${Math.round(extraStop)}s`)} each`);

      // Settling in after a change: first laps vs. the rest of that stint,
      // against our own same-driver stops (else the class after its stops).
      const warm = ck.warmByCar[c.number] || [];
      const oursCh = warm.filter(w => w.change).map(w => w.cost);
      const oursSame = warm.filter(w => !w.change).map(w => w.cost);
      const field = Object.entries(ck.warmByCar).filter(([n]) => !ourNums.has(n)).flatMap(([, ws]) => ws.map(w => w.cost));
      const base = oursSame.length ? debriefMean(oursSame) : field.length ? debriefMean(field) : null;
      const settle = oursCh.length && base != null ? Math.max(0, debriefMean(oursCh) - base) * DEBRIEF.WARM_LAPS : 0;

      const changes = ourStops.filter(st => st.change).length;
      const drivers = new Set((sat.stints || []).map(s2 => s2.driver).filter(Boolean)).size;
      const extraChanges = changes - Math.max(0, drivers - 1);
      const perChange = Math.max(0, extraStop || 0) + settle;
      if (extraChanges > 0 && perChange >= 3)
        out.push(`Double stints could save ~${red(fmtDur(extraChanges * perChange))} (~${Math.round(Math.max(0, extraStop || 0))}s/stop${settle >= 1 ? ` + ~${Math.round(settle)}s settling in` : ""})`);
    }

    // More stops than the class top 3.
    const top = db.classes[sat.cls]?.top;
    if (top && sat.stops && !top.nums.includes(String(c.number)) && sat.stops >= top.stops + 0.75)
      out.push(`${sat.stops} stops — ${cls} top 3 averaged ${top.stops.toFixed(1)}`);

    return out.length ? `<div style="margin:6px 0 10px;"><span class="eyebrow">Key Takeaways</span>${out.map(line).join("")}</div>` : "";
  };

  const carBlocks = db.cars.map(c => `
    <div style="border-left:3px solid ${c.accent};padding-left:12px;margin-bottom:16px;">
      <div class="font-display" style="font-weight:600;font-size:14px;margin-bottom:4px;">#${esc(c.number)}</div>
      ${timeLossBlock(c)}
      ${keyTakeaways(c)}
      ${closerLine(c)}
      ${c.drivers.map(d => driverCard(c, d)).join("")}
    </div>`).join("");

  // Race Pace by Hour: the class field line plus each Kingpin car's own
  // pace in its car colour (bridged through stops and cautions).
  const classBlocks = Object.entries(db.classes).map(([cls, k]) => {
    if (!k.chart) return "";
    const carLines = db.cars.filter(c => c.sat.cls === cls && c.sat.paceSegs?.length).map(c => {
      const segs = c.sat.paceSegs;
      const pts = k.chart.field.map((_, i) => { const sg = segs.find(x => x.points[i]); return sg ? sg.points[i] : null; });
      return { label: `#${c.number}`, color: c.accent || T.blue, width: 2.2,
        points: racePaceBridge(pts, k.chart.field, [{ from: segs[0].from, to: segs[segs.length - 1].to }]) };
    });
    const chart = debriefPaceChartSvg(k.chart, [
      { label: `${cls} field`, color: T.textMuted, points: k.chart.field, dash: "5 4", width: 2 },
      ...carLines,
    ], { ariaLabel: `${cls} field race pace with Kingpin cars, by hour` });
    return chart ? `<div style="margin-bottom:18px;"><span class="eyebrow">Race Pace by Hour${Object.keys(db.classes).length > 1 ? ` · ${esc(cls)}` : ""}</span><div style="margin-top:8px;">${chart}</div></div>` : "";
  }).join("");

  // Archived Race Debrief: contents only — the collapsible supplies the frame.
  if (opts.bare) return carBlocks ? `${classBlocks}${carBlocks}` : line("No Kingpin car took the checkered flag in this race.");

  return `
    <section style="margin-bottom:32px;">
      <h2>Saturday Debrief</h2>
      <div class="catalog-panel" style="margin-top:0;">
        ${classBlocks}
        ${carBlocks || line("None of these cars ran in that race.")}
      </div>
    </section>`;
}

function rmAssemble(classification, sessionLabel, summary){
  const pitStopsByNumber = Object.fromEntries(classification.map(c => [c.startNumber, c._pitStops]));
  const intervals = {};
  classification.forEach(c => {
    intervals[c.startNumber] = c.status === "DNS" ? "—" : c.position === 1 ? "Leader" : (c._gap || (c.lapsBehind ? `${c.lapsBehind} lap${c.lapsBehind === 1 ? "" : "s"}` : "—"));
  });
  const running = classification.filter(r => r.status !== "DNS");
  return {
    sessionId: sessionLabel, fetchedAt: summary?.built_at || new Date().toISOString(),
    classification, pitStopsByNumber, intervals,
    overview: {
      entries: classification.length,
      finishers: classification.filter(r => r.status === "Normal").length,
      dnf: classification.filter(r => r.status === "DNF").length,
      dns: classification.filter(r => r.status === "DNS").length,
      totalLaps: classification.length ? Math.max(...classification.map(r => r.numberOfLaps)) : 0,
      totalPitStops: Object.values(pitStopsByNumber).reduce((a, b) => a + b, 0),
      carsOnLeadLap: running.filter(r => r.lapsBehind === 0).length,
    },
    cautions: summary?.cautions || [],
    redFlags: summary?.red_flags || [],
    lapsLed: summary?.laps_led || null,
    bestStint: summary?.best_stint || null,
    longestStint: summary?.longest_stint || null,
    avgLapByNumber: summary?.avg_laps || {},
    fastestLap: summary?.fastest_lap || null,
    fastestStop: summary?.fastest_stop || null,
    fastestStopDc: summary?.fastest_stop_dc || null,
    driverConsistency: summary?.driver_consistency || {},
    pitTimes: summary?.pit_times || null,
    raceClasses: ["GTO"],
  };
}

// Full build: reads laps + flag timeline, computes the overview, and (for
// engineers) saves it to redmist_race_summary. Returns null if this race
// has no Red Mist results.
async function buildRedmistArchive(race, { save } = { save: false }){
  const resultRows = await fetchRedmistResultRows(race);
  if (!resultRows) return null;
  const { event_id, session_id, session_name } = resultRows[0];
  const classification = rmClassification(resultRows);

  const scope = q => q.eq("event_id", event_id).eq("session_id", session_id).eq("session_name", session_name);
  const lapCols = "car_number, lap_number, lap_time_seconds, is_pit_lap, caution_lap, captured_at";
  const [lapRows, periods, allPitStops] = await Promise.all([
    // driver_name on laps is newer — fall back to the older column set if
    // the column isn't there yet.
    fetchAllRows(() => scope(supabase.from("redmist_live_laps").select(lapCols + ", driver_name")).order("car_number").order("lap_number"))
      .catch(() => fetchAllRows(() => scope(supabase.from("redmist_live_laps").select(lapCols)).order("car_number").order("lap_number"))),
    fetchAllRows(() => supabase.from("redmist_flag_periods").select("flag, started_at, ended_at")
      .eq("event_id", event_id).eq("session_id", session_id).eq("session_name", session_name)
      .order("started_at")).catch(() => []), // table may not exist on older deploys
    fetchAllRows(() => scope(supabase.from("redmist_live_pit_stops")
      .select("car_number, lap_number, pit_duration_ms, driver_change, driver_out, driver_in, penalty_served"))).catch(() => []),
  ]);
  const pitStops = rmServiceStops(rmAlignStopLaps(rmDropPostRaceStops(allPitStops, lapRows, resultRows)));

  const lapsByPos = rmLapsByPos(classification, lapRows);
  // Logged flag timeline when we have one; lap-based inference otherwise
  // (races run before flag logging existed).
  const flagSource = periods.length ? "flag_log" : "laps";
  const { cautions, redFlags } = periods.length
    ? rmFlagSummary(periods)
    : { cautions: computeCautions(lapsByPos), redFlags: computeRedFlags(lapsByPos) };
  // Best Stint Pace only counts cars that ran a real share of the race —
  // at least half their class winner's laps. A car out after 17 laps
  // (e.g. #54 on Sunday) can post one quick early run, but it isn't
  // comparable to cars that ran 100+. Longest Stint still considers all.
  const classWinnerLaps = {};
  classification.forEach(c => { classWinnerLaps[c.resultClass] = Math.max(classWinnerLaps[c.resultClass] || 0, c.numberOfLaps); });
  const paceEligible = classification.filter(c => c.numberOfLaps >= 0.5 * (classWinnerLaps[c.resultClass] || 0));
  const bestStints = computeStints(paceEligible, lapsByPos, new Set(["GTO"]), 15);
  const allStints = computeStints(classification, lapsByPos, new Set(["GTO"]), 15);
  const stints = { best: bestStints.best, longest: allStints.longest };

  const flagRedPeriods = periods.length ? rmFlagSummary(periods).redFlags : redFlags;
  const stops = rmFastestStops(classification, pitStops, lapRows, flagRedPeriods);
  const ourNumbers = new Set((race.cars || []).map(c => String(c.number)));

  const summary = {
    race_id: String(race.id), event_id, session_id, session_name,
    cautions, red_flags: redFlags,
    laps_led: computeLapsLed(classification, lapsByPos),
    best_stint: stints.best, longest_stint: stints.longest,
    avg_laps: rmAvgLaps(classification, lapsByPos),
    fastest_lap: rmFastestLap(classification),
    fastest_stop: stops.plain,
    fastest_stop_dc: stops.dc,
    driver_consistency: rmDriverConsistency(ourNumbers, classification, lapsByPos, lapRows, pitStops, resultRows),
    pit_times: rmPitTimes(classification, pitStops, lapRows, flagRedPeriods),
    flag_source: flagSource,
    built_at: new Date().toISOString(),
  };
  if (save){
    const { error } = await supabase.from("redmist_race_summary").upsert(summary, { onConflict: "race_id" });
    if (error) console.error("[rm-archive] saving summary failed:", error);
  }
  return rmAssemble(classification, session_name, summary);
}

// Opening an archived race: saved results + saved summary, no lap reads.
// Falls back to a full build if the summary was never saved, and returns
// null if there are no Red Mist results at all.
async function loadRedmistArchive(race){
  const resultRows = await fetchRedmistResultRows(race);
  if (!resultRows) return null;
  const { data: summary, error } = await supabase.from("redmist_race_summary").select("*").eq("race_id", String(race.id)).maybeSingle();
  if (error) console.error("[rm-archive] summary fetch failed:", error);
  // No summary yet, or one saved before fastest-stop / driver consistency
  // were added — build (and, for engineers, save) a fresh one.
  const dcEntries = summary ? Object.values(summary.driver_consistency || {}).flat() : [];
  if (!summary || summary.driver_consistency == null || summary.pit_times == null || dcEntries.some(e => !e.ranges || e.seconds == null || e.adj !== 4)) return buildRedmistArchive(race, { save: state.isEngineer });
  return rmAssemble(rmClassification(resultRows), resultRows[0].session_name, summary);
}

async function loadArchiveResults(race){
  try {
    return await loadRedmistArchive(race);
  } catch (e){
    console.error("[rm-archive] load failed:", e);
    return null;
  }
}

// Loads real pit-in/pit-out cycle data from Red Mist Timing for this race,
// when available (see the redmist-backfill project: pulls Red Mist's
// LoadCarLaps data, derives pit cycles, and upserts into redmist_pit_cycles
// keyed on race_id/car_number/stop_num).
//
// Deliberately narrow: only surfaces duration_pdm_seconds, the field
// validated against a crew stopwatch during this project (see project notes
// — pdm matched real timing within a few seconds on two independent
// stops; a separate clock-gap measure was tried and rejected as
// consistently ~60-300s too long). red_flag_overlap is surfaced because a
// stop that overlaps a session-wide red flag has an unreliable pdm (the
// clock keeps running while the field is stopped, not being serviced) —
// confirmed against a real stop that was ~26 minutes by clock time but
// pdm=81s. needs_review flags stops whose numbers don't fit a normal
// pattern at all (e.g. a confirmed 95-minute garage repair) for a human to
// annotate via the notes field — not yet exposed in this render, kept for
// a future manual-correction UI.
//
// Grouped by car_number, ordered by stop_num, so each car's tile can just
// read race.redmistPitCycles.byCarNumber[car.number] directly.
// Loads real pit-in/pit-out cycle data from Red Mist Timing for this race,
// when available (see the redmist-backfill project: pulls Red Mist's
// LoadCarLaps data, derives pit cycles, and upserts into redmist_pit_cycles
// keyed on race_id/car_number/stop_num).
//
// Two duration fields are used, for two different situations - confirmed
// against real race-day ground truth, not just guessed:
//
//   duration_pdm_seconds (the default) - Red Mist's own reported duration.
//     Validated against a crew stopwatch on two independent stops (within a
//     few seconds both times). Used for ordinary stops.
//
//   duration_clockgap_seconds (only when needsReview && !redFlagOverlap) -
//     literal elapsed time between the car entering and leaving pit-lane
//     (the `ip` flag transition). Normally ~60-300s LONGER than pdm for an
//     ordinary stop (some lag in how the flag trips), which is why it's not
//     used generally. But for a genuine extended stop - e.g. a garage
//     repair - pdm badly understates the real time lost (confirmed real
//     case: pdm=114s, but the car was actually off track for ~95 minutes)
//     while clock-gap correctly captures the whole thing. That's exactly
//     what needsReview flags: a stop whose pdm/clock-gap disagree by more
//     than a rough threshold with no red flag to explain it.
//
// redFlagOverlap stops are the other case where a large clock-gap shows up,
// but there it does NOT mean a real time loss - the whole field was
// stopped by the session, not just this car - so those intentionally keep
// showing "Red Flag" rather than either duration number (confirmed real
// case: clock-gap ~26 minutes on a stop that wasn't actually a long repair,
// just badly timed against a red flag).
// Pit Stop Times for an archived race. redmist_pit_cycles only exists for
// races that went through the redmist-backfill project; races captured by
// the live poller have their stops in redmist_live_pit_stops instead. Any
// of the race's cars missing from the former are filled from the latter.
async function loadArchivePitStops(race){
  const cycles = await loadRedmistPitCyclesFromSupabase(race.id);
  const nums = (race.cars || []).map(c => String(c.number)).filter(n => n.toLowerCase() !== "53x");
  if (!nums.length) return cycles;
  let live = null;
  try { live = await loadLivePitStopsForRace(race, nums); }
  catch (e){ console.error("[pit] live pit stop load failed:", e); }
  if (!live) return cycles;
  const out = { ...(cycles?.byCarNumber || {}) };
  nums.forEach(n => {
    const lv = live.byCarNumber[n] || [];
    const cy = out[n];
    if (!cy?.length){ if (lv.length) out[n] = lv; return; }
    // Older races keep redmist_pit_cycles for durations, flags and review
    // notes, but its lap numbers are estimates and its driver names are
    // Red Mist's raw report. Take the lap and drivers from the stop rows
    // the stints, Drivers table and lap fixes all use — matched in order
    // when the stop counts agree, else to the nearest lap — unless the
    // cycle row carries a manual confirmation.
    const used = new Set();
    cy.forEach((c, i) => {
      let m = lv.length === cy.length ? lv[i] : null;
      if (!m && c.lap != null){
        m = lv.filter(x => !used.has(x) && x.lap != null && Math.abs(x.lap - c.lap) <= 5)
          .sort((a, b) => Math.abs(a.lap - c.lap) - Math.abs(b.lap - c.lap))[0] || null;
      }
      if (!m) return;
      used.add(m);
      c.lap = m.lap;
      if (!c.confirmed){ c.driverIn = m.driverIn; c.driverOut = m.driverOut; c.driverChanged = m.driverChanged; }
    });
  });
  return { byCarNumber: out };
}

// Same shape as loadRedmistPitCyclesFromSupabase(), built from the live
// poller's rows for this race's own session. Duration is Red Mist's
// pit_duration_ms (the same pdm figure validated against a stopwatch).
// The poller doesn't record flag state on a stop, so it's derived here:
// a stop (in-lap completion minus its duration, with a minute of slack
// either side) that overlaps a logged red flag period is Red Flag; one
// that overlaps a caution period, or whose pit lap / out-lap is a caution
// lap, is Caution. Unfinished rows (no duration) and sub-15s drive-
// through/timing noise are left out, as in the race overview stats.
async function loadLivePitStopsForRace(race, carNumbers){
  const resultRows = await fetchRedmistResultRows(race);
  if (!resultRows) return null;
  const { event_id, session_id, session_name } = resultRows[0];
  const scope = q => q.eq("event_id", event_id).eq("session_id", session_id).eq("session_name", session_name);
  const [stops, periods] = await Promise.all([
    fetchAllRows(() => scope(supabase.from("redmist_live_pit_stops")
      .select("car_number, stop_num, lap_number, pit_duration_ms, driver_change, driver_out, driver_in, penalty_served"))
      .in("car_number", carNumbers).order("car_number").order("lap_number")),
    fetchAllRows(() => scope(supabase.from("redmist_flag_periods").select("flag, started_at, ended_at")).order("started_at")).catch(() => []),
  ]);
  let kept = stops.filter(s => Number(s.pit_duration_ms) >= RM_MIN_PIT_MS);
  if (!kept.length) return null;

  const lapNums = [...new Set(kept.flatMap(s => [s.lap_number - 1, s.lap_number, s.lap_number + 1]))];
  const laps = lapNums.length ? await fetchAllRows(() => scope(supabase.from("redmist_live_laps")
    .select("car_number, lap_number, caution_lap, captured_at"))
    .in("car_number", carNumbers).in("lap_number", lapNums)).catch(() => []) : [];
  kept = rmDropPostRaceStops(kept, laps, resultRows);
  if (!kept.length) return null;
  kept = rmAlignStopLaps(kept);
  const lapAt = {};
  laps.forEach(l => { lapAt[`${l.car_number}|${l.lap_number}`] = l; });

  const span = p => ({ flag: Number(p.flag), a: new Date(p.started_at).getTime(), b: p.ended_at ? new Date(p.ended_at).getTime() : Infinity });
  const reds = periods.map(span).filter(p => p.flag === RM_RED);
  const yellows = periods.map(span).filter(p => RM_CAUTION_FLAGS.has(p.flag));
  const overlaps = (list, a, b) => list.some(p => a <= p.b && b >= p.a);

  const byCarNumber = {};
  kept.forEach(s => {
    const num = String(s.car_number);
    const inLap = lapAt[`${num}|${s.lap_number}`], outLap = lapAt[`${num}|${s.lap_number + 1}`];
    const end = inLap ? new Date(inLap.captured_at).getTime() : null;
    const a = end != null ? end - Number(s.pit_duration_ms) - 60000 : null, b = end != null ? end + 60000 : null;
    const redFlagOverlap = a != null && overlaps(reds, a, b);
    const underCaution = !redFlagOverlap && (inLap?.caution_lap === true || outLap?.caution_lap === true || (a != null && overlaps(yellows, a, b)));
    const list = (byCarNumber[num] ||= []);
    list.push({
      stopNum: list.length + 1,
      lap: s.lap_number ?? null,
      pdmSeconds: Number(s.pit_duration_ms) / 1000,
      clockGapSeconds: null,
      redFlagOverlap,
      underCaution,
      needsReview: false,
      notes: null,
      driverChanged: s.driver_change === true && !rmIsPenaltyStop(s),
      driverIn: s.driver_in || null,
      driverOut: s.driver_out || null,
      penalty: rmIsPenaltyStop(s),
    });
  });
  return { byCarNumber };
}

async function loadRedmistPitCyclesFromSupabase(raceId){
  const { data, error } = await supabase
    .from("redmist_pit_cycles")
    .select("*") // driver_out_* columns are read when present
    .eq("race_id", raceId)
    .order("car_number", { ascending: true })
    .order("stop_num", { ascending: true });

  if (error){ console.error("loadRedmistPitCyclesFromSupabase failed:", error); return null; }
  if (!data || !data.length) return null;

  const byCarNumber = {};
  for (const row of data){
    if (!byCarNumber[row.car_number]) byCarNumber[row.car_number] = [];
    byCarNumber[row.car_number].push({
      stopNum: row.stop_num,
      lap: row.pit_in_lap_estimated ?? null,
      pdmSeconds: row.duration_pdm_seconds != null ? Number(row.duration_pdm_seconds) : null,
      clockGapSeconds: row.duration_clockgap_seconds != null ? Number(row.duration_clockgap_seconds) : null,
      redFlagOverlap: row.red_flag_overlap,
      underCaution: row.under_caution,
      needsReview: row.needs_review,
      notes: row.notes,
      driverChanged: row.driver_change_reported,
      // Prefer a manually confirmed driver name over Red Mist's raw report,
      // matching the correction-layer pattern the schema was designed for
      // (see redmist_pit_cycles migration - driver identity from Red Mist
      // alone is known unreliable, confirmed during earlier validation).
      driverIn: row.driver_in_confirmed || row.driver_in_reported,
      driverOut: row.driver_out_confirmed || row.driver_out_reported || null,
      confirmed: !!(row.driver_in_confirmed || row.driver_out_confirmed),
    });
  }

  return { byCarNumber };
}

// ---- Red Mist live timing ----
// redmist_live_positions / redmist_live_laps are populated server-side by
// the redmist-live-poll Edge Function (on a pg_cron schedule) — the
// frontend only ever reads Supabase, never Red Mist directly. Which event
// is currently live is likewise resolved server-side into
// redmist_event_watch; this just reads that row rather than guessing.
let redmistChannel = null;

// A race with a linked, currently-live Red Mist event whose feed is
// actually fresh is fully owned by the server-side stint automation (see
// maybeApplyDriverChange() in redmist-live-poll) — no manual editing,
// even for an engineer, since Red Mist is the authoritative source once
// real polling data is flowing. isEngineer's role narrows to authoring
// the plan before the race goes live.
//
// Deliberately no staleness/fallback check here: a prior version reopened
// manual editing if the feed went quiet for 30s, but a mid-race feed
// hiccup reopening editing mid-race caused more risk than it solved (and
// is a rare case) — so once a race is linked to a live Red Mist event,
// it stays locked for its duration regardless of feed gaps.
// The live-data trigger: a session is live when redmist_live_session says
// is_live AND the row is fresh. Discovery still goes LoadLiveEvents ->
// redmist_event_watch (that's where the event id comes from), but the
// event being listed as live only means "this weekend is happening" —
// between Saturday's and Sunday's sessions it's still listed. The session
// row is what says cars are actually on track.
//
// Freshness: the poller only writes the session row while it's polling
// that event (on change, plus a 30s heartbeat). A row nobody has touched
// in SESSION_FRESH_MS is a leftover, not a live session. The freshness
// check gates ATTACHING only — once attached, a stale row (feed hiccup)
// does NOT detach; only an explicit is_live=false does. That keeps the
// earlier decision that a mid-race feed gap must never reopen editing.
const SESSION_FRESH_MS = 120_000;
// Red Mist can report isLive=false with sessionId=0 during a running
// session (seen in qualifying) — so an on-track flag also counts.
// Every on-track flag in Red Mist's enum — everything except 0 (pre-race /
// unknown) and 5 (checkered). Previously {1,2,3,7} from the old mapping,
// which meant a White, Code 60, Debris or Waving Yellow flag during an
// is_live=false report could read as "session ended" and detach live data.
const ACTIVE_FLAGS = new Set([1, 2, 3, 4, 6, 7, 8, 9, 10, 11, 12]);
// MUST match classifySession() in redmist-live-poll. Only Qualifying and
// Race sessions are reported; HPDE/test/practice (incl. "Race Practice N")
// are Practice and never attach. Order matters for that reason.
function classifySession(name){
  const n = String(name || "").toLowerCase();
  if (/qualif/.test(n)) return "Qualifying";
  if (/practice|hpde|test|warm/.test(n)) return "Practice";
  if (/race|hour|enduro/.test(n)) return "Race";
  return "Practice";
}
// The poller's session_type wins over the name: Red Mist can carry a stale
// name into a new session (Race Practice arrived still named "GP1/GP2
// Qualifying"), and the poller demotes those to Practice. Name-based
// classification is only the fallback for rows written before that column.
function sessionTypeOf(session){
  return session?.session_type || classifySession(session?.session_name);
}
function isSessionActive(session){
  if (!session) return false;
  if (sessionTypeOf(session) === "Practice") return false;
  // A Race that has taken the checkered stays attached, so its final
  // standings and car tiles stay on screen instead of vanishing the moment
  // the flag drops. It detaches when the next session replaces it or the
  // event leaves the live list — and from then on the page shows the
  // saved final results (redmist_race_results) instead.
  if (sessionTypeOf(session) === "Race" && Number(session.current_flag) === 5) return true;
  return session.is_live === true || ACTIVE_FLAGS.has(Number(session.current_flag));
}
function isCheckered(){ return Number(state.homeLive.flag) === 5; }
function isSessionRowLive(session){
  if (!session || !session.fetched_at || !isSessionActive(session)) return false;
  return Date.now() - new Date(session.fetched_at).getTime() < SESSION_FRESH_MS;
}

function sessionKeyOf(session){
  return session ? { id: Number(session.session_id ?? 0), name: session.session_name ?? "", type: sessionTypeOf(session) } : null;
}
function isSameSession(a, b){
  return !!(a && b && a.id === b.id && a.name === b.name);
}
// Live rows carry event_id + session_id + session_name; anything from
// another session of the same event (practice, yesterday's quali) is ignored.
function isCurrentSessionRow(row){
  const ls = state.liveSession;
  return !!(row && ls && String(row.event_id) === String(state.redmistEventId)
    && Number(row.session_id) === ls.id && row.session_name === ls.name);
}
function scopeToLiveSession(query){
  const ls = state.liveSession;
  return query.eq("session_id", ls ? ls.id : -1).eq("session_name", ls ? ls.name : "");
}

// Attached = a Qualifying or Race session is live for this race's event.
// Locked = only during a Race session: that's when the server-side stint
// automation owns the plan. Qualifying (any class) never locks editing.
function isLiveAttached(race){
  return !!(state.redmistEventId && race);
}
function isRaceLiveAndLocked(race){
  // Unlocks at the checkered: the race is over, and the plan needs to be
  // editable again to archive it.
  return isLiveAttached(race) && state.liveSession?.type === "Race" && !isCheckered();
}

async function refreshRedmistCar(race, carNumber, skipRender){
  const eventId = state.redmistEventId;
  if (!eventId) return;
  const [{ data: pos, error: posErr }, { data: stats, error: statsErr }, { data: cons, error: consErr }] = await Promise.all([
    scopeToLiveSession(supabase.from("redmist_live_positions").select("*").eq("event_id", eventId).eq("car_number", carNumber)).maybeSingle(),
    scopeToLiveSession(supabase.from("redmist_current_stint_stats").select("*").eq("event_id", eventId).eq("car_number", carNumber)).maybeSingle(),
    // Clean-lap consistency (pit, out, caution laps excluded) — see
    // add_consistency_clean_laps.sql.
    scopeToLiveSession(supabase.from("redmist_current_stint_consistency").select("*").eq("event_id", eventId).eq("car_number", carNumber)).maybeSingle(),
  ]);
  if (consErr) console.error("[redmist-live] refreshRedmistCar consistency failed for car", carNumber, ":", consErr);
  if (posErr) console.error("[redmist-live] refreshRedmistCar positions failed for car", carNumber, ":", posErr);
  if (statsErr) console.error("[redmist-live] refreshRedmistCar stats failed for car", carNumber, ":", statsErr);
  console.log(`[redmist-live] car ${carNumber}: position row ${pos ? "found" : "NOT FOUND"}, stint stats ${stats ? "found" : "not found"}`);
  if (!race.redmistLive) race.redmistLive = { byCarNumber:{}, statsByCarNumber:{} };
  if (pos) race.redmistLive.byCarNumber[carNumber] = pos;
  if (stats) race.redmistLive.statsByCarNumber[carNumber] = stats;
  // Cleared (not kept) when the view returns nothing — a new stint with
  // no clean laps yet should read "—", not the previous driver's figure.
  if (!consErr){
    if (!race.redmistLive.consistencyByCarNumber) race.redmistLive.consistencyByCarNumber = {};
    race.redmistLive.consistencyByCarNumber[carNumber] = cons || null;
  }
  // handleRedmistDriverChange() previously ran here client-side. As of
  // Phase 1 of the server-side stint automation, that logic now lives in
  // the redmist-live-poll Edge Function itself (runs on the service-role
  // key, independent of any browser tab) — see subscribeStintChanges()
  // below for how the client picks up those server-made changes live.
  // skipRender=true during openRace()'s initial batch fetch — that call
  // site does its own single render() once ALL cars have resolved, so the
  // car-plan tiles reach their final collapsed/expanded state in one paint
  // rather than settling in piecemeal as each car's query lands.
  if (!skipRender) scheduleLiveRender();
}

// Resolves whether a WRL event is currently live and, if so, fetches
// initial position/stint data for every car in the race. Deliberately
// split from subscribeRedmistLiveChannel() below — this half is the part
// openRace() awaits BEFORE its first render, specifically so a car tile
// that turns out to have live data is already collapsed on first paint
// instead of rendering expanded and then visibly snapping shut once this
// fetch resolves a moment later. All decision points log under the
// [redmist-live] prefix for console-based debugging.
async function loadRedmistLiveState(raceId){
  const race = state.races.find(r=>r.id===raceId);
  const carNumbers = (race?.cars||[]).map(c=>c.number).filter(Boolean);
  if (!race){ console.log("[redmist-live] no race found for id", raceId); return { race:null, carNumbers:[] }; }
  if (!carNumbers.length){ console.log("[redmist-live] race has no cars with a number set — nothing to match against"); return { race, carNumbers }; }
  console.log("[redmist-live] watching for car numbers:", carNumbers);

  const { data: watch, error: watchErr } = await supabase
    .from("redmist_event_watch").select("event_id, is_live, event_name").eq("id", 1).maybeSingle();
  if (watchErr){ console.error("[redmist-live] watch lookup failed:", watchErr); return { race, carNumbers }; }
  console.log("[redmist-live] redmist_event_watch row:", watch);

  state.redmistEventId = null;
  const watchEventId = watch?.is_live ? watch.event_id : null;
  if (!watchEventId){ console.log("[redmist-live] no live event (is_live is false or row missing) — stopping here, this is expected when nothing's live"); return { race, carNumbers }; }

  const { data: session, error: sessionErr } = await supabase
    .from("redmist_live_session").select("session_id, session_name, session_type, is_live, current_flag, fetched_at").eq("event_id", watchEventId).maybeSingle();
  if (sessionErr){ console.error("[redmist-live] session lookup failed:", sessionErr); return { race, carNumbers }; }
  console.log("[redmist-live] redmist_live_session row:", session);
  if (!isSessionRowLive(session)){ console.log("[redmist-live] event", watchEventId, "is listed live but no session is running (is_live false or row stale) — not attaching yet"); return { race, carNumbers }; }
  // This plan already has a finished race saved. Only re-attach to THAT
  // session (still showing the checkered); any other session belongs to a
  // different plan, and attaching would overwrite the final state.
  const done = race.raceResults?.rows?.[0];
  if (done && !(Number(session.session_id) === Number(done.session_id) && session.session_name === done.session_name)){
    console.log("[redmist-live] plan already finished in", done.session_name, "— not attaching to live session", session.session_name);
    return { race, carNumbers };
  }
  state.redmistEventId = watchEventId;
  state.liveSession = sessionKeyOf(session);
  // Fresh per-session container — nothing from a previous session carries over.
  race.redmistLive = { byCarNumber:{}, statsByCarNumber:{} };
  console.log("[redmist-live] using event_id", state.redmistEventId, "— fetching initial data for each car (blocking first paint)");

  await Promise.all([
    ...carNumbers.map(num => refreshRedmistCar(race, num, /*skipRender=*/true)),
    loadRedmistFullField(race, state.redmistEventId, /*skipRender=*/true),
  ]);

  const matched = Object.keys(race.redmistLive?.byCarNumber || {});
  console.log(`[redmist-live] initial fetch done — ${matched.length}/${carNumbers.length} cars matched:`, matched);
  if (!matched.length){
    console.log("[redmist-live] zero matches — check that redmist_live_positions actually has rows for event_id", state.redmistEventId, "and for these car numbers specifically:", carNumbers);
  }
  return { race, carNumbers };
}

// The Realtime subscription itself doesn't need to block the first paint —
// only the initial data does — so this runs AFTER openRace() has already
// rendered once with correct data.
function subscribeRedmistLiveChannel(raceId, race, carNumbers){
  if (!state.redmistEventId || !race || !carNumbers.length) return;
  // Position rows for this team's cars now arrive through the full-field
  // channel (mergeFullFieldPositionRow), same as every other car. This
  // channel used to ALSO listen to redmist_live_positions — unfiltered,
  // every event — and re-query + render each of our cars on its own
  // schedule. Our car's tile then repainted a beat before the rows around
  // it (Car Behind, Class Pace), so the two were never from the same
  // tick, and every change was delivered twice. Laps still come here:
  // they drive the stint stats / consistency queries.
  redmistChannel = supabase
    .channel(`redmist-live-${raceId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_laps', filter: `event_id=eq.${state.redmistEventId}` }, payload => {
      const num = payload.new?.car_number;
      if (num && carNumbers.includes(num) && isCurrentSessionRow(payload.new)) refreshRedmistCar(race, num);
    })
    .subscribe();
  // Full-field standings load automatically alongside this team's own
  // cars — no click required (see renderLiveStandingsPanel).
  subscribeFullFieldChannel(raceId, race, state.redmistEventId);
}

// ---- Full-field live standings (beneath the track map, not the
// per-car tiles above) — deliberately separate data path from
// byCarNumber above, since that's scoped to only this team's own cars.
// This needs every car currently in the Red Mist event, so it's its own
// fetch/subscription pair — started automatically alongside the per-car
// data (loadRedmistLiveState/subscribeRedmistLiveChannel above), always
// visible rather than gated behind a click.
let fullFieldChannel = null;

async function loadRedmistFullField(race, eventId, skipRender){
  const { data: positions, error: posErr } = await scopeToLiveSession(supabase
    .from("redmist_live_positions").select("*").eq("event_id", eventId));
  if (posErr) console.error("[redmist-live] loadRedmistFullField positions failed:", posErr);

  if (!race.redmistLive) race.redmistLive = { byCarNumber:{}, statsByCarNumber:{} };
  race.redmistLive.fullField = positions || [];
  await refreshFullFieldStopCounts(race, eventId, skipRender);
}

// Recomputed from scratch on every pit-stop change rather than
// incrementally tracked — this table is low volume (a handful of stops
// per car per race), so a full recount is cheap and avoids any drift
// from a missed or out-of-order realtime event.
async function refreshFullFieldStopCounts(race, eventId, skipRender){
  const { data: stops, error } = await scopeToLiveSession(supabase
    .from("redmist_live_pit_stops").select("car_number, penalty_served").eq("event_id", eventId));
  if (error){ console.error("[redmist-live] refreshFullFieldStopCounts failed:", error); return; }
  const counts = {};
  rmServiceStops(stops).forEach(r => { counts[r.car_number] = (counts[r.car_number]||0) + 1; });
  if (!race.redmistLive) race.redmistLive = { byCarNumber:{}, statsByCarNumber:{} };
  race.redmistLive.stopCountsByCarNumber = counts;
  // skipRender=true during openRace()'s initial blocking load — same
  // reasoning as refreshRedmistCar's skipRender: that call site does its
  // own single render() once everything (including this) has resolved.
  if (!skipRender) scheduleRender();
}

function mergeFullFieldPositionRow(race, row){
  if (!race.redmistLive || !row || !isCurrentSessionRow(row)) return;
  const arr = race.redmistLive.fullField || [];
  const idx = arr.findIndex(r => r.car_number === row.car_number);
  if (idx >= 0) arr[idx] = row; else arr.push(row);
  race.redmistLive.fullField = arr;
  // Our own cars' tiles read byCarNumber — keep it on the same row so the
  // tile and its neighbours always come from the same poll.
  if (race.cars.some(c => c.number === row.car_number)) race.redmistLive.byCarNumber[row.car_number] = row;
  scheduleLiveRender();
}
// One poll rewrites every car whose position changed, but Realtime
// delivers those rows one event at a time. Rendering after each one
// showed the half-applied states in between — two cars both on P5, rows
// swapping and swapping back as the rest of the batch landed. All live
// data paths render through this: wait until the burst goes quiet, then
// render the whole batch once.
// Capped at LIVE_MAX_WAIT_MS so a steady stream of events (several
// channels, one poll a second) can never keep pushing the render back.
let liveRenderTimer = null, liveRenderFirstPending = 0;
const LIVE_SETTLE_MS = 300, LIVE_MAX_WAIT_MS = 1000;
function scheduleLiveRender(){
  const now = Date.now();
  if (!liveRenderFirstPending) liveRenderFirstPending = now;
  clearTimeout(liveRenderTimer);
  const wait = Math.max(0, Math.min(LIVE_SETTLE_MS, liveRenderFirstPending + LIVE_MAX_WAIT_MS - now));
  liveRenderTimer = setTimeout(() => { liveRenderFirstPending = 0; scheduleRender(); }, wait);
}

// ---- Resync ----
// Realtime only sends a row when it CHANGES. If the socket drops — most
// often when the tab sits in the background (browsers throttle it until
// the connection times out) — every change during the gap is lost, and a
// car's row then stays stale until that car changes again. That's the
// "1 lap" gap that a page refresh fixed. So re-fetch the full field (and
// our cars' stats) whenever the channel (re)connects, when the tab comes
// back into view, and every LIVE_RESYNC_MS as a backstop.
const LIVE_RESYNC_MS = 20_000;
let liveResyncTimer = null, liveResyncInFlight = false;
async function resyncLiveData(reason){
  const race = state.races.find(r => r.id === state.currentRaceId);
  if (!race || !state.redmistEventId || liveResyncInFlight) return;
  liveResyncInFlight = true;
  try {
    const carNumbers = (race.cars || []).map(c => c.number).filter(Boolean);
    await Promise.all([
      loadRedmistFullField(race, state.redmistEventId, /*skipRender=*/true),
      ...carNumbers.map(n => refreshRedmistCar(race, n, /*skipRender=*/true)),
      state.liveSession?.type === "Race"
        ? loadPaceTrend(state.redmistEventId, state.liveSession.id, state.liveSession.name) : null,
      LIVE_TRACK_MAP_ENABLED ? loadLiveTrackMap(state.redmistEventId) : null,
      LIVE_TRACK_MAP_ENABLED ? loadLiveGps(state.redmistEventId) : null,
    ]);
    // Full-field rows are the fresher copy of our own cars' positions.
    (race.redmistLive?.fullField || []).forEach(r => {
      if (carNumbers.includes(r.car_number)) race.redmistLive.byCarNumber[r.car_number] = r;
    });
    scheduleLiveRender();
  } catch (e){
    console.error("[redmist-live] resync failed (" + reason + "):", e);
  } finally {
    liveResyncInFlight = false;
  }
}
function startLiveResync(){
  if (liveResyncTimer) return;
  liveResyncTimer = setInterval(() => { if (!document.hidden) resyncLiveData("interval"); }, LIVE_RESYNC_MS);
}
function stopLiveResync(){
  clearInterval(liveResyncTimer); liveResyncTimer = null;
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.redmistEventId) resyncLiveData("tab visible");
});

function subscribeFullFieldChannel(raceId, race, eventId){
  if (fullFieldChannel) return; // idempotent — toggling the panel open twice shouldn't double-subscribe
  fullFieldChannel = supabase
    .channel(`redmist-fullfield-${raceId}`)
    // Resolve the race at event time, not subscribe time — startApp()
    // replaces the race objects on a tab-focus re-auth.
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_positions', filter: `event_id=eq.${eventId}` }, payload => {
      mergeFullFieldPositionRow(state.races.find(r => r.id === raceId) || race, payload.new);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_pit_stops', filter: `event_id=eq.${eventId}` }, () => {
      refreshFullFieldStopCounts(state.races.find(r => r.id === raceId) || race, eventId);
    })
    .subscribe((status) => {
      // Fires on the first connect AND on every automatic reconnect —
      // anything that changed while disconnected was never delivered.
      if (status === "SUBSCRIBED") resyncLiveData("channel subscribed");
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") console.warn("[redmist-live] full-field channel", status);
    });
  startLiveResync();
}

function unsubscribeFullFieldChannel(){
  if (fullFieldChannel){ supabase.removeChannel(fullFieldChannel); fullFieldChannel = null; }
  stopLiveResync();
}

// ---- Live mirror of server-side stint automation (Phase 1) ----
// The redmist-live-poll Edge Function now writes directly to
// stints/cars/races using the service-role key when it detects a
// confirmed driver change — see maybeApplyDriverChange() in that
// function. This subscription is what makes those writes show up in an
// open tab without a refresh, for anyone viewing (not just an engineer —
// there's no client-side write happening here to gate, this only reads).
// Deliberately independent of whether Red Mist happens to be live at this
// exact moment (unlike subscribeRedmistLiveChannel above) — a second
// engineer's manual edit in another tab benefits from this too, not just
// the automated path.
let stintsChannel = null;

function subscribeStintChanges(raceId, carIds){
  unsubscribeStintChanges();
  if (!carIds.length) return;
  const carIdFilter = `car_id=in.(${carIds.join(",")})`;

  stintsChannel = supabase
    .channel(`stint-mirror-${raceId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'stints', filter: carIdFilter }, payload => {
      console.log("[stint-mirror] stints event received:", payload); // TEMP debug — remove once realtime is confirmed working
      mergeStintRowIntoPlan(payload.new);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'cars', filter: `id=in.(${carIds.join(",")})` }, payload => {
      console.log("[stint-mirror] cars event received:", payload); // TEMP debug
      mergeCarRowIntoPlan(payload.new);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'races', filter: `id=eq.${raceId}` }, payload => {
      console.log("[stint-mirror] races event received:", payload); // TEMP debug
      mergeRaceRowIntoPlan(payload.new);
    })
    .subscribe((status, err) => {
      console.log("[stint-mirror] channel status:", status, err || ""); // TEMP debug — look for "SUBSCRIBED" here
    });
}

function unsubscribeStintChanges(){
  if (stintsChannel){ supabase.removeChannel(stintsChannel); stintsChannel = null; }
}

function mergeStintRowIntoPlan(row){
  if (!state.plan) return;
  const cp = state.plan.carPlans.find(cp=>cp.car.id===row.car_id);
  if (!cp) return;
  cp.stints[row.stint_index] = {
    driver: row.driver, driverIndex: row.driver_index,
    start: new Date(row.start_at), end: new Date(row.end_at),
    plannedEnd: new Date(row.planned_end_at || row.end_at),
    lengthMin: row.length_min, position: row.position, notes: row.notes || "",
    flags: row.flags || [], removed: row.removed || false,
    quietMinutes: row.quiet_minutes || 0, finished: row.finished || false,
  };
  scheduleRender();
}

function mergeCarRowIntoPlan(row){
  if (!state.plan) return;
  const cp = state.plan.carPlans.find(cp=>cp.car.id===row.id);
  if (!cp) return;
  cp.car.drivers = row.drivers || [];
  cp.car.driverStintMode = row.driver_stint_mode || [];
  cp.retiredAtStint = row.retired_at_stint ?? null;
  scheduleRender();
}

function mergeRaceRowIntoPlan(row){
  if (!state.plan || state.currentRaceId !== row.id) return;
  if (row.plan_end_at) state.plan.endDateTime = new Date(row.plan_end_at);
  if (row.total_minutes != null) state.plan.totalMinutes = row.total_minutes;
  scheduleRender();
}

// Convenience wrapper for call sites that don't need to block a render on
// this (none currently do — openRace() uses the split functions above
// directly — but kept for any future direct call).
async function subscribeRedmistLive(raceId){
  unsubscribeRedmistLive();
  const { race, carNumbers } = await loadRedmistLiveState(raceId);
  render();
  if (race) subscribeRedmistLiveChannel(raceId, race, carNumbers);
}

function unsubscribeRedmistLive(){
  if (redmistChannel){ supabase.removeChannel(redmistChannel); redmistChannel = null; }
  state.redmistEventId = null;
  state.liveSession = null;
}

// ---- Home screen: live race indicator ----
// Maps Red Mist's raw current_flag string to the badge color. Matched by
// substring rather than an exact enum since the real values coming back
// from GetCurrentSessionStateJson haven't been fully catalogued yet (we
// only have "Green"/"Yellow"/"Red" confirmed from the three states this
// badge was built for) — this way a variant like "Full Course Yellow" or
// "Red Flag" still resolves correctly instead of falling through to the
// unknown-state fallback. Order matters: check red/yellow before green so
// a value like "Green/Yellow" (if Red Mist ever reports transitions that
// way) doesn't get misread.
// Red Mist's Flags type is an integer enum (0-12), confirmed against the
// published OpenAPI schema — NOT a string like "Green"/"Yellow" as this
// function originally assumed (that version called .toLowerCase() on a
// number and would have thrown the first time a live flag came through).
// Only a few codes are confirmed from prior project validation: 0=pre,
// 1=green, 2=transition, 3=red, 5=checkered, 7=yellow. The rest (4, 6,
// 8-12) are unconfirmed, so they fall through to the neutral color rather
// than guessing at a red/yellow/green mapping that might be wrong.
function flagToLiveColor(flag){
  const f = Number(flag);
  if (f === 3 || f === 6) return T.red;                        // red, black
  if (f === 2 || f === 12 || f === 11) return T.amber;         // yellow, waving yellow, debris
  if (f === 7 || f === 8) return T.purple;                     // Code 35 / Code 60
  if (f === 1) return T.green;
  if (f === 4 || f === 5) return T.white;                      // white, checkered
  return T.textFaint;                                          // 0 unknown/pre-race, 9 blue, 10 meatball
}

// Red Mist's Flags enum (RedMist.TimingCommon/Models/Flags.cs), in order.
// Corrects the earlier assumption that 2=transition and 7=yellow — per the
// enum, 2 is Yellow and 7 is Purple35, i.e. WRL's Code 35 (which is what
// was actually being observed during cautions).
const RM_FLAG_LABELS = ["Pre-race","Green","Yellow","Red","White","Checkered","Black","Code 35","Code 60","Blue","Meatball","Debris","Waving Yellow"];
function flagLabel(flag){
  if (flag == null || flag === "") return "—";
  const f = Number(flag);
  return Number.isInteger(f) && RM_FLAG_LABELS[f] ? RM_FLAG_LABELS[f] : "—";
}

// ---- Car retirement / inactivity ----
// Red Mist has no explicit "retired" field. Signals, strongest first:
//   car_status (mcs): Red Mist's own status text (DNS / Contact /
//     Mechanical ...) — only populated on multiloop timing systems.
//   is_stale (st): Red Mist's "not updated for a while" flag.
//   last_lap_at: when the poller last saw this car complete a lap. No lap
//     for INACTIVE_AFTER_MIN while not red-flagged -> Inactive.
// Labelled "Inactive" rather than "Retired" unless Red Mist itself says
// so — a long garage repair looks identical until the car comes back out,
// and the badge clears itself the moment it completes a lap.
const INACTIVE_AFTER_MIN = 12;
function liveCarStatus(pos, leaderLaps, opts = {}){
  if (!pos) return null;
  const mcs = (pos.car_status || "").trim();
  if (mcs && !/^(active|in pits?)$/i.test(mcs)) return { label: mcs, tone: "dnf" };
  if (!(pos.last_lap_completed > 0) && leaderLaps >= 3) return { label: "DNS", tone: "dns" };
  // In the pit lane beats the no-lap timer: a car sitting in the pits
  // shows as In Pit (blue, pulsing — same look as our own cars' IN PIT
  // indicator) rather than Inactive. Only cars stopped OUT on track, or
  // that Red Mist marks stale, fall through to Inactive.
  // After the checkered every car ends up in the pits, so In Pit means
  // nothing there — skipped until the race is archived.
  const finished = opts.finished ?? isRaceFinished(state.races.find(r => r.id === state.currentRaceId));
  if (pos.in_pit === true && !finished) return { label: "In Pit", tone: "pit" };
  if (finished){
    // After the checkered the field parks: Red Mist marks parked cars stale
    // and every last lap ages past the timer, so neither means retired. A
    // car is out only if it stopped lapping INACTIVE_AFTER_MIN+ before the
    // last car took the flag — same rule live-poll uses for result_status.
    const ref = opts.fieldLastLapMs ?? fieldLastLapMs(state.races.find(r => r.id === state.currentRaceId)?.redmistLive?.fullField);
    const t = pos.last_lap_at ? new Date(pos.last_lap_at).getTime() : NaN;
    if (ref && Number.isFinite(t) && (ref - t) / 60000 >= INACTIVE_AFTER_MIN) return { label: "Inactive", tone: "dnf" };
    return null;
  }
  // Red Mist flips is_stale while a car is on its pit-in lap — it leaves the
  // track loops for pit lane and goes unseen until the pit-in loop sets
  // in_pit. So stale only counts once the car is also overdue: no lap for
  // two of its own lap times (5 min if it has none).
  if (pos.is_stale === true && staleOverdue(pos)) return { label: "Inactive", tone: "dnf" };
  if (pos.last_lap_at && Number(state.homeLive.flag) !== 3){
    const mins = (liveNowMs() - new Date(pos.last_lap_at).getTime()) / 60000;
    if (mins >= INACTIVE_AFTER_MIN) return { label: `Inactive ${Math.floor(mins)}m`, tone: "dnf" };
  }
  return null;
}
function staleOverdue(pos){
  if (!pos.last_lap_at) return true;
  const lap = rmTimeToSeconds(pos.last_lap_time);
  const graceMs = lap > 0 ? lap * 2000 : 5 * 60000;
  return liveNowMs() - new Date(pos.last_lap_at).getTime() >= graceMs;
}
// Latest lap completion anywhere in the field — the post-checkered
// reference for "stopped before the end".
function fieldLastLapMs(field){
  return (field || []).reduce((m, r) => {
    const t = r.last_lap_at ? new Date(r.last_lap_at).getTime() : NaN;
    return Number.isFinite(t) && t > m ? t : m;
  }, 0);
}
// "Now" for the no-lap timer. In the finished (post-checkered) view this is
// the moment the session's data stopped, not the wall clock — otherwise,
// hours later, every car would read Inactive.
function liveNowMs(){
  const r = state.races.find(r => r.id === state.currentRaceId);
  return r?.redmistLive?.finishedAt || Date.now();
}
function isRaceFinished(race){
  if (!race || race.status === "archived") return false;
  // "checkered" is set server-side by live-poll when the plan's Race session
  // takes the flag — persists across reloads without needing live data.
  return race.status === "checkered" || !!race.redmistLive?.finished || !!race.raceResults?.rows?.length
    || state.finishedRaceIds.has(String(race.id))
    || (isLiveAttached(race) && state.liveSession?.type === "Race" && isCheckered());
}
function liveLeaderLaps(race){
  const field = race?.redmistLive?.fullField || [];
  return field.reduce((m, r) => Math.max(m, r.last_lap_completed || 0), 0);
}
// Live indicator state for one of our cars: "pit" while Red Mist says it's
// in the pit lane, otherwise "track". Drives the colour/label of the
// header badge, the timeline card and the stint-table row (red ON TRACK /
// blue IN PIT).
function liveIndicator(race, carNumber){
  // From the checkered until the race is archived every indicator reads
  // CHECKERED — static, no pulse — whether the page is still attached to
  // the finished session or showing its saved final state.
  if (race?.redmistLive?.finished || (isLiveAttached(race) && state.liveSession?.type === "Race" && isCheckered())){
    return { inPit: false, checkered: true, color: "var(--text)", wash: "rgba(255,255,255,0.08)", label: "CHECKERED" };
  }
  const pos = race?.redmistLive?.byCarNumber?.[carNumber];
  const inPit = pos?.in_pit === true;
  return inPit
    ? { inPit: true,  color: "var(--blue)", wash: "rgba(61,111,232,0.12)", label: "IN PIT" }
    : { inPit: false, color: "var(--red)",  wash: "rgba(226,68,92,0.10)", label: "ON TRACK" };
}

function liveStatusBadge(st, inline = true){
  if (!st) return "";
  const margin = inline ? "margin-left:6px;" : "";
  if (st.tone === "pit"){
    return `<span style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(61,111,232,0.12);vertical-align:middle;${margin}">
      <span style="width:6px;height:6px;border-radius:999px;background:var(--blue);animation:livePulse 1.2s ease-in-out infinite;"></span>
      <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:0.05em;color:var(--text);">In Pit</span>
    </span>`;
  }
  return `<span class="results-badge ${st.tone}" style="${margin}">${esc(st.label)}</span>`;
}

// Race-wide summary above the first car tile while a race session is
// live. Built from data already loaded for the standings table
// (fullField) plus the session row (flag / time to go) — no new queries.
function renderLiveRaceSummary(race){
  const finishedView = !!race.redmistLive?.finished;
  if (!finishedView && !(isLiveAttached(race) && state.liveSession?.type === "Race")) return "";
  const field = race.redmistLive?.fullField || [];
  if (!field.length) return "";

  const leaderLaps = liveLeaderLaps(race);
  const leader = field.find(r => r.overall_position === 1)
    || field.find(r => (r.last_lap_completed || 0) === leaderLaps);
  const flag = finishedView ? 5 : state.homeLive.flag;
  const finished = Number(flag) === 5;
  // The lap the leader is ON, not the last one completed — except after
  // the checkered, where the final completed lap is the answer.
  const currentLap = leaderLaps ? (finished ? leaderLaps : leaderLaps + 1) : "—";

  // Class leaders for the classes this team is running in (skipped when
  // the overall leader already is that class leader).
  const ourClasses = [...new Set(field.filter(r => race.cars.some(c => c.number === r.car_number)).map(r => r.class).filter(Boolean))];
  const classLeaders = ourClasses
    .map(cls => field.find(r => r.class === cls && r.class_position === 1))
    .filter(r => r && r.car_number !== leader?.car_number)
    .map(r => `${esc(r.class)}: #${esc(r.car_number)}`).join(" · ");

  let onTrack = 0, inPit = 0, inactive = 0;
  field.forEach(r => {
    const st = liveCarStatus(r, leaderLaps);
    if (st?.tone === "pit") inPit++;
    else if (st) inactive++;
    else onTrack++;
  });
  const countSub = [inPit ? `${inPit} in pit` : null, inactive ? `${inactive} inactive` : null].filter(Boolean).join(" · ");

  const flagColor = flagToLiveColor(flag);
  const tile = (label, value, sub) => `
    <div class="results-carstat-tile">
      <div class="results-stat-label">${label}</div>
      <div class="results-carstat-value">${value}</div>
      ${sub ? `<div class="results-stat-sub">${sub}</div>` : ""}
    </div>`;

  return `
    <div class="live-summary-grid">
      ${tile(finished ? "Final Lap" : "Current Lap", esc(String(currentLap)), !finishedView && state.homeLive.timeToGo ? `${esc(String(state.homeLive.timeToGo))} to go` : null)}
      ${tile("Leader", leader ? `#${esc(leader.car_number)} <span style="font-size:13px;color:var(--textMuted);">${esc(leader.team_name || "")}</span>` : "—", classLeaders || null)}
      ${tile("Flag", `<span style="display:inline-flex;align-items:center;gap:7px;"><span style="width:9px;height:9px;border-radius:999px;background:${flagColor};flex-shrink:0;${finished ? "" : "animation:livePulse 1.2s ease-in-out infinite;"}"></span><span style="color:${flagColor}">${flagLabel(flag)}</span></span>`)}
      ${tile(finished ? "Running at Finish" : "Cars on Track", `${onTrack}<span style="font-size:13px;color:var(--textMuted);"> / ${field.length}</span>`, countSub || null)}
    </div>`;
}

let homeLiveChannel = null;

// Fetches which WRL event (if any) is currently live and that event's
// current flag, independent of any race being open. Called once at boot
// and again whenever the watch/session rows change via the realtime
// subscription below.
async function loadHomeLiveStatus(){
  const { data: watch, error: watchErr } = await supabase
    .from("redmist_event_watch").select("event_id, event_name, is_live").eq("id", 1).maybeSingle();
  if (watchErr) console.error("[home-live] redmist_event_watch fetch failed:", watchErr);
  const watchEventId = watch?.is_live ? watch.event_id : null;

  let session = null;
  if (watchEventId){
    const { data, error: sessionErr } = await supabase
      .from("redmist_live_session").select("session_id, session_name, session_type, is_live, current_flag, time_to_go, laps_to_go, fetched_at").eq("event_id", watchEventId).maybeSingle();
    if (sessionErr) console.error("[home-live] redmist_live_session fetch failed:", sessionErr);
    session = data;
  }
  const sessionLive = isSessionRowLive(session);
  const eventId = sessionLive ? watchEventId : null;
  state.homeLive = {
    eventId, watchEventId,
    flag: sessionLive ? (session.current_flag ?? null) : null,
    timeToGo: sessionLive ? (session.time_to_go ?? null) : null,
    lapsToGo: sessionLive ? (session.laps_to_go ?? null) : null,
  };
  console.log("[home-live] watch event:", watchEventId, "| session:", session, "| session live:", sessionLive);
  syncHomeStandings(watchEventId, watch?.event_name ?? null, session);

  if (watchEventId){
    // The server auto-links a race to the live event (maybeAutoLinkRace),
    // but state.races was loaded at boot and never saw that write — so the
    // Home tile's LIVE badge couldn't light up without a page reload.
    if (!state.races.some(r => String(r.redmistEventId) === String(watchEventId))){
      const { data: linked } = await supabase.from("races").select("id").eq("redmist_event_id", watchEventId);
      (linked || []).forEach(row => {
        const r = state.races.find(r => r.id === row.id);
        if (r) r.redmistEventId = watchEventId;
      });
    }
  }

  const raceOpen = state.page === "plan" && state.currentRaceId && state.currentStatus !== "archived";

  // Session went live while a race was open (including one opened before
  // anything was live) — attach once.
  // Also re-attach when the event stays the same but the session changes
  // (e.g. quali -> race) so every query re-scopes to the new session.
  const sessionSwitched = sessionLive && state.redmistEventId && !isSameSession(state.liveSession, sessionKeyOf(session));
  if (raceOpen && sessionLive && (String(state.redmistEventId) !== String(eventId) || sessionSwitched) && !liveAttachInFlight){
    if (sessionSwitched) unsubscribeFullFieldChannel();
    liveAttachInFlight = true;
    console.log("[redmist-live] session went live while race was open — attaching");
    try { await subscribeRedmistLive(state.currentRaceId); }
    finally { liveAttachInFlight = false; }
    // Quali results were only loaded at race open and on explicit session
    // end. A direct switch (GTO quali -> GP1/GP2 quali) never ends in
    // between, so the finished session's final rows were never picked up.
    loadQualifyingResults(state.races.find(r => r.id === state.currentRaceId));
  }

  // Session explicitly ended (is_live=false written by the poller, or the
  // event dropped off the live list entirely) — detach. A merely STALE row
  // does not detach; see isSessionRowLive().
  const explicitlyEnded = !watchEventId || (session && !isSessionActive(session));
  if (state.redmistEventId && explicitlyEnded){
    console.log("[redmist-live] session ended — detaching live data");
    unsubscribeRedmistLive();
    unsubscribeFullFieldChannel();
    if (raceOpen) loadQualifyingResults(state.races.find(r => r.id === state.currentRaceId));
    if (raceOpen){
      const r = state.races.find(r => r.id === state.currentRaceId);
      loadRaceResults(r).then(() => loadFinishedRaceState(r));
    }
    loadFinishedRaceIds();
  }

  scheduleRender();
}
let liveAttachInFlight = false;

// ===================== Live event standings on Home =====================
// Shows qualifying and race standings for whichever WRL event the poller
// has found live (redmist_event_watch) — no race plan needed. Lets drivers
// follow Friday qualifying before a plan exists, and anyone follow the
// rest of the field. Data comes straight from redmist_live_positions /
// redmist_live_pit_stops by event + session, so it's independent of the
// plan page's live attach (state.redmistEventId / state.liveSession).
//   Race session (incl. its checkered) -> race standings / final results.
//   Anything else -> whichever finished most recently: the last race's saved
//   final results (redmist_race_results), or every qualifying session so
//   far, the live one badged.
let homeStandingsChannel = null, homeStandingsTimer = null, homeStandingsSeq = 0, homeStopsTimer = null;

function syncHomeStandings(eventId, eventName, session){
  if (!eventId){ stopHomeStandings(); return; }
  const key = session ? {
    id: Number(session.session_id ?? 0), name: session.session_name ?? "",
    type: sessionTypeOf(session), flag: session.current_flag ?? null,
    active: isSessionActive(session),
  } : null;
  const hs = state.homeStandings;
  if (!hs || String(hs.eventId) !== String(eventId)){
    stopHomeStandings();
    state.homeStandings = { eventId, eventName, session: key, field: [], stops: {}, quali: [], lastRace: null };
    subscribeHomeStandings(eventId); // loads on SUBSCRIBED
    return;
  }
  const sessionChanged = !key || !hs.session || hs.session.id !== key.id || hs.session.name !== key.name;
  // A race session going inactive after its checkered: reload so the saved
  // final results take over from the live field straight away.
  const raceEnded = !sessionChanged && hs.session?.type === "Race" && hs.session.active && key && !key.active;
  hs.eventName = eventName ?? hs.eventName;
  hs.session = key; // flag / active changes ride along without a refetch
  if (sessionChanged){ hs.field = []; hs.stops = {}; loadHomeStandings(); }
  else if (raceEnded) loadHomeStandings();
}

function stopHomeStandings(){
  if (homeStandingsChannel){ supabase.removeChannel(homeStandingsChannel); homeStandingsChannel = null; }
  clearInterval(homeStandingsTimer); homeStandingsTimer = null;
  clearTimeout(homeStopsTimer); homeStopsTimer = null;
  state.homeStandings = null;
}

function isHomeRaceSessionRow(hs, row){
  const s = hs?.session;
  return !!(s && s.type === "Race" && Number(row.session_id) === s.id && row.session_name === s.name);
}

function groupQualiSessions(rows){
  const bySession = {};
  (rows || []).forEach(r => {
    const key = `${r.session_id}|${r.session_name}`;
    const g = (bySession[key] ||= { key, id: Number(r.session_id), name: r.session_name, rows: [], latest: 0 });
    g.rows.push(r);
    g.latest = Math.max(g.latest, new Date(r.fetched_at || 0).getTime());
  });
  return Object.values(bySession);
}

// Most recent race session with saved final results for this event.
// Rows are normalised to the live-position field names the results panel
// reads (laps -> last_lap_completed), stops come from the saved count.
function latestSavedRace(rows){
  const bySession = {};
  (rows || []).forEach(r => {
    const key = `${r.session_id}|${r.session_name}`;
    const g = (bySession[key] ||= { key, id: Number(r.session_id), name: r.session_name, rows: [], at: 0 });
    g.rows.push({ ...r, last_lap_completed: r.laps });
    g.at = Math.max(g.at, new Date(r.checkered_at || r.updated_at || 0).getTime());
  });
  const latest = Object.values(bySession).sort((a, b) => b.at - a.at)[0];
  if (!latest) return null;
  latest.stops = Object.fromEntries(latest.rows.map(r => [r.car_number, r.pit_stops ?? 0]));
  return latest;
}

function countServiceStops(stops){
  const counts = {};
  rmServiceStops(stops || []).forEach(r => { counts[r.car_number] = (counts[r.car_number] || 0) + 1; });
  return counts;
}

// Full reload. Latest call wins — a slower earlier response (e.g. from
// before a session switch) is dropped rather than overwriting newer data.
async function loadHomeStandings(){
  const hs = state.homeStandings;
  if (!hs) return;
  const seq = ++homeStandingsSeq;
  const s = hs.session;
  const wantRace = !!(s && s.type === "Race");
  const scoped = q => q.eq("event_id", hs.eventId).eq("session_id", s.id).eq("session_name", s.name);
  try {
    const [quali, field, stops, , results] = await Promise.all([
      supabase.from("redmist_live_positions").select("*").eq("event_id", hs.eventId).eq("session_type", "Qualifying"),
      wantRace ? scoped(supabase.from("redmist_live_positions").select("*")) : Promise.resolve({ data: [] }),
      wantRace ? scoped(supabase.from("redmist_live_pit_stops").select("car_number, penalty_served")) : Promise.resolve({ data: [] }),
      wantRace ? loadPaceTrend(hs.eventId, s.id, s.name) : null,
      supabase.from("redmist_race_results").select("*").eq("event_id", hs.eventId),
    ]);
    if (seq !== homeStandingsSeq || state.homeStandings !== hs) return;
    [quali, field, stops, results].forEach(r => { if (r.error) console.error("[home-standings] fetch failed:", r.error); });
    hs.quali = groupQualiSessions(quali.data);
    hs.lastRace = latestSavedRace(results.data);
    hs.field = field.data || [];
    hs.stops = countServiceStops(stops.data);
    if (state.page === "home") scheduleLiveRender();
  } catch (e){
    console.error("[home-standings] load failed:", e);
  }
}

async function refreshHomeStops(){
  const hs = state.homeStandings;
  if (!hs || !hs.session || hs.session.type !== "Race") return;
  const s = hs.session;
  const { data, error } = await supabase.from("redmist_live_pit_stops").select("car_number, penalty_served")
    .eq("event_id", hs.eventId).eq("session_id", s.id).eq("session_name", s.name);
  if (error){ console.error("[home-standings] stops fetch failed:", error); return; }
  if (state.homeStandings !== hs || hs.session !== s) return;
  hs.stops = countServiceStops(data);
  if (state.page === "home") scheduleLiveRender();
}

function upsertByCar(arr, row){
  const i = arr.findIndex(r => r.car_number === row.car_number);
  if (i >= 0) arr[i] = row; else arr.push(row);
}

function mergeHomeStandingsRow(row){
  const hs = state.homeStandings;
  if (!hs || !row || String(row.event_id) !== String(hs.eventId)) return;
  let touched = false;
  if (isHomeRaceSessionRow(hs, row)){ upsertByCar(hs.field, row); touched = true; }
  if (row.session_type === "Qualifying"){
    const key = `${row.session_id}|${row.session_name}`;
    let g = hs.quali.find(x => x.key === key);
    if (!g){ g = { key, id: Number(row.session_id), name: row.session_name, rows: [], latest: 0 }; hs.quali.push(g); }
    upsertByCar(g.rows, row);
    g.latest = Math.max(g.latest, new Date(row.fetched_at || 0).getTime());
    touched = true;
  }
  // Rows keep merging while another page is open, so Home is current the
  // moment someone navigates back — but only Home re-renders for them.
  if (touched && state.page === "home") scheduleLiveRender();
}

function subscribeHomeStandings(eventId){
  homeStandingsChannel = supabase
    .channel(`home-standings-${eventId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_positions', filter: `event_id=eq.${eventId}` }, payload => {
      mergeHomeStandingsRow(payload.new);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_pit_stops', filter: `event_id=eq.${eventId}` }, payload => {
      if (!isHomeRaceSessionRow(state.homeStandings, payload.new || {})) return;
      clearTimeout(homeStopsTimer);
      homeStopsTimer = setTimeout(refreshHomeStops, 500); // a stop opens and closes in bursts
    })
    .subscribe((status) => {
      // First connect and every reconnect — anything missed while
      // disconnected was never delivered, so reload in full.
      if (status === "SUBSCRIBED") loadHomeStandings();
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") console.warn("[home-standings] channel", status);
    });
  // Same backstop as the plan page's resync, only while Home is showing.
  homeStandingsTimer = setInterval(() => {
    if (!document.hidden && state.page === "home") loadHomeStandings();
  }, LIVE_RESYNC_MS);
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && state.homeStandings && state.page === "home") loadHomeStandings();
});

// Our cars for the gold row highlight: anything on a non-archived plan,
// plus any car Red Mist lists under a Kingpin team name — so the highlight
// works on Friday before a plan exists.
function homeStandingsOurCars(hs){
  const nums = new Set();
  state.races.filter(r => r.status !== "archived").forEach(r => (r.cars || []).forEach(c => c.number && nums.add(c.number)));
  const scan = rows => (rows || []).forEach(r => { if (/kingpin/i.test(r.team_name || "")) nums.add(r.car_number); });
  scan(hs.field); hs.quali.forEach(g => scan(g.rows));
  return [...nums].map(number => ({ number }));
}

// No race live: the last race's final results win over the qualifying
// tables if that race finished after the latest qualifying activity — and
// never while a qualifying session is live.
function showSavedRace(hs){
  const lr = hs.lastRace;
  if (!lr?.rows?.length) return false;
  const s = hs.session;
  if (s && s.type === "Qualifying" && s.active) return false;
  const latestQuali = hs.quali.reduce((m, g) => g.rows.length ? Math.max(m, g.latest) : m, 0);
  return lr.at >= latestQuali;
}

function renderHomeStandings(){
  const hs = state.homeStandings;
  if (!hs) return "";
  const who = { cars: homeStandingsOurCars(hs) };
  const ourNumbers = new Set(who.cars.map(c => c.number));
  const s = hs.session;
  const panels = [];

  if (s && s.type === "Race" && s.active && hs.field.length){
    panels.push(Number(s.flag) === 5
      ? renderFinalResultsPanel(who, hs.field, hs.stops, s.name)
      : renderLiveStandingsTable(who, hs.field, hs.stops, { subtitle: s.name, finished: false, trendKey: paceTrendKey(hs.eventId, s.id, s.name) }));
  } else if (showSavedRace(hs)){
    const lr = hs.lastRace;
    panels.push(renderFinalResultsPanel(who, lr.rows, lr.stops, lr.name));
  } else {
    const liveKey = s && s.type === "Qualifying" && s.active ? `${s.id}|${s.name}` : null;
    const hasOurs = g => g.rows.some(r => ourNumbers.has(r.car_number));
    [...hs.quali]
      .filter(g => g.rows.length)
      // live session first, then our class's session, then most recent
      .sort((a, b) => ((b.key === liveKey) - (a.key === liveKey)) || (hasOurs(b) - hasOurs(a)) || (b.latest - a.latest))
      .forEach(g => panels.push(renderLiveQualifyingTable(who, g.rows, { title: g.name, status: g.key === liveKey ? "Live" : "Finished" })));
  }
  if (!panels.length) return ""; // event live but nothing captured yet (practice / HPDE only)

  return `
      <section class="event-standings fade-in">
        <div class="races-head">
          <span class="eyebrow">${esc(hs.eventName || "Live Event")}</span>
        </div>
        <div class="event-standings-grid">${panels.join("")}</div>
      </section>`;
}
// =================== end live event standings on Home ===================

// Kept running for the life of the tab (started once at boot, not tied to
// Home specifically) — cheap single-row tables, and it means the badge is
// already current the moment someone navigates back to Home rather than
// waiting on a fresh fetch. No car/race filter: whichever event is live
// can change over time, so this just re-resolves from scratch on every
// watch/session change rather than trying to filter for an id known in
// advance.
function subscribeHomeLiveWatch(){
  if (homeLiveChannel) return; // idempotent — startApp() can run again (tab-focus re-auth) without double-subscribing
  homeLiveChannel = supabase
    .channel("home-live-watch")
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_event_watch', filter: 'id=eq.1' }, () => {
      loadHomeLiveStatus();
    })
    // Server-side race row changes (live-poll's auto-link, session stamp,
    // planned -> checkered) — keeps the Home tiles current without a reload.
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'races' }, (payload) => {
      const row = payload.new;
      const r = row && state.races.find(x => x.id === row.id);
      if (!r) return;
      const changed = r.status !== row.status
        || String(r.redmistEventId ?? "") !== String(row.redmist_event_id ?? "")
        || String(r.redmistSessionId ?? "") !== String(row.redmist_session_id ?? "");
      if (!changed) return;
      r.status = row.status;
      r.redmistEventId = row.redmist_event_id ?? null;
      r.redmistSessionId = row.redmist_session_id ?? null;
      r.redmistSessionName = row.redmist_session_name ?? null;
      if (state.currentRaceId === row.id && state.currentStatus !== "archived") state.currentStatus = row.status;
      scheduleRender();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_session' }, (payload) => {
      // Only worth a re-fetch if it's the event we actually care about —
      // avoids a pointless round trip every poll cycle once other events
      // exist in history.
      // Keyed on the WATCHED event, not the session-live one — the update
      // that flips is_live false->true has to get through this filter.
      if (String(payload.new?.event_id) === String(state.homeLive.watchEventId) || String(payload.new?.event_id) === String(state.redmistEventId)){
        loadHomeLiveStatus();
      }
    })
    .subscribe();
}

// Matches this race's own cars (by car number) against the archived
// classification rows, for the per-car result tiles and finish position.
function matchArchiveToRaceCars(race, results){
  if (!results) return [];
  return race.cars.map(car => {
    const row = results.classification.find(r => r.startNumber === car.number);
    if (!row) return { car, found: false };
    return {
      car, found: true,
      position: row.position, positionInClass: row.positionInClass,
      status: row.status, resultClass: row.resultClass,
      bestTime: row.bestTime, bestLap: row.bestLap,

      pitStops: results.pitStopsByNumber[car.number] ?? 0,

  });

// Appends a permanent, timestamped note to a car's stint log (rendered
// beneath that car's stint table) instead of a transient toast. stintIdx
// links the entry back to whichever stint's notes/flags should be shown
// alongside it, even if those are added after the fact.
// When `key` is supplied, updates the existing entry carrying that key
// instead of adding another one. Repeated tweaks to the same thing (nudging
// a start time by 15 min over and over, revising a stint's end) should read
// as one evolving statement of where things now stand, not a pile of
// near-identical lines. `meta` carries whatever the caller needs to remember
// across those updates — typically the original values, so the entry can
// always describe the *cumulative* change rather than only the last nudge.
//
// The same coalescing has to happen in Supabase or duplicates would reappear
// on reload, so keyed entries track their row id and UPDATE it rather than
// inserting again. `entry_key` is persisted so the link survives a refetch.
function logStintNote(cp, stintIdx, text, type, key, meta){
  if (!cp.log) cp.log = [];
  const resolvedType = type || "info";

  if (key){
    const existing = cp.log.find(m => m.stintIdx === stintIdx && m.key === key);
    if (existing){
      existing.text = text;
      existing.type = resolvedType;
      existing.ts = Date.now();
      if (meta !== undefined) existing.meta = meta;
      if (existing.dbId){
        supabase.from("stint_log").update({ message: text, type: resolvedType })
          .eq("id", existing.dbId)
          .then(({ error })=>{ if (error) console.error("logStintNote update failed:", error); });
      }
      return existing;
    }
  }

  const entry = { stintIdx, text, type: resolvedType, ts: Date.now(), key: key||null, meta: meta, dbId: null };
  cp.log.push(entry);
  if (cp.car && cp.car.id){
    supabase.from("stint_log").insert({
      car_id: cp.car.id, stint_index: stintIdx, message: text, type: resolvedType, entry_key: key||null,
    }).select().single().then(({ data, error })=>{
      if (error){ console.error("logStintNote insert failed:", error); return; }
      if (data) entry.dbId = data.id; // so later revisions update this row
    });
  }
  return entry;
}
function findStintLogEntry(cp, stintIdx, key){
  return (cp.log||[]).find(m => m.stintIdx === stintIdx && m.key === key) || null;
}
// Used when an adjustment is undone back to its original value — the entry
// stops being true, so it's removed rather than left saying "moved 0 min".
function removeStintLogEntry(cp, stintIdx, key){
  if (!cp.log) return;
  const i = cp.log.findIndex(m => m.stintIdx === stintIdx && m.key === key);
  if (i < 0) return;
  const [entry] = cp.log.splice(i, 1);
  if (entry && entry.dbId){
    supabase.from("stint_log").delete().eq("id", entry.dbId)
      .then(({ error })=>{ if (error) console.error("removeStintLogEntry delete failed:", error); });
  }
}
// Retire log entries are matched by their fixed message pattern rather than
// a stored flag — the log table has no column for that, and text-matching
// survives a reload from Supabase the same way freshly-created entries do.
// A car's retirement is already fully explained by the message itself; the
// stint it happened on may carry a flag/note of its own (e.g. a meatball
// noting mechanical trouble), and that's already visible on the stint row —
// repeating it under the log line would just be noise.
function isRetireLogEntry(text){
  return /^Car retired after Stint \d+\.$/.test(text);
}
function hexToRgb(hex){
  hex = hex.replace("#","");
