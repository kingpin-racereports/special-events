  state.catalog = [...state.catalog, catEntry];
  addCarFromCatalog(catEntry);
  state.newCar = { number:"", team:"", model:"", manufacturer:"", accent: ACCENT_PRESETS[0] };
}

async function createRacePlan(){
  const cars = state.cars;
  const canCreatePlan = cars.length>0 && cars.every(c=>c.drivers.some(d=>d.trim()))
      && (state.track && (state.track!=="Other" || state.customTrack.trim()))
      && state.startTime && Number(state.durationHours)>0;
  if (!canCreatePlan) return;

  const resolvedTrack = state.track === "Other" ? state.customTrack.trim() : state.track;
  const [hh,mm] = state.startTime.split(":").map(Number);
  const startDateTime = new Date(state.eventDate || Date.now());
  startDateTime.setHours(hh, mm, 0, 0);
  const totalMinutes = Number(state.durationHours) * 60;
  const endDateTime = addMinutes(startDateTime, totalMinutes);

  const raceFields = {
    event_name: state.eventName,
    event_date: (state.eventDate ? new Date(state.eventDate) : new Date()).toISOString().slice(0,10),
    track: resolvedTrack, start_time: state.startTime,
    duration_hours: Number(state.durationHours), status: "planned",
    plan_start_at: startDateTime.toISOString(), plan_end_at: endDateTime.toISOString(), total_minutes: totalMinutes,
  };

  let raceId = state.currentRaceId;
  if (raceId){
    // Re-editing an existing race's Setup and regenerating: update the
    // race row, then replace every car outright (cascades to their
    // stints/log automatically) rather than trying to reconcile which
    // cars/drivers changed — simplest correct translation of "the plan
    // gets rebuilt from whatever's currently in Setup."
    const { error } = await supabase.from("races").update(raceFields).eq("id", raceId);
    if (error){ console.error("update race failed:", error); return; }
    const { error: delErr } = await supabase.from("cars").delete().eq("race_id", raceId);
    if (delErr) console.error("delete old cars failed:", delErr);
  } else {
    const { data, error } = await supabase.from("races").insert(raceFields).select().single();
    if (error){ console.error("insert race failed:", error); return; }
    raceId = data.id;
  }

  // Postgres generates the real car/stint ids — insert cars one at a
  // time so each one's generated id is available for its own stints.
  const carPlans = [];
  const debriefCtx = { track: resolvedTrack, startDateTime, totalMinutes };
  for (const c of cars){
    const debriefNotes = finalizeDebriefForCar(c, debriefCtx);
    const validIdx = c.drivers.map((d,idx)=>({d,idx})).filter(o=>o.d.trim());
    const validDrivers = validIdx.map(o=>o.d);
    const validStintModes = validIdx.map(o=>stintModeOf(c, o.idx));
    const carFields = {
      race_id: raceId, catalog_id: c.catalogId || null, number: c.number, team: c.team,
      manufacturer: c.manufacturer, model: c.model, accent: c.accent, drivers: validDrivers,
      driver_stint_mode: validStintModes,
      starting_position: parsePosition(c.startingPosition),
      finish_position: c.finishPosition != null ? parseFinishPosition(c.finishPosition) : null,
    };
    const { data: carRow, error: carErr } = await supabase.from("cars").insert(carFields).select().single();
    if (carErr){ console.error("insert car failed:", carErr); continue; }

    // Each driver's stint length comes from the 60/90/120 presets or a
    // custom 5-minute increment (45–180) on Setup. A car can mix lengths
    // freely — each driver's length is fully independent of the others. If
    // a driver's actual stint needs to run long or short of their preset,
    // use Finish on the planner page to lock in the real end time — the
    // cascade there re-times everything downstream.
    const stintLenFor = (rotationPos) => Number(validStintModes[rotationPos % validStintModes.length] || '60');

    // Scheduled quiet time (Barber / Road Atlanta on a Sunday) is a hard
    // clock-time pause, so the loop tracks a wall-clock cursor alongside
    // driven minutes rather than deriving times from elapsed alone. A stint
    // that would run through the window is cut short at the window's start
    // — the pause hangs off that stint, and the next driver picks up when
    // the window ends. Driven time is unaffected by the pause: the car
    // still completes the full race duration, so the day simply finishes
    // later by the length of the break.
    const quiet = quietWindowFor(resolvedTrack, startDateTime);

    let driven = 0, di = 0; const stints = [];
    let cursor = new Date(startDateTime);
    let quietApplied = false;

    while (driven < totalMinutes){
      // Sitting at the window start — take the break before opening
      // another stint rather than starting one we'd immediately pause.
      if (quiet && !quietApplied && +cursor >= +quiet.start){
        if (stints.length) stints[stints.length-1].quietMinutes = quiet.minutes;
        cursor = new Date(quiet.end);
        quietApplied = true;
        continue;
      }

      const wantLen = stintLenFor(di);
      let segLen = Math.min(wantLen, totalMinutes - driven);
      let end = addMinutes(cursor, segLen);

      // Would run into the pause — end it early, right on the window.
      if (quiet && !quietApplied && +end > +quiet.start){
        segLen = Math.round((+quiet.start - +cursor) / 60000);
        end = new Date(quiet.start);
      }
      if (segLen <= 0) break; // safety valve; shouldn't trigger

      stints.push({ driver: validDrivers[di % validDrivers.length], driverIndex: di % validDrivers.length, start: new Date(cursor), end, plannedEnd: new Date(end), lengthMin: segLen, position: null, notes: "", flags: [], removed: false, quietMinutes: 0, finished: false });
      driven += segLen; di += 1; cursor = new Date(end);
    }

    const stintRows = stints.map((s,i)=>({
      car_id: carRow.id, stint_index: i, driver: s.driver, driver_index: s.driverIndex,
      start_at: s.start.toISOString(), end_at: s.end.toISOString(), planned_end_at: s.plannedEnd.toISOString(),
      length_min: s.lengthMin, position: null, notes: "", flags: [], removed: false, quiet_minutes: s.quietMinutes || 0, finished: false,
    }));
    const { error: stintErr } = await supabase.from("stints").insert(stintRows);
    if (stintErr) console.error("insert stints failed:", stintErr);

    const cp = { car: mapCarRowToCarRecord(carRow), stints, log: [], retiredAtStint: null };
    carPlans.push(cp);

    // Saturday debrief changes, logged against the stint they affect so
    // the engineer can see why the plan looks the way it does.
    debriefNotes.forEach(n => {
      const idx = n.kind === "order"
        ? debriefClosingStint(stints.map(s => ({ len: s.lengthMin })))
        : stints.findIndex(s => s.driver === n.driver);
      if (idx != null && idx >= 0) logStintNote(cp, idx, n.text, "info", `debrief-${n.kind}-${n.driver}`);
    });
    delete c.debrief;
  }
  state.debrief = null;

  state.plan = { startDateTime, endDateTime, totalMinutes, track: resolvedTrack, carPlans };
  state.currentRaceId = raceId;
  // A scheduled quiet-time pause pushes the finish later than
  // start + duration. The races row was inserted before the stints were
  // built, so derive the real end from the schedule and correct it.
  recomputePlanEndTime();
  if (state.plan.endDateTime > endDateTime){
    await supabase.from("races").update({
      plan_end_at: state.plan.endDateTime.toISOString(),
      total_minutes: state.plan.totalMinutes,
    }).eq("id", raceId);
  }
  state.currentStatus = "planned";
  state.finishDrafts = {};
  state.addingReserve = new Set();
  state.reserveDraft = {};
  state.page = "plan";

  state.races = await loadRaces(); // refresh the Home/Archive list to include this race
  render();
}

// Recompute the overall race end time from whichever car's stint schedule
// now runs longest, after a cascading edit.
function recomputePlanEndTime(){
  const plan = state.plan;
  let maxEnd = plan.startDateTime;
  plan.carPlans.forEach(cp=>{
    for (let k=cp.stints.length-1; k>=0; k--){
      if (!cp.stints[k].removed){
        const end = addMinutes(cp.stints[k].end, cp.stints[k].quietMinutes || 0);
        if (end > maxEnd) maxEnd = end;
        break;
      }
    }
  });
  plan.endDateTime = maxEnd;
  plan.totalMinutes = Math.round((plan.endDateTime - plan.startDateTime)/60000);
}

// Pushes the in-memory plan (after a stint edit) to Supabase: the race's
// overall computed timing, each car's retired state, and every stint for
// every car in one upsert per car (keyed on car_id+stint_index, which the
// stints table's unique constraint is built around — see schema). This
// keeps every individual mutation function below unchanged: they just
// mutate state.plan in memory exactly as before, then call this.
async function syncPlanToRaceRecord(){
  if (!state.currentRaceId) return;
  const plan = state.plan;

  await supabase.from("races").update({
    plan_start_at: plan.startDateTime.toISOString(),
    plan_end_at: plan.endDateTime.toISOString(),
    total_minutes: plan.totalMinutes,
  }).eq("id", state.currentRaceId);

  for (const cp of plan.carPlans){
    await supabase.from("cars").update({
      retired_at_stint: cp.retiredAtStint,
      drivers: cp.car.drivers,
      driver_stint_mode: cp.car.driverStintMode || [],
    }).eq("id", cp.car.id);

    const stintRows = cp.stints.map((s,i)=>({
      car_id: cp.car.id, stint_index: i, driver: s.driver, driver_index: s.driverIndex,
      start_at: s.start.toISOString(), end_at: s.end.toISOString(),
      planned_end_at: (s.plannedEnd||s.end).toISOString(), length_min: s.lengthMin,
      position: s.position ?? null, notes: s.notes||"", flags: s.flags||[],
      removed: s.removed||false, quiet_minutes: s.quietMinutes||0, finished: s.finished||false,
    }));
    const { error } = await supabase.from("stints").upsert(stintRows, { onConflict: "car_id,stint_index" });
    if (error) console.error("syncPlanToRaceRecord stints upsert failed:", error);
  }

  // Keep the shallow Home/Archive list's copy of this race's cars in sync
  // (car-level fields only — that list never holds stints).
  const raceInList = state.races.find(r=>r.id===state.currentRaceId);
  if (raceInList){
    raceInList.cars = plan.carPlans.map(cp=>({ ...cp.car }));
  }
}

// Shared cascade math for real end-time edits (updateStintEnd). Given a
// car's plan, an anchor stint index, and the cursor time the NEXT stint
// should start at, walks every stint after the anchor forward: absorbing
// a stint entirely if its own original end time has already passed by
// the time the cursor reaches it, or restoring + re-timing it otherwise.
// Finishes by re-running the driver rotation across whatever changed.
// Returns which stints were newly absorbed/newly restored, for the caller
// to log. (Quiet time does NOT use this — it's a fixed clock-time pause
// baked in when the plan is built, see quietWindowFor/createRacePlan. It
// uniformly shifts the schedule instead of absorbing anyone's stint.)
function cascadeStintsFrom(cp, anchorIdx, cursor){
  const stints = cp.stints;
  const nowRemoved = [];
  const nowRestored = [];
  const newlyNegligibleFinal = [];
  for (let j=anchorIdx+1; j<stints.length; j++){
    const s = stints[j];
    if (cp.retiredAtStint != null && j > cp.retiredAtStint){
      s.removed = true; // car retired — stays removed regardless of time math
      continue;
    }
    if (s.end <= cursor){
      if (!s.removed) nowRemoved.push(j);
      s.removed = true;
      s.negligibleFinal = false;
      s.start = new Date(cursor);
      // cursor doesn't advance — this stint contributed no time
    } else {
      if (s.removed) nowRestored.push(j);
      s.removed = false;
      s.start = new Date(cursor);
      s.lengthMin = Math.round((s.end - s.start)/60000);
      // Advance past this stint's own end AND any quiet-time break already
      // scheduled right after it — otherwise a later cascade (triggered by
      // finishing an earlier stint) would silently erase that gap when it
      // recalculates this stint's downstream neighbor.
      cursor = addMinutes(s.end, s.quietMinutes || 0);

      // "Negligible final stint" rule: the very last stint in the plan,
      // squeezed down to a sliver by an upstream overrun, isn't worth
      // creating as its own driver-assigned stint. Real start/end times
      // are untouched by this — it only changes whether it's presented
      // as a schedulable stint or folded into a note.
      const isFinalStint = j === stints.length - 1;
      const threshold = finalStintNegligibleThresholdMin();
      if (isFinalStint && s.lengthMin > 0 && s.lengthMin <= threshold){
        if (!s.negligibleFinal) newlyNegligibleFinal.push(j);
        s.negligibleFinal = true;
        s.negligibleMinutes = s.lengthMin;
      } else if (s.negligibleFinal){
        s.negligibleFinal = false;
        delete s.negligibleMinutes;
      }
    }
  }

  // Absorbing stints doesn't cancel those drivers — it just means their turn
  // hasn't come yet. So the surviving stints shift down by however many
  // slots were swallowed: if an overrun eats two stints, everyone after it
  // moves two places later and keeps the same running order. A queue does
  // this in one pass — each stint contributes its current driver to the back
  // and takes the front, while a removed stint contributes its driver but
  // claims no slot, which is exactly what pushes the sequence along.
  //
  // Restoration is the opposite: nothing was skipped, so the rotation is
  // re-run cleanly from the anchor rather than shifted. Finished stints end
  // either pass — their driver is recorded history, not a plan.
  if (nowRemoved.length){
    const queue = [];
    for (let j=anchorIdx+1; j<stints.length; j++){
      const s = stints[j];
      if (s.finished) break;
      queue.push({ driver: s.driver, driverIndex: s.driverIndex });
      if (s.removed) continue; // driver stays queued, waiting for a real slot
      const next = queue.shift();
      s.driver = next.driver;
      s.driverIndex = next.driverIndex;
    }
  } else if (nowRestored.length){
    const validDrivers = cp.car.drivers.filter(d=>d.trim());
    if (validDrivers.length){
      let rot = (stints[anchorIdx].driverIndex + 1) % validDrivers.length;
      for (let j=anchorIdx+1; j<stints.length; j++){
        if (stints[j].finished) break;
        if (stints[j].removed) continue;
        stints[j].driverIndex = rot;
        stints[j].driver = validDrivers[rot];
        rot = (rot+1) % validDrivers.length;
      }
    }
  }

  return { nowRemoved, nowRestored, newlyNegligibleFinal };
}

// Editing a stint's end time hands the freed-up (or overrun) time to
// whatever comes after it. The very next stint just has its start pushed
// to match. If the overrun is big enough to swallow that stint's own
// planned end entirely, it's marked removed (greyed out, not deleted —
// see renderStintRow) and the cascade keeps checking the stint after that,
// and so on, until it reaches one with real time left. Shrinking an earlier
// stint back down runs the same recalculation and revives anything that's
// no longer swallowed.
async function updateStintEnd(carId, stintIdx, timeStr){
  if (!timeStr) { render(); return; }
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stints = cp.stints;
  const stint = stints[stintIdx];
  if (!stint) return;

  const [hh,mm] = timeStr.split(":").map(Number);
  const newEnd = new Date(stint.start);
  newEnd.setHours(hh, mm, 0, 0);

  if (newEnd <= stint.start){
    render(); // invalid — end can't be before this stint's own start; revert the field
    return;
  }

  const deltaMin = Math.round((newEnd.getTime() - stint.end.getTime())/60000); // did this specific edit change anything?
  if (!stint.plannedEnd) stint.plannedEnd = new Date(stint.end); // backfill for stints saved before this was tracked
  stint.end = newEnd;
  stint.lengthMin = Math.round((stint.end - stint.start)/60000);
  stint.removed = false; // the stint being actively edited is never itself "removed"
  stint.finished = true; // this is the only path that confirms a real end time, so the End column now shows it instead of the Finish Stint button

  // Reported minutes always compare against this stint's ORIGINAL planned
  // end time, not just its value a moment ago — so if it already shifted
  // from an earlier edit or absorbed time from a prior stint's extension,
  // the log still reflects the true total deviation from the schedule
  // rather than just this one interaction's small remaining nudge.
  const deltaFromPlan = Math.round((stint.end.getTime() - stint.plannedEnd.getTime())/60000);

  // The overrun/underrun cascade runs on the RAW new end time only — it
  // decides whether downstream stints get absorbed or restored based on
  // genuine time gained or lost. It must NOT include the quiet-time break
  // below, or a scheduled rest period gets mistaken for lost time and ends
  // up stretching/absorbing real stints instead of just pushing the
  // schedule later untouched.
  const cursor = newEnd;
  const { nowRemoved, nowRestored, newlyNegligibleFinal } = cascadeStintsFrom(cp, stintIdx, cursor);

  // Any quiet-time break scheduled after THIS stint is dead time nobody
  // drives through. It must push everything downstream later by exactly
  // its duration, without changing anyone's stint length — a flat shift.
  // Doing this as a separate step (after the overrun cascade above) keeps a
  // scheduled rest period from ever being treated as absorbable lost time.
  if (stint.quietMinutes){
    for (let j=stintIdx+1; j<stints.length; j++){
      const ds = stints[j];
      ds.start = addMinutes(ds.start, stint.quietMinutes);
      ds.end = addMinutes(ds.end, stint.quietMinutes);
      if (ds.plannedEnd) ds.plannedEnd = addMinutes(ds.plannedEnd, stint.quietMinutes);
    }
  }

  if (nowRemoved.length){
    const list = nowRemoved.map(i=>`Stint ${i+1}`).join(", ");
    logStintNote(cp, stintIdx, `Stint ${stintIdx+1} extended by ${deltaFromPlan} min — completely absorbed ${list}. ${nowRemoved.length>1?"They've":"It's"} been removed from the schedule.`, "warn", "end-adjust");
  } else if (nowRestored.length){
    const list = nowRestored.map(i=>`Stint ${i+1}`).join(", ");
    logStintNote(cp, stintIdx, `Stint ${stintIdx+1} adjusted — ${list} restored to the schedule.`, "info", "end-adjust");
  } else if (deltaMin !== 0){
    const label = deltaFromPlan > 0
      ? `Stint ${stintIdx+1} extended by ${deltaFromPlan} min.`
      : deltaFromPlan < 0
        ? `Stint ${stintIdx+1} was short ${Math.abs(deltaFromPlan)} min.`
        : `Stint ${stintIdx+1} adjusted back to its original schedule.`;
    logStintNote(cp, stintIdx, label, "info", "end-adjust");
  }

  // The final stint got squeezed down to a sliver too small to hand a
  // driver as its own stint — not absorbed to zero, just noted. Its real
  // start/end times are untouched; only the fact that it isn't being
  // scheduled as a stand-alone stint gets logged.
  if (newlyNegligibleFinal.length){
    newlyNegligibleFinal.forEach(i=>{
      const mins = stints[i].negligibleMinutes;
      logStintNote(cp, i, `Only ${mins} min remains for the final stint — too short to schedule as its own stint. Noted here in case fuel numbers are tight near the ${finalStintNegligibleThresholdMin()} min mark.`, "warn");
    });
  }


  recomputePlanEndTime();
  await syncPlanToRaceRecord();
  render();
}

async function updateStintPosition(carId, stintIdx, value){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  stint.position = value.trim() ? value.trim() : null;
  await syncPlanToRaceRecord();
  render();
}

// Lets a stint's driver be reassigned after the plan was generated (e.g.
// swapping the rotation on the fly, or slotting someone in out of their
// usual sequence). driverIndex is kept in sync so the color dot / palette
// stays consistent with the car's driver list.
//
// Deliberately a bare name swap: no stint resize, no downstream driver
// shuffle. The rotation built at race creation already lays out lengths and
// order efficiently, and start times are now tuned directly with the ±15
// adjuster — so a dropdown change here should mean only "this stint is
// driven by someone else," never a silent re-plan of the rest of the day.
async function updateStintDriver(carId, stintIdx, driverName){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  const validDrivers = cp.car.drivers.filter(d=>d.trim());
  const idx = validDrivers.indexOf(driverName);
  stint.driver = driverName;
  stint.driverIndex = idx >= 0 ? idx : 0;
  // The same driver now on the stint before or after this one = a double
  // stint: fold the two into one entry. Later stints keep their times and
  // drivers; only their numbering moves up.
  const merges = mergeDoubleStintsAround(cp.stints, stintIdx);
  if (!merges.length){
    await saveStintFields(cp.car.id, stintIdx, { driver: stint.driver, driver_index: stint.driverIndex });
    render();
    return;
  }
  merges.forEach(m => {
    // Log entries follow their stint to its new number.
    (cp.log || []).forEach(l => { if (l.stintIdx != null && l.stintIdx >= m.removedIdx) l.stintIdx = l.stintIdx === m.removedIdx ? m.at : l.stintIdx - 1; });
  });
  [...state.openStintNotes].forEach(k => { if (k.startsWith(cp.car.id + "__")) state.openStintNotes.delete(k); });
  await persistStintMerges(cp, merges);
  merges.forEach(m => logStintNote(cp, m.at, `Double stint — ${m.driver} runs Stints ${m.at + 1}–${m.at + 2} as one; later stints unchanged.`, "info"));
  render();
}

// Back-to-back stints for the same driver around index i are one double
// stint. The later stint folds into the earlier: the earlier keeps its
// start and takes the later one's end, planned end and any quiet break.
// Only stints still to run (or the one on track) merge — a finished stint
// is history — and never across a quiet-time break. Removed (absorbed)
// stints in between are skipped over. Returns [{ at, removedIdx, driver }]
// in the order applied; indices refer to the array at that moment.
function mergeDoubleStintsAround(stints, i){
  const merges = [];
  const live = k => k >= 0 && k < stints.length && !stints[k].removed;
  const prevOf = k => { let j = k - 1; while (j >= 0 && stints[j].removed) j--; return j; };
  const nextOf = k => { let j = k + 1; while (j < stints.length && stints[j].removed) j++; return j; };
  const canMerge = (a, b) => a && b && !a.finished && !b.finished && !a.quietMinutes
    && a.driver && b.driver && sameDriverName(a.driver, b.driver);
  const fold = (ai, bi) => {
    const a = stints[ai], b = stints[bi];
    a.end = new Date(b.end);
    a.plannedEnd = new Date(b.plannedEnd || b.end);
    a.lengthMin = Math.round((a.end - a.start) / 60000);
    a.quietMinutes = b.quietMinutes || 0;
    if (b.position != null && b.position !== "") a.position = b.position;
    const notes = [a.notes, b.notes].filter(x => x && x.trim());
    a.notes = notes.join("\n");
    stints.splice(bi, 1);
    merges.push({ at: ai, removedIdx: bi, driver: a.driver });
  };
  let at = i;
  const p = prevOf(at);
  if (live(p) && canMerge(stints[p], stints[at])){ fold(p, at); at = p; }
  const n = nextOf(at);
  if (live(n) && canMerge(stints[at], stints[n])) fold(at, n);
  return merges;
}

// Saves a car's stints after a merge renumbered them: every row from the
// first merge point on is rewritten at its new index, rows past the new end
// are deleted, and stint_log entries move with their stints.
async function persistStintMerges(cp, merges){
  const carId = cp.car.id;
  const from = Math.min(...merges.map(m => m.at));
  const rows = cp.stints.map((s, i) => ({
    car_id: carId, stint_index: i, driver: s.driver, driver_index: s.driverIndex,
    start_at: s.start.toISOString(), end_at: s.end.toISOString(),
    planned_end_at: (s.plannedEnd || s.end).toISOString(), length_min: s.lengthMin,
    position: s.position ?? null, notes: s.notes || "", flags: s.flags || [],
    removed: s.removed || false, quiet_minutes: s.quietMinutes || 0, finished: s.finished || false,
  })).slice(from);
  const { error } = await supabase.from("stints").upsert(rows, { onConflict: "car_id,stint_index" });
  if (error) console.error("persistStintMerges upsert failed:", error);
  const { error: delErr } = await supabase.from("stints").delete().eq("car_id", carId).gte("stint_index", cp.stints.length);
  if (delErr) console.error("persistStintMerges trailing delete failed:", delErr);
  // Log rows: each merge shifts entries after its removed stint down one.
  const { data: logs, error: logErr } = await supabase.from("stint_log").select("id, stint_index").eq("car_id", carId).gte("stint_index", from);
  if (logErr){ console.error("persistStintMerges log read failed:", logErr); return; }
  for (const l of logs || []){
    let idx = l.stint_index;
    merges.forEach(m => { if (idx >= m.removedIdx) idx = idx === m.removedIdx ? m.at : idx - 1; });
    if (idx !== l.stint_index){
      const { error: e } = await supabase.from("stint_log").update({ stint_index: idx }).eq("id", l.id);
      if (e) console.error("persistStintMerges log shift failed:", e);
    }
  }
}

// One stint row, only the given columns — used for edits allowed while a
// race is live, so the rest of the row (times, finished, removed) stays
// whatever the poller last wrote.
async function saveStintFields(carId, stintIdx, fields){
  const { error } = await supabase.from("stints").update(fields).eq("car_id", carId).eq("stint_index", stintIdx);
  if (error) console.error("saveStintFields failed:", error);
}

async function updateStintNote(carId, stintIdx, value){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  stint.notes = value;
  await saveStintFields(cp.car.id, stintIdx, { notes: value || "" });
  render();
}

async function toggleStintFlag(carId, stintIdx, flagKey){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  const stint = cp.stints[stintIdx];
  if (!stint) return;
  if (!stint.flags) stint.flags = [];

  const idx = stint.flags.indexOf(flagKey);
  if (idx >= 0) stint.flags.splice(idx, 1); else stint.flags.push(flagKey);
  await syncPlanToRaceRecord();
  render();
}

// Retiring a car marks every stint after the retirement point as removed
// (same greyed-out treatment as an absorbed stint) and records which stint
// it happened after. recomputePlanEndTime + the cascade guard in
// updateStintEnd both already respect retiredAtStint, so the race's overall
// end time and any later time edits correctly treat this car as done.
async function retireCarAction(carId, stintIdx){
  const cp = state.plan.carPlans.find(cp=>cp.car.id===carId);
  if (!cp) return;
  cp.retiredAtStint = stintIdx;
  for (let j=stintIdx+1; j<cp.stints.length; j++){
    cp.stints[j].removed = true;
  }
  logStintNote(cp, stintIdx, `Car retired after Stint ${stintIdx+1}.`, "warn");
  recomputePlanEndTime();
  await syncPlanToRaceRecord();
  render();
}

async function archiveRace(){
  // Finish position is no longer entered here — the Red Mist results
  // built below supply it (see getEffectiveFinishPosition()). The `finish_position`
  // column on `cars` is left untouched going forward; RLS blocks writing
  // it once the race is archived anyway, so there's nothing to backfill.
  //
  // This RLS block is BY DESIGN, not a bug to route around: once a race
  // is archived, its `cars` rows are meant to be frozen at the database
  // level. Any correction to an already-archived race should be a rare,
  // deliberate action done directly in Supabase (dashboard/SQL) — not
  // something the app exposes an "edit archived race" path for. Do not
  // add a client-side workaround (e.g. a service-role bypass) for this.
  const { error: statusErr } = await supabase.from("races").update({ status: "archived" }).eq("id", state.currentRaceId);
  if (statusErr) console.error("archiveRace: status update failed:", statusErr);

  state.currentStatus = "archived";
  const raceInList = state.races.find(r=>r.id===state.currentRaceId);
  if (raceInList?.redmistLive?.finished) raceInList.redmistLive = null; // archived view takes over from here
  if (raceInList){
    raceInList.status = "archived";
    raceInList.cars = state.plan.carPlans.map(cp=>({ ...cp.car }));
  }
  // Results come straight from Red Mist. Built and saved now so every
  // viewer gets the same overview from here on.
  state.archiveLoading = true;
  render();
  try {
    const built = raceInList ? await buildRedmistArchive(raceInList, { save: true }) : null;
    if (built) raceInList.archiveResults = built;
    else console.warn("archiveRace: no Red Mist results saved for this race — use Build Results from Red Mist once they are");
  } catch (e){
    console.error("archiveRace: building Red Mist results failed:", e);
  }
  state.archiveLoading = false;
  render();
}

// ---- horizontal-scroll support for tile rows (mouse wheel + click-drag) ----
// Delegated on document so it keeps working across re-renders (bindEvents()
// re-runs on every render(), but this only needs to be wired up once).
(function enableHorizontalScrollRows(){
  const ROW_SELECTOR = ".tile-row, .catalog-row, .track-picker-row";

  // Mouse wheel / trackpad: a vertical wheel gesture over a horizontally
  // scrollable row scrolls it sideways instead of scrolling the page.
  document.addEventListener("wheel", function(e){
    const row = e.target.closest(ROW_SELECTOR);
    if (!row) return;
    if (row.scrollWidth <= row.clientWidth) return; // nothing to scroll
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // already a horizontal gesture, let it be native
    e.preventDefault();
    row.scrollLeft += e.deltaY;
  }, { passive: false });

  // Click-and-drag (mouse) support, in addition to native touch swipe which
  // overflow-x:auto already provides on mobile.
  let dragEl = null, startX = 0, startScroll = 0, moved = false;
  document.addEventListener("mousedown", function(e){
    const row = e.target.closest(ROW_SELECTOR);
    if (!row) return;
    dragEl = row; startX = e.pageX; startScroll = row.scrollLeft; moved = false;
    row.classList.add("dragging");
  });
  document.addEventListener("mousemove", function(e){
    if (!dragEl) return;
    const dx = e.pageX - startX;
    if (Math.abs(dx) > 4) moved = true;
    dragEl.scrollLeft = startScroll - dx;
  });
  function endDrag(){
    if (!dragEl) return;
    dragEl.classList.remove("dragging");
    dragEl = null;
  }
  document.addEventListener("mouseup", endDrag);
  document.addEventListener("mouseleave", endDrag);
  // Suppress the click that would otherwise fire on a tile right after a
  // real drag (so dragging the row doesn't accidentally select a tile).
  document.addEventListener("click", function(e){
    if (moved){ e.stopPropagation(); e.preventDefault(); moved = false; }
  }, true);
})();

// ---- AUTH BOOT ----
// This page renders for everyone, session or not — getSession() resolves
// from the client's cached session (localStorage), fast, no network
// round-trip in the common case. If a session exists, checkIsEngineer()
// (a simple "am I in the engineers table" lookup) decides whether edit
// controls unlock; maybeSingle() (not single()) since zero rows is the
// normal, expected case for a non-engineer account, not an error. The
// onAuthStateChange listener below upgrades to engineer mode if a session
// shows up shortly after load (e.g. a magic-link click landing here), and
// downgrades back to read-only on sign-out.
// ---- "currently on track" live-highlight ticker ----
// carPlanSection() already computes the correct live stint at render time,
// but if someone leaves the plan page open without triggering any other
// re-render, that highlight would go stale as time passes. Rather than
// calling the full render() on a timer — which would blow away an
// in-progress stint note edit (the textarea only commits on blur) — this
// directly patches just the timeline segments and stint-table rows that
// need to change, using the data- attributes carPlanSection() writes out
// for exactly this purpose.
function updateLiveHighlights(){
  if (!state.plan || state.currentStatus === "archived") return;
  state.plan.carPlans.forEach(cp=>{
    const liveIdx = computeLiveStintIndex(cp.stints, false);
    const ind = liveIndicator(state.races.find(r=>r.id===state.currentRaceId), cp.car.number);

    document.querySelectorAll(`.timeline .seg[data-car="${cp.car.id}"]`).forEach(el=>{
      const idx = +el.getAttribute("data-stint");
      const color = el.getAttribute("data-color");
      const isLive = idx === liveIdx;
      const [r,g,b] = hexToRgb(color);
      const stint = cp.stints[idx];
      el.classList.toggle("seg-live", isLive);
      el.classList.toggle("seg-pit", isLive && ind.inPit);
      el.classList.toggle("seg-checkered", isLive && !!ind.checkered);
      el.style.background = isLive ? ind.wash : `rgba(${r},${g},${b},0.14)`;
      el.style.borderColor = isLive ? ind.color : "transparent";
      if (!isLive) el.style.borderTopColor = color; // border-color shorthand above also reset the top accent stripe — reassert it
      el.style.boxShadow = "none";
      if (stint) el.style.flexGrow = Math.max(stint.lengthMin, 1) * (isLive ? 1.6 : 1); // live card gets extra room for "ON TRACK"
      const dotEl = el.querySelector(".dot, .live-dot");
      if (dotEl){
        dotEl.className = isLive ? "live-dot" : "dot";
        dotEl.style.background = isLive ? ind.color : color;
      }
      const tmEl = el.querySelector(".tm");
      if (tmEl){
        if (isLive){
          tmEl.style.whiteSpace = "normal";
          tmEl.style.overflow = "visible";
          tmEl.style.lineHeight = "1.1";
          tmEl.innerHTML = `<span style="color:${ind.color};font-weight:600;">${ind.label}</span>`;
        } else {
          tmEl.style.whiteSpace = "";
          tmEl.style.overflow = "";
          tmEl.style.lineHeight = "";
          tmEl.innerHTML = (stint && stint.finished ? formatDuration(stint.lengthMin) : formatTimeUltraCompact(new Date(el.getAttribute("data-start-iso"))));
        }
      }
    });

    document.querySelectorAll(`.stint-table .row[data-car="${cp.car.id}"]`).forEach(el=>{
      const idx = +el.getAttribute("data-stint");
      const isLive = idx === liveIdx;
      el.classList.toggle("row-live", isLive);
      el.classList.toggle("row-pit", isLive && ind.inPit);
      el.classList.toggle("row-checkered", isLive && !!ind.checkered);
    });
  });
}
setInterval(updateLiveHighlights, 30000);

async function checkIsEngineer(){
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) return false;
  const { data, error } = await supabase.from("engineers").select("user_id").eq("user_id", user.id).maybeSingle();
  if (error){ console.error("checkIsEngineer failed:", error); return false; }
  return !!data;
}

// The phone/browser back gesture and the Esc key both route through the
// same stack the on-screen Back button uses. popstate is the only place
// that actually unwinds a screen; the button and Esc call history.back(),
// which triggers this.
window.addEventListener("popstate", function(){
  if (state.confirmDelete){ state.confirmDelete = null; render(); return; }
  if (state.navStack.length) navBack();
});
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  // Esc closes an open confirmation dialog first; only once nothing is
  // layered on top does it mean "go back a screen".
  if (state.confirmDelete){ state.confirmDelete = null; render(); return; }
  // Don't hijack Esc while the user is in a text field.
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")){ t.blur(); return; }
  requestBack();
});

// Re-fetches races fresh from Supabase, but preserves any fields that only
// live in memory and aren't part of the races/cars row shape itself -
// currently `archiveResults` (archived Red Mist overview), `redmistPitCycles` (Red
// Mist pit-cycle data), `redmistLive` (live timing + the driver-change
// debounce state), `qualiResults` and `raceResults` (saved Red Mist final
// results), all attached separately from loadRaces()'s own query.
//
// Needed because Supabase's auth client can fire a SIGNED_IN-equivalent
// event on its own when a tab regains focus/visibility (routine token
// refresh behavior, not something this app triggers) - see
// onAuthStateChange below. That re-runs startApp(), which used to blindly
// replace state.races wholesale, silently wiping any currently-open race's
// loaded data even though nothing the person did should have discarded it.
// A full page reload masked this (it re-opens the race properly and
// re-fetches everything), which is why the bug only showed up on
// tab-switch, not on refresh. redmistLive is a second, later instance of
// exactly this same problem: every tab-focus event was quietly resetting
// the live tile AND the driver-change confirmation streak back to
// nothing, which looked like the debounce simply never confirming.
async function startApp(isEngineer){
  state.isEngineer = isEngineer;
  const fresh = await loadRaces();
  const prevById = new Map(state.races.map(r => [r.id, r]));
  state.races = fresh.map(r => {
    const prev = prevById.get(r.id);
    if (!prev) return r;
    const preserved = { ...r };
    if (prev.archiveResults) preserved.archiveResults = prev.archiveResults;
    if (prev.redmistPitCycles) preserved.redmistPitCycles = prev.redmistPitCycles;
    if (prev.redmistLive) preserved.redmistLive = prev.redmistLive;
    if (prev.qualiResults) preserved.qualiResults = prev.qualiResults;
    // Saved Red Mist final results (loadRaceResults) — only fetched when a
    // race is opened, so dropping it here made the Final Results table
    // vanish on every tab switch until a full reload.
    if (prev.raceResults) preserved.raceResults = prev.raceResults;
    return preserved;
  });
  state.catalog = await loadCatalog();
  render();
}

async function bootIfAuthorized(){
  // Roster/allowlist gating has been rolled back — the plan is public and
  // read-only for anyone. The only thing left to check is whether the
  // signed-in account (if any) is an engineer, which unlocks editing.
  const isEngineer = await checkIsEngineer();
  await startApp(isEngineer);
}

(async function boot(){
  const { data: { session } } = await supabase.auth.getSession();
  if (session){
    await bootIfAuthorized();
  } else {
    // No session — the plan is public and read-only, so render it
    // immediately rather than gating on (or redirecting for) a login.
    await startApp(false);
  }

  // Home's LIVE race badge — started once here (not inside startApp,
  // which re-runs on every tab-focus re-auth) and left running for the
  // life of the tab, independent of whether any race is currently open.
  loadHomeLiveStatus();
  subscribeHomeLiveWatch();
  loadFinishedRaceIds();

  // Safety net / upgrade path: picks up a session that lands after the
  // initial render (e.g. a magic-link click that opened this same URL,
  // or the tab regaining a session), and re-checks engineer status.
  // Also downgrades back to read-only immediately on sign-out.
  supabase.auth.onAuthStateChange(function(event, newSession){
    if (event === "SIGNED_IN" && newSession){
      bootIfAuthorized();
    } else if (event === "SIGNED_OUT"){
      state.isEngineer = false;
      render();
    }
  });
})();
</script>
