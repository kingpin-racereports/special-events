// Heatmap for a stint's finish position relative to the car's class starting
// position — lower/better positions trend green, higher/worse trend red.
function positionCellStyle(posValue, startPos){
  const pos = parsePosition(posValue);
  const start = parsePosition(startPos);
  if (pos==null || start==null) return { bg:"transparent", color:"var(--text)" };
  const delta = pos - start; // negative = gained spots, positive = lost spots
  const maxDelta = 8;
  const clamped = Math.max(-maxDelta, Math.min(maxDelta, delta));
  const t = Math.abs(clamped) / maxDelta; // 0..1
  // Bumped up from a 0.14–0.74 range — the low end was nearly invisible for
  // small position swings, which is most of them in practice.
  const alpha = (0.32 + t*0.55).toFixed(2);
  const [r,g,b] = hexToRgb(clamped <= 0 ? T.green : T.red);
  const textColor = t > 0.35 ? "#0A0C10" : "var(--text)";
  return { bg:`rgba(${r},${g},${b},${alpha})`, color: textColor };
}
// "Currently on track" — which stint actually has a driver in the car
// right now. This is NOT simply "whichever stint's scheduled window
// contains the current time": a stint's scheduled end passing doesn't
// mean the driver actually came in — that only becomes true once the
// stint is confirmed finished (via the Finish Stint button or an end-time
// edit, which set s.finished). So this walks stints in order and picks
// the FIRST one that hasn't been finished yet — that's whoever is really
// out there, even if they're running long past their scheduled end and
// the next driver's scheduled slot has technically already started. If
// that stint hasn't reached its own (possibly cascade-adjusted) start
// time yet, nobody's confirmed on track (race hasn't started, or there's
// a genuine gap — quiet time, a pending driver change, etc).
function computeLiveStintIndex(stints, archived){
  if (archived) return -1;
  const now = new Date();
  const idx = stints.findIndex(s=>!s.removed && !s.negligibleFinal && !s.finished);
  if (idx === -1) return -1; // every stint already finished (or none exist)
  return now >= stints[idx].start ? idx : -1;
}
function parsePosition(v){
  if (v == null) return null;

// Class finish position accepts either a numeric spot or "DNF" — a car that
// retires still needs to be archivable without a class position, since it
// never crossed the line. Returns a number, the literal string "DNF", or
// null if the field is empty/unrecognized. The `cars.finish_position`
// column is text, so both forms round-trip through Supabase cleanly.
function parseFinishPosition(v){
  if (v == null) return null;
  const s = String(v).trim();
  if (!s) return null;
  if (/^dnf$/i.test(s)) return "DNF";
  return parsePosition(s);
}
function buildShortNames(fullNames){
  const lastCounts = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    lastCounts[last] = (lastCounts[last]||0) + 1;
  });
  const map = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    // Last name only ("Robert Campbell" -> "Campbell"), unless another driver
    // on this car shares that last name — then disambiguate with a first
    // initial ("T. Driver" / "A. Driver").
    map[n] = (lastCounts[last] > 1 && parts.length > 1) ? `${parts[0][0]}. ${last}` : last;
  });

}
// Compact 3-letter driver codes for the horizontal timeline specifically —
// full/short names don't reliably fit in the narrow, proportionally-sized
// stint cards. Normally the first 3 letters of the last name ("Atchley" ->
// "ATC"); if two drivers on the same car share a last name, disambiguates
// with a first-name initial + first 2 letters of the last name instead
// ("Tom Driver" / "Alex Driver" -> "TDR" / "ADR"). Scoped to the timeline
// only — the stint table keeps using buildShortNames().
function buildTimelineAbbrev(fullNames){
  const lastCounts = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    lastCounts[last] = (lastCounts[last]||0) + 1;
  });
  const map = {};
  fullNames.forEach(n=>{
    const parts = n.trim().split(/\s+/);
    const last = parts[parts.length-1];
    const first = parts[0];
    map[n] = (lastCounts[last] > 1 && parts.length > 1)
      ? (first[0] + last.slice(0,2)).toUpperCase()
      : last.slice(0,3).toUpperCase();
  });
  return map;
}

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// Stint-length for a driver, chosen either from the 60/90/120 quick-pick
// buttons or the "Custom" select, which offers every 5-minute increment
// from 45 to 180. Anything unset or unrecognized (e.g. a car added before
// this feature existed, or an older '150' preset) reads as the 60 default,
// so older race records keep working.
const STINT_WHEEL_MIN = 45, STINT_WHEEL_MAX = 180, STINT_WHEEL_STEP = 5;
// The three quick-pick buttons. Any other value is reached through the
// "Custom" select, which is what that select displays whenever one of
// these presets is the active choice.
const STINT_PRESETS = ['60','90','120'];
function isStintPreset(mode){ return STINT_PRESETS.includes(String(mode)); }
function stintWheelValues(){
  const vals = [];
  for (let v = STINT_WHEEL_MIN; v <= STINT_WHEEL_MAX; v += STINT_WHEEL_STEP) vals.push(v);
  return vals;
}
function stintModeOf(car, idx){
  const raw = car.driverStintMode && car.driverStintMode[idx];
  const n = Number(raw);
  const valid = Number.isFinite(n) && n >= STINT_WHEEL_MIN && n <= STINT_WHEEL_MAX && (n - STINT_WHEEL_MIN) % STINT_WHEEL_STEP === 0;

}

// ---- livery placeholder (mimics CarHeaderImage fallback) ----

// ---- track layout image, same convention/fallback as the livery image ----
// Expects images at images/tracks/<slug>.png (same directory scheme as
// wherever car header images would live, e.g. images/cars/). If that image
// is missing (404) or no track is set, falls back to the same
// color + diagonal-stripe placeholder used for cars.
function trackSlug(name){
  return (name||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");

// Image paths that 404'd this session. The fallback used to happen only
// in the DOM (onerror swaps the <img> for the placeholder), so the next
// render emitted the <img> again, it failed again, and got swapped again

// ===================== Live track map (Red Mist GPS) =====================
// While a session is live, the Track Map box draws the circuit Red Mist
// learned from GPS (v2 LoadTrackMap, stored per event in
// redmist_track_maps by live-poll) and puts each Kingpin car on it at its
// last GPS fix (redmist_live_gps — its own table and channel, so GPS
// moving every second never touches the positions rows or re-renders
// the page; fixes go straight to the ticker below). Car fixes
// are projected exactly as Red Mist projects the outline: metres from the
// map's north-west corner, y down, one scale taken at the map's centre.
// Dots glide between fixes rather than jumping once a second.
// No map yet for the event (Red Mist hasn't learned it) -> the static
// detail image, same as before.
// Re-read every TRACK_MAP_RECHECK_MS at most: often enough to pick up a
// map Red Mist learns mid-session (or its start/finish calibration), and
// rendering can call this freely without a query per render.
const TRACK_MAP_RECHECK_MS = 60_000;
// Live map (outline + GPS car dots) on every copy of the page, shown
// wherever a standings table is. Set false to fall back to the static
// -detail.png everywhere (no map load, no GPS subscription).
const LIVE_TRACK_MAP_ENABLED = true;
let liveTrackMap = { eventId: null, map: null, loading: false, checkedAt: 0 };

async function loadLiveTrackMap(eventId){
  if (!eventId || liveTrackMap.loading) return;
  if (liveTrackMap.eventId === String(eventId) && Date.now() - liveTrackMap.checkedAt < TRACK_MAP_RECHECK_MS) return;
  liveTrackMap.loading = true;
  try {
    const { data, error } = await supabase.from("redmist_track_maps")
      .select("event_id, map, built_utc").eq("event_id", String(eventId)).maybeSingle();
    if (error) throw error;
    const m = data?.map;
    const ok = m?.pts?.length >= 3 && m.bounds && (m.bounds.w > 0 || m.bounds.h > 0);
    const changed = liveTrackMap.eventId !== String(eventId) || !!liveTrackMap.map !== ok
      || (ok && liveTrackMap.map?.built !== m.built) || (ok && !!liveTrackMap.map?.sf !== !!m.sf);
    if (changed) for (const k in trackMapGlide) delete trackMapGlide[k];
    liveTrackMap = { eventId: String(eventId), map: ok ? m : null, loading: false, checkedAt: Date.now() };
    if (changed) scheduleRender();
  } catch (e){
    console.error("[track-map] load failed:", e);
    liveTrackMap.loading = false;
    liveTrackMap.checkedAt = Date.now();
  }
}

// car number -> { lat, lon, inPit, at } for the current event.
let liveGps = { eventId: null, byCar: {} };
const GPS_STALE_MS = 60_000; // no fix this long (car left the feed) -> no dot
function applyGpsRow(row){
  if (!row || String(row.event_id) !== liveGps.eventId) return;
  liveGps.byCar[row.car_number] = { lat: Number(row.latitude), lon: Number(row.longitude), inPit: row.in_pit === true, at: new Date(row.fetched_at).getTime() };
}
async function loadLiveGps(eventId){
  if (!LIVE_TRACK_MAP_ENABLED || !eventId) return;
  if (liveGps.eventId !== String(eventId)) liveGps = { eventId: String(eventId), byCar: {} };
  try {
    const { data, error } = await supabase.from("redmist_live_gps")
      .select("event_id, car_number, latitude, longitude, in_pit, fetched_at").eq("event_id", String(eventId));
    if (error) throw error;
    (data || []).forEach(applyGpsRow);
  } catch (e){
    console.error("[track-map] gps load failed:", e);
  }
}
// The GPS channel streams a row per car every second, so it only runs
// while a live map is actually on screen (Home or plan page) — opened and
// closed by startTrackMapTicker() after every render, for whichever event
// that map shows.
let gpsChannel = null, gpsChannelEvent = null;
function subscribeGpsChannel(eventId){
  if (!LIVE_TRACK_MAP_ENABLED || !eventId) return;
  if (gpsChannel && gpsChannelEvent === String(eventId)) return;
  unsubscribeGpsChannel();
  gpsChannelEvent = String(eventId);
  if (liveGps.eventId !== gpsChannelEvent) liveGps = { eventId: gpsChannelEvent, byCar: {} };
  gpsChannel = supabase
    .channel(`redmist-gps-${eventId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'redmist_live_gps', filter: `event_id=eq.${eventId}` }, payload => applyGpsRow(payload.new))
    .subscribe(status => { if (status === "SUBSCRIBED") loadLiveGps(eventId); });
}
function unsubscribeGpsChannel(){
  if (gpsChannel){ supabase.removeChannel(gpsChannel); gpsChannel = null; }
  gpsChannelEvent = null;
}

function trackMapProject(map, lat, lon){
  const b = map.bounds;
  const mLat = 6371000 * Math.PI / 180;
  const mLon = mLat * Math.cos(b.cLat * Math.PI / 180);
  return { x: (lon - b.minLon) * mLon, y: (b.maxLat - lat) * mLat };
}

// Our cars (never #53x), in plan order — those with a live row while
// attached, every plan car otherwise (their dots appear once GPS does).
function trackMapCars(race){
  const by = race?.redmistLive?.byCarNumber || {};
  const attached = isLiveAttached(race);
  return (race?.cars || []).filter(c => c.number && String(c.number).toLowerCase() !== "53x" && (!attached || by[c.number]))
    .map(c => ({ ...c, accent: c.accent || T.blue }));
}

// Number colour on a car's dot: dark on light accents (amber, cyan), white otherwise.
function trackMapInk(hex){
  try {
    const [r, g, b] = hexToRgb(hex);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? "#0B1030" : "#FFFFFF";
  } catch { return "#FFFFFF"; }
}

// Plan page: the live map in place of the static image whenever this
// plan's standings / qualifying / results tables are on screen (not just
// while attached to a live session). The event is the attached one, else
// the one the plan is linked to; with nothing on track it's the outline
// alone until GPS starts flowing.
function liveTrackMapSection(race, standingsShown){
  if (!race || race.status === "archived" || !standingsShown) return "";
  // Live sessions only (attached to a running quali / race, not yet at the
  // checkered) — otherwise the static track image.
  if (!isLiveAttached(race) || race.redmistLive?.finished || (state.liveSession?.type === "Race" && isCheckered())) return "";
  const eventId = state.redmistEventId ?? race.redmistEventId;
  if (eventId == null) return "";
  loadLiveTrackMap(eventId);
  const map = liveTrackMap.eventId === String(eventId) ? liveTrackMap.map : null;
  if (!map) return "";
  const ours = trackMapCars(race);
  const cars = [...ours, ...tmSelectedCars(new Set(ours.map(c => c.number)))];
  const by = race.redmistLive?.byCarNumber || {};
  const field = race.redmistLive?.fullField || [];
  return trackMapBox(map, eventId, cars, c => by[c.number] || field.find(r => r.car_number === c.number), { showField: true, track: race.track });
}

// Red Mist's centreline is learned from GPS, and its points are unevenly
// spaced: long gaps on straights, clusters in some corners. A spline
// through them can't fix that — where a corner is only a few points (or a
// tight cluster between two long segments) it still comes out as a sharp
// vertex, e.g. Sebring's Sunset Bend drawing as two points instead of one
// big sweeping arc. So the outline is rebuilt instead:
//   1. resample the closed loop at even spacing along its length, so
//      every stretch of track has the same point density;
//   2. smooth it with a circular Gaussian (TRACK_MAP_SMOOTH * span as the
//      sigma). Straights stay straight; any corner sharper than that
//      radius becomes a rounded arc.
// The drawn line can sit a few metres inside the raw points at a corner
// apex. Car dots come from GPS, and real cars trace the rounded line, so
// they sit on it at least as well as on the raw polygon.
const TRACK_MAP_SMOOTH = 0.03;    // Gaussian sigma, fraction of the map's larger side
function trackMapSmoothPath(pts, span){
  const S = trackMapSmoothPoints(pts, span);
  const f = v => v.toFixed(1);
  return S.map((p, k) => `${k ? "L" : "M"}${f(p.x)} ${f(p.y)}`).join("") + "Z";
}
function trackMapSmoothPoints(pts, span){
  span = span || pts.reduce((m, p) => Math.max(m, Math.abs(p.x), Math.abs(p.y)), 0) || 1;
  const f = v => v.toFixed(1);
  // Clean: drop exact/near duplicates and an explicit closing point.
  const minGap = span * 0.001;
  const P = [];
  for (const p of pts){
    const q = P[P.length - 1];
    if (!q || Math.hypot(p.x - q.x, p.y - q.y) > minGap) P.push({ x: p.x, y: p.y });
  }
  if (P.length > 2 && Math.hypot(P[0].x - P[P.length - 1].x, P[0].y - P[P.length - 1].y) <= minGap) P.pop();
  const n = P.length;
  if (n < 4) return P;

  // 1. Even resample by arc length around the closed loop.
  const seg = [];
  let perim = 0;
  for (let i = 0; i < n; i++){
    const a = P[i], b = P[(i + 1) % n];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    seg.push(len); perim += len;
  }
  const N = Math.max(60, Math.min(1500, Math.round(perim / (span / 300))));
  const step = perim / N;
  const R = [];
  let i = 0, acc = 0;
  for (let k = 0; k < N; k++){
    const t = k * step;
    while (i < n - 1 && acc + seg[i] < t){ acc += seg[i]; i++; }
    const a = P[i], b = P[(i + 1) % n];
    const u = seg[i] ? (t - acc) / seg[i] : 0;
    R.push({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u });
  }

  // 2. Circular Gaussian smoothing.
  const sigma = Math.max(1, (span * TRACK_MAP_SMOOTH) / step); // in samples
  const W = Math.min(Math.floor(N / 2) - 1, Math.ceil(sigma * 3));
  const kernel = [];
  let kSum = 0;
  for (let j = -W; j <= W; j++){ const w = Math.exp(-(j * j) / (2 * sigma * sigma)); kernel.push(w); kSum += w; }
  const S = R.map((_, k) => {
    let x = 0, y = 0;
    for (let j = -W; j <= W; j++){
      const q = R[(k + j + N) % N], w = kernel[j + W];
      x += q.x * w; y += q.y * w;
    }
    return { x: x / kSum, y: y / kSum };
  });

  return S;
}

// The smoothed line as a walkable loop: points, cumulative distance at
// each point, total length. Built once per map (cached on the map object)
// and used to move dots ALONG the drawn track instead of cutting corners.
function trackMapGeom(map){
  if (map._geom) return map._geom;
  const { w, h } = map.bounds;
  const span = Math.max(w, h);
  const pts = trackMapSmoothPoints(map.pts, span);
  const cum = [0];
  for (let i = 1; i <= pts.length; i++){
    const a = pts[i - 1], b = pts[i % pts.length];
    cum.push(cum[i - 1] + Math.hypot(b.x - a.x, b.y - a.y));
  }
  map._geom = { pts, cum, perim: cum[pts.length], span };
  return map._geom;
}
// Nearest point on the loop to (x, y): its distance along the loop and how
// far off the line it is (pit lane, paddock, or bad fix).
function trackMapSnap(geom, x, y){
  const { pts, cum } = geom, n = pts.length;
  let best = Infinity, bestS = 0;
  for (let i = 0; i < n; i++){
    const a = pts[i], b = pts[(i + 1) % n];
    const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy;
    const u = L2 ? Math.max(0, Math.min(1, ((x - a.x) * dx + (y - a.y) * dy) / L2)) : 0;
    const px = a.x + dx * u, py = a.y + dy * u;
    const d2 = (x - px) * (x - px) + (y - py) * (y - py);
    if (d2 < best){ best = d2; bestS = cum[i] + (cum[i + 1] - cum[i]) * u; }
  }
  return { s: bestS, off: Math.sqrt(best) };
}
// Point at distance s along the loop.
function trackMapAt(geom, s){
  const { pts, cum, perim } = geom, n = pts.length;
  s = ((s % perim) + perim) % perim;
  let lo = 0, hi = n;
  while (lo < hi - 1){ const mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
  const a = pts[lo], b = pts[(lo + 1) % n];
  const u = (s - cum[lo]) / ((cum[lo + 1] - cum[lo]) || 1);
  return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u };
}

// Corner number positions on the drawn line from a TRACK_CORNERS list.
// Start/finish and travel direction come from Red Mist's calibration
// (sf point + heading); without it, the outline's first point and its
// own point order. Each label is pushed to the outside of the bend.
// Cached per map.
function trackMapCorners(map, list){
  if (!list?.length) return [];
  if (map._cornersFor === list) return map._corners;
  const geom = trackMapGeom(map);
  const { span, perim } = geom;
  let s0 = 0, dir = 1;
  if (map.sf){
    s0 = trackMapSnap(geom, map.sf.x, map.sf.y).s;
    const a = trackMapAt(geom, s0 - span * 0.01), b = trackMapAt(geom, s0 + span * 0.01);
    const rad = map.sf.hdg * Math.PI / 180;
    if ((b.x - a.x) * Math.sin(rad) + (b.y - a.y) * -Math.cos(rad) < 0) dir = -1;
  }
  const look = span * 0.025;
  const COMPASS = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0], ne: [1, -1], nw: [-1, -1], se: [1, 1], sw: [-1, 1] };
  const corners = list.map(([num, f, side]) => {
    const s = s0 + dir * f * perim;
    const p = trackMapAt(geom, s), a = trackMapAt(geom, s - dir * look), c = trackMapAt(geom, s + dir * look);
    const t1x = p.x - a.x, t1y = p.y - a.y, t2x = c.x - p.x, t2y = c.y - p.y;
    const l1 = Math.hypot(t1x, t1y) || 1, l2 = Math.hypot(t2x, t2y) || 1;
    let ox = -(t2x / l2 - t1x / l1), oy = -(t2y / l2 - t1y / l1);
    const lo = Math.hypot(ox, oy);
    if (lo < 1e-3){ ox = -t2y / l2; oy = t2x / l2; } else { ox /= lo; oy /= lo; }
    const forced = COMPASS[side];
    if (forced){ const fl = Math.hypot(forced[0], forced[1]); ox = forced[0] / fl; oy = forced[1] / fl; }
    return { num, x: p.x, y: p.y, ox, oy };
  });
  map._cornersFor = list;
  map._corners = corners;
  return corners;
}

// Cars picked from a standings table to follow on the map. Each gets its
// own colour and is drawn like a Kingpin car (big numbered dot, in the
// legend) but with a white ring, so gold still means Kingpin. Kept for the
// session, across pages; Kingpin rows aren't selectable (always shown).
const TM_SELECT_COLORS = ["#FF5C8A", "#4DD0E1", "#B388FF", "#69F0AE", "#FF8A3D", "#40C4FF", "#EEFF41", "#F48FB1"];
const tmSelected = new Map(); // car number -> colour, in pick order
function tmToggleCar(num){
  if (!num) return;
  if (tmSelected.has(num)) tmSelected.delete(num);
  else {
    const used = new Set(tmSelected.values());
    tmSelected.set(num, TM_SELECT_COLORS.find(c => !used.has(c)) || TM_SELECT_COLORS[tmSelected.size % TM_SELECT_COLORS.length]);
  }
  scheduleRender();
}
// Selected cars to add to a map, minus any already drawn as ours.
function tmSelectedCars(ourNums){
  return [...tmSelected].filter(([n]) => !ourNums.has(n)).map(([number, accent]) => ({ number, accent, selected: true }));
}
// Standings rows: Kingpin rows keep their gold highlight; every other row
// is tappable to add/remove that car on the live map (only while a live
// map exists), tinted in its map colour once picked.
function tmRowAttrs(num, isOurs){
  if (isOurs) return `style="background:${T.gold}17;border-left:2px solid ${T.gold};"`;
  if (!LIVE_TRACK_MAP_ENABLED || !liveTrackMap.map) return "";
  const col = tmSelected.get(num);
  return `data-act="tm-select-car" data-car="${esc(num)}" class="tm-selectable" title="${col ? "Remove from" : "Show on"} track map"${col ? ` style="background:${col}1F;border-left:2px solid ${col};"` : ""}`;
}
function tmSwatch(num){
  const col = tmSelected.get(num);
  return col && LIVE_TRACK_MAP_ENABLED && liveTrackMap.map ? `<span class="tm-row-sw" style="background:${col};"></span>` : "";
}

// The live map box: outline, start/finish, our cars as numbered accent
// dots, and every other car on track as a small muted dot. The
// field dots aren't rendered here — the ticker adds one for each car it
// has a GPS fix for, so cars joining the session appear without a render.
// posOf(car) -> that car's current positions row, for the legend.
function trackMapBox(map, eventId, cars, posOf, opts = {}){
  const { w, h } = map.bounds;
  const span = Math.max(w, h);
  const pad = span * 0.06;
  const line = trackMapSmoothPath(map.pts, span);

  // Start/finish: a short bar across the track, perpendicular to travel.
  let sf = "";
  if (map.sf){
    const rad = map.sf.hdg * Math.PI / 180;      // compass: 0 = north (−y), 90 = east (+x)
    const px = Math.cos(rad), py = Math.sin(rad); // perpendicular to (sin, −cos)
    const half = span * 0.025;
    sf = `<line x1="${(map.sf.x - px * half).toFixed(1)}" y1="${(map.sf.y - py * half).toFixed(1)}" x2="${(map.sf.x + px * half).toFixed(1)}" y2="${(map.sf.y + py * half).toFixed(1)}"
            stroke="${T.white}" stroke-width="${(span * 0.008).toFixed(1)}" stroke-linecap="round"></line>`;
  }

  // Corner numbers, just off the outside edge of the line.
  const cornerList = trackCornersFor(opts.track, map.track);
  const cornerLabels = cornerList ? trackMapCorners(map, cornerList).map(c => {
    const d = span * 0.042;
    return `<text class="tm-turn" x="${(c.x + c.ox * d).toFixed(1)}" y="${(c.y + c.oy * d).toFixed(1)}" font-size="${(span * 0.028).toFixed(1)}">${c.num}</text>`;
  }).join("") : "";

  const r = span * 0.024;
  // Dots are placed by the ticker; the morph patcher leaves these groups
  // alone while their key is unchanged, so live ticks don't reset them.
  const key = cars.map(c => `${c.number}:${c.accent}`).join(",") + "|" + (map.built || "") + (map.sf ? "|sf" : "");
  const dots = cars.map(c => `
        <g class="tm-car" data-tm-car="${esc(c.number)}" transform="translate(0 0)" style="opacity:0;">
          <circle r="${r.toFixed(1)}" fill="${c.accent}" stroke="${c.selected ? T.white : T.gold}" stroke-width="${(r * 0.22).toFixed(1)}"></circle>
          <text font-size="${(r * (String(c.number).length > 2 ? 0.8 : 0.95)).toFixed(1)}" style="fill:${trackMapInk(c.accent)};">${esc(c.number)}</text>
        </g>`).join("");
  const field = opts.showField
    ? `<g class="tm-field" data-morph-skip data-morph-key="${esc("field|" + key)}" data-tm-ours="${esc(cars.map(c => c.number).join(","))}" data-tm-r="${(r * 0.55).toFixed(1)}" data-tm-sw="${(r * 0.18).toFixed(1)}"></g>`
    : "";

  const legend = cars.length ? `
      <div class="tm-legend">
        ${cars.map(c => {
          const pos = posOf(c) || {};
          const where = pos.in_pit === true ? "In pit" : `P${pos.class_position ?? "—"}`;
          return `<span><span class="sw" style="background:${c.accent};${c.selected ? `box-shadow:0 0 0 1.5px ${T.white};` : `box-shadow:0 0 0 1.5px ${T.gold};`}"></span><b>#${esc(c.number)}</b> ${where}</span>`;
        }).join("")}
        ${cars.some(c => c.selected) ? `<button class="tm-clear" data-act="tm-clear-selection">Clear</button>` : ""}
      </div>` : "";

  return `
    <div class="track-detail-box" id="trackDetailBox">
      <div class="track-detail-head">${icon("mapPin",13)} Track Map</div>
      <svg class="tm-map" id="tmLiveSvg" data-tm-event="${esc(String(eventId))}" viewBox="${(-pad).toFixed(1)} ${(-pad).toFixed(1)} ${(w + pad * 2).toFixed(1)} ${(h + pad * 2).toFixed(1)}"
           role="img" aria-label="${esc(map.track || "Track")} map with live car positions">
        <path d="${line}" fill="none" stroke="${T.border}" stroke-width="${(span * 0.03).toFixed(1)}" stroke-linejoin="round"></path>
        <path d="${line}" fill="none" stroke="${T.panelRaised}" stroke-width="${(span * 0.018).toFixed(1)}" stroke-linejoin="round"></path>
        ${sf}
        ${cornerLabels}
        ${field}
        <g class="tm-dots" data-morph-skip data-morph-key="${esc(key)}">${dots}</g>
      </svg>
      ${legend}
    </div>`;
}

// Home: the same map beneath the Qualifying / Race standings, for the
// event the poller has found live — no race plan needed. Shown whenever a
// standings table is (renderHome passes that in), so it stays up between
// sessions too: during practice/HPDE the poller writes no GPS, so the
// outline shows with no dots until the next quali/race goes green. Every
// car with a fresh GPS fix is drawn; Kingpin cars (plan cars or Kingpin
// team name) get the numbered accent dots.
function renderHomeTrackMap(standingsShown){
  if (!LIVE_TRACK_MAP_ENABLED || !standingsShown) return "";
  const hs = state.homeStandings;
  if (!hs) return "";
  const s = hs.session;
  // Only while a qualifying or race session is actually running — once
  // sessions are finished (or the race has the checkered) the tables stay
  // up but there's nothing on track to show.
  if (!s || !s.active || !(s.type === "Qualifying" || s.type === "Race") || Number(s.flag) === 5) return "";
  loadLiveTrackMap(hs.eventId);
  const map = liveTrackMap.eventId === String(hs.eventId) ? liveTrackMap.map : null;
  if (!map) return "";
  // Legend positions, looked up PER CAR from the session that car is in —
  // previously every car read from one table (the live session, or the
  // latest one with our cars), so cars from another class's session got
  // that table's stale rows or nothing: GTO cars showed "In pit" (their
  // last row in a finished session) and GP cars showed "P—".
  //   Race live -> the race rows.
  //   Otherwise -> each car's own qualifying session: the live one if the
  //   car is in it, else the most recent one it ran in. Class position by
  //   fastest lap. "In pit" only from a live session; a finished session's
  //   last row says nothing about where the car is now.
  const isRace = !!(s && s.type === "Race" && s.active && hs.field.length);
  const liveKey = s && s.type === "Qualifying" && s.active ? `${s.id}|${s.name}` : null;
  const byCar = {};
  if (isRace) hs.field.forEach(r => { byCar[r.car_number] = r; });
  else {
    // Oldest first so newer sessions overwrite; the live session always wins.
    [...hs.quali].sort((a, b) => (a.key === liveKey) - (b.key === liveKey) || a.latest - b.latest).forEach(g => {
      const live = g.key === liveKey;
      qualiRankByClass(g.rows).forEach(x => {
        byCar[x.p.car_number] = { ...x.p, class_position: x.best == null ? null : x.clsPos, in_pit: live ? x.p.in_pit : false };
      });
    });
  }
  const cars = homeStandingsOurCars(hs)
    .filter(c => c.number && String(c.number).toLowerCase() !== "53x" && byCar[c.number])
    .sort((a, b) => String(a.number).localeCompare(String(b.number), undefined, { numeric: true }))
    .map((c, i) => ({ number: c.number, accent: homeCarAccent(c.number, i) }));
  cars.push(...tmSelectedCars(new Set(cars.map(c => c.number))));
  return `
      <section class="event-standings home-track-map fade-in">
        ${trackMapBox(map, hs.eventId, cars, c => byCar[c.number], { showField: true })}
      </section>`;
}

// A Kingpin car's dot colour on Home: its accent on an active plan if it
// has one, otherwise the next preset so each car is still distinct.
function homeCarAccent(number, i){
  for (const r of state.races){
    if (r.status === "archived") continue;
    const c = (r.cars || []).find(c => c.number === number);
    if (c?.accent) return c.accent;
  }
  return ACCENT_PRESETS[i % ACCENT_PRESETS.length];
}

// Dot motion. GPS fixes arrive about once a second, unevenly (realtime
// batching, poll jitter). Gliding straight to each new fix as it arrives
// made dots lurch and cut across corners. Instead each car keeps a short
// history of fixes (timestamped by the server's fetched_at) and is drawn
// TRACK_MAP_DELAY_MS in the past, interpolated between the two fixes that
// bracket that moment: steady motion with no jumps, at the cost of being
// that much behind live. Between two fixes on the racing line the dot
// travels ALONG the drawn track (by distance around the loop), so it
// follows corners; if either fix is in the pit or off the line (pit lane),
// it moves in a straight line instead.
const TRACK_MAP_DELAY_MS = 2500;
const TRACK_MAP_OFF_LINE = 0.025;   // fraction of span; further than this = not on the racing line
const trackMapGlide = {};           // car number -> { samples: [{ t, x, y, s, on }] }
let trackMapClockOffset = null;     // local clock - server clock (smallest seen = least latency)
let trackMapRaf = null;
function trackMapTick(){
  trackMapRaf = null;
  const svg = document.getElementById("tmLiveSvg");
  const map = liveTrackMap.map;
  if (!svg || !map) return;
  const geom = trackMapGeom(map);
  const gps = liveGps.eventId === svg.getAttribute("data-tm-event") ? liveGps.byCar : {};
  const field = svg.querySelector(".tm-field");
  if (field){
    const ours = new Set((field.getAttribute("data-tm-ours") || "").split(",").filter(Boolean));
    const have = new Set([...field.children].map(g => g.getAttribute("data-tm-car")));
    Object.keys(gps).forEach(num => {
      if (ours.has(num) || have.has(num)) return;
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "tm-other");
      g.setAttribute("data-tm-car", num);
      g.setAttribute("transform", "translate(0 0)");
      g.style.opacity = "0";
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("r", field.getAttribute("data-tm-r"));
      c.setAttribute("stroke-width", field.getAttribute("data-tm-sw"));
      const t = document.createElementNS("http://www.w3.org/2000/svg", "title");
      t.textContent = "#" + num;
      c.appendChild(t);
      g.appendChild(c);
      field.appendChild(g);
    });
  }

  const nowLocal = Date.now();
  // Server time maps to local time by the smallest delay seen so far, so
  // a skewed device clock can't freeze or rush playback.
  Object.values(gps).forEach(fix => {
    if (!Number.isFinite(fix.at)) return;
    const off = nowLocal - fix.at;
    if (trackMapClockOffset == null || off < trackMapClockOffset) trackMapClockOffset = off;
  });
  const playAt = nowLocal - (trackMapClockOffset ?? 0) - TRACK_MAP_DELAY_MS; // in server time
  const offLine = geom.span * TRACK_MAP_OFF_LINE;

  svg.querySelectorAll("[data-tm-car]").forEach(g => {
    const num = g.getAttribute("data-tm-car");
    const other = g.classList.contains("tm-other");
    const fix = gps[num];
    if (!fix || !Number.isFinite(fix.lat) || !Number.isFinite(fix.lon) || nowLocal - (trackMapClockOffset ?? 0) - fix.at > GPS_STALE_MS){
      g.style.opacity = "0"; delete trackMapGlide[num]; return;
    }
    const st = (trackMapGlide[num] ||= { samples: [] });
    const last = st.samples[st.samples.length - 1];
    if (!last || fix.at > last.t){
      const p = trackMapProject(map, fix.lat, fix.lon);
      const snap = trackMapSnap(geom, p.x, p.y);
      st.samples.push({ t: fix.at, x: p.x, y: p.y, s: snap.s, on: !fix.inPit && snap.off <= offLine, pit: fix.inPit });
      if (st.samples.length > 12) st.samples.shift();
    }

    // The two samples around playAt; before the first or after the last,
    // hold that sample (no guessing ahead).
    const S = st.samples;
    let a = S[0], b = S[0];
    if (playAt >= S[S.length - 1].t){ a = b = S[S.length - 1]; }
    else if (playAt > S[0].t){
      for (let i = 1; i < S.length; i++){ if (S[i].t >= playAt){ a = S[i - 1]; b = S[i]; break; } }
    }
    const k = b.t > a.t ? Math.max(0, Math.min(1, (playAt - a.t) / (b.t - a.t))) : 1;

    let x, y;
    if (a !== b && a.on && b.on){
      // Shortest way round the loop between the two (handles crossing
      // the start/finish point of the loop).
      let ds = b.s - a.s;
      if (ds > geom.perim / 2) ds -= geom.perim;
      if (ds < -geom.perim / 2) ds += geom.perim;
      ({ x, y } = trackMapAt(geom, a.s + ds * k));
    } else {
      x = a.x + (b.x - a.x) * k; y = a.y + (b.y - a.y) * k;
    }
    g.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    const inPit = k < 0.5 ? a.pit : b.pit;
    g.style.opacity = other ? (inPit ? "0.35" : "0.9") : (inPit ? "0.6" : "1");
  });
  trackMapRaf = requestAnimationFrame(trackMapTick);
}
// Runs after every render: GPS streams only while a live map is on screen,
// for the event that map shows, and the dots animate only while it is.

// ---- car header image, same convention/fallback as the track image ----
// Expects images at images/cars/<number>-<team-slug>.png. If that image is
// missing (404) or the car has no number, falls back to the same
// color + diagonal-stripe placeholder.
function carSlug(number, team){
  const base = `${number||""}-${team||""}`;
  return base.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"");
}
function carStripContent(number, team, accent){
  const slug = carSlug(number, team);
  if (!slug || imgKnownMissing(`images/cars/${slug}.png`)) return liveryDiv(accent);
  return `<img src="images/cars/${slug}.png" alt="#${esc(number)} ${esc(team)}" class="track-layout-img" onerror="handleTrackImgError(this, '${accent}')" />`;
}

// ============================================================================
// RENDER
// ============================================================================
let lastRenderedPage = null; // used to scroll to top only on an actual page change, not every re-render
let lastRenderedHtml = null; // skip the DOM write entirely when nothing visible changed

// Coalesced render for Realtime/background callbacks. A single poll can
// deliver dozens of row events within a few ms (one per car); calling
// render() for each rebuilt the entire page dozens of times per second.
// This collapses any burst into one render on the next animation frame.
// Also defers while someone is typing in a field inside #app, since a
// rebuild would destroy the input and drop their focus/cursor mid-edit —
// it runs as soon as they leave the field instead.
let renderScheduled = false;
function scheduleRender(){
  if (renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{
    renderScheduled = false;
    const a = document.activeElement;
    const app = document.getElementById("app");
    if (a && app && app.contains(a) && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT")){
      a.addEventListener("blur", scheduleRender, { once:true });
      return;
    }
    render({ background:true });
  });
}

// Minimal DOM patcher used for live-tick renders (see render()). Children
// are matched by position; same tag -> sync attributes and recurse,
// otherwise replace. Unchanged subtrees are skipped entirely, so their
// images, animations, hover state and scroll positions are left alone.
// A focused form field is never touched.
function morphChildren(from, to){
  const a = [...from.childNodes], b = [...to.childNodes];
  for (let i = 0; i < b.length; i++){
    if (i >= a.length) from.appendChild(b[i]);
    else morphNode(a[i], b[i]);
  }
  for (let i = b.length; i < a.length; i++) a[i].remove();
}
function morphNode(a, b){
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName){ a.replaceWith(b); return; }
  if (a.nodeType === 3 || a.nodeType === 8){
    if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue;
    return;
  }
  if (a.nodeType !== 1 || a.isEqualNode(b)) return;
  // Subtrees driven by their own ticker (live track-map dots) are left
  // alone while their key is unchanged.
  if (a.hasAttribute("data-morph-skip") && b.hasAttribute("data-morph-skip")
    && a.getAttribute("data-morph-key") === b.getAttribute("data-morph-key")) return;
  if ((a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a === document.activeElement) return;
  for (const { name, value } of [...b.attributes]){
    if (a.getAttribute(name) !== value) a.setAttribute(name, value);
  }
  for (const { name } of [...a.attributes]){
    if (!b.hasAttribute(name)) a.removeAttribute(name);
  }
  if (a.tagName === "TEXTAREA"){ if (a.value !== b.value) a.value = b.value; return; }
  morphChildren(a, b);
}

// bindEvents() now also runs after in-place patches, where most elements
// already have their listeners — this binds each (element, event) once.
const boundListeners = new WeakMap();
function listenOnce(el, evt, fn){
  let set = boundListeners.get(el);
  if (!set){ set = new Set(); boundListeners.set(el, set); }
  if (set.has(evt)) return;
  set.add(evt);
  el.addEventListener(evt, fn);
}

function render(opts){
  const app = document.getElementById("app");
  if (state.confirmDelete){
    // modal renders on top of whatever page is current
  }
  // Capture the track picker's current scroll offset before the DOM gets
  // replaced below — innerHTML resets scrollLeft to 0, which would make
  // the row visibly jump back to the start on every selection. Restoring
  // it (instantly, not scrolled/animated) afterward means selecting a
  // track leaves the row exactly where it was.
  const existingTrackRow = document.querySelector(".track-picker-row");
  const trackScrollLeft = existingTrackRow ? existingTrackRow.scrollLeft : null;

  // Expanded stint panels (notes / flags / ±15 start adjuster) are a
  // transient working state, not something to carry around the app. Collapse
  // them whenever the page actually changes, so the planner always loads
  // clean. This runs BEFORE the HTML is built — collapsing afterwards would
  // render them open for one frame and only close on the next render.
  // Same-page re-renders are left alone, so a panel stays put while its ±15
  // steppers are being tapped.
  const pageChanged = state.page !== lastRenderedPage;
  if (pageChanged && state.openStintNotes) state.openStintNotes.clear();

  let html = "";
  if (state.page === "home") html = renderHome();
  else if (state.page === "setup") html = renderSetup();
  else if (state.page === "plan" && state.plan) html = renderPlan();
  else if (state.page === "archive") html = renderArchive();
  else html = renderHome();

  if (state.confirmDelete){
    html += renderConfirmModal();
  }

  // Background (Realtime) render where nothing visible changed — the
  // common case for a live-data tick — leaves the DOM alone entirely.
  // Limited to background renders on purpose: an explicit render() after a
  // user action may be relied on to reset DOM-only state (e.g. snapping an
  // input back after a rejected write), so those always rebuild.
  if (opts && opts.background && !pageChanged && html === lastRenderedHtml) return;
  lastRenderedHtml = html;

  app.classList.toggle("same-page-render", !pageChanged);

  // Live ticks (background renders on the same page) are patched into the
  // existing DOM rather than replacing it. Rebuilding everything once a
  // second was the visible glitch on the car tiles and standings: every
  // element, image and animation was torn down and recreated even when
  // only one number changed. Now only the nodes that actually differ are
  // touched (scroll positions, hover and animations survive untouched).
  // User-initiated renders still rebuild outright, since some flows rely
  // on that to reset DOM-only state.
  if (opts && opts.background && !pageChanged && app.firstChild){
    const tpl = document.createElement("template");
    tpl.innerHTML = html;
    morphChildren(app, tpl.content);
    bindEvents(); // idempotent — only binds elements that are new
    return;
  }

  app.style.setProperty("--pulse-phase", `-${Math.round(performance.now() % 1200)}ms`); // 1200 = livePulse duration
  // Horizontally-scrollable tables (live standings, quali, archive) are
  // rebuilt on every live tick like everything else, and innerHTML resets
  // their scrollLeft to 0 — on a phone that snapped the standings table
  // back to the left edge every time any car's row changed. Same fix as
  // the track picker: capture before, restore instantly after. Matched by
  // order on the page, and only on same-page renders.
  const tableScrolls = pageChanged ? [] : [...app.querySelectorAll(".results-table-wrap")].map(el => el.scrollLeft);

  app.innerHTML = html;
  bindEvents();

  if (tableScrolls.some(x => x > 0)){
    app.querySelectorAll(".results-table-wrap").forEach((el, i) => {
      if (tableScrolls[i] == null) return;
      const prev = el.style.scrollBehavior;
      el.style.scrollBehavior = "auto";
      el.scrollLeft = tableScrolls[i];
      el.style.scrollBehavior = prev;
    });
  }

  if (pageChanged){
    window.scrollTo(0, 0);
    lastRenderedPage = state.page;
  }

  if (trackScrollLeft != null){
    const row = document.querySelector(".track-picker-row");
    if (row){
      const prevBehavior = row.style.scrollBehavior;
      row.style.scrollBehavior = "auto"; // force instant — no animated re-scroll on restore
      row.scrollLeft = trackScrollLeft;
      row.style.scrollBehavior = prevBehavior;
    }
  } else {
    // Fresh mount of the track picker (first render of Setup this visit,
    // not a re-render) — if a track is already selected, center it in the
    // scroll area instead of leaving the row parked at the start. Only
    // fires when the row didn't exist a moment ago (see capture above),
    // so it never fights the scroll-preserving restore on later
    // re-renders — that's what caused the bouncing before.
    const row = document.querySelector(".track-picker-row");
    const selectedTile = row ? row.querySelector(".track-tile.selected") : null;
    if (row && selectedTile){
      const prevBehavior = row.style.scrollBehavior;
      row.style.scrollBehavior = "auto"; // instant — no scroll animation on page open
      const rowRect = row.getBoundingClientRect();
      const tileRect = selectedTile.getBoundingClientRect();
      const tileOffsetWithinRow = row.scrollLeft + (tileRect.left - rowRect.left);
      const target = tileOffsetWithinRow - (row.clientWidth / 2) + (tileRect.width / 2);
      row.scrollLeft = Math.max(0, Math.min(target, row.scrollWidth - row.clientWidth));
      row.style.scrollBehavior = prevBehavior;
    }
  }
}

function raceTile(race){
  const carsCount = race.cars.length;
  const accent = race.cars[0] ? race.cars[0].accent : T.blue;
  // Live badge: this race's own redmist_event_id matches whichever event
  // Home is currently watching as live (see subscribeHomeLiveWatch()) —
  // independent of isRaceLiveAndLocked(), which only exists for a race
  // that's actually open, and independent of state.isEngineer, since
  // this is a public status indicator, not an edit gate.
  // String-compared rather than === -- Postgres bigint columns come back
  // from Supabase as JS strings while int columns come back as numbers,
  // so if redmist_event_id and redmist_event_watch.event_id aren't the
  // same underlying Postgres type, a strict === silently never matches
  // even though both sides print identically.
  const isLive = race.status!=="archived" && race.redmistEventId != null && state.homeLive.eventId != null
    && String(race.redmistEventId) === String(state.homeLive.eventId);
  if (race.status!=="archived") console.log("[home-live] tile check for", race.eventName, "— race.redmistEventId:", race.redmistEventId, typeof race.redmistEventId, "vs homeLive.eventId:", state.homeLive.eventId, typeof state.homeLive.eventId, "-> isLive:", isLive); // TEMP debug
  const finished = isRaceFinished(race);
  const liveColor = isLive ? flagToLiveColor(state.homeLive.flag) : null;
  return `
    <div class="race-tile" data-act="open-race" data-id="${race.id}" role="button" tabindex="0" style="border-color:${accent};">
      <div class="strip" style="background:var(--panelRaised);">
        ${trackStripContent(race.track, accent)}
        ${finished ? `
        <div class="live-badge" style="background:rgba(10,12,16,0.72);border:1px solid rgba(255,255,255,0.55);">
          <span class="chk-flag"></span>
          <span class="lbl" style="color:var(--text);">CHECKERED</span>
        </div>` : isLive ? `
        <div class="live-badge" style="background:rgba(10,12,16,0.72);border:1px solid ${liveColor};">
          <span class="dot" style="background:${liveColor};"></span>
          <span class="lbl" style="color:${liveColor};">LIVE</span>
        </div>` : ""}
        ${(state.isEngineer && race.status!=="archived") ? `<button class="del" data-act="del-race" data-id="${race.id}" data-label="${esc(race.eventName)}" onclick="event.stopPropagation()">${icon("x",13)}</button>` : ""}
      </div>
      <div class="body">
        <div class="name">${esc(race.eventName)}</div>
        <div class="meta">${esc(race.track||"No track set")} · ${carsCount} car${carsCount!==1?"s":""}</div>
        <div class="meta" style="margin-top:2px;color:${race.status==="archived"?T.gold:T.textFaint}">${race.status==="archived"?`Archived · ${formatDateCompact(race.eventDateISO)}`:finished?"Finished · not yet archived":"Planned"}</div>
      </div>
      ${state.isEngineer ? `<button class="dup" data-act="duplicate-race" data-id="${race.id}" title="Duplicate this race" onclick="event.stopPropagation()">${icon("copy",12)}</button>` : ""}
    </div>`;
}

// Renders one selectable tile in the track picker grid. Reuses the same

function trackTile(trackName){

    ? icon("plus",22)

}

// Effective finish position for a car: from the archived Red Mist results
// (class position, falling back to overall; DNF/DNS status takes priority
// over a numeric position) once built. Falls back to the optionally-
// entered `car.finishPosition` (still written to Supabase pre-archive, per
// the RLS note in archiveRace()) when there are no archived results yet.
// Returns a number, "DNF", "DNS", or null.
function getEffectiveFinishPosition(car, race){
  if (race && race.archiveResults){
    const m = matchArchiveToRaceCars({ cars:[car] }, race.archiveResults)[0];
    if (m && m.found){
      if (m.status === "DNF") return "DNF";
      if (m.status === "DNS") return "DNS";
      return m.positionInClass || m.position;
    }
  }
  if (typeof car.finishPosition === "number" || car.finishPosition === "DNF") return car.finishPosition;
  // No archived results and nothing entered: fall back to the Red Mist result
  // saved at the checkered (class position, or its DNF/DNS status).
  const rr = race?.raceResults?.rows?.find(r => r.car_number === car.number);
  if (rr){
    if (rr.result_status === "DNF" || rr.result_status === "DNS") return rr.result_status;
    if (rr.class_position != null) return rr.class_position;
  }
  return null;
}

function renderPlan(){
  const plan = state.plan;
  const archived = state.currentStatus === "archived";
  const race = state.races.find(r=>r.id===state.currentRaceId);
  const readOnly = archived || isRaceLiveAndLocked(race) || !state.isEngineer;
  // Archived results read best-to-worst by effective finish position — see
  // getEffectiveFinishPosition() above. DNFs (and anything unset) sort to
  // the end rather than staying in whatever order the cars were originally
  // entered in. Sort is stable, so ties (e.g. two DNFs) keep their
  // original relative order.
  // getEffectiveFinishPosition() can return a number, "DNF", "DNS", or
  // null — only the number case sorts meaningfully, so DNF/DNS/unset all
  // collapse to Infinity here and sink to the bottom together (stable
  // sort keeps their original relative order among themselves).
  const finishSortKey = (car) => {
    const pos = getEffectiveFinishPosition(car, race);
    return typeof pos === "number" ? pos : Infinity;
  };
  const sortedCarPlans = archived
    ? [...plan.carPlans].sort((a,b)=> finishSortKey(a.car) - finishSortKey(b.car))
    : plan.carPlans;
  const primaryCar = sortedCarPlans[0] && sortedCarPlans[0].car;
  const podium = archived && primaryCar ? podiumColor(getEffectiveFinishPosition(primaryCar, race)) : null;
  const bannerColor = podium || T.textMuted;

  // Distinct from the plain "you're not signed in as an engineer" case —
  // an actual engineer needs to know WHY their edit controls disappeared
  // mid-race rather than just silently losing them, or this looks like a
  // bug rather than the intended handoff to Red Mist.
  const liveLocked = !archived && isLiveAttached(race); // drives the live bar (shown for quali too); editing lock is readOnly above
  // Standings / qualifying / saved results. On desktop these sit in the
  // side column, which widens when there's a table in it.
  const fullFieldPanel = archived ? renderArchiveFullFieldPanel(race) : "";
  const sidePanels = (!archived ? renderLiveStandingsPanel(race) : (race?.archiveResults ? "" : savedResultsPanel(race))).trim();
  const finalTop = !archived ? renderFinalStandingsTop(race) : "";

  return `
    <div class="page page-wide fade-in">
      <div class="top-actions">
        ${readOnly ? `<button class="btn-back" data-act="nav-back">${icon("arrowLeft",15)} Back</button>` : `<button class="btn-back" data-act="plan-edit">${icon("arrowLeft",15)} Edit</button>`}
        <div class="right">
          ${!readOnly ? `<button class="link-red" data-act="del-current-race">${icon("trash",13)} Delete</button>` : ""}
          <button class="link-muted" data-act="go-home">${icon("rotate",13)} Home</button>
        </div>
      </div>

      ${liveLocked ? `
        <div style="display:flex;align-items:center;gap:8px;margin-top:14px;padding:8px 12px;border-radius:8px;background:rgba(226,68,92,0.10);">
          <span style="width:6px;height:6px;border-radius:999px;background:var(--red);animation:livePulse 1.2s ease-in-out infinite;flex-shrink:0;"></span>
          <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textMuted);">
            Live${state.liveSession?.name ? ` - ${esc(state.liveSession.name)}` : ""} - provided by RedMist
          </span>
        </div>
      ` : ""}

      <h1 class="font-display" style="font-weight:700;font-size:30px;margin:16px 0 0;">${esc(state.eventName)}</h1>
      <p style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--textFaint);margin-top:4px;">Race Date: ${formatDate(state.eventDate)}</p>

      ${archived ? `
      <div class="banner" style="border:1px solid ${bannerColor};">
        ${podium ? icon("trophy",16,"color:"+bannerColor) : ""}
        <span style="color:${bannerColor}">Archived — results below by car</span>
      </div>` : ""}

      ${archived ? `<div class="archive-top">${renderArchiveResultsPanel(race)}</div>` : ""}
      ${archived ? debriefSectionHtml(race) : ""}

      ${!archived ? renderLiveRaceSummary(race) : ""}
      ${finalTop}

      <div class="plan-cols ${(sidePanels || fullFieldPanel) ? "side-wide" : ""}">
        <div class="plan-main">
          <div class="car-plans ${archived ? "" : "car-plans-grid"}">
            ${sortedCarPlans.map(cp=>carPlanSection(cp, plan, archived)).join("")}
          </div>
        </div>

        <div class="plan-side">
          ${fullFieldPanel}

          <div class="chip-grid" style="margin-top:${fullFieldPanel ? 24 : 40}px;">
            ${infoChip("mapPin","Track",plan.track)}
            ${infoChip("flag","Duration",formatDuration(plan.totalMinutes))}
            ${infoChip("clock","Green Flag",formatTime(plan.startDateTime))}
            ${infoChip("timer","Checkered Flag",formatTime(plan.endDateTime))}
          </div>

          ${trackDetailSection(plan.track, !archived && !!(sidePanels || finalTop.trim()))}

          ${sidePanels}
        </div>
      </div>

      ${!readOnly ? `
      <div class="archive-box fade-in">
        <div class="head">${icon("archive",15)} Race Complete?</div>
        <p>Archive this race to pull in each car's finish position, fastest lap, pit stops, and more from Red Mist.</p>
        <button class="btn-gold" id="archiveRace" data-act="archiveRace">${icon("trophy",14)} Archive Race</button>
      </div>` : ""}
    </div>`;
}

function infoChip(iconName,label,value){
  return `<div class="chip"><span class="ico">${icon(iconName,13)}</span><div><div class="lbl">${label}</div><div class="val">${esc(value)}</div></div></div>`;
}

// Competitors Pit Times (archive, Red Mist results only): each GTO
// finisher's stops, driver changes and total time in the pits, least
// first. Colour is by rank (green -> red) so one long stop doesn't flatten
// everyone else's colour; the bar is actual time. Shown inside each car's
// tile (full width, under Drivers / Pit Stops) with that car highlighted.
function competitorPitTimesPanel(race, focusNum){
  const all = race?.archiveResults?.pitTimes;
  if (state.archiveLoading || !all?.length) return "";
  // In a car's tile: only the cars that finished ahead of it in class, plus
  // the car itself for reference.
  const clsPos = Object.fromEntries((race.archiveResults.classification || []).map(c => [String(c.startNumber), c.positionInClass]));
  const mine = focusNum != null ? clsPos[String(focusNum)] : null;
  const rows = mine != null ? all.filter(r => clsPos[String(r.num)] != null && clsPos[String(r.num)] <= mine) : all;
  if (!rows.length || (focusNum != null && rows.length < 2)) return "";
  const ours = new Set(focusNum != null ? [String(focusNum)] : race.cars.map(c => String(c.number)));
  const maxS = Math.max(...rows.map(r => r.seconds), 1);
  const stops = [[63,178,127],[242,166,62],[226,68,92]]; // T.green -> T.amber -> T.red
  const rankColor = i => {
    const t = rows.length > 1 ? i / (rows.length - 1) : 0;
    const a = t < 0.5 ? stops[0] : stops[1], b = t < 0.5 ? stops[1] : stops[2], u = t < 0.5 ? t * 2 : (t - 0.5) * 2;
    return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * u)).join(",")})`;
  };
  const fmt = s => { const m = Math.floor(s / 60), r = Math.round(s % 60); return r === 60 ? `${m + 1}:00` : `${m}:${String(r).padStart(2, "0")}`; };
  // Layout lives in CSS (.pit-times-*) so phones get their own column
  // widths: no bar, short headers, team name wraps to at most two lines —
  // the whole table fits the screen with no sideways scroll.
  const body = rows.map((r, i) => {
    const c = rankColor(i), isOurs = ours.has(String(r.num));
    return `
      <div class="pit-times-row ${isOurs ? "ours" : ""}">
        <span class="pit-times-name"><span class="num" style="color:var(--textMuted);">#${esc(r.num)}</span> <span style="font-weight:600;">${esc(r.name)}</span></span>
        <span class="pit-times-num">${r.stops}</span>
        <span class="pit-times-num">${r.driverChanges}</span>
        <span class="pit-times-time">
          <span class="pit-times-bar"><span style="width:${Math.max(4, Math.round(r.seconds / maxS * 100))}%;background:${c};"></span></span>
          <span class="font-mono" style="font-weight:700;color:${c};">${fmt(r.seconds)}</span>
        </span>
      </div>`;
  }).join("");
  return `
    <div class="summary-box">
      <div class="pit-times-row pit-times-head">
        <span class="fin-label" style="margin:0;">${icon("timer",12)} Competitor</span>
        <span class="fin-label" style="margin:0;justify-content:flex-end;">Stops</span>
        <span class="fin-label" style="margin:0;justify-content:flex-end;"><span class="lbl-full">Driver Chg</span><span class="lbl-short">Chg</span></span>
        <span class="fin-label" style="margin:0;justify-content:flex-end;"><span class="lbl-full">Time in Pits</span><span class="lbl-short">Time</span></span>
      </div>
      ${body}
    </div>`;
}

// "Johan Schwartz" -> "Schwartz" (keeps the Fastest Driver Chg tile to one line of names).
function driverSurname(name){
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "?";
}

// Race Overview for an archived race, built from Red Mist. Visible to
// everyone; only the Build / Rebuild controls are engineer-gated.
function renderArchiveResultsPanel(race){
  if (!race) return "";
  const res = race.archiveResults;

  if (state.archiveLoading){
    return `
      <div class="results-panel fade-in" style="display:flex;justify-content:center;padding:32px 20px;">
        <div class="results-spinner"></div>
      </div>`;
  }

  if (!res){
    return `
      <div class="results-panel fade-in">
        ${!state.isEngineer ? `
          <p style="text-align:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--textFaint);margin:8px 0;">
            Race results are not official.
          </p>
        ` : `
          <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
            <button class="btn-gold" style="display:inline-flex;padding:14px 24px;" data-act="rm-archive-build">${icon("timer",14)} Build Results from Red Mist</button>
            ${state.archiveError ? `<p style="color:${T.red};font-size:12px;margin:0;">${esc(state.archiveError)}</p>` : ""}
          </div>
        `}
      </div>`;
  }

  const ov = res.overview;
  const overviewTile = (label, value, sub) => `
    <div class="results-stat-tile">
      <div class="results-stat-label">${label}</div>
      <div class="results-stat-value">${value}</div>
      ${sub ? `<div class="results-stat-sub">${sub}</div>` : ""}
    </div>`;

  // One outright winner gets the full "#num Team Name" treatment (matches
  // Best Stint Pace); a tie between multiple teams just shows car numbers
  // — spelling out every team name when several tied gets cluttered fast.
  const longestStintSub = (ls) => {
    if (!ls) return "";
    const entries = ls.entries || (ls.nums||[]).map(n=>({num:n,name:""})); // old Supabase rows may lack entries
    if (entries.length === 1) return `#${esc(entries[0].num)} ${esc(entries[0].name)}`;
    return entries.map(e=>`#${esc(e.num)}`).join(", ");
  };

  // Built as a list so the desktop grid can size itself to the tile count
  // (three rows at 900px+, two from 1440px) — see --c3 / --c2 in the CSS.
  const overviewTiles = [
        overviewTile("Total Laps", ov.totalLaps),
        overviewTile("Total Pit Stops", ov.totalPitStops),
        overviewTile("Entries", ov.entries),
        overviewTile("Finishers", ov.finishers, `${ov.dnf} DNF`),
        overviewTile("Total Cautions", res.cautions.length),
        res.redFlags && res.redFlags.length ? overviewTile("Red Flags", res.redFlags.length) : "",
        overviewTile("Cars on Lead Lap", ov.carsOnLeadLap),
        overviewTile("Most Laps Led", res.lapsLed ? `${res.lapsLed.laps} laps` : "—", res.lapsLed ? `#${esc(res.lapsLed.num)} ${esc(res.lapsLed.name)}` : ""),
        overviewTile("Best Stint Pace - GTO", res.bestStint ? fmtLapTime(res.bestStint.avg) : "—", res.bestStint ? `#${esc(res.bestStint.num)} ${esc(res.bestStint.name)}` : ""),
        overviewTile("Longest Stint - GTO", res.longestStint ? `${res.longestStint.lapCount} laps` : "—", longestStintSub(res.longestStint)),
        overviewTile(`Fastest Lap${res.fastestLap?.cls ? ` - ${esc(res.fastestLap.cls)}` : ""}`, res.fastestLap ? fmtLapTime(res.fastestLap.seconds) : "—", res.fastestLap ? `#${esc(res.fastestLap.num)} ${esc(res.fastestLap.name)}` : ""),
        overviewTile("Fastest Pit Stop", res.fastestStop ? `${res.fastestStop.seconds.toFixed(1)}s` : "—", res.fastestStop ? `#${esc(res.fastestStop.num)} ${esc(res.fastestStop.name)}` : ""),
        overviewTile("Fastest Driver Change", res.fastestStopDc ? `${res.fastestStopDc.seconds.toFixed(1)}s` : "—", res.fastestStopDc ? `#${esc(res.fastestStopDc.num)} ${esc(res.fastestStopDc.name)}${(res.fastestStopDc.driverOut || res.fastestStopDc.driverIn) ? `<br>${esc(driverSurname(res.fastestStopDc.driverOut))} → ${esc(driverSurname(res.fastestStopDc.driverIn))}` : ""}` : "")
  ].filter(Boolean);

  return `
    <div class="results-panel fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <span class="eyebrow" style="color:${T.gold};">Race Overview</span>
        ${state.isEngineer ? `<button class="link-muted" data-act="rm-archive-build" style="font-size:11px;">${icon("rotate",12)} Rebuild</button>` : ""}
      </div>

      <div class="results-overview-grid" style="--c3:${Math.ceil(overviewTiles.length/3)};--c2:${Math.ceil(overviewTiles.length/2)};">
        ${overviewTiles.join("")}
      </div>

    </div>`;
}

// Archived full-field standings: always shown in full, beneath the car
// car tiles, ahead of the info chips and track map, rather than toggled
// inside Race Overview.
function renderArchiveFullFieldPanel(race){
  const res = race?.archiveResults;
  if (state.archiveLoading || !res?.classification?.length) return "";
  const fieldRows = res.classification.map((r,i) => {
    const isOurs = race.cars.some(c=>c.number===r.startNumber);
    return `<tr style="${isOurs?`background:${T.gold}17;border-left:2px solid ${T.gold};`:""}">
      <td class="num" style="white-space:nowrap;">P${i+1}${classPodiumTrophy(r.positionInClass, r.status !== "DNS" && r.numberOfLaps > 0)}</td>
      <td><span class="num">#${esc(r.startNumber)}</span> - <span style="font-weight:600;">${esc(r.name)}</span></td>
      <td class="num">${esc(res.intervals[r.startNumber] ?? "—")}</td>
      <td class="num col-laps">${r.numberOfLaps}</td>
      <td class="stops col-stops">${res.pitStopsByNumber[r.startNumber] ?? 0}</td>
      <td class="results-cls" style="white-space:nowrap;">${classPosCell(r.resultClass, r.positionInClass, r.status)}</td>
    </tr>`;
  }).join("");
  return `
    <div class="results-panel ff-panel fade-in">
      <div style="margin-bottom:12px;"><span class="eyebrow" style="color:${T.gold};">Full-Field Standings</span></div>
      <div class="results-table-wrap">
      <table class="results-table archive-field">
        <thead><tr><th>Finish</th><th>Car</th><th>Gap</th><th class="col-laps">Laps</th><th class="col-stops">Stops</th><th>Class</th></tr></thead>
        <tbody>${fieldRows}</tbody>
      </table>
      </div>
    </div>`;
}

// "HH:mm:ss.fff" (Red Mist) -> seconds; null for blank/zero times so cars
// without a timed lap sort to the bottom instead of the top.
function rmTimeToSeconds(t){
  if (!t) return null;
  const parts = String(t).split(":").map(Number);
  if (parts.some(isNaN)) return null;
  const sec = parts.reduce((acc, v) => acc * 60 + v, 0);
  return sec > 0 ? sec : null;
}
function fmtLapTime(sec){
  if (sec == null) return "—";
  const m = Math.floor(sec / 60);
  const s = (sec - m * 60).toFixed(3).padStart(6, "0");
  return m ? `${m}:${s}` : s;
}

function renderLiveQualifyingTable(race, fullField, opts = {}){
  const title = opts.title || "Qualifying";
  const isLive = opts.status === "Live";
  // Qualifying is decided by fastest lap within each class, so rows are
  // grouped by class (fastest class first) and Pos is the class position.
  const rows = qualiRankByClass(fullField);

  const fieldRows = rows.map((r, i) => {
    const pos = r.p;
    const isOurs = race.cars.some(c=>c.number===pos.car_number);
    const newClass = i > 0 && (rows[i - 1].p.class || "") !== (pos.class || "");
    return `<tr ${tmRowAttrs(pos.car_number, isOurs)}${newClass ? ` data-class-break` : ""}>
      <td class="num">${r.best == null ? "—" : `P${r.clsPos}`}</td>
      <td>${tmSwatch(pos.car_number)}<span class="num">#${esc(pos.car_number)}</span> - <span style="font-weight:600;">${esc(pos.team_name || "—")}</span></td>
      <td class="num" style="font-weight:600;">${fmtLapTime(r.best)}</td>
      <td class="num">${pos.last_lap_completed ?? 0}</td>
      <td class="results-cls">${esc(pos.class || "—")}</td>
    </tr>`;
  }).join("");

  return `
    <div class="results-panel live-panel fade-in">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">
        <span class="eyebrow" style="color:${isLive ? T.red : T.gold};">${esc(title)} — Fastest Lap</span>
        ${opts.status ? `
        <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:${isLive ? "rgba(226,68,92,0.12)" : "var(--panelRaised)"};">
          ${isLive ? `<span style="width:6px;height:6px;border-radius:999px;background:var(--red);animation:livePulse 1.2s ease-in-out infinite;"></span>` : ""}
          <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:10px;letter-spacing:0.05em;color:${isLive ? "var(--text)" : "var(--textFaint)"};">${isLive ? "LIVE" : "FINISHED"}</span>
        </span>` : ""}
      </div>
      <div class="results-table-wrap">
      <table class="results-table live-table">
        <thead><tr><th>Pos</th><th>Car</th><th>Best Lap</th><th>Laps</th><th>Class</th></tr></thead>
        <tbody>${fieldRows}</tbody>
      </table>
      </div>
    </div>`;
}

// ---- Qualifying results (all qualifying sessions of the event) ----
// Qualifying rows stay in redmist_live_positions under their own
// session_id/session_name after each session ends, so every qualifying
// session run so far (GTO, GP1/GP2, ...) can be shown for the rest of the
// weekend. Sessions that haven't run yet simply have no rows.
async function loadQualifyingResults(race){
  if (!race) return;
  // race.redmistEventId can still be null in memory if the race was opened
  // before the server auto-linked it; fall back to the attached live event.
  const eventId = race.redmistEventId ?? (race.id === state.currentRaceId ? state.redmistEventId : null);
  // Sunday's grid is set by Saturday's race (fastest lap within class), not qualifying.
  if (isSundayRace(race)) return loadSundayGrid(race, eventId);
  if (eventId == null){ console.log("[quali-results] no event id linked to this race yet — skipping"); return; } // TEMP debug
  const { data, error } = await supabase
    .from("redmist_live_positions").select("*")
    .eq("event_id", eventId).eq("session_type", "Qualifying");
  if (error){ console.error("[quali-results] fetch failed:", error); return; }

  const bySession = {};
  (data || []).forEach(r => {
    const key = `${r.session_id}|${r.session_name}`;
    const g = (bySession[key] ||= { key, id: Number(r.session_id), name: r.session_name, rows: [], latest: 0 });
    g.rows.push(r);
    g.latest = Math.max(g.latest, new Date(r.fetched_at || 0).getTime());
  });
  race.qualiResults = { sessions: Object.values(bySession) };
  console.log("[quali-results] event", eventId, "sessions:", race.qualiResults.sessions.map(g => `${g.key} (${g.rows.length} cars)`), "| live key:", qualiSessionKey(state.liveSession)); // TEMP debug
  applyQualifyingStartPositions(race);
  scheduleRender();
}

// Sunday race plan? Keyed off the plan's own race day (plan start, else the
// Race Date set on Setup).
function isSundayRace(race){
  return !!race && racePaceIsSunday(racePaceRaceDay(race, null));
}

// Sunday starting order = Saturday's race, fastest lap within each class.
// Stored in the same shape as qualiResults so qualiClassStartPos() and
// applyQualifyingStartPositions() work unchanged; the panels never render
// on Sunday (see renderQualifyingPanels).
async function sundayGridRows(race, eventId){
  const satDay = racePacePrevDay(racePaceRaceDay(race, null));
  if (eventId != null){
    return racePaceSaturdayRows(race, [{ event_id: eventId, session_id: race.redmistSessionId, session_name: race.redmistSessionName }], satDay);
  }
  // Not linked to an event yet — use Saturday's plan at the same track.
  const satRace = (state.races || []).find(r => r.id !== race.id && r.track === race.track && racePaceRaceDay(r, null) === satDay);
  return satRace ? fetchRedmistResultRows(satRace, true) : null;
}

async function loadSundayGrid(race, eventId){
  let rows;
  try { rows = await sundayGridRows(race, eventId); }
  catch (e){ console.error("[sunday-grid] Saturday results fetch failed:", e); return; }
  if (!rows?.length){ console.log("[sunday-grid] no Saturday race results found for race", race.id); return; } // TEMP debug
  race.qualiResults = { fromSaturday: true, sessions: [{ key: `${rows[0].session_id}|${rows[0].session_name}`, id: Number(rows[0].session_id), name: rows[0].session_name, rows, latest: 0 }] };
  console.log("[sunday-grid] start order from", rows[0].session_name, `(${rows.length} cars)`); // TEMP debug
  applyQualifyingStartPositions(race);
  scheduleRender();
}

// Several race sessions can end up tagged to one plan (one Red Mist event
// spans the weekend). Prefer the session whose date matches this plan's
// race date; only then fall back to the most recent.
function pickResultSession(rows, race, strict = false){
  const bySession = {};
  rows.forEach(r => {
    const key = `${r.session_id}|${r.session_name}`;
    const g = (bySession[key] ||= { key, name: r.session_name, rows: [], at: 0, date: r.session_date || null });
    g.rows.push(r);
    g.at = Math.max(g.at, new Date(r.checkered_at || r.updated_at || 0).getTime());
  });
  const groups = Object.values(bySession);
  const raceDate = String(race?.eventDateISO || "").slice(0, 10);
  // A weekend event holds several races, so match this race's own day: the
  // session's date, else the local day it finished, else its name ("Saturday …").
  const localDay = ms => ms ? new Date(ms).toLocaleDateString("en-CA") : "";
  const weekday = raceDate ? new Date(raceDate + "T12:00:00").toLocaleDateString("en-US", { weekday: "long" }).toLowerCase() : "";
  const sameDay = g => g.date ? String(g.date).slice(0, 10) === raceDate : localDay(g.at) === raceDate;
  let dated = raceDate ? groups.filter(sameDay) : [];
  if (!dated.length && weekday) dated = groups.filter(g => String(g.name || "").toLowerCase().includes(weekday));
  // Strict callers (the Saturday debrief) never fall back to another day's
  // race — a wrong-day session is worse than no debrief.
  if (strict && groups.length > 1 && !dated.length){
    console.warn("[race-results] no session matches", raceDate, "for race", race?.id, "— skipping");
    return null;
  }
  if (groups.length > 1) console.warn("[race-results]", groups.length, "sessions tagged to race", race?.id, "— using", (dated[0] || groups[0]).name, dated.length ? "(date match)" : "(most recent — no date match)");
  return (dated.length ? dated : groups).sort((a, b) => b.at - a.at)[0];
}

// Which plans have saved final results — drives the CHECKERED badge on the
// Home tiles without opening each race.
async function loadFinishedRaceIds(){
  const { data, error } = await supabase.from("redmist_race_results").select("race_id").not("race_id", "is", null);
  if (error){ console.error("[race-results] finished-race lookup failed:", error); return; }
  state.finishedRaceIds = new Set((data || []).map(r => String(r.race_id)));
  scheduleRender();
}

// Post-checkered, pre-archive view. When the plan isn't attached to a
// live session but has saved results, load that session's final rows so
// the car tiles, summary strip and indicators stay exactly as they were
// at the flag — until the race is archived.
async function loadFinishedRaceState(race){
  const rr = race?.raceResults;
  if (!rr?.rows?.length || race.status === "archived" || isLiveAttached(race)) return;
  const { event_id, session_id, session_name } = rr.rows[0];
  const carNumbers = (race.cars || []).map(c => c.number).filter(Boolean);
  const scope = q => q.eq("event_id", event_id).eq("session_id", session_id).eq("session_name", session_name);
  const [pos, stats, cons, stops] = await Promise.all([
    scope(supabase.from("redmist_live_positions").select("*")),
    scope(supabase.from("redmist_current_stint_stats").select("*")).in("car_number", carNumbers),
    scope(supabase.from("redmist_current_stint_consistency").select("*")).in("car_number", carNumbers),
    scope(supabase.from("redmist_live_pit_stops").select("car_number, penalty_served")),
  ]);
  if (pos.error){ console.error("[finished] positions fetch failed:", pos.error); return; }
  if (isLiveAttached(race)) return; // a live session attached while we were fetching — it wins
  const fullField = pos.data || [];
  const byCarNumber = {}, statsByCarNumber = {}, consistencyByCarNumber = {}, stopCountsByCarNumber = {};
  fullField.forEach(r => { if (carNumbers.includes(r.car_number)) byCarNumber[r.car_number] = r; });
  (stats.data || []).forEach(r => { statsByCarNumber[r.car_number] = r; });
  (cons.data || []).forEach(r => { consistencyByCarNumber[r.car_number] = r; });
  rmServiceStops(stops.data).forEach(r => { stopCountsByCarNumber[r.car_number] = (stopCountsByCarNumber[r.car_number] || 0) + 1; });
  const finishedAt = fullField.reduce((m, r) => Math.max(m, new Date(r.fetched_at || 0).getTime()), 0) || rr.checkeredAt || Date.now();
  race.redmistLive = { byCarNumber, statsByCarNumber, consistencyByCarNumber, fullField, stopCountsByCarNumber, finished: true, finishedAt };
  scheduleRender();
}

// Saved final results for this race plan (written by the poller at the
// checkered — see redmist_race_results). Matched by race_id; falls back to
// the linked event's Race session(s) for rows written before the plan was
// linked. If there's more than one Race session, the latest is used.
async function loadRaceResults(race){
  if (!race) return;
  let { data, error } = await supabase.from("redmist_race_results").select("*").eq("race_id", String(race.id));
  if (error){ console.error("[race-results] fetch failed:", error); return; }
  if (!data?.length && race.redmistEventId != null){
    const res = await supabase.from("redmist_race_results").select("*").eq("event_id", race.redmistEventId).is("race_id", null);
    if (!res.error) data = res.data;
  }
  if (!data?.length){ race.raceResults = null; scheduleRender(); return; }
  const latest = pickResultSession(data, race);
  race.raceResults = { sessionName: latest.name, rows: latest.rows, checkeredAt: latest.at || null };
  scheduleRender();
}

function qualiSessionKey(ls){ return ls ? `${ls.id}|${ls.name}` : null; }

// Rows ranked by best lap; untimed (null / 00:00:00.000) cars go last.
function rankByBestLap(rows){
  return rows.map(p => ({ p, best: rmTimeToSeconds(p.best_time) }))
    .sort((a, b) => {
      if (a.best == null && b.best == null) return String(a.p.car_number).localeCompare(String(b.p.car_number), undefined, { numeric:true });
      if (a.best == null) return 1;
      if (b.best == null) return -1;
      return a.best - b.best;
    });
}

// Qualifying order: rank by best lap, number each class 1..n, then group
// the classes together (the class with the fastest car first). Untimed
// cars sit at the back of their class.
// Hardship / admin entries ("112x", "216x", Kingpin's "53x"): extra laps
// after major repairs, not part of qualifying.
function isHardshipCar(n){ return /x$/i.test(String(n ?? "")); }

function qualiRankByClass(rows){
  const ranked = rankByBestLap(rows.filter(r => !isHardshipCar(r.car_number)));
  const count = {};
  ranked.forEach(x => { const c = x.p.class || ""; count[c] = (count[c] || 0) + 1; x.clsPos = count[c]; });
  const order = [...new Set(ranked.map(x => x.p.class || ""))];
  return ranked.sort((a, b) => (order.indexOf(a.p.class || "") - order.indexOf(b.p.class || "")) || (a.clsPos - b.clsPos));
}

// Class starting position from qualifying: rank by best lap among cars of
// the same class, within the qualifying session this car ran in. Null if
// the car has no qualifying row or no timed lap.
function qualiClassStartPos(race, carNumber){
  const sessions = race?.qualiResults?.sessions || [];
  const session = sessions.find(s => s.rows.some(r => r.car_number === carNumber));
  if (!session) return null;
  const me = session.rows.find(r => r.car_number === carNumber);
  const ranked = rankByBestLap(session.rows.filter(r => (r.class || "") === (me.class || "") && !isHardshipCar(r.car_number)));
  const idx = ranked.findIndex(x => x.p.car_number === carNumber);
  return idx >= 0 && ranked[idx].best != null ? idx + 1 : null;
}

// Starting position used everywhere (tile badge, heatmap, archive delta):
// qualifying-derived when available, otherwise whatever is saved on the car.
function startPosFor(car){
  const race = state.races.find(r => r.id === state.currentRaceId);
  const derived = race && race.status !== "archived" ? qualiClassStartPos(race, car.number) : null;
  return derived ?? parsePosition(car.startingPosition);
}

// Persist qualifying-derived start positions to cars.starting_position so
// they survive into the archived race (archived races read the saved
// value). Engineer sessions only — a viewer's write would be silently
// rejected by RLS anyway.
function applyQualifyingStartPositions(race){
  if (!race || race.status === "archived") return;
  (race.cars || []).forEach(car => {
    const derived = qualiClassStartPos(race, car.number);
    if (derived == null || derived === parsePosition(car.startingPosition)) return;
    car.startingPosition = derived;
    (state.cars || []).forEach(c => { if (c.id === car.id) c.startingPosition = derived; });
    (state.plan?.carPlans || []).forEach(cp => { if (cp.car.id === car.id) cp.car.startingPosition = derived; });
    if (state.isEngineer){
      supabase.from("cars").update({ starting_position: derived }).eq("id", car.id)
        .then(({ error }) => { if (error) console.error("[quali-results] saving start position failed for car", car.number, ":", error); });
    }
  });
}

// Every qualifying session so far, each its own table. The live one (if
// any) uses the realtime full-field data and is badged Live; the rest are
// Finished. Replaced entirely by race standings during a Race session.
function renderQualifyingPanels(race){
  if (isSundayRace(race)) return ""; // Sunday: race table only
  const liveQuali = isLiveAttached(race) && state.liveSession?.type === "Qualifying";
  const liveKey = liveQuali ? qualiSessionKey(state.liveSession) : null;
  const ourNumbers = new Set(race.cars.map(c => c.number));

  const finished = (race.qualiResults?.sessions || [])
    .filter(sess => sess.key !== liveKey && sess.rows.length)
    // our class's session first, then most recent
    .sort((a, b) => (b.rows.some(r => ourNumbers.has(r.car_number)) - a.rows.some(r => ourNumbers.has(r.car_number))) || (b.latest - a.latest));

  const panels = [];
  if (liveQuali) panels.push(renderLiveQualifyingTable(race, race.redmistLive?.fullField || [], { title: state.liveSession.name, status: "Live" }));
